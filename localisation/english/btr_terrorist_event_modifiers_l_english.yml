 military_failure_disapproval_desc:0 "They are disappointed by our failed military operation."

 # Event Text Localization
 btr_terrorist.10.name:0 "Colony Ship Missing"
 btr_terrorist.10.desc:0 "Our colony ship §Y[ship.GetName]§! carrying §Y[colonist_count]§! colonists has failed to arrive at its scheduled waypoint. Long-range sensors detected an unscheduled hyperspace exit in the §Y[terrorist_system.GetName]§! system, followed by complete communications blackout.\n\nInitial investigation suggests the vessel may have been interdicted by unknown forces. Search and rescue protocols are awaiting your authorization.\n\nWhat are your orders?"
 btr_terrorist.10.a:0 "Write off the ship - we can't spare resources for a search."
 btr_terrorist.10.b:0 "Authorize search and rescue - begin the search operation."

 btr_terrorist.20.name:0 "Search Update - Colony Ship Located"
 btr_terrorist.20.desc:0 "Our search teams have located §Y[ship.GetName]§! in the §Y[terrorist_system.GetName]§! system, approximately §Y[jump_distance]§! jumps from our borders. The vessel appears intact but is being held by what our intelligence identifies as biotic terrorist operatives.\n\nIntercepted communications reveal they are demanding either §Y1000§! trade credits or the immediate repeal of our anti-biotic policies in exchange for the safe return of the colonists.\n\nLong-range scans detect several armed vessels surrounding our colony ship. Any rescue attempt would be extremely dangerous.\n\nHow do you wish to proceed?"
 btr_terrorist.20.a:0 "Pay the ransom - §R1000§! trade credits for their safe return."
 btr_terrorist.20.b:0 "Repeal our anti-biotic policies as demanded."
 btr_terrorist.20.c:0 "Send in our strike team - we don't negotiate with terrorists."
 btr_terrorist.20.d:0 "We need more time to consider our options."

 btr_terrorist.21.name:0 "Terrorist Impatience"
 btr_terrorist.21.desc:0 "Our delay in responding to the terrorists' demands has made them increasingly agitated. Intelligence reports suggest they are growing impatient with our hesitation.\n\n§RWarning: Further delays may result in the terrorists taking drastic action.§!"
 btr_terrorist.21.a:0 "We must make a decision now."

 btr_terrorist.30.name:0 "Ransom Resolution"
 btr_terrorist.30.desc.success:0 "The terrorists have honored their agreement. §Y[ship.GetName]§! has been released and is proceeding to its original destination under escort. All colonists are accounted for, though many report harsh treatment during their captivity.\n\nThe successful payment of ransom may encourage future terrorist actions."
 btr_terrorist.30.desc.failure:0 "Despite receiving the ransom payment, the terrorists have detonated §Y[ship.GetName]§!. Long-range sensors confirm total destruction of the vessel and loss of all aboard. The terrorists' final transmission: §R'This is the price of oppression.'§!\n\nThe betrayal sends shockwaves throughout the empire."
 btr_terrorist.30.a:0 "The outcome is decided."

 btr_terrorist.40.name:0 "Policy Change Response"
 btr_terrorist.40.desc.success:0 "The repeal of our anti-biotic legislation has satisfied the terrorists' demands. §Y[ship.GetName]§! has been released and is proceeding to its destination. The colonists report surprisingly good treatment during their captivity.\n\n§G'Your government shows wisdom,'§! was the terrorists' final message. §G'Perhaps there is hope for peace.'§!"
 btr_terrorist.40.desc.failure:0 "The policy change was deemed §R'too little, too late'§! by the terrorist leadership. §Y[ship.GetName]§! has been destroyed along with all colonists aboard. Intelligence suggests internal disagreement within the terrorist cell led to this tragic outcome."
 btr_terrorist.40.a:0 "The die is cast."

 btr_terrorist.50.name:0 "Boarding Action Results"
 btr_terrorist.50.desc.complete_success:0 "Our strike team executed a perfect boarding action. All terrorists were neutralized with minimal casualties, and every colonist has been rescued unharmed. §Y[ship.GetName]§! suffered only minor damage and can continue its mission.\n\nThe successful rescue operation sends a clear message to potential future terrorists."
 btr_terrorist.50.desc.partial_success:0 "The boarding action succeeded in retaking §Y[ship.GetName]§!, but at significant cost. §R[casualty_percent]%§! of the colonists were killed in the crossfire, and the ship suffered substantial damage. The surviving terrorists were eliminated.\n\nWhile most lives were saved, the high casualty count sparks debate about the operation's necessity."
 btr_terrorist.50.desc.pyrrhic_victory:0 "Our strike team managed to retake §Y[ship.GetName]§!, but the terrorists triggered significant damage before being neutralized. Over half the colonists were lost, and the ship requires extensive repairs before continuing its mission.\n\nThe heavy casualties raise questions about our tactical approach."
 btr_terrorist.50.desc.failure:0 "Our boarding attempt was detected and repelled by the terrorists. In response, they detonated §Y[ship.GetName]§!, destroying the vessel and killing all colonists aboard. Our strike team barely escaped with their lives.\n\nThe failed rescue attempt becomes a political disaster."
 btr_terrorist.50.a:0 "The operation is concluded."

 btr_terrorist.60.name:0 "Terrorist Ultimatum Expired"
 btr_terrorist.60.desc:0 "Our hesitation has proven fatal. The terrorists, growing impatient with our delay, have carried out their threat and detonated §Y[ship.GetName]§!. All colonists aboard have perished.\n\n§R'This is what happens to those who ignore our demands,'§! was their final transmission before the explosion."
 btr_terrorist.60.a:0 "A tragic end."

 btr_terrorist.61.name:0 "Search Operation Failed"
 btr_terrorist.61.desc:0 "Our search operation has failed to locate the missing colony ship §Y[ship.GetName]§!. Despite extensive efforts by our search teams, no trace of the vessel or its colonists has been found.\n\nThe families of the missing colonists demand answers we cannot provide."
 btr_terrorist.61.a:0 "The search has failed."

 # Special Project Localization
 PROJECT_MISSING_COLONY_SHIP_SEARCH:0 "Search for Missing Colony Ship"
 PROJECT_MISSING_COLONY_SHIP_SEARCH_DESC:0 "Our colony ship has gone missing during transit. We must dispatch search teams to investigate their last known location and determine their fate."
 PROJECT_MISSING_COLONY_SHIP_STRIKE_TEAM:0 "Send in the Strike Team"
 PROJECT_MISSING_COLONY_SHIP_STRIKE_TEAM_DESC:0 "We don't negotiate with terrorists, our only choice is to send in a strike team for a rescue operation."