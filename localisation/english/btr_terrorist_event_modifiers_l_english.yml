 terrorist_betrayal_unrest_desc:0 "The terrorists' betrayal after receiving ransom payment has caused outrage and loss of faith in negotiation."
 abandoned_colonists_unrest_desc:0 "Our decision to abandon the search for missing colonists has created resentment among families and supporters."
 military_casualties_mourning_desc:0 "Heavy military casualties during the rescue operation have dampened morale and created grief among military families."
 military_failure_unrest_desc:0 "The failed military rescue operation has undermined confidence in our armed forces and leadership."
 btr_terrorist_threat_level_desc:0 "Ongoing biotic terrorist activity has increased tensions along our borders and made expansion more costly."
 successful_hostage_rescue_desc:0 "Our successful hostage rescue operation has boosted military confidence and expanded operational capabilities."
