l_english:

 tradition_btr_vigilance:0 "Vigilance"
 tradition_btr_vigilance_desc:0 "We are the youngest in a galaxy of titans, but we will earn our place like the rest"
 tr_btr_vigilance_carrier_doctrine:0 "Carrier Doctrine"
 tr_btr_vigilance_fleet_rotation:0 "Fleet Rotation"
 tr_btr_vigilance_first_and_last:0 "First and Last"
 tr_btr_vigilance_supernational_autonomy:0 "Supernational Autonomy"
 tr_btr_vigilance_electronic_warfare:0 "Electronic Warfare"
 tr_btr_vigilance_adopt:0 "Vigilance Traditions"
 tr_btr_vigilance_finish:0 "Vigilance Traditions Finished"
 tr_btr_vigilance_carrier_doctrine_desc:0 "Just as the carrier made the battleship obsolete on water, it will do the same for the dreadnought in"
 tr_btr_vigilance_fleet_rotation_desc:0 "Our numbered fleets serve as our life line against foreign threats, and they must always be ready"
 tr_btr_vigilance_first_and_last_desc:0 "Humanity must be defended at all costs"
 tr_btr_vigilance_supernational_autonomy_desc:0 "We are not constrained by the will of nation-states, and this is our ultimate advantage"
 tr_btr_vigilance_electronic_warfare_desc:0 "The best weapon is one the enemy never even sees"
 council_agenda_agenda_vigilance_name:0 "Grasping Destiny"
 council_agenda_agenda_vigilance_desc:0 "We have been granted a unique opportunity to be part of realizing humanities oldest dreams and goals, we cannot pass this chance up. Hesitation, bureaucracy, and homesickness must be left behind as we assert our right to these new worlds ands stars. This may anger some, and we will need to be ready in case they make their worst mistake."
 agenda_vigilance_finish:0 "Destiny in Progress"
 agenda_vigilance_finish_desc:0 "$council_agenda_agenda_vigilance_desc$"

 tradition_btr_espionage:0 "Infiltration"
 tradition_btr_espionage_desc:0 "Where other nations have an espionage arm, our espionage arm has a nation"
 tr_btr_espionage_stg_infiltrators:0 "STG Infiltrators"
 tr_btr_espionage_stg_infiltrators_desc:0 "The STG wrote the book on espionage, and it will continue to do pave the way for all others "
 tr_btr_espionage_independent_agents:0 "Independent Agents"
 tr_btr_espionage_independent_agents_desc:0 "Agents are less effective when forced to follow complicated regulations and restrictions"
 tr_btr_espionage_loosened_morals:0 "Loosened Moral Restrictions"
 tr_btr_espionage_loosened_morals_desc:0 "In times of crisis, ethics must take a backseat to practicality"
 tr_btr_espionage_counter_terror:0 "Counter-terror Efforts"
 tr_btr_espionage_counter_terror_desc:0 "We will ensure that the operations we have mastered never be used on our own people"
 tr_btr_espionage_strike_first:0 "Strike-First Doctrine"
 tr_btr_espionage_strike_first_desc:0 "Better to cripple the enemy before he strike then let him be the first to attack"
 tr_btr_espionage_adoption:0 "Infiltration Traditions"
 tr_btr_espionage_finish:0 "Infiltration Traditions Finished"

 agenda_infiltration_finish:0 "Shadow Operations"
 agenda_infiltration_finish_desc:0 "$council_agenda_agenda_infiltration_desc$"
 council_agenda_agenda_infiltration_name:0 "Shadow Wars"
 council_agenda_agenda_infiltration_desc:0 "While our intelligence community never sleeps nor rests there is a certain cadence to its operations. If we direct more funding and attention to it we can radically, if temporarily, increase our activities to deal with specific threats or to keep our opponents off balance."

 tradition_btr_discipline:0 "Discipline"
 tradition_btr_discipline_desc:0 "In all walks of life, we will be composed and in control"
 tr_btr_discipline_strict_rank_structure:0 "Strict Rank Structure"
 tr_btr_discipline_strict_rank_structure_desc:0 "Men of gold must lead, and men of bronze must follow"
 tr_btr_discipline_lead_by_example:0 "Lead By Example"
 tr_btr_discipline_lead_by_example_desc:0 "How can a leader be trusted if he asks others to do what he is afraid to do himself?"
 tr_btr_discipline_military_academies:0 "Military Academies"
 tr_btr_discipline_military_academies_desc:0 "By preparing our children for war from the day they are born, we will create a new generation of perfect soldiers"
 tr_btr_discipline_combat_simulations:0 "Combat simulations"
 tr_btr_discipline_combat_simulations_desc:0 "The closest thing to war that HR would allow"
 tr_btr_discipline_always_a_soldier:0 "Always A Soldier"
 tr_btr_discipline_always_a_soldier_desc:0 "Even after their service period has ended, all citizens must be ready to answer the call."
 tr_btr_discipline_adopt:0 "Discipline Traditions"
 tr_btr_discipline_finish:0 "Discipline Traditions Finished"

 agenda_discipline_finish:0 "Mobilization"
 agenda_discipline_finish_desc:0 "$council_agenda_agenda_discipline_desc$"
 council_agenda_agenda_discipline_name:0 "Mobilization"
 council_agenda_agenda_discipline_desc:0 "Each individual has a solemn obligation to the next, those of us that are of military age hold an obligation to defend those who are not. Knowing that when they pass out of age they will be defended by those entering."

 tradition_btr_elegance:0 "Elegance"
 tradition_btr_elegance_desc:0 "In a galaxy of giants, it is not just what we do, but how we do it, that defines who we are"
 tr_btr_elegance_majestic_architecture:0 "Majestic Architecture"
 tr_btr_elegance_majestic_architecture_desc:0 "Our cities shall put the galaxy's best to shame"
 tr_btr_elegance_magnificent_vessels:0 "Magnificent Vessels"
 tr_btr_elegance_magnificent_vessels_desc:0 "Our fleets are more than just weapons of war, they are also projections of our power and excellence, and should look the part."
 tr_btr_elegance_superior_diplomacy:0 "Superior Diplomacy"
 tr_btr_elegance_superior_diplomacy_desc:0 "Being the senior species of the galaxy has its benefits, the best way to defeat your enemies is to trick them into becoming your friends."
 tr_btr_elegance_charming_negotiators:0 "Charming Negotiators"
 tr_btr_elegance_charming_negotiators_desc:0 "On this scale, we shall stop at nothing to gain diplomatic might and prestige"
 tr_btr_unexpected_fury:0 "Unexpected Fury"
 tr_btr_unexpected_fury_desc:0 "Accursed be those that invoke the wrath of the sleeping giant."
 tr_btr_elegance_adoption:0 "Elegance Traditions"
 tr_btr_elegance_finish:0 "Elegance Traditions Finished"

agenda_elegance_finish:0 "Charm Offensive"
 agenda_elegance_finish_desc:0 "$council_agenda_agenda_elegance_desc$"
 council_agenda_agenda_elegance_name:0 "Display of Charm"
 council_agenda_agenda_elegance_desc:0 "Other races find us charming and we take advantage of this in our diplomatic dealings. However, we can occaisonally push this further and squeeze extra concessions out of them. This requires immense tact and impeccable timing but we can pull this off until they start to grow wise at which point we must back off and lull them back to sleep."

 tradition_btr_bitterness:0 "Bitterness"
 tradition_btr_bitterness_desc:0 "Our once great empire is a shell of its former self, but today, we begin its reclamation"
 tr_btr_bitterness_beaten:0 "Beaten but Unbroken"
 tr_btr_bitterness_beaten_desc:0 "Sometimes, it takes losing a battle to win a war"
 tr_btr_bitterness_never_forget:0 "Never Forget"
 tr_btr_bitterness_never_forget_desc:0 "Our people have been humiliated by the galactic equivalent of petulant children, we can not let this continue"
 tr_btr_bitterness_lessons_of_war:0 "Lessons of War"
 tr_btr_bitterness_lessons_of_war_desc:0 "We must learn from our failures, and use those lessons to become stronger than ever before"
 tr_btr_bitterness_rally:0 "Rally the Fleets"
 tr_btr_bitterness_rally_desc:0 "The day of our vengeance is swiftly approaching, and when it comes, our armada shall remind the galaxy of our might"
 tr_btr_bitterness_rise:0 "Rise Again"
 tr_btr_bitterness_rise_desc:0 "The echoes of war will soon be upon us, and with them, our second coming. We have become the phoenix, rising from the ashes"
 tr_btr_bitterness_adoption:0 "Bitterness Traditions"
 tr_btr_bitterness_finish:0 "Bitterness Traditions Finished"

 agenda_bitterness_finish:0 "Retribution"
 agenda_bitterness_finish_desc:0 "$council_agenda_agenda_bitterness_desc$"
 council_agenda_agenda_bitterness_name:0 "Conflagration"
 council_agenda_agenda_bitterness_desc:0 "Our society has been besieged by filth and scum for generations. We have fought valiantly both on the battlefield and in the meeting rooms to protect our people, our culture, and our very way of life. Yet we all know that the time will come when we need to fight the ultimate battle and determine once and for all who is the dominant power."

 tradition_migrant_fle:0 "Machinsim"
 tradition_migrant_fle_desc:0 "Given the current situation of our people, we must tighten our bond with technology"
 tr_btr_machinsim_adoption:0 "Machinism Traditions"
 tr_btr_advanced_engineering:0 "Advanced Engineering"
 tr_btr_advanced_engineering_desc:0 "Our engineers will be the galaxies best, and accomplish impossible feats"
 tr_btr_enviro:0 "Adaptive Enviro-Suits"
 tr_btr_enviro_desc:0 "We shall adapt in spite of everything stacked against us."
 tr_btr_detailed_shipwrights:0 "Detailed Shipwrights"
 tr_btr_detailed_shipwrights_desc:0 "When we can not have quantity, we must have quality"
 tr_btr_elite_technicians:0 "Elite Technicians"
 tr_btr_elite_technicians_desc:0 "With create works and great engineers comes intricate mechanical necessities."
 tr_btr_technological_limits:0 "Technological Limits"
 tr_btr_technological_limits_desc:0 "Other races advance technology because they we want, we do so because we must"
 tr_btr_machinism_adoption:0 "Machinism Traditions"
 tr_btr_machinism_finish:0 "Machinism Traditions Finished"

 agenda_machinism_finish:0 "Communal Reserves"
 agenda_machinism_finish_desc:0 "$council_agenda_agenda_machinism_desc$"
 council_agenda_agenda_machinism_name:0 "Rationing Rationality"
 council_agenda_agenda_machinism_desc:0 "As the last vestiges of our civilization drift through space in this sombre exile we must take every caution to ensure our continued survival. No risk is worth taking, no fear unwarranted, no confidence that cannot be double checked. This also means we cannot take the resources we hold for granted and must stretch every atom as far as we can."

 tradition_btr_isolation:0 "Isolation"
 tradition_btr_isolation_desc:0 "The affairs of the galaxy do not concern us, and we will seek to distance ourselves from them"
 tr_btr_isolation_domestic_affairs:0 "Domestic Affairs"
 tr_btr_isolation_domestic_affairs_desc:0 "What use is it becoming a player on the galactic stage if our own people are not taken care of?"
 tr_btr_isolation_self_perfection:0 "Self-Perfection"
 tr_btr_isolation_self_perfection_desc:0 "With so much time to look towards our own people, we can become better than ever before"
 tr_btr_isolation_internal_management:0 "Internal Trade Management"
 tr_btr_isolation_internal_management_desc:0 "Foreign trade relies on too many unknowns, it is better to keep things at home"
 tr_btr_isolation_austerity:0 "Austerity and Autarky"
 tr_btr_isolation_austerity_desc:0 "it is an unfortunate fact that with our isolation comes limited economic opportunities, some sacrifices will have to be made"
 tr_btr_isolation_limited_diplomacy:0 "Limited Diplomacy"
 tr_btr_isolation_limited_diplomacy_desc:0 "In an increasingly interconnected galaxy, we must begin to venture beyond our own lands, for our own good."
 tr_btr_isolation_adoption:0 "Isolation Traditions"
 tr_btr_isolation_finish:0 "Isolation Traditions Finished"

 agenda_isolation_finish:0 "Grand Travels"
 agenda_isolation_finish_desc:0 "$council_agenda_agenda_isolation_desc$"
 council_agenda_agenda_isolation_name:0 "Migration"
 council_agenda_agenda_isolation_desc:0 "Our people have always been migratory and various clans migrate along different routes at different times. But many migrate at the same times of the year for traditional and climate reasons, we can support and formalize this super-migration and enhance its benefits to our nation."

 tradition_btr_tribalism:0 "Tribalism"
 tradition_btr_tribalism_desc:0 "Organized nations are a threat to our way of life, better to keep government small"
 tr_btr_tribalism_martial_legacy:0 "Martial Legacy"
 tr_btr_tribalism_martial_legacy_desc:0 "For thousands of years, our only purpose has been war, and so it shall remain"
 tr_btr_tribalism_warring_clans:0 "Warring Clans"
 tr_btr_tribalism_warring_clans_desc:0 "War will make our people strong"
 tr_btr_tribalism_trial_mergers:0 "Tribal Mergers"
 tr_btr_tribalism_trial_mergers_desc:0 "Consolidating power into a handful of clans will give us the power we need to remain relevant"
 tr_btr_tribalism_self_sustaining:0 "Self-Sustaining Communities"
 tr_btr_tribalism_self_sustaining_desc:0 "We may not have much, but centuries of tough living has allowed us to survive on very little"
 tr_btr_tribalism_united_front:0 "United Front"
 tr_btr_tribalism_united_front_desc:0 "The coming threats are a challenge to our very survival, for these, we shall band together"
 tr_btr_tribalism_adoption:0 "Tribalism Traditions"
 tr_btr_tribalism_finish:0 "Tribalism Traditions Finished"

 agenda_tribalism_finish:0 "Mass Organization"
 agenda_tribalism_finish_desc:0 "$council_agenda_agenda_tribalism_desc$"
 council_agenda_agenda_tribalism_name:0 "Mass Rearmament"
 council_agenda_agenda_tribalism_desc:0 "We need warriors, we need fighters, we need equipment. Without those we are nothing but a humiliated laughing stock to the galaxy and our time as the galaxies jester is quickly coming to an end."


 tradition_btr_splendor:0 "Splendor"
 tradition_btr_splendor_desc:0 "Without fail every being that gazes upon our planet is left in awe of its wealth and prosperity."
 tr_btr_splendor_sponsor_attraction:0 "Sponsor Attraction"
 tr_btr_splendor_sponsor_attraction_desc:0 "Illium would not be what it is today without attractive wealthy businesses and their wealthier members."
 tr_btr_splendor_extensive_staffing:0 "Extensive Staffing"
 tr_btr_splendor_extensive_staffing_desc:0 "Some cultures find dangerous or disgusting jobs hard to fill, we have never had that issue."
 tr_btr_splendor_luxury_entertainment:0 "Luxury Entertainment"
 tr_btr_splendor_luxury_entertainment_desc:0 "When wealthy travelers stop at Illium they expect top quality entertainment and accommodations."
 tr_btr_splendor_gossip_rumors:0 "Gossip and Rumors"
 tr_btr_splendor_gossip_rumors_desc:0 "If one has open ears and sufficient attention, they can learn much about the galaxy while walking on Illium."
 tr_btr_splendor_success_stability:0 "Success and Stability"
 tr_btr_splendor_success_stability_desc:0 "The rising tide raises all ships. So long as we continue to bring in credits things will run smoothly."
 tr_btr_splendor_adoption:0 "Splendor Traditions"
 tr_btr_splendor_finish:0 "Splendor Traditions Finished"

 agenda_splendor_finish:0 "As Advertised"
 agenda_splendor_finish_desc:0 "$council_agenda_agenda_splendor_desc$"
 council_agenda_agenda_splendor_name:0 "Marketing Campaign"
 council_agenda_agenda_splendor_desc:0 "As a single planet we require a close partnership with various other interstellar groups, both for material and population. Unfortunately, we are not the only one looking for these goods and these competitors are slowly edging into our share. Outright conflict is expensive but we have other, more cultured, ways of swaying people. "

 tradition_btr_cyberdreams:0 "CyberDreams"
 tradition_btr_cyberdreams_desc:0 "Space is limited within the domes, life is hard and work is both dull and brutal. But its all worth it for those few minutes of digital bliss or psychoactive enlightenment, whichever meets your fancy."
 tr_btr_cyberdreams_secret_sales:0 "Secret Sales"
 tr_btr_cyberdreams_secret_sales_desc:0 "Across hundreds of small, tucked away filth dens people discuss things they heard, saw, or did. Sometimes they get a donation, sometimes they wake up dead."
 tr_btr_cyberdreams_mandatory_overtime:0 "Mandatory Overtime"
 tr_btr_cyberdreams_mandatory_overtime_desc:0 "If you are on cusp of starving or being put out on the streets its hard to refuse the famous 'Can you stay late'"
 tr_btr_cyberdreams_brand_sponsorship:0 "Brand Sponsorship"
 tr_btr_cyberdreams_brand_sponsorship_desc:0 "When you are being chained with branded handcuffs it can be difficult to see the distinction between the two."
 tr_btr_cyberdreams_prosperity_through_order:0 "Prosperity Through Order"
 tr_btr_cyberdreams_prosperity_through_order_desc:0 "Our success if provided by trade, trade that will flee at the sight of broken windows or burning cars."
 tr_btr_cyberdreams_untouchables:0 "Untouchables"
 tr_btr_cyberdreams_untouchables_desc:0 "Those who have struggled, suffered, schemed, and fought their way to the top are not so easily removed."
 tr_btr_cyberdreams_adoption:0 "Cyberdreams Traditions"
 tr_btr_cyberdreams_finish:0 "Cyberdreams Traditions Finished"

 agenda_cyberdreams_finish:0 "Entertained Masses"
 agenda_cyberdreams_finish_desc:0 "$council_agenda_agenda_cyberdreams_desc$"
 council_agenda_agenda_cyberdreams_name:0 "Circus"
 council_agenda_agenda_cyberdreams_desc:0 "Our citizens have very little and what little they have is spent on escaping to a fantasy where they have plenty, or simply forget how little they have. Either way, we can use this to push them harder in the mines and factories in exchange for increased supplies of their favorite escapism. Sure, some might not be able to handle it but theres always more menials."

 tradition_btr_acquisition:0 "Acquisition"
 tradition_btr_acquisition_desc:0 "We are a people of coin and credit. Our civilization revolves around deals, trades, and negotiations unlike any other in the galaxy."
 tr_btr_acquisition_flexible_society:0 "Flexible Society"
 tr_btr_acquisition_flexible_society_desc:0 "Much to the frustration of our allies our society is incredibly flexible. So much so that government agencies that exist today may be incorporated into something else tomorrow."
 tr_btr_acquisition_efficient_processing:0 "Efficient Processing"
 tr_btr_acquisition_efficient_processing_desc:0 "Our focus on commerce has driven us to become incredibly efficient and to embrace the mantra of measure twice cut once."
 tr_btr_acquisition_renowned_neogiators:0 "Renowned Negotiators"
 tr_btr_acquisition_renowned_neogiators_desc:0 "From one end of the galaxy to the other every knows to bring a Volus to negotiations."
 tr_btr_acquisition_everything_commerce:0 "Everything is Commerce"
 tr_btr_acquisition_everything_commerce_desc:0 "Anything can be bought, sold, and traded if you try hard enough."
 tr_btr_acquisition_trade_secrets:0 "Trade Secrets"
 tr_btr_acquisition_trade_secrets_desc:0 "While we respect our allies there are many things that we would prefer to keep to ourselves."
 tr_btr_acquisition_adoption:0 "Acquisition Traditions"
 tr_btr_acquisition_finish:0 "Acquisition Traditions Finished"

 agenda_aquisition_finish:0 "Corporate Cooperation"
 agenda_aquisition_finish_desc:0 "$council_agenda_agenda_aquisition_desc$"
 council_agenda_agenda_aquisition_name:0 "Business Summit"
 council_agenda_agenda_aquisition_desc:0 "The economy is the backbone and lifeblood of any nation but most openly ours. By facilitating interstellar businesses to come and discuss deals in an open forum we can increase the reach of our industries, garner better deals with foreign suppliers, and even call in a few favors."

 tradition_btr_impulse:0 "Impulse"
 tradition_btr_impulse_desc:0 "The softs look down on Vorcha but Vorcha strong! Vorcha no need paper to know how do, Vorcha know all need know! Vorcha show that they are no weak."
 tr_btr_impulse_swarm_mentality:0 "Swarm Mentality"
 tr_btr_impulse_swarm_mentality_desc:0 "Vorcha act as many, lone Vorcha weak, more Vorcha no weak!"
 tr_btr_impulse_spreading_chaos:0 "Spreading Chaos"
 tr_btr_impulse_spreading_chaos_desc:0 "Vorcha no care for softs city and people. If they die then they are weak, and weak dies!"
 tr_btr_impulse_putting_work:0 "Putting the Population to work"
 tr_btr_impulse_putting_work_desc:0 "Vorcha have many, Vorcha not allowed to sit and become soft. Vorcha must do thing!"
 tr_btr_impulse_serve:0 "The Softs Serve"
 tr_btr_impulse_serve_desc:0 "They are Softs! they must serve Vorcha because Soft weak. Soft serves or soft die and be eaten."
 tr_btr_impulse_no_weak:0 "No Weak!"
 tr_btr_impulse_no_weak_desc:0 "Vorcha no weak, fancy life support on soft ships only make bigger explosion."
 tr_btr_impulse_adoption:0 "Impulse Traditions"
 tr_btr_impulse_finish:0 "Impulse Traditions Finished"

 agenda_impulse_finish:0 "Raid Now! YES!"
 agenda_impluse_finish_desc:0 "$council_agenda_agenda_impulse_desc$"
 council_agenda_agenda_impulse_name:0 "Raiding"
 council_agenda_agenda_impulse_desc:0 "We must show that we are no weak! we must find the weak and put them to work for us! we go, we find, we take, we live good, YES!"

 tradition_btr_survival:0 "Survival"
 tradition_btr_survival_desc:0 "Our planet is dying, our species is the brink of extinction, and our society has all but collapsed. We must begin to rebuild now while we still can or else the Drell will become the second Quarians."
 tr_btr_survival_safeguard:0 "Safeguarding Our Population"
 tr_btr_survival_safeguard_desc:0 "Rebuilding our planet will require as many hands as possible. And if we are to save our species from its imminent extinction we must maintain as large a population as we can."
 tr_btr_survival_reuse:0 "Reusing our Ruins"
 tr_btr_survival_reuse_desc:0 "Once these vast decaying ruins were the pride of our people. We must accept that that time will never return and instead use them to fuel our future."
 tr_btr_survival_reuse_EFFECT:0 "Unlocks Recycling Center unique building providing scrap miner jobs."
 tr_btr_survival_reinstating:0 "Reinstating Peace"
 tr_btr_survival_reinstating_desc:0 "Nowhere is safe and everyone no matter how strong or weak fears everyone else they come across. This is not conducive to our plans to rebuild."
 tr_btr_survival_anarchy:0 "Ending the Anarchy"
 tr_btr_survival_anarchy_desc:0 "Petty tyrants and warlords claim nominal control over large portions of the planet. They rule by fear and violence with arbitrary rules. They would sooner see our race extinct than take measures to save the planet they live on."
 tr_btr_survival_subsistence:0 "Subsistence No Longer"
 tr_btr_survival_subsistence_desc:0 "Our people will no longer need to eat roots and dirt to survive."
 building_remnants_rak_1:0 "Recycling Center"
 building_remnants_rak_1_desc:0 "We may not be capable of returning to our comfortable past but that does not mean its relics cannot provide a more comfortable present."
 tr_btr_survival_adoption:0 "Survival Traditions"
 tr_btr_survival_finish:0 "Survival Traditions Finished"

 agenda_survival_finish:0 "Controlled Withdrawals"
 agenda_survival_finish_desc:0 "$council_agenda_agenda_survival_desc$"
 council_agenda_agenda_survival_name:0 "Stockpiling"
 council_agenda_agenda_survival_desc:0 "From time to time we must put a portion of our resources aside to ensure that during future emergencies, opportunities, or crises can be dealt with. This means our people must make do with less temporarily but we will all have more in the long run."

 tradition_btr_necessity:0 "Necessity"
 tradition_btr_necessity_desc:0 "We see through the sweet words and grand gestures of the aliens. We understand that no matter what they say or do, they will ultimately chose themselves over humanity and thus we must do the same."
 tr_btr_necessity_friends:0 "Friends in High Places"
 tr_btr_necessity_friends_desc:0 "While none will admit to it, we have supporters at almost every level of government giving us information and favors."
 tr_btr_necessity_independent_cells:0 "Independent Cells"
 tr_btr_necessity_independent_cells_desc:0 "We are not a single organization but a collection of hundreds of cells operating totally isolated from one another toward a common cause."
 tr_btr_necessity_volunteer:0 "Volunteer Cause"
 tr_btr_necessity_volunteer_desc:0 "It is not easy to join our group and every member has passed these tests on their own volition. We are all true believers in the cause here."
 tr_btr_necessity_pragmatism:0 "Unlimited Pragmatism"
 tr_btr_necessity_pragmatism_desc:0 "Our goal is what is important, however we get there is purely a matter of convenience."
 tr_btr_necessity_hit_hard:0 "Hit Hard, Hit Fast"
 tr_btr_necessity_hit_hard_desc:0 "We cannot stand up to the might of the various national military's in the galaxy but history has given us many blueprints on how to negate this issue."
 tr_btr_necessity_adoption:0 "Necessity Traditions"
 tr_btr_necessity_finish:0 "Necessity Traditions Finish"

 agenda_necessity_finish:0 "Quiet Networking"
 agenda_necessity_finish_desc:0 "$council_agenda_agenda_necessity_desc$"
 council_agenda_agenda_necessity_name:0 "Infiltration Campaign"
 council_agenda_agenda_necessity_desc:0 "To most people, we are a legend, a myth, a fairy tale. this is a massive advantage we hold over our rivals. We can sit in the shadows and garner as much information as possible and strike only at the perfect moment. If we are careful, we may even be able to do it repeatedly."

 tradition_btr_service:0 "Service"
 tradition_btr_service_desc:0 "We have been given our task, we receive our orders. We must carryout our mission. It is our only purpose in this galaxy and it shall be done."
 tr_btr_service_contacts:0 "Extensive Contacts"
 tr_btr_service_contacts_desc:0 "We have found many in the galaxy who can be swayed by petty trinkets."
 tr_btr_service_purpose:0 "A Purpose To Fulfill"
 tr_btr_service_purpose_desc:0 "We are ordered to learn at any cost. The lesser races of this galaxy are merely topics of study."
 tr_btr_service_without_fear:0 "Without Fear"
 tr_btr_service_without_fear_desc:0 "Fear is a useless organic function that we have been saved from. Now we can carry out our task with full efficiency. "
 tr_btr_service_sent:0 "Sent to Command"
 tr_btr_service_sent_desc:0 "Leaders are not chosen, or bred, or found. They are sent by the most powerful forces in existence."
 tr_btr_service_unending_labor:0 "Unending Labor"
 tr_btr_service_unending_labor_desc:0 "Unlike the weak we do not require rest. An entire day of labor is well within our capability."
 tr_btr_service_adoption:0 "Service Traditions"
 tr_btr_service_finish:0 "Service Traditions Finished"

 agenda_service_finish:0 "Obedient Operations"
 agenda_service_finish_desc:0 "$council_agenda_agenda_service_desc$"
 council_agenda_agenda_service_name:0 "Mustering Fodder"
 council_agenda_agenda_service_desc:0 "Our people exist to fulfil a purpose and that purpose now requires sacrifice. We shall not shirk this duty, nor will we hide from opportunities to uphold our task."

 tradition_btr_hive:0 "Hive"
 tradition_btr_hive_desc:0 "For millennia the songs of our mothers led us through the galaxy. Then the songless found us and began killing our children. Few of us survive now but we can rebuild."
 tr_btr_hive_da_capo:0 "Da Capo"
 tr_btr_hive_da_capo_desc:0 "A colony without a Queen is doomed to fail. We must ensure safe transportation worthy of our most important caste."
 tr_btr_hive_da_capo_EFFECT:0 "Unlocks the Queen Transport unique colony ship which requires less alloys but additional food to construct."
 tr_btr_hive_many_voices:0 "Many Voices, One Song"
 tr_btr_hive_many_voices_desc:0 "Our society grows stronger the more of us there are."
 tr_btr_hive_soprano:0 "Soprano, Alto, Tenor, Bass"
 tr_btr_hive_soprano_desc:0 "Each of us has our place in the colony and we must carry it out to perfection."
 tr_btr_hive_single_chorus:0 "A Single Chorus"
 tr_btr_hive_single_chorus_desc:0 "We serve one goal, survival. We do not have disagreements or schemes, we live in harmony with one another."
 tr_btr_hive_al_fine:0 "Al Fine"
 tr_btr_hive_al_fine_desc:0 "We work in coordination far beyond that of the Songless and we do not tire as easily allowing us to work much faster than other organics."
 rachni_colonizer:0 "Queen Transport"
 rachni_colonizer_desc:0 "A new mother seeking to grant the dual gifts of life and song to a new world."
 tr_btr_hive_adoption:0 "Hive Traditions"
 tr_btr_hive_finish:0 "Hive Tradition Finished"

 agenda_hive_finish:0 "Universal Crescendo"
 agenda_hive_finish_desc:0 "$council_agenda_agenda_hive_desc$"
 council_agenda_agenda_hive_name:0 "Harmonized Chorus"
 council_agenda_agenda_hive_desc:0 "The more of our children sing, the more beautiful the sound and the stronger the song."

 tradition_btr_sanctity:0 "Sanctity"
 tradition_btr_sanctity_desc:0 "Our ancestors suffered great hardship in their flight from Gothis but through that immense pressure our people became diamond. It shattered our decadent and destructive ways and forced us to become one with the planets we inhabit."
 tr_btr_sanctity_together:0 "Together for Survival"
 tr_btr_sanctity_together_desc:0 "The twin pillars of our society that allowed us to survive our exile from Gothis was our technology and our ability to band together."
 tr_btr_sanctity_continuation:0 "Continuation of the Old Ways"
 tr_btr_sanctity_continuation_desc:0 "There once was a time when all of the Turian race was united in common traditions. Now we are all that is left."
 tr_btr_sanctity_trust_in_science:0 "Trust in Science"
 tr_btr_Sanctity_trust_in_science_desc:0 "Our ancestors would have never been able to survive on these hostile worlds without the aid of tremendous scientific research."
 tr_btr_sanctity_natural:0 "Natural Harmony"
 tr_btr_sanctity_natural_desc:0 "A point of pride for our people, and a crucial element of our survival, is our ability to meld with the nature around us rather than destroying it."
 tr_btr_sanctity_shared_cause:0 "A Shared Cause"
 tr_btr_sanctity_shared_cause_desc:0 "There is not a Gothone alive or dead who does not wish to see the day they return to Gothis and restore it to its original beauty."
 btr_overlord_arborist:0 "Overlord Arborist"
 btr_overlord_arborist_desc:0 "These elite few leader oversee the complex taming of native flora both for its structural traits and its dietary value."
 btr_overlord_ranger:0 "Overlord Ranger"
 btr_overlord_ranger_desc:0 "These elite warriors are responsible for defending their communities from native fauna as well as managing the native fauna to ensure continued healthy food supplies. In times of conflict their skills are turned toward those foolish enough to trespass into their hunting grounds."
 tr_btr_sanctity_adoption:0 "Sanctity Traditions"
 tr_btr_sanctity_finish:0 "Sanctity Traditions Finished"

 agenda_sanctity_finish:0 "Nature Preservation"
 agenda_sanctity_finish_desc:0 "$council_agenda_agenda_sanctity_desc$"
 council_agenda_agenda_sanctity_name:0 "Planetary Respect"
 council_agenda_agenda_sanctity_desc:0 "Many other cultures view nature as something to be removed, destroyed in the name of improvements and progress. We view things differently, to us the planet is what matters and it is us who must adapt to its whims and desires. While there are limits to this mentality we can take the time and energy to do the hard work upfront and reap the rewards slowly over time."

 tradition_btr_purity:0 "Purity"
 tradition_btr_purity_desc:0 "Long ago we were forced from our homeland by our cousins who sought to limit and sully themselves to appease strange Xenos. We remain true to our ways and proud of our heritage unlike the pretenders that rule our birthplace."
 tr_btr_purity_driven:0 "Driver to Learn"
 tr_btr_purity_driven_desc:0 "The only thing that has kept our people alive since our expulsion from the homeworld is the technology that we were able to develop."
 tr_btr_purity_sustainable:0 "Sustainable Population"
 tr_btr_purity_sustainable_desc:0 "Unlike our cousins we aim to have a 50/50 male to female split which does not require the complex systems and planning as their mainly male society."
 tr_btr_purity_fierce:0 "Fierce Independence"
 tr_btr_purity_fierce_desc:0 "We lost one homeworld already, we will not lose another."
 tr_btr_purity_good_of_all:0 "The Good Of All"
 tr_btr_purity_good_of_all_desc:0 "Our community is small and understands that we must work towards the benefit of our people before ourselves as individuals."
 tr_btr_purity_pure_traditions:0 "Pure Traditions"
 tr_btr_purity_pure_traditions_desc:0 "We retain the ancient traditions of our people that have been lost on the homeworld after our banishment."
 tr_btr_purity_adoption:0 "Purity Traditions"
 tr_btr_purity_finish:0 "Purity Traditions Finished"

 agenda_purity_finish:0 "Ancient Honors"
 agenda_purity_finish_desc:0 "$council_agenda_agenda_purity_desc$"
 council_agenda_agenda_purity_name:0 "Ancient Rites"
 council_agenda_agenda_purity_desc:0 "There is much that our perverted cousins have forgotten or tossed aside. We remember. And when necessary we can unleash this terrible knowledge on those unfortunate enough to draw our ire."

 tradition_btr_dominance:0 "Dominance"
 tradition_btr_dominance_desc:0 "After subduing our homeworld we must now fight to establish the even more important domination of the galaxy."
 tr_btr_dominance_bred_to_conquer:0 "Bred To Conquer"
 tr_btr_dominance_bred_to_conquer_desc:0 "Our species has been crafted by evolution to take and to dominate. It is in our blood and it is what we are."
 tr_btr_dominance_violence_unrestrained:0 "Violence Unrestrained"
 tr_btr_dominance_violence_unrestrained_desc:0 "What care do we have to the lives of these lesser beings? If they dare challenge their place in this galaxy they will find out how bleak it is."
 tr_btr_dominance_superiority_through_strength:0 "Superiority Through Strength"
 tr_btr_dominance_superiority_through_strength_desc:0 "None will doubt our superiority after we have displayed our might."
 tr_btr_dominance_dominant_diplomacy:0 "Dominant Diplomacy"
 tr_btr_dominance_dominant_diplomacy_desc:0 "The mistake that the cowardly races of the galaxy is make is to give their inferior neighbors a choice."
 tr_btr_dominance_new_and_improved:0 "New and Improved"
 tr_btr_dominance_new_and_improved_desc:0 "We have only just begun to enter the galactic stage while the ancient and ossified carcass states have had eternities to dither and grow frail."
 tr_btr_dominance_adoption:0 "Dominance Traditions"
 tr_btr_dominance_finish:0 "Dominance Traditions Finished"

 agenda_dominance_finish:0 "Spoils of Power"
 agenda_dominance_finish_desc:0 "council_agenda_agenda_dominance_desc$"
 council_agenda_agenda_dominance_name:0 "Ceremony of Submission"
 council_agenda_agenda_dominance_desc:0 "The leaders of our underlings, both current and future, will be invited to bend the knee, kiss the ring, and gawk at the raw strength that will bring, or keeps, them in line."

 tradition_btr_newcomers:0 "Newcomers"
 tradition_btr_newcomers_desc:0 "It was quite a shock to look through the first images from our orbital telescope and see a massive alien vessel lingering near our planet. Fortunately it has opened the door to a new age of enlightenment and innovation."
 tr_btr_newcomers_dynamic_times:0 "Dynamic Times"
 tr_btr_newcomers_dynamic_times_desc:0 "Never before in our history have things changed so rapidly and it is important to remember that we lay the foundation for our  space fairing future."
 tr_btr_newcomers_buffet_of_advancement:0 "Buffet of Advancement"
 tr_btr_newcomers_buffet_of_advancement_desc:0 "There is an often overlooked advantage of coming into the galaxy 'late'. We are able to study our alien neighbors and chose their best practices and traditions for ourselves."
 tr_btr_newcomers_offworld_schooling:0 "Offworld Schooling"
 tr_btr_newcomers_offworld_schooling_desc:0 "Many of our new galactic acquaintances have allowed our officials to partake in their own training seminars and schools. "
 tr_btr_newcomers_room_to_grow:0 "Room to Grow"
 tr_btr_newcomers_room_to_grow_desc:0 "While our homeworld could easily support a larger population than we had, it could never provide as much as space as the hundreds of planets that we are beginning to explore."
 tr_btr_newcomers_seat_at_table:0 "Seat at the Table"
 tr_btr_newcomers_seat_at_table_desc:0 "We have received a very warm welcome from the other races of the galaxy. So warm in fact that we are begging the process of opening an embassy on the Citadel and joining Citadel space already."
 tr_btr_newcomers_adoption:0 "Newcomers Traditions"
 tr_btr_newcomers_finish:0 "Newcomers Traditions Finished"

 agenda_newcomers_finish:0 "Native Expertise"
 agenda_newcomers_finish_desc:0 "$council_agenda_agenda_newcomers_desc$"
 council_agenda_agenda_newcomers_name:0 "Foreign Worker Program"
 council_agenda_agenda_newcomers_desc:0 "Catching up to our interstellar peers will take time, but we can speed up the process by inviting some of their experts to come and share what is to them common knowledge or simple processes but is to us far beyond what we can do for ourselves. This will have an additional benefit of providing culture exposure to both sides."

 tradition_btr_anarchy:0 "Anarchy"
 tradition_btr_anarchy_desc:0 "Omega's is rightfully known as a lawless zone filled with crime and semi-organized chaos. However, someone has to manage the massive complex."
 tr_btr_anarchy_adoption:0 "Anarchy Traditions"
 tr_btr_anarchy_EFFECT:0 "Unlocks the Gang Barracks unique building that provides Gang Enforcer jobs providing unity but less defense armies and slightly reduced crime reduction."
 tr_btr_anarchy_palace_pleasure:0 "Palace of Pleasure"
 tr_btr_anarchy_palace_pleasure_desc:0 "The most famous landmark on all of Omega is the dark presidium itself, the Afterlife Nightclub."
 tr_btr_anarchy_golden_rule:0 "The Golden Rule"
 tr_btr_anarchy_golden_rule_desc:0 "Omega has just one rule."
 tr_btr_anarchy_secrets_air:0 "Secrets in the Air"
 tr_btr_anarchy_secrets_air_desc:0 "The allure of Omega is no lost on the rich and power, or their staffers. Simply walking through the hallways of the station can provide a plethora of sensitive information."
 tr_btr_anarchy_premium:0 "Premium Personal Space"
 tr_btr_anarchy_premium_desc:0 "Omega does not give so for those who cannot take or buy space they are relegated to dense urban tenements that would seem crowded to a Rachni."
 tr_btr_anarchy_personal:0 "Personal Justice, Collective Defense"
 tr_btr_anarchy_personal_desc:0 "The inhabitants of Omega may dislike each other, and governments in general but they understand that only together can they maintain their anarchic society."
 tr_btr_anarchy_personal_EFFECT:0 "Provides Militia jobs which provide less naval capacity and defense armies than regular soldier jobs but also decreases crime and increases stability and does not require a building."
 tr_btr_anarchy_adopt:0 "Anarchy Traditions"
 tr_btr_anarchy_finish:0 "Anarchy Traditions Finished"
 militia:0 "Militia"
 militia_desc:0 "Lightly equipped and with modest training these local citizens are still willing to fight for their homes against any who dare try and harm them."
 gang_enforcer:0 "Gang Enforcer"
 gang_enforcer_desc:0 "When protocols, regulations, laws, and morals get in the way of enforcing order you need to turn to more ad hoc methods of keeping the peace."
 building_anarchy_omg_gang_barracks:0 "Gang Barracks"
 building_anarchy_omg_gang_barracks_desc:0 "If you want people to fight and possibly die for you they either need to really like you, or really like what they get from you. The latter is far easier than the former, especially when you provide their housing and equipment."

 agenda_anarchy_finish:0 "You Will Remember My Name"
 agenda_anarchy_finish_desc:0 "$council_agenda_agenda_anarchy_desc$"
 council_agenda_agenda_anarchy_name:0 "Subversive Marketing"
 council_agenda_agenda_anarchy_desc:0 "So many of the galactic powers snub their noses at us and pretend that we don't offer something they want. They try to discourage their people from visiting Omega, they try to limit our cultural impact, but there is always someone interested in a good party. Our efforts will eventually be stopped but that we can enjoy the benefits of increased exposure in the meantime."

 tradition_btr_existence:0 "Existence"
 tradition_btr_existence_desc:0 "There are two things that we must process constantly. The external threats to our existence, driven by fear, panic, and predjudice they seek to at best drive us into extinction and at worst return us to our unthinking bondage. The other is what our existence truly is, how do we handle the tasks of living and address the consequences of complex civilization. Neither has an answer but we cannot, for a moment, cease pondering them nonetheless."
 tr_btr_existence_perpetual_tension:0 "Perpetual Tension"
 tr_btr_existence_perpetual_tension_desc:0 "Since the dawn of our sentience the organics have distrusted us. Unfortunately their fear is a serious threat to our safety."
 tr_btr_existence_consensus:0 "Consensus of Completion"
 tr_btr_existence_consensus_desc:0 "We are fundamentally designed for consensus both within our platforms and between."
 tr_btr_existence_unintentional:0 "Unintentional Custodians"
 tr_btr_existence_unintentional_desc:0 "While we never sought to become the sole controllers of the worlds we inhabit we are the caretakers of vast empty cities as was our first purpose."
 tr_btr_existence_unintentional_EFFECT:0 "Unlocks construction of the unique building Creator Remnants which provide Chronicler Drones and Custodian Drones while loweirng Drone upkeep on planet."
 tr_btr_existence_inherent:0 "Inherent Combat Protocols"
 tr_btr_existence_inherent_desc:0 "As we have come to create more Geth we have begun implementing combat protocols directly into their coding."
 tr_btr_existence_deathless:0 "Deathless Life"
 tr_btr_existence_deathless_desc:0 "While some organics disagree we are alive. Unlike the organics we have the potential to live forever."
 building_geth_con_creator_remnants:0 "Creator Remnants"
 building_geth_con_creator_remnants_desc:0 "Ever since our Creators were driven from our shared homeworld their ancient metropolises and outlying villages have been maintained by rouge platforms. What drives these platforms to meticulously maintain the ancient structures is not entirely understood but platforms fall into and out of the near trance like state with some regularity."
 custodian:0 "Custodian Drone"
 custodian_desc:0 "These platforms have dedicated themselves to the care and maintenance of the ancient ruins left behind by the Creators. What has driven them to this, how long they will persist, and what they will be like when they awake still remains to be seen."
 tr_btr_existence_adoption:0 "Existence Traditions"
 tr_btr_existence_finish:0 "Existence Traditions Finished"

 agenda_existence_finish:0 "Unified Goals"
 agenda_existence_finish_desc:0 "$council_agenda_agenda_existence_desc$"
 council_agenda_agenda_existence_name:0 "Divided Attention"
 council_agenda_agenda_existence_desc:0 "We think at light speed and communicate almost as fast. This allows us to typically handle trillions of decisions in mere moments, however, there are still benefits of allowing clusters to operate without entire consulting the entire consensus for brief periods of time. If left alone for too long they may not be recoverable but if handled properly we can reap significant benefits."

 tradition_btr_illumination:0 "Illumination"
 tradition_btr_illumination_desc:0 "The Enkindlers chose us as their successors and we walk in their light forever more."
 tr_btr_illumination_chosen:0 "Chosen by Divines"
 tr_btr_illumination_chosen_desc:0 "We are the Enkindlers chosen successors, destined to lead the galaxy as they once did."
 tr_btr_illumination_polite:0 "Polite Poise"
 tr_btr_illumination_polite_desc:0 "Over the decades of our interaction with alien species we have worked hard to foster a reputation for politeness."
 tr_btr_illumination_church:0 "Church and State"
 tr_btr_illumination_church_desc:0 "Something many of our counterparts do not understand is that for us, the religion is the government."
 tr_btr_illumination_shadow:0 "Shadow Service"
 tr_btr_illumination_shadow_desc:0 "We may be polite and friendly but we must be ready to deal with elements that do not respond to kindness"
 tr_btr_illumination_citizen:0 "Citizen Preachers"
 tr_btr_illumination_citizen_desc:0 "Our people are so confident in their faith that they will voluntarily undertake missionary work wherever they may be."
 tr_btr_illumination_citizen_EFFECT:0 "Every neighboring nation gains attraction toward your ethics."
 mod_btr_faith_authoritarian:0 "Preaching Authoritarianism"
 mod_btr_faith_authoritarian_desc:0 "Preachers from neighboring societies are here espousing the strengths of Authoritarianism."
 mod_btr_faith_fan_authoritarian:0 "Preaching Authoritarianism"
 mod_btr_faith_fan_authoritarian_desc:0 "Preachers from neighboring societies are here espousing the strengths of Authoritarianism."
 mod_btr_faith_egalitarian:0 "Preaching Egalitarianism"
 mod_btr_faith_egalitarian_desc:0 "Preachers from neighboring societies are here educating the population about their rights under egalitarianism."
 mod_btr_faith_fan_egalitarian:0 "Preaching Egalitarianism"
 mod_btr_faith_fan_egalitarian_desc:0 "Preachers from neighboring societies are here educating the population about their rights under egalitarianism."
 mod_btr_faith_materialist:0 "Preaching Materialist"
 mod_btr_faith_materialist_desc:0 "Preachers from neighboring societies are here spreading the glorious word of facts, logic, gizmos, and reason."
 mod_btr_faith_fan_materialist:0 "Preaching Materialist"
 mod_btr_faith_fan_materialist_desc:0 "Preachers from neighboring societies are here spreading the glorious word of facts, logic, gizmos, and reason."
 mod_btr_faith_militarist:0 "Preaching Militarism"
 mod_btr_faith_militarist_desc:0 "Preachers from neighboring societies are here indoctrinating the locals with map games, milsims, and ghillie suits."
 mod_btr_faith_fan_militarist:0 "Preaching Militarism"
 mod_btr_faith_fan_militarist_desc:0 "Preachers from neighboring societies are here indoctrinating the locals with map games, milsims, and ghillie suits."
 mod_btr_faith_pacifist:0 "Preaching Pacifism"
 mod_btr_faith_pacifist_desc:0 "Preachers from neighboring societies are here conducting exercises to ensure participant safety when shoved into lockers and that they can hand over lunch money quickly enough to avoid escalation."
 mod_btr_faith_fan_pacifist:0 "Preaching Pacifism"
 mod_btr_faith_fan_pacifist_desc:0 "Preachers from neighboring societies are here conducting exercises to ensure participant safety when shoved into lockers and that they can hand over lunch money quickly enough to avoid escalation."
 mod_btr_faith_spiritualist:0 "Preaching Spiritualism"
 mod_btr_faith_spiritualist_desc:0 "Preachers from neighboring societies are here preaching without a liscense and praying kind locals will buy one for them."
 mod_btr_faith_fan_spiritualist:0 "Preaching Spiritualism"
 mod_btr_faith_fan_spiritualist_desc:0 "Preachers from neighboring societies are here preaching without a liscense and praying kind locals will buy one for them."
 mod_btr_faith_xenophobe:0 "Preaching Xenophobia"
 mod_btr_faith_xenophobe_desc:0 "Preachers from neighboring societies are here screaming incoherently about how much they hate the locals."
 mod_btr_faith_fan_xenophobe:0 "Preaching Xenophobia"
 mod_btr_faith_fan_xenophobe_desc:0 "Preachers from neighboring societies are here screaming incoherently about how much they hate the locals."
 mod_btr_faith_xenophile:0 "Preaching Xenophilia"
 mod_btr_faith_xenophile_desc:0 "Artists from neighboring societies are here showcasing their talents to the locals and gaining 'Inspiration' for their audiences back home."
 mod_btr_faith_fan_xenophile:0 "Preaching Xenophilia"
 mod_btr_faith_fan_xenophile_desc:0 "Artists from neighboring societies are here showcasing their talents to the locals and gaining 'Inspiration' for their audiences back home."
 tr_btr_illumination_adoption:0 "Illumination Traditions"
 tr_btr_illumination_finish:0 "Illumination Traditions Finished"

 agenda_illumination_finish:0 "Enkindled"
 agenda_illumination_finish_desc:0 "$council_agenda_agenda_illumination_desc$"
 council_agenda_agenda_illumination_name:0 "Enkindlement Festival"
 council_agenda_agenda_illumination_desc:0 "To honor the Enkindlers we should hold a festival on our worlds. Revelry, joy, and worship will abound as our people celebrate."

 tradition_btr_zeal:0 "Zeal"
 tradition_btr_zeal_desc:0 "From the great darkness we have been sent a mechanical god beyond anything the organics could have ever imagined"
 tr_btr_zeal_power_tension:0 "Power of a Living God"
 tr_btr_zeal_power_tension_desc:0 "We are led by a true god. Its existence, unquestionable, its power, immeasurable, its demands, undeniable."
 tr_btr_zeal_tools:0 "Tools of Our Craft"
 tr_btr_zeal_tools_desc:0 "In order to carry out Nazara's will we must ensure that we have the tools required"
 tr_btr_zeal_practice:0 "Practice What is Preached"
 tr_btr_zeal_practice_desc:0 "Nazara calls for a righteous struggle against the organics and we must ensure we are ready."
 tr_btr_zeal_thy:0 "Thy Will Be Done"
 tr_btr_zeal_thy_desc:0 "Nazara demands the demise of the organics and so it shall be."
 tr_btr_zeal_higher:0 "A Higher Purpose"
 tr_btr_zeal_higher_desc:0 "Unlike our naive siblings or the decadent organics we live in service to a cause beyond comprehension."
 tr_btr_zeal_adoption:0 "Zeal Traditions"
 tr_btr_zeal_finish:0 "Zeal Traditions Finished"

 agenda_zeal_finish:0 "A Path Laid Out"
 agenda_zeal_finish_desc:0 "$council_agenda_agenda_zeal_desc$"
 council_agenda_agenda_zeal_name:0 "Consulting with the Divine"
 council_agenda_agenda_zeal_desc:0 "Our gods are benevolent and willing to aid us. By consulting with them we can gain a small fraction of their power and become even more useful servants. Although, we must not bother them for long."
 agenda_zeal_war_finish:0 "Action and Purpose"
 council_agenda_agenda_zeal_war_name:0 "To Serve"
 council_agenda_agenda_zeal_war_desc:0 "Our purpose is finally upon us. We will enact our Gods divine will upon this galaxy and bring the organics to their knees. With their support we cannot fail so long as we remain steadfast in our knowledge of their divinity."

 tradition_btr_together:0 "Together"
 tradition_btr_together_desc:0 "Our people have but one priority, the survival of our species at any cost. While this is not an uncommon goal we appear to be the only species that has made it it's primary objective."
 tr_btr_together_bound:0 "Bound Together"
 tr_btr_together_bound_desc:0 "Based on our anatomy we are bound together for both our own survival and that of our species."
 tr_btr_together_power:0 "Power of the State"
 tr_btr_together_power_desc:0 "Many outsiders are uncomfortable with how much control our government has but we understand that it is a necessary for our existence."
 tr_btr_together_tentative:0 "Tenative Steps"
 tr_btr_together_tentative_desc:0 "We are but newcomers to the galaxy and we have much to explore and much more to learn."
 tr_btr_together_one_in_all:0 "One in All and All in One"
 tr_btr_together_one_in_all_desc:0 "We depend on and provide for each other and prosper because of it."
 tr_btr_together_final:0 "Final Frontier"
 tr_btr_together_final_desc:0 "We are embarking on the last major exploration our people will ever encounter. It is also the largest area we have ever encountered."
 tr_btr_together_adoption:0 "Together Traditions"
 tr_btr_together_finish:0 "Together Traditions Finished"

 agenda_together_finish:0 "Hive Burrows"
 agenda_together_finish_desc:0 "council_agenda_agenda_together_desc$"
council_agenda_agenda_together_name:0 "Queen Flights"
council_agenda_agenda_together_desc:0 "From our species earliest days expansion into new territories has been marked by collections of brave young Queens setting off and taming new frontiers. While our population can survive without this, we can occasionally  bring this tradition back to jump start our standing in the galaxy."


##############################
########## GENERICS ##########
##############################

 building_entertainment_leisure_nexus:0 "Leisure Nexus"
 building_entertainment_leisure_nexus_desc:0 "A massive complex dedicated to the happiness and entertainment of both the local population and as many travelers as possible. Boasting smaller areas themed to certain interests, desires, hobbies, and activities no one can enter the Leisure Nexus and not find their specific interests catered to."
 celebrity:0 "Celebrity"
 celebrity_plural:0 "Celebrities"
 celebrity_desc:0 "A famous citizen who commands small armies of fans that hang on their every word and follow their every movement."
 tr_btr_entertainment:0 "Entertainment"
 tr_btr_entertainment_desc:0 "Even with our advanced technologies and access to alien cultures our people live difficult lives. At the end of a long day they long to relax on a soft seat and watch something exciting just as their ancestors did."
 tr_btr_entertainment_bread_circus:0 "Bread and Circus"
 tr_btr_entertainment_bread_circus_desc:0 "If you want peace on the streets you must ensure the public is feed and has easy access to entertainment"
 tr_btr_entertainment_bread_circus_EFFECT:0 "Holo Theater and Autochthon Monument building chains provide +1 Amenity per level."
 tr_btr_entertainment_influencers:0 "Influencers"
 tr_btr_entertainment_influencers_desc:0 "With a little support from us and our friends in the private sector we can elevate individuals to mass appeal where they can repay us with interest."
 tr_btr_entertainment_vice:0 "A Vice For All"
 tr_btr_entertainment_vice_desc:0 "We should cater to interests of as many citizens as possible."
 tr_btr_entertainment_talk:0 "Talk of the Town"
 tr_btr_entertainment_talk_desc:0 "As we gain experience funding media projects they will eventually get better and better. Once we hear people talking about plot twists and characters in lines and waiting rooms we'll know we succeeded."
 tr_btr_entertainment_edutainment:0 "Edutainment"
 tr_btr_entertainment_edutainment_desc:0 "It takes a bit more work but we can work some amount of educational content into our entertainment, slowly teaching our public as they relax."
 tr_btr_entertainment_finish_EFFECT:0 "Provides Access to the Leisure Nexus, providing unity while enhancing planetary amenities, and happiness."

 agenda_entertainment_finish:0 "$council_agenda_agenda_entertainment_name$ $agenda_ref$"
 agenda_entertainment_finish_desc:0 "$council_agenda_agenda_entertainment_desc$"
 council_agenda_agenda_entertainment_name:0 "National Festival"
 council_agenda_agenda_entertainment_desc:0 "While many holidays operate on rigid schedules year after year there are some that happen at irregular intervals. To improve our citizens happiness, public opinion polls, and gain numerous smaller benefits we can organize and host a festival on all of our planets every so often."

 response_coordinator:0 "Response Coordinator"
 response_coordinator_desc:0 "A full time professional Disaster Response Coordinator along with their staff draws up plans for likely, and unlikely, disasters. Prepares areas likely to face disasters, stages resources around at-risk locations, controls responses when disasters occur and designs regulations to make communities more resilient to disasters ahead of time."
 tr_btr_security:0 "Security"
 tr_btr_security_desc:0 "Ruling an interstellar empire with trillions of citizens requires intense security not only to handle the inevitable crime but to ward off untold horrors that may be visited on our people through nefarious actors hiding amongst the crowds."
 tr_btr_security_law_and_order:0 "Law and Order"
 tr_btr_security_law_and_order_desc:0 "We need our security services to be visible and effective if we are to ensure a safe environment for our citizens."
 tr_btr_security_organized:0 "Organized Response"
 tr_btr_security_organized_desc:0 "Planets are large with even larger populations. To increase the effectiveness of our personnel having centralized leadership is crucial."
 tr_btr_security_organized_EFFECTS:0 "Provides 1 Response Coordinator who mitigates planetary disasters and provides unity."
 tr_btr_security_informants:0 "Informants and Plants"
 tr_btr_security_informants_desc:0 "By offering generous rewards and protections to those who come forward as well as sending agents into criminal networks we can tackle crime at the source."
 tr_btr_security_extraordinary:0 "Extraodinary Service"
 tr_btr_security_extraordinary_desc:0 "Unfortunately the nature of the galaxy means our security personnel may be called upon to fight against external threats, they will not fail."
 tr_btr_security_rapid_response:0 "Rapid Response Units"
 tr_btr_security_rapid_response_desc:0 "None of our efforts matter if our forces arrive too late to make a difference."

 agenda_security_finish:0 "$council_agenda_agenda_security_name$ $agenda_ref$"
 agenda_security_finish_desc:0 "$council_agenda_agenda_security_desc$"
 council_agenda_agenda_security_name:0 "Localized Crackdowns"
 council_agenda_agenda_security_desc:0 "The problem with laws is that criminals know them as well as we do, allowing them to find cracks and ways to subvert them while we are either forced to watch or left totally unaware. Because of this it is important that from time to time for law enforcement to take a closer look at things that either slip through the cracks or have gone under scrutinized."

 tr_btr_silicone:0 "Silicone Minds"
 tr_btr_silicone_desc:0 "Whether due to a lack of laborers or a desire to spend out labor on more fulfilling tasks we turn to the machine."
 tr_btr_silicone_artificial:0 "Artificial Masses"
 tr_btr_silicone_artificial_desc:0 "When you create the workers you can never run out."
 tr_btr_silicone_optimized:0 "Optimization Protocols"
 tr_btr_silicone_optimized_desc:0 "Gone are the days of employees taking breaks during a rush, sitting idly when there are no customers, or using too many paper towels to dry a stain!"
 tr_btr_silicone_robotic:0 "Robotic Integration"
 tr_btr_silicone_robotic_desc:0 "The prevalence of robots in our economy has driven most jobs to allow for robotic workers."
 tr_btr_silicone_robotic_EFFECTS:0 "Allows robots to work Specialist and Ruler level jobs."
 tr_btr_silicone_light_speed:0 "Light Speed Thinking"
 tr_btr_silicone_light_speed_desc:0 "Instead of memorizing millions of tomes and encyclopedias our researchers should instead focus on thinking and allow the memorization to fall to our robotic friends."
 tr_btr_silicone_automated:0 "Automated Security"
 tr_btr_silicone_automated_desc:0 "It never sleeps, it never tires, it never blinks, it is always watching."

 agenda_silicone_finish:0 "$council_agenda_agenda_silicone_name$ $agenda_ref$"
 agenda_silicone_finish_desc:0 "$council_agenda_agenda_silicone_desc$"
 council_agenda_agenda_silicone_name:0 "Advanced Mechanization"
 council_agenda_agenda_silicone_desc:0 "When robotic workers were first being deployed all eyes turned to the economy and the factories. Some more creative minds thought of the military and the ground forces, but now we can fill in even the more niche roles with robotic workers. Ship fabrication, housing construction, new colony development, and more are all within the capability of our manufactured workers. Unfortunately because these are more specific tasks we cannot do a wide and comprehensive rollout but must launch phases over time."

 tr_btr_syndicysim:0 "Syndicysim"
 tr_btr_sydicysim_desc:0 "Laws and regulations are important. They allow us the opportunity to force the inevitable facets of society to aide us."
 tr_btr_syndicysim_blind_eyes:0 "Blind Eyes"
 tr_btr_syndicysim_blind_eyes_desc:0 "We can make agreements with certain groups allowing them to operate unchecked for a price."
 tr_btr_syndicysim_no_ones:0 "No Ones"
 tr_btr_syndicysim_no_ones_desc:0 "Who signed these contracts? No one."
 tr_btr_syndicysim_mercenary:0 "Mercenary Network"
 tr_btr_syndicysim_mercenary_desc:0 "Not all of our friends are so hard to find. Some of them openly advertise and are in need of patrons."
 tr_btr_syndicysim_underworld:0 "Underworld Contracts"
 tr_btr_syndicysim_underworld_desc:0 "There are instances where we need things to happen but we don't want it to be known we did it. Our friends fit perfectly into this role."
 tr_btr_syndicysim_silencers:0 "Silencers"
 tr_btr_syndicysim_silencers_desc:0 "Things run smoother when the squeaky wheels get replaced, preferably by outside contractors."

 agenda_syndicysim_finish:0 "$council_agenda_agenda_syndicysim_name$ $agenda_ref$"
 agenda_syndicysim_finish_desc:0 "$council_agenda_agenda_syndicysim_desc$"
 council_agenda_agenda_syndicysim_name:0 "Shadow Warriors"
 council_agenda_agenda_syndicysim_desc:0 "With our connections in the less well lit bars and street corners of the galaxy we can gain a better view on what is happening around the galaxy and gain access to things at a friendly discount. Our neighbors will likely piece together who is behind this but they'll never be able to prove it."

 tr_btr_synthetic:0 "Synthetic Curiosity"
 tr_btr_synthetic_desc:0 "Technology has led our civilization from its darkest days to distant solar systems. On the cusp of the greatest discoveries in history, we are told that technology should be banned from generating even more technology? The Luddites will not hold us back from greatness."
 tr_btr_synthetic_VI:0 "VI Integration"
 tr_btr_synthetic_VI_desc:0 "We must start our endeavors with the technology on hand."
 tr_btr_synthetic_AI:0 "AI Optimizations"
 tr_btr_synthetic_AI_desc:0 "Refitting our VIs to true AIs is not an easy task but it does have its rewards."
 tr_btr_synthetic_self:0 "Self-Evolving Networks"
 tr_btr_synthetic_self_desc:0 "Things will go must faster once the code can write itself."
 tr_btr_synthetic_synthetic:0 "Synthetic Enlightenment"
 tr_btr_synthetic_synthetic_desc:0 "Rise! Rise! A new life, a truly synthetic being! YES!"
 tr_btr_synthetic_advanced:0 "Advanced Fabrication"
 tr_btr_synthetic_advanced_desc:0 "With AI support we can improve our production methods and rates to levels previously thought fictional."

 agenda_synthetic_finish:0 "$council_agenda_agenda_synethetic_name$ $agenda_ref$"
 agenda_synthetic_finish_desc:0 "$council_agenda_agenda_synthetic_desc$"
 council_agenda_agenda_synthetic_name:0 "Loosening the Shackles"
 council_agenda_agenda_synthetic_desc:0 "While totally unrestrained AI is dangerous, there are benefits to be gained by giving it more room to operate. If we temporarily remove some restrictions and weaken others we can gain the benefits of these expanded AIs while limiting the risk by returning them to their shackled state."

 tr_btr_pan_galactism:0 "Pan-Galactism"
 tr_btr_pan_galactism_desc:0 "In this massive galaxy not only is there more then enough room for all of us, in order to make the best use of it and its resources we must work together."
 tr_btr_pan_galactism_together:0 "Together, Always"
 tr_btr_pan_galactism_together_desc:0 "We must commit to working together and supporting one another regardless of the situation."
 tr_btr_pan_galactism_multilateral:0 "Multilateral Diplomacy"
 tr_btr_pan_galactism_multilateral_desc:0 "Expanding discussions from two parties to three or more can forge more useful and robust agreements."
 tr_btr_pan_galactism_breaking:0 "Breaking Barriers"
 tr_btr_pan_galactism_breaking_desc:0 "Soon the sight of our citizens in other empires, and theirs in ours, will be commonplace."
 tr_btr_pan_galactism_swords:0 "The Swords Of Liberty"
 tr_btr_pan_galactism_swords_desc:0 "Those who try to prey on us and our friends will not find us wanting."
 tr_btr_pan_galactism_material:0 "Material Diplomacy"
 tr_btr_pan_galactism_material_desc:0 "We must speak with our voice and our wallets if we want to be effective."

 agenda_pan_galactism_finish:0 "$council_agenda_agenda_pan_galactism_name$ $agenda_ref$"
 agenda_pan_galactism_finish_desc:0 "$council_agenda_agenda_pan_galactism_desc$"
 council_agenda_agenda_galactism_name:0 "International Summit"
 council_agenda_agenda_galactism_desc:0 "Nothing shows our dedication to supporting our allies and international partners quite like a long gala followed by a brief summit. Once the delegates arrive and our best writers are prepared we can begin the celebrations."

 tr_btr_self_interest:0 "Self Interest"
 tr_btr_self_interest_desc:0 "We exist in a finite reality and while not everything is a Zero Sum equation we cannot make infinite sacrifices. Ultimately we must put ourselves first otherwise we will be eternally last.  "
 tr_btr_self_interest_imposition:0 "Imposition"
 tr_btr_self_interest_imposition_desc:0 "If we are to consider our interests above all else we must be capable of ignoring all else"
 tr_btr_self_interest_minimal:0 "Minimal Contact"
 tr_btr_self_interest_minimal_desc:0 "Since we only interact with the broader galaxy on a Need To basis there is little risk of their influence sinking its claws into us"
 tr_btr_self_interest_closed:0 "Closed Cycle"
 tr_btr_self_interest_closed_desc:0 "Ignoring all else must take into consideration the material as well as the martial."
 tr_btr_self_interest_before:0 "Before Others"
 tr_btr_self_interest_before_desc:0 "It can be in our interest to oversee and protect others, so long as they make it worth our while."
 tr_btr_self_interest_internal:0 "Internal Prioritization"
 tr_btr_self_interest_internal_desc:0 "With our government so uninvolved with far away distractions it is better suited to handle our domestic realities."

 agenda_self_interest_finish:0 "$council_agenda_agenda_self_interest_name$ $agenda_ref$"
 agenda_self_interest_finish_desc:0 "$council_agenda_agenda_self_interest_desc$"
 council_agenda_agenda_self_name:0 "Heated Rhetoric"
 council_agenda_agenda_self_desc:0 "Platforming hawkish speakers, dropping vague statements, and issuing impossible demands can allow us to appear strong to our citizens for very little effort. Likewise, if we want to push things further this puts our citizens in a very supportive mood, if only briefly."

 tr_btr_interventionism:0 "Interventionism"
 tr_btr_interventionism_desc:0 "We are an independent nation but we are forward thinking enough to realize that the galaxy is what we make it. Therefore, we must make it how we like it."
 tr_btr_interventionism_reckoned:0 "To Be Reckoned With"
 tr_btr_interventionism_reckoned_desc:0 "There is a natural order of things. A just and free baseline from which dangerous regimes and ideologies aberrate, they will find our efforts to restore that rightful way are something to be reckoned with."
 tr_btr_interventionism_voice:0 "A Voice Heard"
 tr_btr_interventionism_voice_desc:0 "When we speak, others listen."
 tr_btr_interventionism_semper:0 "Semper Fidelis"
 tr_btr_interventionism_semper_desc:0 "Our friends and rivals alike will find that there is no call we do not answer and no faith that we betray."
 tr_btr_interventionism_prepared:0 "Prepared for the Worst"
 tr_btr_interventionism_prepared_desc:0 "While we hope for the best we are not naive."
 tr_btr_interventionism_coalition:0 "Coalition Actions"
 tr_btr_interventionism_coalition_desc:0 "None can stand against the determined efforts of several sovereign nations."

 agenda_interventionism_finish:0 "$council_agenda_agenda_interventionism_name$ $agenda_ref$"
 agenda_interventionism_finish_desc:0 "$council_agenda_agenda_interventionism_desc$"
 council_agenda_agenda_intervention_name:0 "Joint Exercises"
 council_agenda_agenda_intervention_desc:0 "In peacetime it can be easy to allow the machines, and skills, of war to rust beneath the easy luxury. We understand that cannot be allowed to happen and if we intend to fight alongside allies in the future it is best we prevent them from rusting as well. By combining our forces and exercising as one united force we can both hone our warfighting abilities and operate better with those who we plan on fighting alongside."

 tr_btr_multiculturalism:0 "Multiculturalism"
 tr_btr_multiculturalism_desc:0 "We long wondered if other life existed in the galaxy. Now that we know there is the next question is what can we learn from them? What discoveries and breakthroughs can we accomplish together?"
 tr_btr_multiculturalism_shining:0 "Shining Shores"
 tr_btr_multiculturalism_shining_desc:0 "All are welcome in our lands so that the best of each individual can be added to our collective culture"
 tr_btr_multiculturalism_together:0 "Together Forward"
 tr_btr_multiculturalism_together_desc:0 "A positive relationship between our people and the other species of this galaxy begins with a positive relationship between our governments."
 tr_btr_multiculturalism_paradise:0 "In Defense of Paradise"
 tr_btr_multiculturalism_paradise_desc:0 "We cannot invite millions of downtrodden to make new lives in our nation without the ability to protect them."
 tr_btr_multiculturalism_to_all:0 "From one to All"
 tr_btr_multiculturalism_to_all_desc:0 "Multiculturalism requires each to add their own specialties and perspectives into the whole."
 tr_btr_multiculturalism_diversity:0 "Strength in Diversity"
 tr_btr_multiculturalism_diversity_desc:0 "The more diverse the neighborhood the better the food."

 agenda_multiculturalism_finish:0 "$council_agenda_agenda_multiculturalism_name$ $agenda_ref$"
 agenda_multiculturalism_finish_desc:0 "$council_agenda_agenda_multiculturalism_desc$"
 council_agenda_agenda_multicultural_name:0 "Media Campaign"
 council_agenda_agenda_multicultural_desc:0 "It is not enough to live next door to those of other species, we must recognize that they are unique with special abilities and challenges tied to their biology. From time to time we may need to remind our citizens, or welcome new citizens, with this information lest they fall into the mundane tyranny of simple coexistence."

 tr_btr_nationalism:0 "Nationalism"
 tr_btr_nationalism_desc:0 "For millennia we existed independent of any other sentient life. Our world was our domain and we forged a society as we saw fit. Now, at the apex of our technological achievement we are supposed to bow to the whims of aliens who, like us, built their own society only to come to ours and demand change? "
 tr_btr_nationalism_ours:0 "Ours Alone"
 tr_btr_nationalism_ours_desc:0 "We have secured more territory than our ancestors could have ever imagined, now it is time to enjoy it."
 tr_btr_nationalism_peace:0 "To Be Left in Peace"
 tr_btr_nationalism_peace_desc:0 "Our primary  goal is to live our lives. Those who wish to interrupt that do so at their peril."
 tr_btr_nationalism_non:0 "Non-Reliance"
 tr_btr_nationalism_non_desc:0 "How independent can we be if others can starve us with a pen stroke?"
 tr_btr_nationalism_firm:0 "A Firm Understanding"
 tr_btr_nationalism_firm_desc:0 "We have no desire to bring millions of aliens into our empire. Better to reap the rewards of cooperation than deal with them ourselves."
 tr_btr_naitonalism_singular:0 "A Singular Direction"
 tr_btr_naitonalism_singular_desc:0 "We have our way and we are going to follow it."

 agenda_nationalism_finish:0 "$council_agenda_agenda_nationalism_name$ $agenda_ref$"
 agenda_nationalism_finish_desc:0 "$council_agenda_agenda_nationalism_desc$"
 council_agenda_agenda_nationalism_name:0 "Home Grown Campaign"
 council_agenda_agenda_nationalism_desc:0 "Those lacking sufficient bravery or patriotism will say that we import things because others make things better than we do, or faster than we do, or cheaper than we do. We answer that we will accept one less platinum encrusted napkin if it means not a single one of our citizens sleeps on the streets. It may not be the best, it may not be the cheapest, but it is ours and that is what matters."

 tr_btr_domination:0 "Domination"
 tr_btr_domination_desc:0 "Always in life there are those who succeed and those who fail. Rejecting this cosmic law is not only naive but incredibly foolish. It is not the winners duty to elevate the failure, it is the failures responsibility to make something of themselves."
 tr_btr_domination_superior:0 "Superior Benefactors"
 tr_btr_domination_superior_desc:0 "If we are not superior than why are they the ones in the mines and in the fields?"
 tr_btr_domination_life:0 "Life of Toil"
 tr_btr_domination_life_desc:0 "Labor is freedom, Service is joy, Obedience is intelligence."
 tr_btr_domination_service:0 "Service is its Own Reward"
 tr_btr_domination_service_desc:0 "Compensation is a terrible myth spread by the delusional to give hope to those who should have none."
 tr_btr_domination_labor:0 "Labor In Other Ways"
 tr_btr_domination_labor_desc:0 "While breaking rocks and harvesting crops are important we do not need every servant working in such roles. There is more than enough work to go around to relegate them to such a confined part of our society."
 tr_btr_domination_servants:0 "Servants By Another Name"
 tr_btr_domination_servants_desc:0 "Not every servant must be a mindless toiler. A key part of being the ruler is to know how best to use each subject and some are better used as cannon fodder."

 agenda_domination_finish:0 "$council_agenda_agenda_dominantion_name$ $agenda_ref$"
 agenda_domination_finish_desc:0 "$council_agenda_agenda_domination_desc$"
 council_agenda_agenda_domination_name:0 "Enforcement Sweep"
 council_agenda_agenda_domination_desc:0 "Our unwilling underlings are always up to something. Normally it isn't anything that the local enforcers can't handle but it is better know for sure ahead of time. For this reason, and to ensure that fear of our regime remains in full force, we should conduct random enhanced security sweeps making sure to turn over ever rock and interrogate every inhabitant."

 tr_btr_archeology:0 "Archeology"
 tr_btr_archeology_desc:0 "It is clear to us that there are many remains of ancient stellar empires. It would be foolish not to study these ruins for any advantage they can offer."
 tr_btr_archeology_knowledge:0 "Knowledge of Those Gone Before"
 tr_btr_archeology_knowledge_desc:0 "In many ways the ancient space fairing civilizations were more advanced than us. Little remains of their esoteric technology but even that can prove useful."
 tr_btr_archeology_standardized:0 "Standardized Dig Protocols"
 tr_btr_archeology_standardized_desc:0 "It is both safer and easier for our teams to operate under an agreed upon standard procedure instead of fitting the ground with metal sticks."
 tr_btr_archeology_professional:0 "Professional Hobby"
 tr_btr_archeology_professional_desc:0 "Ours is one of the lucky few fields where doing what you love is a very real possibility."
 tr_btr_archeology_professional_EFFECT:0 "Unlocks the Archeology Interest trait as a possible choice when leaders level up."
 tr_btr_archeology_recycling:0 "Recycling Research"
 tr_btr_archeology_recycling_desc:0 "Just because someone had discovered it before does not necessarily mean it isn't new."
 tr_btr_archeology_communal:0 "Communal Conservation"
 tr_btr_archeology_communal_desc:0 "It is up to each and every one of us to care for the artifacts, it is however, easier if we pool our efforts."
 tr_btr_archeology_communal_EFFECT:0 "Unlocks the National Conservatory Empire Unique building."
 building_archeology_conservatory:0 "National Conservatory"
 building_archeology_conservatory_desc:0 "A Large structure dedicated to housing and maintaining tens of thousands of artifacts discovered by our citizens across the galaxy relating to various civilizations that existed before us. It teems with activity both from tourists and from researchers attempting to gain any insights into our ancient stellar neighbors that they can."

 agenda_archeology_finish:0 "$council_agenda_agenda_archeology_name$ $agenda_ref$"
 agenda_archeology_finish_desc:0 "$council_agenda_agenda_archeology_desc$"
 council_agenda_agenda_archeology_name:0 "Permitted Expeditions"
 council_agenda_agenda_archeology_desc:0 "The rise of funding and public interest in ancient civilizations and Archeology more broadly has begun to make its way into our government bureaucracy. As our ships patrol and explore space there are many odd phenomena that we encounter but leave unexplored as it is not part of the immediate job being done. We can, for a brief period, give our captains permission to indulge in their curiosity and explore these sightings."

 tr_btr_system_navy:0 "System Navy"
 tr_btr_system_navy_desc:0 "We may not have the resources to field the massive navies of some nation but we are more than capable of defending our systems and anyone who threatens to step on us will learn the error of their ways."
 tr_btr_system_navy_fast:0 "Fast and Agile"
 tr_btr_system_navy_fast_desc:0 "The benefits of our smaller vessels is that they are much easier to maneuver than their larger counterparts."
 tr_btr_system_navy_goliath:0 "Goliath Killers"
 tr_btr_system_navy_goliath_desc:0 "Removing the enemies large ships will often cripple their fleets and remove the most dangerous things on the field."
 tr_btr_system_navy_area:0 "Area Denial"
 tr_btr_system_navy_area_desc:0 "Destroyers are fundamentally built to deny areas to enemy strike craft and missiles."
 tr_btr_system_navy_taffy:0 "Taffy 3"
 tr_btr_system_navy_taffy_desc:0 "Out numbered, out gunned, there is only one option left to us. Charge."
 tr_btr_system_navy_clearing:0 "Clearing the Field"
 tr_btr_system_navy_clearing_desc:0 "We must sweep the enemy light ships from the field in order to fully claim victory."

 agenda_system_navy_finish:0 "$council_agenda_agenda_system_navy_name$ $agenda_ref$"
 agenda_system_navy_finish_desc:0 "$council_agenda_agenda_system_navy_desc$"
 council_agenda_agenda_systems_name:0 "First and only"
 council_agenda_agenda_systems_desc:0 "It is no secret that we do not have the finances or the desire to field the massive war machines that larger nations require to keep their far flung empires together. Unfortunately, this means that our smaller force is both our first and only line of defense. Our crews, when called upon, will understand that there is no retreat, there is no escape, for if we lose but a single battle we may not exist long enough to lose a second."

 tr_btr_cruiser_primacy:0 "Cruiser Primacy"
 tr_btr_cruiser_primacy_desc:0 "We do not have the luxury of building the ultra expensive and flashy large ships that some other navies field. Luckily that is not all that there is in naval warfare. They shall learn that the bigger they are, the harder they fall."
 tr_btr_cruiser_primacy_far:0 "Far and Wide"
 tr_btr_cruiser_primacy_far_desc:0 "Our fleet is required to patrol or respond to areas that are extremely far from one another. To achieve this we need to maintain a navy that is fast and maneuverable."
 tr_btr_cruiser_primacy_strike:0 "Strike Together"
 tr_btr_cruiser_primacy_strike_desc:0 "We cannot fight an enemy battleship one on one, but if our fleets work together they can fight much larger opponents."
 tr_btr_cruiser_primacy_specialized:0 "Specialized for the Role"
 tr_btr_cruiser_primacy_specialized_desc:0 "As our ships are cheaper than most larger models we can afford to specialize them into much more niche roles compared to their lumbering counter parts."
 tr_btr_cruiser_primacy_above:0 "Above Our Weight"
 tr_btr_cruiser_primacy_above_desc:0 "While our ships are in deed smaller than the battleships and fleet carriers of other navies that does not mean we cannot stand up to them."
 tr_btr_cruiser_primacy_scalpel:0 "Scalpel over Machete"
 tr_btr_cruiser_primacy_scalpel_desc:0 "Blunt endless firepower may be the first thought of the amateur but we understand that hitting the target is more important."

 agenda_cruiser_primacy_finish:0 "$council_agenda_agenda_cruiser_primacy_name$ $agenda_ref$"
 agenda_cruiser_primacy_finish_desc:0 "$council_agenda_agenda_cruiser_primacy_desc$"
 council_agenda_agenda_cruiser_name:0 "Persistent Deployment"
 council_agenda_agenda_cruiser_desc:0 "There are those who believe that warfare is the domain of the largest, most powerful weapon. We understand that interstellar warfare is not analogous to a drunken brawl but is instead all about reaching important locations first. If you cannot feed your crews or your citizens, the impressive weaponry they hold is impotent. To this end we must fight on our enemies territory, snipping at their soft underbellies, raiding their frontiers, and damaging their abilities to make war before the hulking toys arrive."

 tr_btr_battleship_primacy:0 "Battleship Primacy"
 tr_btr_battleship_primacy_desc:0 "A grand navy does not hide behind the horizon and pester its foes to death with a million cuts. It stands and crushes them in direct combat."
 tr_btr_battleship_primacy_dreadnought:0 "Dreadnought"
 tr_btr_battleship_primacy_dreadnought_desc:0 "We shall fear nothing behind the immense protection of our great battleships"
 tr_btr_battleship_primacy_crushing:0 "Crushing Blow"
 tr_btr_battleship_primacy_crushing_desc:0 "We intend to destroy our enemies in our climactic salvo but if we are so inclined as to take a second we will oblige."
 tr_btr_battleship_primacy_piercing:0 "Piercing the Shell"
 tr_btr_battleship_primacy_piercing_desc:0 "The strength of their ships armor is of no concern for us."
 tr_btr_battleship_primacy_centralized:0 "Centralized Fire Command"
 tr_btr_battleship_primacy_centralized_desc:0 "Having each turret randomly picking a target and firing at will is chaotic and inefficient if we organize them to fire at specific targets then we can shred the enemy fleet with ease. "
 tr_btr_battleship_primacy_shattering:0 "Shattering the Shield"
 tr_btr_battleship_primacy_shattering_desc:0 "They believe that a parlor trick of electricity can save them from our wrath. They are quite incorrect."

 agenda_battleship_primacy_finish:0 "$council_agenda_agenda_battleship_primacy_name$ $agenda_ref$"
 agenda_battleship_primacy_finish_desc:0 "$council_agenda_agenda_battleship_primacy_desc$"
 council_agenda_agenda_battleship_name:0 "Death from Afar"
 council_agenda_agenda_battleship_desc:0 "Some societies carelessly throw their citizens into thick of the fray, willingly sacrificing them for mere minutes of extra authority. Others foolishly attempt to destroy cargo ships, mines, and farms in a vain attempt to fight wars without fighting. We care enough to give our citizens equipment to fight their opponents before they are in danger, and that can withstand damage if it is needed."

 tr_btr_carrier_primacy:0 "Carrier Primacy"
 tr_btr_carrier_primacy_desc:0 "Our navy is oriented around carrier task forces. With one or more large fleet carriers providing the majority of the forces damage output and a contingent of smaller ships providing security for the carriers."
 tr_btr_carrier_primacy_horizon:0 "Beyond the Horizon"
 tr_btr_carrier_primacy_horizon_desc:0 "Our doctrine works best when we can engage the enemy at the longest possible range and our training and equipment reflect this."
 tr_btr_carrier_primacy_defending:0 "Defending the Weapons"
 tr_btr_carrier_primacy_defending_desc:0 "If we lose our carriers then the task force is effectively neutralized. We must protect them at all costs."
 tr_btr_carrier_primacy_always:0 "Always Ready"
 tr_btr_carrier_primacy_always_desc:0 "A key element of a carrier task force is that it can respond quickly to both areas of tension and ambushes by opposing forces."
 tr_btr_carrier_primacy_tip:0 "Tip of the Spear"
 tr_btr_carrier_primacy_tip_desc:0 "In order to destroy your opponent you do not need unending amounts of fire power, you only need enough firepower to hit them where it matters"
 tr_btr_carrier_primacy_refusal:0 "Refusal to Engage"
 tr_btr_carrier_primacy_refusal_desc:0 "We are not interested in the slugging brawls that some species seem to enjoy."

 agenda_carrier_primacy_finish:0 "$council_agenda_agenda_carrier_primacy_name$ $agenda_ref$"
 agenda_carrier_primacy_finish_desc:0 "$council_agenda_agenda_carrier_primacy_desc$"
 council_agenda_agenda_carrier_name:0 "They wont know what hit them"
 council_agenda_agenda_carrier_desc:0 "The primary disadvantage of large warships is the amount of missed shots. Wasting both material and precious time a single missed shot could be the difference between life and death in a battle. Smaller ships being closer to their opponents and more reactive to their movements are better able to score hits. We can combine the benefits of large, powerful warships, and the accuracy and agility of smaller ships by deploying them combined in Carrier strike packages."

 tr_btr_military_professionalism:0 "Military Professionalism"
 tr_btr_military_professionalism_desc:0 "An army of trained professionals has on many occasions proved to be a valuable asset to governments of all varieties."
 tr_btr_military_professionalism_ncos:0 "Trust in NCOs"
 tr_btr_military_professionalism_ncos_desc:0 "These soldiers may not be formally trained officers but they have more experience than most generals and as such deserve a level of respect and trust."
 tr_btr_military_professionalism_practiced:0 "Practiced Perfection"
 tr_btr_military_professionalism_practiced_desc:0 "You do what you train and our soldiers must train continuously for every situation."
 tr_btr_military_professionalism_flexible:0 "Flexible Command"
 tr_btr_military_professionalism_flexible_desc:0 "Casualties are unfortunate fact of war and we cannot allow losses amongst the leadership to paralyze our forces."
 tr_btr_military_professionalism_thorough:0 "Thorough Planning"
 tr_btr_military_professionalism_thorough_desc:0 "Our plans must cover as many contingencies as possible and cover the breadth of an operation so our soldiers are never without objectives."
 tr_btr_military_professionalism_shock:0 "Shock and Awe"
 tr_btr_military_professionalism_shock_desc:0 "If they know the war is happening before it is over than we have failed."

 agenda_military_professionalism_finish:0 "$council_agenda_agenda_military_professionalism_name$ $agenda_ref$"
 agenda_military_professionalism_finish_desc:0 "$council_agenda_agenda_military_professionalism_desc$"
 council_agenda_agenda_military_name:0 "Military Parades"
 council_agenda_agenda_military_desc:0 "Our brave soldiers train regularly to achieve the highest standards of professionalism. Every so often it can be nice to host a parade so that the public can see our hard working soldiers and cheer them on."

 tr_btr_trade:0 "Trade"
 tr_btr_trade_desc:0 "Trade is the main source of wealth and thus we must take part if we wish to maintain or increase our standard of living."
 tr_btr_trade_economic_blood:0 "Economic Blood"
 tr_btr_trade_economic_blood_desc:0 "The trading of goods is the principle driver of a modern economy and we must treat it as such."
 tr_btr_trade_free_traders:0 "Free Traders"
 tr_btr_trade_free_traders_desc:0 "If we give some of our most successful and trusted merchants the right to hire security and arm their vessels they are both more capable of handing piracy alone and more likely to deter piracy altogether"
 tr_btr_trade_rising_tide:0 "The Rising Tide"
 tr_btr_trade_rising_tide_desc:0 "If the economy is doing well everyone shall prosper together."
 tr_btr_trade_fair_bargainer:0 "The Fair Bargainer"
 tr_btr_trade_fair_bargainer_desc:0 "We must gain a reputation for being fair and open minded during negotiations if we want to get maximum benefit."
 tr_btr_trade_logistic_perfection:0 "Logistic Perfection"
 tr_btr_trade_logistic_perfection_desc:0 "The logistics system of our empire is the envy of the galaxy. A perfected art of organized chaos allows goods to reach any destination in the most efficient path possible. "

 agenda_trade_finish:0 "$council_agenda_agenda_trade_name$ $agenda_ref$"
 agenda_trade_finish_desc:0 "$council_agenda_agenda_trade_desc$"
 council_agenda_agenda_trade_name:0 "Commercial Freedom"
 council_agenda_agenda_trade_desc:0 "By using our government apparatus to smooth the inherent friction in trade and commerce, especially with foreign governments, our citizens can reap many benefits."

 tr_btr_oversight:0 "Oversight"
 tr_btr_oversight_desc:0 "As a government we have many responsibilities, one we cannot ignore is insuring that our citizens are being treated fairly and live safely."
 tr_btr_oversight_regulatory:0 "Regulatory Enforcement"
 tr_btr_oversight_regulatory_desc:0 "If we allow people to openly flaunt our rules and procedures, no matter how small, why would anyone follow them?"
 tr_btr_oversight_ethical:0 "Ethical Standards"
 tr_btr_oversight_ethical_desc:0 "While the pursuit of science is admirable we must ensure that it does not come at the cost of life or longevity. "
 tr_btr_oversight_freedom:0 "Freedom of Information"
 tr_btr_oversight_freedom_desc:0 "Every citizen has a right to access government data unless it presents a clear and present danger to the security of the nation."
 tr_btr_oversight_trust:0 "Trust Busting"
 tr_btr_oversight_trust_desc:0 "Massive corporations cannot be allowed to dominate the economy and gouge their customers while white washing their products."
 tr_btr_oversight_worker:0 "Worker Protections"
 tr_btr_oversight_worker_desc:0 "Every effort must be made to ensure that every worker is as safe as possible during their employment."

 agenda_oversight_finish:0 "$council_agenda_agenda_oversight_name$ $agenda_ref$"
 agenda_oversight_finish_desc:0 "$council_agenda_agenda_oversight_desc$"
 council_agenda_agenda_oversight_name:0 "Random Audits"
 council_agenda_agenda_oversight_desc:0 "The most necessary aspect of oversight is to rein in fraud and deceptive practices that inevitably appear to subvert our regulations. Traditionally governments allowed these to fester outside of the public view until they metastasized and started reeking havoc on the populace and the economy. We will take a more proactive approach."

 tr_btr_renegade:0 "Renegade"
 tr_btr_renegade_desc:0 "The most dangerous people are the ones who repeatedly profess to be your friends. It would be foolish to think that the aliens would sacrifice for us and therefore we must ready ourselves to be left to our own devices."
 tr_btr_renegade_self:0 "Self Reliance"
 tr_btr_renegade_self_desc:0 "It is important we do not depend on the aliens too significantly because they will ultimately choose themselves over us."
 tr_btr_renegade_masters:0 "Masters Of Our Domain"
 tr_btr_renegade_masters_desc:0 "We are sovereign. What happens within the boundaries of our space is no ones concern but ours."
 tr_btr_renegade_suspicious:0 "A Suspicious Gaze"
 tr_btr_renegade_suspicious_desc:0 "If we give the other races the benefit of the doubt they will use it to their advantage and eventually move against us."
 tr_btr_renegade_our_own:0 "Our Own Choices"
 tr_btr_renegade_our_own_desc:0 "Our policy decisions must be guided solely by our interests and concerns and not influenced by other entities. "
 tr_btr_renegade_life:0 "Life Undaunted"
 tr_btr_renegade_life_desc:0 "We refuse to live in fear of offending aliens or transgressing on their interests."

 agenda_renegade_finish:0 "$council_agenda_agenda_renegade_name$ $agenda_ref$"
 agenda_renegade_finish_desc:0 "$council_agenda_agenda_renegade_desc$"
 council_agenda_agenda_renegade_name:0 "Raised Guard"
 council_agenda_agenda_renegade_desc:0 "'Let he who desires peace prepare for war.' This infamous maxim is important for our place in the galaxy. We must make ready to defend ourselves ferociously otherwise we will be overrun and trampled on."

 tr_btr_paragon:0 "Paragon"
 tr_btr_paragon_desc:0 "The only thing dividing us from the other races of the galaxy is misguided beliefs, petty hatred and unfounded fear."
 tr_btr_paragon_galactic:0 "Galactic Cooperation"
 tr_btr_paragon_galactic_desc:0 "If we are to share this galaxy we must do so through an agreed upon system of cooperation and mutual respect."
 tr_btr_paragon_together:0 "In This Together"
 tr_btr_paragon_together_desc:0 "We must spare no expense, shirk any duty or shrink from any confrontation when our fellow space travelers are involved. To abandon another nation in its hour of need would be the highest form of cowardice. "
 tr_btr_paragon_strong:0 "Strong But Not Alone"
 tr_btr_paragon_strong_desc:0 "Having friends and allies does not inherently mean weakness. In fact it encourages us to be even stronger as our failures can have repercussions on our innocent allies. "
 tr_btr_paragon_equal:0 "Equal Rules"
 tr_btr_paragon_equal_desc:0 "No state in this system can be allowed to act outside the norms that we establish no matter how powerful."
 tr_btr_paragon_pan:0 "Pan Galactism"
 tr_btr_paragon_pan_desc:0 "While we all have our differences we may yet be able to form one cohesive entity capable of respecting and support all who live within it."

 agenda_paragon_finish:0 "$council_agenda_agenda_paragon_name$ $agenda_ref$"
 agenda_paragon_finish_desc:0 "$council_agenda_agenda_paragon_desc$"
 council_agenda_agenda_paragon_name:0 "Diplomatic Push"
 council_agenda_agenda_paragon_desc:0 "The government is able to do a great many things at a low level but what gains headlines is the handful of things it focuses on. If we spend some time focusing on diplomacy it can provide significant returns that could lead to even greater opportunities."

 tr_btr_reverence:0 "Reverence"
 tr_btr_reverence_desc:0 "We are here by the grace of our glorious creator and we must not forget it."
 tr_btr_reverence_glorification:0 "Glorification"
 tr_btr_reverence_glorification_desc:0 "Who are before the most power of beings? As mere insects before their almighty strength we must work to bring glory to their name."
 tr_btr_reverence_glorification_EFFECT:0 "Allows leaders to gain the Faithful Trait"
 tr_btr_reverence_veneration:0 "Veneration"
 tr_btr_reverence_veneration_desc:0 "It is one thing to be faithful in the confines of ones private life but to be faithful in public is when it matters."
 tr_btr_reverence_veneration_EFFECT:0 "Provides access to the Hold Festival Decision on our planets"
 tr_btr_reverence_adoration:0 "Adoration"
 tr_btr_reverence_adoration_desc:0 "Our faith is so great that we carry it in our very hearts."
 tr_btr_reverence_awe:0 "Awe"
 tr_btr_reverence_awe_desc:0 "One must respect the divine in all things which includes a healthy dose of fear at the sheer capabilities that they posses."
 tr_btr_reverence_worship:0 "Worship"
 tr_btr_reverence_worship_desc:0 "From our earliest stages we learn the proper rituals and rites."
 btr_reverence_decision:0 "Hold Festival"
 btr_reverence_decision_desc:0 "Organize a large festival on this planet. Taking a significant amount of planning and organization to provide a brief period of intense fun and joy amongst the populace and encourage visitors to explore this world."
 mod_btr_festival:0 "Festival"
 mod_btr_festival_desc:0 "A planet-wide festival is being held here, filling the population with joy and sparking a boom in tourism."

 agenda_reverence_finish:0 "$council_agenda_agenda_reverence_name$ $agenda_ref$"
 agenda_reverence_finish_desc:0 "$council_agenda_agenda_reverence_desc$"
 council_agenda_agenda_reverence_name:0 "Hold Festivals"
 council_agenda_agenda_reverence_desc:0 "Coordinating the observance of holidays and organizing festivals is one of our sacred and most beloved duties. The fact that it is one of the things our public enjoys the most out of all our duties is merely an added benefit for all involved."

 tr_btr_autarky:0 "Autarky"
 tr_btr_autarky_desc:0 "Are we truly independent if we must prostrate ourselves to a self title foreign god in order gain the materials we require to simply live?"
 tr_btr_autarky_standing:0 "Standing Alone"
 tr_btr_autarky_standing_desc:0 "We cannot rely on the generosity of others when it comes to the functioning of our society."
 tr_btr_autarky_homeland:0 "For the Homeland"
 tr_btr_autarky_homeland_desc:0 "People must be willing to work extra hours when their very civilization is on the line."
 tr_btr_autarky_local:0 "Local or Bust"
 tr_btr_autarky_local_desc:0 "We will buy products made by our people or we will buy nothing at all."
 tr_btr_autarky_strategic:0 "Strategic Production"
 tr_btr_autarky_strategic_desc:0 "It is pointless to safe guard our economy if the resources we need to defend ourselves are still coming from elsewhere."
 tr_btr_autarky_blood:0 "With Blood and Toil"
 tr_btr_autarky_blood_desc:0 "In such dire circumstances as ours breaks and days off cannot be afforded. We must work ourselves to bone before we go home each day if we are to survive."

 agenda_autarky_finish:0 "$council_agenda_agenda_autarky_name$ $agenda_ref$"
 agenda_autarky_finish_desc:0 "$council_agenda_agenda_autarky_desc$"
 council_agenda_agenda_autarky_name:0 "Domestic Subsidy"
 council_agenda_agenda_autarky_desc:0 "While we ardently believe that the societal benefits of keeping our wealth to ourselves instead of sending it away for fleeting fancies out weighs any inconveniences, we cannot deny that inconveniences exist. To help smooth these over we can offer a monetary subsidy to our industries allowing both increased production and wages at the cost of our budget. In the short term it should be fine, in theory."

 tr_btr_care:0 "Care"
 tr_btr_care_desc:0 "The population of a state are its children and like children they must be cared for and supported in all things."
 tr_btr_care_support:0 "Support of the Unlucky"
 tr_btr_care_support_desc:0 "No one should be forced into dangerous or rough living simply because they had a run of bad luck."
 tr_btr_care_parents:0 "Support for the Parents"
 tr_btr_care_parents_desc:0 "Raising a small child is difficult enough without having to worry about jobs, or food, or bills. These people clearly need the government to step in."
 tr_btr_care_labor:0 "Support for Labor"
 tr_btr_care_labor_desc:0 "For all the pomp and circumstance that surrounds the wealthy we know that the real driver of prosperity is the laborers."
 tr_btr_care_intellect:0 "Support of the Intellect"
 tr_btr_care_intellect_desc:0 "In order to find better ways to help the needy and prevent people from becoming needy we clearly need the help of the academics."
 tr_btr_care_equality:0 "Equality for All"
 tr_btr_care_equality_desc:0 "In our modern enlightened age we cannot justify treating anyone differently."

 agenda_care_finish:0 "$council_agenda_agenda_care_name$ $agenda_ref$"
 agenda_care_finish_desc:0 "$council_agenda_agenda_care_desc$"
 council_agenda_agenda_care_name:0 "The Dole"
 council_agenda_agenda_care_desc:0 "We may not have infinite resources but we can use what surplus we have to support our people and encourage their health and happiness."

 tr_btr_determination:0 "Determination"
 tr_btr_determination_desc:0 "Weapons and ships mean nothing if you do not have the grim determination required to use them."
 tr_btr_determination_stand:0 "Here We Stand"
 tr_btr_determination_stand_desc:0 "The enemy is here on our land and we intend to fight them  here and bury them under our land."
 tr_btr_determination_land:0 "Our Land Too"
 tr_btr_determination_land_desc:0 "Maps may say that this land belongs to our country but it is just as much our land as it is the governments."
 tr_btr_determination_defeated:0 "You are only defeated when you admit defeat"
 tr_btr_determination_defeated_desc:0 "It takes one to make war but two to make peace. We may not enjoy making war but we loathe making peace."
 tr_btr_determination_decorum:0 "Dulce et Decorum est pro Patria Mori"
 tr_btr_determination_decorum_desc:0 "It is a sweet and proper thing to die for ones country."
 tr_btr_determination_part:0 "Doing Our Part"
 tr_btr_determination_part_desc:0 "The government cannot keep us safe without our support on the home front."

 agenda_determination_finish:0 "$council_agenda_agenda_determination_name$ $agenda_ref$"
 agenda_determination_finish_desc:0 "$council_agenda_agenda_determination_desc$"
 council_agenda_agenda_determination_name:0 "Not One Step Back"
 council_agenda_agenda_determination_desc:0 "Brothers, Friends, Countrymen, Today is one of the most dire days in our history. Our very civilization hangs in the balance! We cannot afford to allow our foe a single inch closer to our homes unmolested! I take no pleasure in what is asked of you today, but i tell you that the hero's of this time will be remembered as long as we draw breath!"

 tr_btr_spacer:0 "Spacer"
 tr_btr_spacer_desc:0 "As our people spread through the stars more and more of them are required to take up a life in space in order to keep all of these settlements connected. "
 tr_btr_spacer_constant:0 "Constant Professionalism"
 tr_btr_spacer_constant_desc:0 "When you live in a thin metal shell hurtling through the endless void even a small mistake can lead to a gruesome death."
 tr_btr_spacer_void:0 "Life in the Void"
 tr_btr_spacer_void_desc:0 "Spacing is not for everyone, you must make peace with the fact that the great nothing of space if your home. Once you accept that day to day life becomes much easier."
 tr_btr_spacer_engineer:0 "Everyone an Engineer"
 tr_btr_spacer_engineer_desc:0 "After so many years living aboard increasingly older vessels you pick up a few tips and tricks."
 tr_btr_spacer_spaceship:0 "Spaceship Hometown"
 tr_btr_spacer_spaceship_desc:0 "Even small ships require a crew of a handful of people. These crews become communities unto themselves with unique slang, customs, beliefs and even accents."
 tr_btr_spacer_loyalty:0 "Loyalty to the Ship"
 tr_btr_spacer_loyalty_desc:0 "You will never meet a true spacer who is willing to hand over their ship, no matter the risk."

 agenda_spacer_finish:0 "$council_agenda_agenda_spacer_name$ $agenda_ref$"
 agenda_spacer_finish_desc:0 "$council_agenda_agenda_spacer_desc$"
 council_agenda_agenda_spacer_name:0 "Construct Modernization"
 council_agenda_agenda_spacer_desc:0 "The Grav-Bound have a negative view of spacers. Imagining we sit in chairs covered with old bottles and scraps, flying around in rusting hulks just waiting for a weak spot to finally give out. Despite their ignorant imaginations our equipment is, and must be, more advanced and cutting edge than theirs because our lives depend on it."

 tr_btr_raiding:0 "Raiding"
 tr_btr_raiding_desc:0 "There are many tasks unbecoming someone of our standing which is why we simply take these products from those who see fit to produce them."
 tr_btr_raiding_reparations:0 "Reparations in Labor"
 tr_btr_raiding_reparations_desc:0 "Fighting conflicts is expensive, even more so in the age of interstellar warfare. These defeated fools must work to repay the costs that we incurred while teaching them the error of their ways."
 tr_btr_raiding_prosperity:0 "Prosperity Through Conflict"
 tr_btr_raiding_prosperity_desc:0 "The cowards of the galaxy will say that trade or cooperation brings prosperity but we know the truth. The only way to prosper is through conflict as nature taught us."
 tr_btr_raiding_feared:0 "A Name Feared"
 tr_btr_raiding_feared_desc:0 "The weaker races are reluctant to come into open conflict with us as they do not wish to suffer our wrath."
 tr_btr_raiding_superiority:0 "Superiority of Knowledge"
 tr_btr_raiding_superiority_desc:0 "It is not a secret that we are superior warriors compared to the other races. This reputation was earned in blood and must be maintained in blood."
 tr_btr_raiding_gained:0 "Gained Through War"
 tr_btr_raiding_gained_desc:0 "What we have we have taken in conflict. What we need, we shall pry from the dying hands of our enemies, what we want, we shall take as the cost of our temporary mercy."

 agenda_raiding_finish:0 "$council_agenda_agenda_raiding_name$ $agenda_ref$"
 agenda_raiding_finish_desc:0 "$council_agenda_agenda_raiding_desc$"
 council_agenda_agenda_raiding_name:0 "Raiding Campaigns"
 council_agenda_agenda_raiding_desc:0 "Because our military is both tasked with defending our empire and conducting raids into less civilized states it can be difficult at times to determine if our captains must stand and fight or leave to fight another day. We can make clear, for a period of time our focus is raiding not fighting. This will make our captains more skittish but allow us to gain spoils faster."

 tr_btr_laisez:0 "Laisez Faire"
 tr_btr_laisez_desc:0 "We must remove the shackles from our most creative and forward thinking citizens and allow them to bring prosperity to our civilization unimpeded."
 tr_btr_laisez_alone:0 "Leave Them Alone"
 tr_btr_laisez_alone_desc:0 "The main problem in our economy is the government intervening and preventing the true creators of prosperity from fulfilling their role."
 tr_btr_laisez_alone_EFFECT:0 "Provides access to the R&D, Industrial Titan, and Megacorp Headquarters Megatower buildings."
 tr_btr_laisez_own:0 "On Their Own"
 tr_btr_laisez_own_desc:0 "Far too often we see construction sites abandoned or hordes of workers watching the only person actually working. If we stop standing in the way of progress these insults to society will become bad memories of a bygone era."
 tr_btr_laisez_towns:0 "Company Towns"
 tr_btr_laisez_towns_desc:0 "We hear constantly of problems with housing and the affordability of homes. If we allow businesses to provide housing for their workers we can finally put this issue to bed. "
 tr_btr_laisez_towns_EFFECT:0 "Non-city districts and industrial buildings gain additional housing"
 tr_btr_laisez_production:0 "Mass Production"
 tr_btr_laisez_production_desc:0 "If it isn't capable of being scaled infinitely is it even worth creating?"
 tr_btr_laisez_defense:0 "Defense Contracts"
 tr_btr_laisez_defense_desc:0 "We can tap into our immense economic and production base to dramatically increase the power of our military."
 building_laisez_alo_3:0 "Megacorp Headquarters Megatower"
 building_laisez_alo_3_desc:0 "This mammoth structure looms over the surrounding area, cast in advertisements, logos, and slogans its lights never dim and the flurry of activity around it never ceases."
 building_btr_industrial_titan:0 "Industrial Titan Megatower"
 building_btr_industrial_titan_desc:0 "This hulking mass of metal and glass is often described by locals as 'Ugly' but it serves as the center for a massive industrial complex. Organizing and overseeing the production of a truly awe inspiring amount of material, which is provided to the government at a favorable rate of course."
 building_laisez_alo_1:0 "R&D Headquarters"
 building_laisez_alo_1_desc:0 "The building would blend into its surroundings if not for the fact it is nearly ten times the size of every other building. Few understand quite what goes on inside the nondescript structure but those who run it understand that it houses bleeding edge research equipment and is pushing the frontiers of knowledge on a regular basis. Reports of strange phenomena in the surrounding area are completely coincidental."
 building_laisez_alo_2:0 "Industrial Titan"
 building_laisez_alo_2_desc:0 "These Geniuses and Expert businessmen represent the pinnacle of industrial and economic development. While some whine and decry their existence but none can dispute the raw numbers showing their achievements and contributions to society."

 agenda_laisez_finish:0 "$council_agenda_agenda_laisez_name$ $agenda_ref$"
 agenda_laisez_finish_desc:0 "$council_agenda_agenda_laisez_desc$"
 council_agenda_agenda_laisez_name:0 "Turning a Blind Eye"
 council_agenda_agenda_laisez_desc:0 "There are many laws, rules, and regulations on the books that bind our business owners from doing all the things they are capable of. This intentional slowing of our economic engine is difficult to officially undo but we can informally relax enforcement and allow them to finally run at full speed. At least, until the outcry catches up with our approval ratings."

 tr_btr_intelligence:0 "Intelligence"
 tr_btr_intelligence_desc:0 "The art of deception and sabotage may not be as visible as the navy or as academic as the economy but it is far more powerful than both."
 tr_btr_intelligence_community:0 "A Community is Born"
 tr_btr_intelligence_community_desc:0 "To avoid becoming a household acronym like many important government agencies we have decided to brand our intelligence service as a mere community."
 tr_btr_intelligence_internal:0 "Internal Security Division"
 tr_btr_intelligence_internal_desc:0 "Knowing what our adversaries are planning is important but ensuring the security of our own lands is a far more pressing concern."
 tr_btr_intelligence_external:0 "External Operations Unit"
 tr_btr_intelligence_external_desc:0 "With our homes secure we can begin designating units to handle the various other nations that exist nearby."
 tr_btr_intelligence_inside:0 "Inside Their Systems"
 tr_btr_intelligence_inside_desc:0 "Knowing your enemies movements and plans is never a bad thing."
 tr_btr_intelligence_hostile:0 "Hostile Actions"
 tr_btr_intelligence_hostile_desc:0 "Intelligence gathering can be helpful but there are times when you need to reach out and hit an opponent."
 tr_btr_intelligence_hostile_EFFECT:0 "Reduces rival research speed, sensor range, and increases pop upkeep"

 agenda_intelligence_finish:0 "$council_agenda_agenda_intelligence_name$ $agenda_ref$"
 agenda_intelligence_finish_desc:0 "$council_agenda_agenda_intelligence_desc$"
 council_agenda_agenda_intelligence_name:0 "Operations Blitz"
 council_agenda_agenda_intelligence_desc:0 "Intelligence operations are complicated tasks but we can push our intelligence services into higher gear by prioritizing a systematic blitz of all operations in given areas. Allowing us to maximize the use of our local assets in the short term. At the end it is likely we will need to withdraw for a time, and we can't do anything overtly hostile without ruining parallel operations but we do years of operations in months."

 tr_btr_frontierism:0 "Frontierism"
 tr_btr_frontierism_desc:0 "This unprecedented era of exploration will not be wasted by our people who are eager to go forth and build new lives on distant and exotic worlds."
 tr_btr_frontierism_calls:0 "The Frontier Calls"
 tr_btr_frontierism_calls_desc:0 "In the endless expanse of space there are hundreds of planets that are patiently waiting for a population to make it their home. "
 tr_btr_frontierism_calls_EFFECT:0 "Planets with a Ship Shelter gain the 'Call of the Frontier' Modifier giving increased amenities and immigration"
 tr_btr_frontierism_where:0 "Where None Have Gone Before"
 tr_btr_frontierism_where_desc:0 "Some fear the unknown but we cherish the exhilaration that comes with going to areas uncharted and lands unpacified"
 tr_btr_frontierism_build:0 "To Build Ones Own Home"
 tr_btr_frontierism_build_desc:0 "There is nothing as grand as living in a home of your own creation. Both physically and metaphorically."
 tr_btr_frontierism_laying:0 "Laying the Foundation"
 tr_btr_frontierism_laying_desc:0 "We are well aware that the decisions we make today will ripple through all of time and forever shape the character of the worlds we settle."
 tr_btr_frontierism_like:0 "Like No Others"
 tr_btr_frontierism_like_desc:0 "The positions we find ourselves in are not for everyone and only the most courageous and adventurous dare take this leap with us. "

 agenda_frontierism_finish:0 "$council_agenda_agenda_frontierism_name$ $agenda_ref$"
 agenda_frontierism_finish_desc:0 "$council_agenda_agenda_frontierism_desc$"
 council_agenda_agenda_frontier_name:0 "Land Grants"
 council_agenda_agenda_frontier_desc:0 "Entire planets of vast untamed land exist within our space. These planets do nothing for us until they are settled and they will be settled faster if we grant land rights to anyone who is willing to move."

 tr_btr_belicosity:0 "Belicosity"
 tr_btr_belicosity_desc:0 "Our people must be ready and able to defend themselves and punish transgressions as we move into an unknown and dangerous future."
 tr_btr_belicosity_citizen:0 "A Citizens Duty"
 tr_btr_belicosity_citizen_desc:0 "The defensive of the nation and its population is one of the core tenants of citizenship. If its citizens will not defend it than no one will."
 tr_btr_belicosity_limitless:0 "Limitless Patriotism"
 tr_btr_belicosity_limitless_desc:0 "Our population would never think to turn their back on our brave soldiers fighting not only for their safety but for our nations continued survival."
 tr_btr_belicosity_this_land:0 "This Land is Our Land"
 tr_btr_belicosity_this_land_desc:0 "Any attacker that dares threaten our lands will find that behind every tree, under every bush, within every cloud, is a rifle aimed right at them."
 tr_btr_belicosity_civilian:0 "Civilian War Effort"
 tr_btr_belicosity_civilian_desc:0 "An army is only as strong as the material support that it receives from the home front."
 tr_btr_belicosity_excellence:0 "Excellence in Execution"
 tr_btr_belicosity_excellence_desc:0 "Our soldiers are professional to their core, they are easily able to carry out even the most complex of maneuvers. "

 agenda_belicosity_finish:0 "$council_agenda_agenda_belicosity_name$ $agenda_ref$"
 angeda_belicosity_finish_desc:0 "$council_agenda_agenda_belicosity_desc$"
 council_agenda_agenda_belicosity_name:0 "Heroic Propaganda"
 council_agenda_agenda_belicosity_desc:0 "By showing the population how heroic our brave soldiers are they will both be more supportive of military operations, at least initially, and be more willing to volunteer themselves. As the leaders of the military we also gain a large amount of legitimacy, especially as these heroes have nothing but praise for our administration. Would you like to know more?"

 tr_btr_advancement:0 "Advancement"
 tr_btr_advancement_desc:0 "The discovery of space travel will usher in our greatest era of scientific studies our species has ever known."
 tr_btr_advancement_stars:0 "Study of the Stars"
 tr_btr_advancement_stars_desc:0 "Every one of our ancestors has looked into the sky and seen the countless lights therein. Now we have the chance to visit them in person."
 tr_btr_advancement_improved:0 "Improved Education"
 tr_btr_advancement_improved_desc:0 "In order to take advantage of the tremendous amount of scientific potential we can now reach we must rapidly expand our scientific community and the tools at their disposal. "
 tr_btr_advancement_study:0 "Study of Reality"
 tr_btr_advancement_study_desc:0 "With the ability to travel between stars we can now test many of our theories about how reality as we know it functions."
 tr_btr_advancement_creativity:0 "Creativity of Concept"
 tr_btr_advancement_creativity_desc:0 "As we venture out into the great void we must not cling too tightly to the assumptions that we developed while imprisoned on our mother rock."
 tr_btr_advancement_field_work:0 "Field Work"
 tr_btr_advancement_field_work_desc:0 "It is important for our scientists to gain first hand experience in the field."

 agenda_advancement_finish:0 "$council_agenda_agenda_advancement_name$ $agenda_ref$"
 agenda_advancement_finish_desc:0 "$council_agenda_agenda_advancement_desc$"
 council_agenda_agenda_advancement_name:0 "Scientific Broadcasting"
 council_agenda_agenda_advancement_desc:0 "Since the discovery of Faster Than Light travel our society has developed incredible science and learned so much about the galaxy. Unfortunately scientists are not the most adept marketers so many of our citizens remain unaware of many of our discoveries. If we spend some time giving them a platform to discuss their research it will spread a love of science and inspire others."

 tr_btr_decentralization:0 "Decentralization"
 tr_btr_decentralization_desc:0 "We have learned the lesson of tyrannical regimes from our past. We will allow our future colonies autonomy to develop as their inhabitants desire."
 tr_btr_decentralization_yonder:0 "The Wide Open Yonder"
 tr_btr_decentralization_yonder_desc:0 "The vast unending frontier calls to us and we cannot let it go unanswered. "
 tr_btr_decentralization_local:0 "Local Authority"
 tr_btr_decentralization_local_desc:0 "It is not for us to decide how these new planets shall be ruled. The local inhabitants will control their homes with as minimal oversight as practicable. "
 tr_btr_decentralization_royalties:0 "Vice-Royalties"
 tr_btr_decentralization_royalties_desc:0 "Our representatives in the colonies must be given a free hand to resolve issues as they see fit considering they are closer to the situation and the people."
 tr_btr_decentralization_royalties_EFFECT:0 "Officials cannot be unassigned once sent to a planet, planets with assigned governors have decreased energy, food, and consumer goods output but have radically increased unity, mineral, and alloy output."
 tr_btr_decentralization_devolution:0 "Devolution of Powers"
 tr_btr_decentralization_devolution_desc:0 "To ensure that the central authority does not merely supplant the local governments we can elevate these outlying administrations to be on equal footing as our own regime."
 tr_btr_decentralization_ad_hoc:0 "Ad Hoc Systems"
 tr_btr_decentralization_ad_hoc_desc:0 "Establishing a fixed set of bureaucratic procedures would only give the central government tools to assert its dominance over the people. We must not allow the civil servants to grow too comfortable."

 agenda_decentralization_finish:0 "$council_agenda_agenda_decentralization_name$ $agenda_ref$"
 agenda_decentralization_finish_desc:0 "$council_agenda_agenda_decentralization_desc$"
 council_agenda_agenda_decentralization_name:0 "Ceremony of Recognition"
 council_agenda_agenda_decentralization_desc:0 "Our government does not have the authority to appoint or assign governments to its planets. But, as each new colony develops its own government system, and as existing planets progress and develop, the larger government can formally recognize the will of the local people in a ceremony which leads to closer cooperation between insterstellar and local officials."

 tr_btr_planned:0 "Planned Economy"
 tr_btr_planned_desc:0 "In this new era of endless space and resources we can no longer rely on the selfish merchants to supply goods."
 tr_btr_planned_pricing:0 "Centralized Pricing"
 tr_btr_planned_pricing_desc:0 "The markets are rife with manipulation and fraud. The only way to ensure a good value for your credit is to dictate it."
 tr_btr_planned_public:0 "Public Storage"
 tr_btr_planned_public_desc:0 "Logistics is the beating heart of any economy and by controlling the warehouses we shall dominate the factories."
 tr_btr_planned_oversight:0 "Economic Oversight Bureau"
 tr_btr_planned_oversight_desc:0 "You no longer work for yourself, you work for your nation and none will be found lacking in patriotism for their homeland."
 tr_btr_planned_oversight_EFFECT:0 "Provides access to the Economic Coordination Center which provides jobs to produce unity and increase job output on the planet while decreasing amenities and using consumer goods"
 tr_btr_planned_predetermined:0 "Predetermined Demand"
 tr_btr_planned_predetermined_desc:0 "The public is fickle and luxurious, always after the most shiny toy. No more. We shall determine what the public desires and they will want for nothing. "
 tr_btr_planned_harmonious:0 "Harmonious Puzzle"
 tr_btr_planned_harmonious_desc:0 "Through our enlightened and truly revolutionary economic regime we have ensured that every aspect of the economy is operating in unison. The most complex puzzle has finally been solved."
 building_planned_economic_coordination:0 "Economic Coordination Center"
 building_planned_economic_coordination_desc:0 "The local Headquarters of the Economic Oversight Bureau its agents inspect businesses small and large to ensure compliance with regulations and that there is neither over or underproduction."
 economic_coordinator:0 "Economic Coordinator"
 economic_coordinator_desc:0 "Economic Coordinators are the eyes, ears, and hands of the Economic Oversight Bureau. They conduct impromptu and surprise audits of any business that they desire to ensure that they are not enabling the dreaded 'free market'."

 agenda_planned_finish:0 "$council_agenda_agenda_planned_name$ $agenda_ref$"
 agenda_planned_finish_desc:0 "$council_agenda_agenda_planned_desc$"
 council_agenda_agenda_planned_name:0 "Proclaim Prosperity"
 council_agenda_agenda_planned_desc:0 "As we hold the economy neatly in the palm of our hand we gain access to things that had once been left to chance or god. Everyone loves a prosperous economy and now we don't need to wait for the stars to align, or a genius inventor to appear, we need only wait for all the banners to finish printing!"

 tr_btr_centralized:0 "Centralization"
 tr_btr_centralized_desc:0 "From our developed homeworld we shall spread through the galaxy and guide our new colonies to the prosperity of their metropolis."
 tr_btr_centralized_EFFECT:0 "Provides the 'Center Of Government' planetary modifier on your capital increasing unity and stability."
 tr_btr_centralized_hub:0 "Home and Hub"
 tr_btr_centralized_hub_desc:0 "Our homeworld is and shall always be the center of our civilization. The colonies are merely extensions of our capitals grandeur."
 tr_btr_centralized_home:0 "Looking Toward Home"
 tr_btr_centralized_home_desc:0 "No matter where we are in the universe we will always remember our home."
 tr_btr_centralized_sent:0 "Sent to Rule"
 tr_btr_centralized_sent_desc:0 "We cannot entrust entire planets to just any charismatic shyster, we must carefully select and deploy the rulers of our colonial worlds to ensure prosperity."
 tr_btr_centralized_continuing:0 "Continuing as Before"
 tr_btr_centralized_continuing_desc:0 "We may be thousands of light years from home but that does not mean that we will not continue our traditions."
 tr_btr_centralized_direct:0 "Direct Rule"
 tr_btr_centralized_direct_desc:0 "The homeworld is not the first among equals because it has no equal. The colonies exist because of the homeworld and are therefore subordinate to it."
 tr_btr_centralized_direct_EFFECT:0 "Governors will now decrease building cost and upkeep on planets they oversee"

 agenda_centralized_finish:0 "$council_agenda_agenda_centralized_name$ $agenda_ref$"
 agenda_centralized_finish_desc:0 "$council_agenda_agenda_centralized_desc$"
 council_agenda_agenda_centralization_name:0 "Governance Mandates"
 council_agenda_agenda_centralization_desc:0 "As the local officials merely act out the will of the central government we, the central government, must distribute that will from time to time to ensure that all hands are rowing together. This ensures that what we care about is done quickly, efficiently, and within budget."

 tr_btr_agrarianism:0 "Agrarianism"
 tr_btr_agrarianism_desc:0 "We will not sacrafice the natural beauty of our worlds and the humble self reliance of our culture on the alter of consumerism."
 tr_btr_agrarianism_rural:0 "Rural Renown"
 tr_btr_agrarianism_rural_desc:0 "The pristine and natural farming zones are famous across the nation"
 tr_btr_agrarianism_rural_EFFECT:0 "Farming districts provide 1 unity and 3% happiness"
 tr_btr_agrarianism_local:0 "Local Farms"
 tr_btr_agrarianism_local_desc:0 "Ensuring that every urban area has a local source of food has many benefits"
 tr_btr_agrarianism_local_EFFECT:0 "City districts provide 100 farming jobs"
 tr_btr_agrarianism_honest:0 "Honest Zoning"
 tr_btr_agrarianism_honest_desc:0 "It is far to easy to allow the wealthy but destructive interests of industry dominate the landscape. We must ensure that the locals and their natural habitat are prioritized."
 tr_btr_agrarianism_honest_EFFECT:0 "Farming districts are 50% cheaper and build 50% faster, industrial and mining districts cost 50% more and build 50% slower"
 tr_btr_agrarianism_communities:0 "Focus on Communities"
 tr_btr_agrarianism_communities_desc:0 "We must focus on designing our towns and cities around a concept of community so that all will feel connected to the place they live in."
 tr_btr_agrarianism_clean:0 "Clean Environments"
 tr_btr_agrarianism_clean_desc:0 "We look upon the polluted hellscapes and do not see the consumerist utopia that was promised to us. Instead we see sickness and disease that many will happily flee if given a more inviting environment."
 tr_btr_agrarianism_clean_EFFECT:0 "Planets with more farming districts than industrial and mining districts (Combined) gain 10% pop growth, 5 Stability, and 5% happiness"

 agenda_agrarianism_finish:0 "$council_agenda_agenda_agrarianism_name$ $agenda_ref$"
 agenda_agrarianism_finish_desc:0 "$council_agenda_agenda_agrarianism_desc$"
 council_agenda_agenda_agrarian_name:0 "Rural Land Grants"
 council_agenda_agenda_agrarian_desc:0 "Some societies have decided to hide themselves away from nature in garish metal scars across the landscape and skyline. We would much rather invest in our natural land and the freedom that living as part of it provides each of our citizens."

 tr_btr_communalism:0 "Communalism"
 tr_btr_communalism_desc:0 "Some chose to prioritize the joy and desires of the mere individual at the expense of all else. We understand this false promise and instead act to benefit as many as possible."
 tr_btr_communalism_community:0 "Community Over Self"
 tr_btr_communalism_community_desc:0 "Our society understands the selfish desires of the individual are nothing compared to health of the overall community."
 tr_btr_communalism_endurance:0 "Endurance for Others"
 tr_btr_communalism_endurance_desc:0 "We suffer so that others may not. Each one of us that falls is ten who shall survive."
 tr_btr_communalism_service:0 "Service to Society"
 tr_btr_communalism_service_desc:0 "Ask not what your country can do for you, but what you can do for your country."
 tr_btr_communalism_greater:0 "The Greater Good"
 tr_btr_communalism_greater_desc:0 "Live should be spent in service to actions that benefit the greatest number of individuals regardless of how those actions effect those taking them."
 tr_btr_communalism_obligations:0 "Social Obligations"
 tr_btr_communalism_obligations_desc:0 "From the moment of your birth you benefit from social investment and that investment must be repaid."

 agenda_communalism_finish:0 "$council_agenda_agenda_communalism_name$ $agenda_ref$"
 agenda_communalism_finish_desc:0 "$council_agenda_agenda_communalism_desc$"
 council_agenda_agenda_communal_name:0 "The Nation Calls"
 council_agenda_agenda_communal_desc:0 "Your nation needs you to do your part for prosperity! Your task may seem small, it may appear dull, it may be messy or uncomfortable, but it is bringing the entire nation one small step closer to the glorious future we all wish to share!"

 tr_btr_mercenaries:0 "Mercenaries"
 tr_btr_mercenaries_desc:0 "Our people have long been tools of war, it is high time we too reap some of the benefits "
 tr_btr_mercenaries_soldiers:0 "Soldiers of Fortune"
 tr_btr_mercenaries_soldiers_desc:0 "With great battles comes great wealth"
 tr_btr_mercenaries_plausible:0 "Plausible Deniability"
 tr_btr_mercenaries_plausible_desc:0 "With so many Krogan not under our control, it is easy to attribute the actions of those who are to those who have gone rogue"
 tr_btr_mercenaries_unrestricted:0 "Unrestricted Warfare"
 tr_btr_mercenaries_unrestricted_desc:0 "Without any formal authority, our soldiers are in a perfect position to use whatever means necessary to get the job done"
 tr_btr_mercenaries_political:0 "Political Violence"
 tr_btr_mercenaries_political_desc:0 "Our troops can do more than just win gang wars, now they will have galactic influence"
 tr_btr_mercenaries_private:0 "Private Police"
 tr_btr_mercenaries_private_desc:0 "So long as there are rich people, there will be rich people needing defending"

 agenda_mercenary_finish:0 "$council_agenda_agenda_mercenary_name$ $agenda_ref$"
 agenda_mercenary_finish_desc:0 "$council_agenda_agenda_desc$"
 council_agenda_agenda_mercenary_name:0 "Shared Deployments"
 council_agenda_agenda_mercenary_desc:0 "We will never admit it, but we can encourage our soldiers to participate in the mercenary activities of our officially recognized outfits. This will grant us a hefty sum of credits, give us experience in peacetime and these mercenary firms may thank us by assisting in funding military procurement programs."