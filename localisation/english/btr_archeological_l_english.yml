l_english:

  ### Site ###
  btr_precursor_mars_triangle:0 "The Triangle of Mars"
  btr_precursor_mars_triangle_site_desc:0 "A mysterious region of Mars that has long been plagued by unexplained technical failures. Now, with colonization underway, rumors of the 'Martian Triangle' have intensified. It may be more than superstition."

  ### Stage 0 ###
  btr_precursor_all.1.name:0 "The Triangle of Mars"
  btr_precursor_all.1.desc:0 "While our colonization of Mars is still in its early phases there are already superstitions developing not only among the colonists, but among those that remain on Earth as well. One superstition that is unnervingly realistic has been dubbed “The Martian Triangle”. We have a significant amount of data showing that a specific area of Mars has had a disproportionate amount of satellite technical difficulties. We aren’t sure why, but it seems like there is something going on in that area which is effecting our equipment."
  btr_precursor_all.1.a:0 "We should look into this."
  ### Stage 1 ###
  btr_precursor_all.2:0 "The Deseado Catacombs"
  btr_precursor_all.2.desc:0 "It appears that our conclusion regarding odd activity in the “Martian Triangle” was correct, although no one seems to remember the term ever existed. We had been going to great lengths to keep our study of the region hidden in plain sight but ultimately it was a private excavation firm that found the true reason for the area’s strange equipment issues. It is too early to tell exactly what we’ve stumbled into, but it is clearly an artificially created structure that was buried. This has caused a lot of commotion in the public, but we truly know very little about this location."
  btr_precursor_all.2.a:0 "Then we must learn more."
  ### Stage 2 ###
  btr_precursor_all.3:0 "A Clearing"
  btr_precursor_all.3.desc:0 "We have managed to clear more of the facility on Mars and have discovered that is somehow still has power. It is incredibly old and has sustained a lot of damage but the areas that haven’t collapsed seem to be essentially left as they were when the facility was abandoned. We do believe it was abandoned because we have not found any signs of remains through the areas we have cleared. While we have uncovered some working terminals, we have no idea how they work or the language they are using."
  btr_precursor_all.3.a:0 "We must learn this ancient tongue to understand the future."
  ### Stage 3 ###
  btr_precursor_all.4:0 "A Conversation with Ghosts"
  btr_precursor_all.4.desc:0 "The clearing of the facility has been progressing slowly but after an unprecedented effort of humanities scientific community we have decrypted the language of the terminals in the facility. Some of the terminals are locked behind passcodes and some require repairs but a large amount of them are accessible to us. At the moment we don’t much information on the inhabitants, but we do know the facilities purpose. To watch and study us in our earliest stages of evolution and much of the information we have uncovered has actually shed more light on our own past than the facilities."
  btr_precursor_all.4.a:0 "An ironic twist for sure."
  ### Stage 4 ###
  btr_precursor_all.5:0 "A Name"
  btr_precursor_all.5.desc:0 "We are beginning to learn more about the former inhabitants of this facility as we finish clearing away the debris and repair their terminals. The scientists have dubbed them “Protheans”, and their civilization spanned a large portion of the galaxy. They were incredibly advanced and constructed a station that allowed their ships to travel to distant stars in orbit of Pluto. We aren’t sure why they were here as they seem repeatedly unimpressed with our ancestors. The terminals also fail to mention why the facility was abandoned or what happened to the Protheans themselves."
  btr_precursor_all.5.a:0 "There may be mysteries in the last areas of the facility."
  ### Stage 5 ###
  btr_precursor_all.6:0 "The Great Reward"
  btr_precursor_all.6.desc:0 "We have finished clearing the rest of the facility and it has revealed finds that can hardly be believed. There is a small hangar with function ships, likely small personnel shuttles, that we have already sent back to earth for study. From what we understand of their technology their ships were not capable of FTL travel but relied on the massive constructs to send them across space. The facilities power source has also been uncovered; it is some form of arcane reactor that we don’t understand. It functions off of a principle the scientists refer to as the “Mass Effect” and it generates large amounts of energy for negligible amounts of space. This particular one is clearly in disrepair and struggling to continue functioning, but it can still advance our technology by centuries!"
  btr_precursor_all.6.a:0 "We will put our sun behind us sooner than we thought!"
  ### Reward Event ###
 # mars_triangle_reward_title:0 "The Great Reward"
 # mars_triangle_reward_desc:0 "The secrets of the Prothean facility have been uncovered. Among them: advanced ship designs, vast knowledge of reactor technology, and functional shuttles ready for study."
 # mars_triangle_reward_option:0 "This will advance our civilization by centuries!"

  ### Site ###
  btr_precursor_original_pillar_name:0 "The Original Pillar"
  btr_precursor_original_pillar_desc:0 "Few remember the ancient folklore of our stone age ancestors of strange beings arriving and leaving a large pillar behind. Painstaking effort has ensured it so that those of us who remember can reap twice the benefit."

  ### Stage 0 ###
  btr_precursor_asari.1:0 "The Original Pillar"
  btr_precursor_asari.1.desc:0 "For as long as the Asari have existed on Thessia there has been a giant ancient artifact looming over them. The primitive Asari that lived in the area told tales of strange being leaving the artifact behind after staying in the region and teaching them various ways to improve their lives. These tales propagated across the planet taking on a life of their own as civilization began to develop on the world."
  btr_precursor_asari.1.a:0 "Whoever speaks with the artifact owns Thessia."
  ### Stage 1 ###
  btr_precursor_asari.2:0 "The Interface of a God"
  btr_precursor_asari.2.desc:0 "The primitive states that began to form as the Asari moved into its ancient era knew of the Pillar and often strove to control it. It rapidly took on a religious function as the ancient stories morphed into doctrines which coalesced around “The Goddess”. The Pillar was understood as a gift from the Goddess, a gift that required enough faith and understanding to fully appreciate."
  btr_precursor_asari.2.a:0 "Empires rose and fell trying to operate our gift."
  ### Stage 2 ###
  btr_precursor_asari.3:0 "The Secret takes hold"
  btr_precursor_asari.3.desc:0 "As time went on the religion solidified as the largest faith on Thessia and the time each nation possessed the gift got longer. Eventually it was realized that there would only ever be conflict over controlling the gift. The now highly powerful religious leadership decided it was best to hide the gift away and begin teaching the masses that it was not a physical gift as many believed. They embarked on a project of erecting a massive statue of the Goddess with the ancient pillar as its core."
  btr_precursor_asari.3.a:0 "We cannot use the Goddesses gift if we are all dead."
  ### Stage 3 ###
  btr_precursor_asari.4:0 "Research and Divination"
  btr_precursor_asari.4.desc:0 "After hundreds of years the Asari forgot about their god’s gift, believing it to have been a myth or a misinterpreted ancient text. Yet the highest echelons of their religious leaders knew different and were using small groups of trusted subordinates to do quietly do research on the pillar. While the nations that controlled the gift had done rudimentary research into it they had only controlled it for decades or a century at most. These religious leaders have held it in secret for nearly a generation and have been able to secretly publish several technological breakthroughs thanks to the pillar."
  btr_precursor_asari.4.a:0 "The future is sooner than we may have thought."
  ### Stage 4 ###
  btr_precursor_asari.5:0 "Reaching the Heavens"
  btr_precursor_asari.5.desc:0 "After generations of study the Asari were able to venture out into space on their own for the first time. The research into the Gift has shown that it is some form of computer but how to activate it and what it contains is still largely a mystery. However, its very design and the materials it is made out of have given rise to numerous inventions and its power supply has been extremely inspiring. As the Asari explore other areas of space, they have encountered technologies left by some other civilization that seem strangely compatible with designs derived from the Gift."
  btr_precursor_asari.5.a:0 "Could we be on the path to the Goddess?"
  ### Stage 5 ###
  btr_precursor_asari.6:0 "Reaching the Heavens"
  btr_precursor_asari.6.desc:0 "As exploration of the stars has continued the public has become aware that an ancient, advanced civilization left many artifacts scattered across the galaxy. None of them suspect that we possess one such artifact and have been using it for millennia to make some of our greatest innovations. Unfortunately, it is becoming increasingly clear that the ancient civilization that left this relic here has long since died out. We will most likely never know why they left it on our home world or what relationship they had with our primitive ancestors but they’re advanced technology will live on through us."
  btr_precursor_asari.6.a:0 "We represent a legacy beyond our wildest imaginations."
  ### Reward Event ###
 # mars_triangle_reward_title:0 "The Great Reward"
 # mars_triangle_reward_desc:0 "The secrets of the Prothean facility have been uncovered. Among them: advanced ship designs, vast knowledge of reactor technology, and functional shuttles ready for study."
 # mars_triangle_reward_option:0 "This will advance our civilization by centuries!"

  ### Stage 0 ###
  btr_precursor_hegemony.1.name:0 "An Ancient Return"
  btr_precursor_hegemony.1.desc:0 "There is a cluster of planets in the Harsa system named after one of our most famous ancient rulers and his wives. Many of our people have travelled to these planets to honor these ancients that had such impact on our modern state. Typically, these pilgrims stay in orbit either on their ships or a series of small stations that function as museums. Recently we have received word that a group of these tourists have ignored this tradition and landed on the planet of Bira as the main planet Verush is a gas giant. They travelled across the planet and came upon a rift in the ground which was large enough to block their path. When they looked into the rift they saw, rooms, strange glowing dim lights, and strange patterns they couldn’t recognize. This was brought to our attention in exchange for a lenient punishment for violating restricted space."
  btr_precursor_hegemony.1.a:0 "The Hegemony will gladly make exceptions for those who discover great antiques."
  ### Stage 1 ###
  btr_precursor_hegemony.2:0 "Arrival"
  btr_precursor_hegemony.2.desc:0 "Our excavation team has reached Bira and has conducted a tentative entry into the strange rift. It is a small room that has been shifted and crumbled by the tectonic forces on the planet with most of the entries and several of the walls being almost completely destroyed. They were able to rappel through what would have been the ceiling had it still existed. Reportedly the room was barren with no furniture or items inside it but the walls were inlaid with some form of light source that emitted a subtle green glow, how this is powered remains a mystery. The team has begun digging to expand the rift before tunneling out of the doorways in an effort to find the rest of this building."
  btr_precursor_hegemony.2.a:0 "Perhaps the forces that destroyed this room preserved some ancient artifacts."
  ### Stage 2 ###
  btr_precursor_hegemony.3:0 "Expansion"
  btr_precursor_hegemony.3.desc:0 "We have been able to uncover the entirety of where the roof should have been on the room we discovered and also cleared away soil that filled two adjacent rooms. They are about the same size and continue to be completely empty of any items but one of them did have a stairwell which our team feels is a promising sign. Preliminary scouting of the surrounding area has also failed to find anything of note. The team is hypothesizing that the structure was abandoned intentionally before being subdued by the planetary forces. There are fears that all of our efforts will go unrewarded because of this."
  btr_precursor_hegemony.3.a:0 "This will be a worthwhile endeavor no matter what the outcome."
  ### Stage 3 ###
  btr_precursor_hegemony.4:0 "Findings"
  btr_precursor_hegmony.4.desc:0 "The team is happy to report that they have completed the excavation of the upper level of the structure and also the room at the base of the stairwell we previously uncovered. The upper floor did in fact hold several smaller items which we have sent to the home world for study. The lower level isn’t completely finished being uncovered but the room we have cleared had several terminals that still had power. While we cannot read the language that the terminals use, we have begun cataloguing them in hopes of translating it later on. This has rejuvenated the team who are rapidly clearing the other rooms on this lower floor."
  btr_precursor_hegemony.4.a:0 "What other treasures will we uncover here?"
  ### Stage 4 ###
  btr_precursor_hegemony.5:0 "Another level"
  btr_precursor_hegemony.5.desc:0 "Upon completion of clearing the second level we discovered another pathway into an even lower level. We believe that this level was always underground and functioned as a smaller basement area although we have not even begun digging through the stairwell to understand what it was used for. The second level has revealed nearly a dozen terminals in total which will hopefully give us incredible amount of information once our linguists decode the language and allow us to read these files. There were also smaller items that appeared to be auxiliary items for the terminals or possibly items that helped the people who used these terminals in their jobs outside of the terminals."
  btr_precursor_hegemony.5.a:0 "With the knowledge locked in those terminals we may be able to traverse the galaxy."
  ### Stage 5 ###
  btr_precursor_hegemony.6:0 "Our Reward"
  btr_precursor_hegemony.6.desc:0 "The excavation of the bottom most level has uncovered a wealth of items. It appears that this floor was left alone while the rest of the building was being evacuated and as such it has been entombed here for potentially millennia. Lockers, chests, cupboards, terminals, and more were all left to sit unused forever. Unfortunately, many of the items were damaged or destroyed when the building was toppled and subsumed by the planet but even, they may yield important information. One oddity that we cannot explain is some form of upright computer that has been thrown from its mount and lays in a corner of the disorienting funhouse that the building has become. Whatever information required such a large and advanced supercomputer must have been incredibly important considering their terminals appear to be extremely advanced already. Considering it has already been moved we are planning on taking it and bringing it back to the home-world with the other items after the excavation is completed."
  btr_precursor_hegemony.6.a:0 "This day will be remembered for generations to come."
  ### Reward Event ###
  # mars_triangle_reward_title:0 "The Great Reward"
  # mars_triangle_reward_desc:0 "The secrets of the Prothean facility have been uncovered. Among them: advanced ship designs, vast knowledge of reactor technology, and functional shuttles ready for study."
  # mars_triangle_reward_option:0 "This will advance our civilization by centuries!"


  ### Site ###
  btr_precursor_new_report:0 "A New Report"
  btr_precursor_new_report_site_desc:0 "Our scientists have been studying the planets within our space for many years. We never anticipated that one of their studies would uncover an unexplained anomaly, but now that it has we are compelled to investigate further."

  ### Stage 0 ###
  btr_precursor_elcor.1.name:0 "A New Report"
  btr_precursor_elcor.1.desc:0 "The planet of Lenuamund has been part of Elcor space ever since the Elcor achieved space flight. But due to its hot and uninhabitable nature it has been ignored with only a small collection of probes left in orbit to monitor it. No one had anticipated these probes to ever report anything of note outside of some academic study. Today we were proven incorrect in our assumptions; two of the probes reported the same anomalous reading from the surface of the planet. According to our study of the readings the probes indicate that something is emitting an intermittent signal from the planet surface but there is too much interference to determine what it is. Our scientists are able to confirm that the signal must be extremely powerful to pierce the interference and there is a high likelihood of it being artificial due how the signal has been behaving."
  btr_precursor_elcor.1.a:0 "We must look into such a strange situation."
  ### Stage 1 ###
  btr_precursor_elcor.2:0 "A Robotic Answer"
  btr_precursor_elcor.2.desc:0 "In order to reach the anomaly on the surface of Lenuamund we must use specially modified robotic workers because no organic being could survive near its surface. We have worked with many robotics manufacturers to begin construction of more durable and heat resistant models that have a chance of lasting on the surface. We are estimating that these models will be ready for deployment within the year."
  btr_precursor_elcor.2.a:0 "Soon this galactic mystery will be solved."
  ### Stage 2 ###
  btr_precursor_elcor.3:0 "The First Expedition"
  btr_precursor_elcor.3.desc:0 "The first deployment of our specialized robots has been completed. They were able to reach the surface of the planet at their drop site near the anomaly. Unfortunately, they were unable to endure the temperatures for long and one by one were silenced. The data that was able to be received did not contain anything about the beacon except for what appears to be a subtle hum that could be heard as they got closer to its location. We are designing a second model to attempt a second expedition."
  btr_precursor_elcor.3.a:0 "May their sacrifice not be in vain."
  ### Stage 3 ###
  btr_precursor_elcor.4:0 "The Second Expedition"
  btr_precursor_elcor.4.desc:0 "We have concluded our second expedition to the anomaly on Lenuamund and it has been much more successful than our original attempt. The second generation of robot explorers passed their fallen predecessors and discovered the source of the signal. It is a large machine that appears to be some form of computer. We do not know who placed it on the planet or when and we cannot answer the questions without retrieving it. Unfortunately, we did not plan on retrieving anything from the surface so we will need a third expedition to take the strange item off the surface."
  btr_precursor_elcor.4.a:0 "The galactic community should study this device."
  ### Stage 4 ###
  btr_precursor_elcor.5:0 "The Final Expedition"
  btr_precursor_elcor.5.desc:0 "Our third expedition to recover the device on Lenuamund has succeeded. With a specially designed shuttle and a new compliment of the second-generation robots we were able to recover the device along with the damaged group from the second expedition and the remains of the first expedition. We have brought the device to a research institute where all citadel species can study the device and help unlock its secrets. The robots have been repaired and returned to service with the first expedition being laid to rest in a museum."
  btr_precursor_elcor.5.a:0 "What will we uncover from this computer?"
  ### Stage 5 ###
  btr_precursor_elcor.6:0 "Completion"
  btr_precursor_elcor.6.desc:0 "The research into the device has not gone as we had hoped. The science teams were able to confirm that Lenuamund was not always as it is now and that at some point it was a world similar to Earth or Thessia but It lost its atmosphere. Outside of that we have not been able to learn much about the device and none of our attempts to wake it from its standby mode have been successful. We believe that it is sending out a signal searching for a satellite which would then activate the device, but all of its satellites were lost when the atmosphere dissipated. Why it has only recently begun sending out the signal in an attempt to wake itself up is unknown and unfortunately it most likely never will be discovered."
  btr_precursor_elcor.6.a:0 "A sad conclusion to a strange mystery."
### Reward Event ###
# mars_triangle_reward_title:0 "The Great Reward"
# mars_triangle_reward_desc:0 "The secrets of the Prothean facility have been uncovered. Among them: advanced ship designs, vast knowledge of reactor technology, and functional shuttles ready for study."
# mars_triangle_reward_option:0 "This will advance our civilization by centuries!"

  ### Site ###
  btr_precursor_everywhere:0 "Enkindler's Everywhere"
  btr_precursor_everywhere_site_desc:0 "The time has finally come to explore and understand the various Enkindler sites across our planet. We were always meant to use this technology and perhaps, by teaching ourselves we will better understand what happened to the Enkindlers that interrupted their plans."

  ### Stage 0 ###
  btr_precursor_hanar.1.name:0 "Enkindler's Everywhere"
  btr_precursor_hanar.1.desc:0 "It is clear to all who visit our home system that our gods cared greatly for us. They left behind dozens of structures, settlements, and artifacts from when they embarked on the selfless task of uplifting our primitive ancestors. Yet despite these sites existing for our entire history many of them are not well understood or explored. While some fear that attempting to catalogue such sites may cause unrest among our people, others are adamant that this is what the Enkindlers would have wanted. They claim that we were always meant to use the Enkindler technology and work with them in their mission to civilize the galaxy, but some misfortune befell them before this could happen."
  btr_precursor_hanar.1.a:0 "These were left to us for a reason."
  ### Stage 1 ###
  btr_precursor_hanar.2:0 "Hohnle’s Moons"
  btr_precursor_hanar.2.desc:0 "Hohnle is one of the planets in our home system and its moons are home to many Enkindler ruins. Our exploration of these ruins has been truly enlightening, while each moon has little more than the husks of former outposts and research stations with many of the terminals either removed or destroyed. But the handful of working terminals reveal what we already knew, this system was of great interest to the Enkindlers and there is some evidence that our ancient ancestors had spent time at these stations."
  btr_precursor_hanar.2.a:0 "How did the Enkindlers decide who was worthy of visiting such holy sites?"
  ### Stage 2 ###
  btr_precursor_hanar.3:0 "Nalynder"
  btr_precursor_hanar.3.desc:0 "Our moon has less overall ruins but what it does have is far larger than anything on the outer planets. While we have not done much to map or explore these ruins knowledge of them dates back to a time before we were able to leave our atmosphere. The exploration of these ruins has caused much more disturbance at home than the more remote sites but have given us far greater rewards. There is clear evidence at many of these facilities that large amounts of ancient Hanar lived in specialized quarters within the campuses. What they did, or how they were chosen remains unknown, but this is revolutionary information."
  btr_precursor_hanar.3.a:0 "We truly are the Enkindlers chosen."
  ### Stage 3 ###
  btr_precursor_hanar.4:0 "Return to Nalynder"
  btr_precursor_hanar.4.desc:0 "With such important discoveries being made on our last expedition it has been decided to return to Nalynder for another look at the ruins there. This time with a much greater attention to the smaller details as the previous discoveries have largely pacified the population at home. The discoveries this time have not been as unprecedented as before, but the teams did note several oddities in their investigations. The Hanar barracks within many of these facilities have a large amount of dining material, similar in abundance to what we would expect from the Enkindler areas. This is strange as our people do not eat in the same way as the land-based species. This has led some to theorize that at one point our species may have resembled the bipeds of our current age."
  btr_precursor_hanar.4.a:0 "The galactic community should study this device."
  ### Stage 4 ###
  btr_precursor_hanar.5:0 "Kahje, The Homeworld"
  btr_precursor_hanar.5.desc:0 "With such grand achievements being made on our moon and outer planets we can finally make small scale expeditions to some of the minor ruins on our homeworld. The majority of these smaller locations seem to be logistical bases used to bring materials from the Enkindlers expansive empire down onto our world and apparently bring ancient Hanar back to the stars. We have also begun uncovering hundreds of thousands of barrels which are always empty and have a window in one side which we can’t explain yet."
  btr_precursor_hanar.5.a:0 "The Enkindlers work in mysterious ways."
  ### Stage 5 ###
  btr_precursor_hanar.6:0 "The Enkindlers Legacy"
  btr_precursor_hanar.6.desc:0 "After having proven we are capable of exploring Enkindler sites in a respectful manner we have decided to explore the largest Enkindler site on Kahje, the complex around Mount Vassla the holiest location in our civilization. It was a difficult process and we had to be extremely careful but after weeks of work we uncovered something unimaginable. A functioning Enkindler device, it seems to be a computer of some description but our studies of the device are superficial at present. Despite our lack of knowledge about the device it is clear that the Enkindlers left this here for us, we only need to discover what we are meant to use it for."
  btr_precursor_hanar.6.a:0 "The most benevolent have blessed us even after all this time."
### Reward Event ###
# mars_triangle_reward_title:0 "The Great Reward"
# mars_triangle_reward_desc:0 "The secrets of the Prothean facility have been uncovered. Among them: advanced ship designs, vast knowledge of reactor technology, and functional shuttles ready for study."
# mars_triangle_reward_option:0 "This will advance our civilization by centuries!"

  ### Site ###
  btr_precursor_ice_canals:0 "Canals....of ice?"
  btr_precursor_ice_canals_site_desc:0 "The planet of Judor IV has been known amongst trivia circles for its strange glacial formations but has historically been ignored by genuine scientists. That ends today as a team of researchers attempting to study the formations discovered that they are almost certainly artificial."

  ### Stage 0 ###
  btr_precursor_salarian.1.name:0 "Canals…… of Ice?"
  btr_precursor_salarian.1.desc:0 "While there has been a general knowledge about the rare features on the planet of Judor IV for some time now, only upon a closer examination of these features did we learn to be more curious. The famous glacial rivers are actually artificial canals which appear to have been abandoned around the same time as the Protheans disappeared. Our working theory is that the Protheans constructed the canals for reasons we cannot currently understand. Something that has attracted so many of our scientists is how pristine the canals appear to be. While the ice has overflown the walls of the canals, underneath the ice the canals seem to perfect preserved despite not having been maintained in millennia."
  btr_precursor_salarian.1.a:0 "We could have many uses for maintenance free infrastructure."
  ### Stage 1 ###
  btr_precursor_salarian.2:0 "A Frozen Past"
  btr_precursor_salarian.2.desc:0 "Excavating a site buried under tens of meters of solid ice is not easy, especially when we must remain careful not to damage the canals underneath. Yet we were successful, with a combination or hard work and specially designed equipment we have cleared away enough of the ice to stand on top of the canal walls. While this hasn’t told us much about the materials that were used, or the techniques, or the technology, it is an important milestone."
  btr_precursor_salarian.2.a:0 "We must empty those canals!"
  ### Stage 2 ###
  btr_precursor_salarian.3:0 "A new causeway"
  btr_precursor_salarian.3.desc:0 "We have been able to reach the bottom of a section of one of the canals. Our science teams are hard at work determining what materials the canal is made out of and looking for clues about how it was constructed. At this time we don’t have conclusive results but we have begun tunneling through the ice in attempts to learn more about these ancient structures."
  btr_precursor_salarian.3.a:0 "“Find everything there is to know."
  ### Stage 3 ###
  btr_precursor_salarian.4:0 "An everlasting Metal"
  btr_precursor_salarian.4.desc:0 "There has been an incredible breakthrough in our study of the metallic walls and floor of this canal. It is a unique alloy that is primarily made of metals that we already know of and understand, how they are combined into this alloy that has properties none of them alone possess is beyond our understanding. Despite our current ignorance of how these metals were combined, knowing the ingredients gives us the ability to experiment. We have also shifted our tunnelling operations in an effort to find any surplus resources or possibly onsite forges."
  btr_precursor_salarian.4.a:0 "The more we can learn from this site the better."
  ### Stage 4 ###
  btr_precursor_salarian.5:0 "A Breakthrough"
  btr_precursor_salarian.5.desc:0 "Our excavation teams have discovered a room hidden behind a panel built into the wall of the canal. It appears that this room was used as housing for the workers while this was being constructed and then as storage and logistics once the construction moved further away. We have not fully explored this large chamber but we have recovered a number of artifacts including some samples of the greenish-blue metal that makes up the canal. We are going to be focusing on exploring this chamber for the foreseeable future."
  btr_precursor_salarian.5.a:0 "This could jump our technology 200 years into the future."
  ### Stage 5 ###
  btr_precursor_salarian.6:0 "200 years already"
  btr_precursor_salarian.6.desc:0 "In the back of the chamber we found it. A massive machine, our current hypothesis is a supercomputer of a design far beyond anything we have even theorized. It appears that this back area of the chamber had been converted into a form of command center for the build site after the barracks was moved closer to where the work was being done. Next to nothing of use is left, the terminals are all broken and many of the other devices are so arcane we cannot begin to understand if they are operational or not. But the computer, it is working, it glows with a faint green light and quietly hums, we aren’t sure why it was left behind when they sealed this area off but perhaps our future study can shed light on that topic as well."
  btr_precursor_salarian.6.a:0 "A discovery beyond our most optimistic estimates."
