  r_btr_prothean_beacon_elcor:0 "Prothean Beacon"
  r_btr_prothean_beacon_elcor_desc:0 "The Prothean Beacon discovered by the Elcor it played a key roll in their early space flight development but due to their cautious nature it did not radically expand their abilities and is still consulted only when needed."
  precursor_beacon_elcor:0 "Beacon of Deliberation"

  ### Site ###
  btr_precursor_everywhere:0 "Enkindler's Everywhere"
  btr_precursor_everywhere_site_desc:0 "The time has finally come to explore and understand the various Enkindler sites across our planet. We were always meant to use this technology and perhaps, by teaching ourselves we will better understand what happened to the Enkindlers that interrupted their plans."

  ### Stage 0 ###
  btr_precursor_hanar.1.name:0 "Enkindler's Everywhere"
  btr_precursor_hanar.1.desc:0 "It is clear to all who visit our home system that our gods cared greatly for us. They left behind dozens of structures, settlements, and artifacts from when they embarked on the selfless task of uplifting our primitive ancestors. Yet despite these sites existing for our entire history many of them are not well understood or explored. While some fear that attempting to catalogue such sites may cause unrest among our people, others are adamant that this is what the Enkindlers would have wanted. They claim that we were always meant to use the Enkindler technology and work with them in their mission to civilize the galaxy, but some misfortune befell them before this could happen."
  btr_precursor_hanar.1.a:0 "These were left to us for a reason."
  ### Stage 1 ###
  btr_precursor_hanar.2:0 "Hohnle’s Moons"
  btr_precursor_hanar.2.desc:0 "Hohnle is one of the planets in our home system and its moons are home to many Enkindler ruins. Our exploration of these ruins has been truly enlightening, while each moon has little more than the husks of former outposts and research stations with many of the terminals either removed or destroyed. But the handful of working terminals reveal what we already knew, this system was of great interest to the Enkindlers and there is some evidence that our ancient ancestors had spent time at these stations."
  btr_precursor_hanar.2.a:0 "How did the Enkindlers decide who was worthy of visiting such holy sites?"
  ### Stage 2 ###
  btr_precursor_hanar.3:0 "Nalynder"
  btr_precursor_hanar.3.desc:0 "Our moon has less overall ruins but what it does have is far larger than anything on the outer planets. While we have not done much to map or explore these ruins knowledge of them dates back to a time before we were able to leave our atmosphere. The exploration of these ruins has caused much more disturbance at home than the more remote sites but have given us far greater rewards. There is clear evidence at many of these facilities that large amounts of ancient Hanar lived in specialized quarters within the campuses. What they did, or how they were chosen remains unknown, but this is revolutionary information."
  btr_precursor_hanar.3.a:0 "We truly are the Enkindlers chosen."
  ### Stage 3 ###
  btr_precursor_hanar.4:0 "Return to Nalynder"
  btr_precursor_hanar.4.desc:0 "With such important discoveries being made on our last expedition it has been decided to return to Nalynder for another look at the ruins there. This time with a much greater attention to the smaller details as the previous discoveries have largely pacified the population at home. The discoveries this time have not been as unprecedented as before, but the teams did note several oddities in their investigations. The Hanar barracks within many of these facilities have a large amount of dining material, similar in abundance to what we would expect from the Enkindler areas. This is strange as our people do not eat in the same way as the land-based species. This has led some to theorize that at one point our species may have resembled the bipeds of our current age."
  btr_precursor_hanar.4.a:0 "The galactic community should study this device."
  ### Stage 4 ###
  btr_precursor_hanar.5:0 "Kahje, The Homeworld"
  btr_precursor_hanar.5.desc:0 "With such grand achievements being made on our moon and outer planets we can finally make small scale expeditions to some of the minor ruins on our homeworld. The majority of these smaller locations seem to be logistical bases used to bring materials from the Enkindlers expansive empire down onto our world and apparently bring ancient Hanar back to the stars. We have also begun uncovering hundreds of thousands of barrels which are always empty and have a window in one side which we can’t explain yet."
  btr_precursor_hanar.5.a:0 "The Enkindlers work in mysterious ways."
  ### Stage 5 ###
  btr_precursor_hanar.6:0 "The Enkindlers Legacy"
  btr_precursor_hanar.6.desc:0 "After having proven we are capable of exploring Enkindler sites in a respectful manner we have decided to explore the largest Enkindler site on Kahje, the complex around Mount Vassla the holiest location in our civilization. It was a difficult process and we had to be extremely careful but after weeks of work we uncovered something unimaginable. A functioning Enkindler device, it seems to be a computer of some description but our studies of the device are superficial at present. Despite our lack of knowledge about the device it is clear that the Enkindlers left this here for us, we only need to discover what we are meant to use it for."
  btr_precursor_hanar.6.a:0 "The most benevolent have blessed us even after all this time."
