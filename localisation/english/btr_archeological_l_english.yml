  r_btr_precursor_shadow:0 "Precursor Shadow"
  r_btr_precursor_shadow_desc:0 "Millions of years ago this panel sat in someones home or workplace on Magda before in the blink of an eye they were vaporized leaving this impression of their shadow as the last eternal remains of their existence. It is both an important reminder of the fragility of life and an inspiration for us to strive harder in all that we do."
  precursor_shadow:0 "Precursor Shadow display"


  r_btr_ancient_generator:0 "Ancient Generator"
  r_btr_ancient_generator_desc:0 "A generator from a long lost civilization that somehow continues producing an impressive amount of energy for its size."
  ancient_generator:0 "Ancient Generator Surplus"

  ### Site ###
  btr_archeology_lost_regiment:0 "The Lost Regiment"
  btr_archeology_lost_regiment_site_desc:0 "Long ago during our Unification Wars the 317th Infantry Regiment was forced to defend a hill to cover the withdrawal of our forces as the rebels counter attacked. None of them were ever seen again. Even after the wars none of the rebel combatants were able to tell us what had happened to the unit and every attempt to locate their remains has failed. Yet, recently a local has come forward with the unit's insignia, likely from a helmet, which has sparked new interest in locating the unit."

  ### Stage 0 ###
  btr_archeology_lost_regiment.name:0 "The Interview"
  btr_archeology_lost_regiment.desc:0 "We have made contact with the local who discovered the insignia. They are a local worker who hikes in the nearby forests, apparently they found it glinting in the sun several miles east where a cluster of forested hills meet some months ago but only recently realized what it was. Because of the delay they can't remember the exact trail they were on but it gives us a rough area to search in."
  btr_archeology_lost_regiment.a:0 "If we are successful they deserve a reward."
  ### Stage 1 ###
  btr_archeology_lost_regiment.1.name:0 "The Search"
  btr_archeology_lost_regiment.1.desc:0 "Our expedition has begun searching the area, forming a long skirmish line to scour the forests from one end to the other. Combined with drones and metal detecting scanners we are expecting a brief search despite the large area and the rough terrain. If our understanding of the battle is accurate then the regiment is likely still in their defensive positions which will likely still have scars from the fighting even after all this time. We are hopeful that we will have more to report soon."
  btr_archeology_lost_regiment.1.a:0 "Understood."
  ### Stage 2 ###
  btr_archeology_lost_regiment.2.name:0 "The Trail"
  btr_archeology_lost_regiment.2.desc:0 "It has not been easy to navigate large sections of these forests but we have completed our search. Unfortunately the obvious signs of battle we had been expecting never materialized, perhaps the forest healed faster than anticipated, perhaps we are in the wrong area, it is hard to tell because we found more evidence of the unit. Several small items, pouches, a gauntlet, nothing concrete but enough to warrant a continued search. Assuming the terrain has not changed dramatically since the battle, the locations of these items doesn't align with what we'd expect tactically. Despite that, our main issue now is, none of them are even remotely close to one another so part of the team is going to search again and part is investigating how these items got here."
  btr_archeology_lost_regiment.2.a:0 "We are too close to fail now."
  ### Stage 3 ###
  btr_archeology_lost_regiment.3.name:0 "The Grave"
  btr_archeology_lost_regiment.3.desc:0 "History is a murky and obscure thing. The one hard fact we know about the battle where the 317th sacrificed themselves is that it was chaos. The rebels caught us off guard, we underestimated them and the 317th was asked to pay for it. The After Action Reports aren't much help, several contradict each other, few mention anything beyond their units immediate actions and what happened to them. We found the 317th, or most of them, in the valley east of the hills. More accurately, we recovered 3,754 confirmed sets of remains out of the 5,200 deployed onto the planet with that number expected to increase as efforts continue. The items we found previously created a trail straight to their final resting place outside of a handful who were found along the path and many more items along the way. Everything recovered is in decent condition all things considered, the remains are purely skeletal with limited evidence of scavenging, no signs of looting have been found yet. We think that the unit attempted to withdraw under fire pulling its constituent battalions back before trying to move as a regiment back toward our lines. We found one battalion's withdrawal route and are searching for the others. It is likely those routes will have more remains scattered nearby. It appears that two battalions attempted to act as a rearguard but were overwhelmed, the less prepared battalions didn't stand a chance."
  btr_archeology_lost_regiment.3.a:0 "Bring them home."
  317th_found:0 "317th Battle Standard"
  317th_found_desc:0 "Having finally found and laid to rest a unit that had been lost for so long, the Turian people can sleep easy knowing both that their government never leaves a Turian behind and that these heroes received the burial's that they deserved."

  ### Site ###
  btr_archeology_crashed_ship:0 "Uncharted Wreck"
  btr_archeology_crashed_ship_site_desc:0 "Starship disasters are rare but not unheard of; many ultimately meet their end on the surface of some terrestrial body and are legally required to register their wrecks for both navigational and legal reasons. While on patrol, one of our ships discovered an uncharted wreck on the surface of a nearby planet. It could not stop to investigate, but it is recommended we dispatch a team to get to the bottom of this."

  ### Stage 0 ###
  btr_archeology_crashed_ship.name:0 "The Ship"
  btr_archeology_crashed_ship.desc:0 "The wreck is heavily damaged but still in one piece, resting in a large pit that it dug as it impacted the surface. Whatever identification it had on its hull is long gone, along with large sections of the hull in general, and its engines are mangled beyond any hope of restoring power. We have set up a base camp on high ground near the pit and are preparing to enter the vessel in the hopes of finding evidence of what happened and to whom."
  btr_archeology_crashed_ship.a:0 "Be safe."
  ### Stage 1 ###
  btr_archeology_crashed_ship.1.name:0 "Through the Shredder"
  btr_archeology_crashed_ship.1.desc:0 "The ship's interior is a nightmare. Sections that survived the impact without much damage are pitch black. Areas where light is more plentiful generally have less space to navigate through. It is also twisted slightly; the entire thing is rotated about fifteen degrees to the right, so we are crawling along walls as much as walking on floors. All of this has caused our progress to be slow and difficult, as none of the team members wants to join the crew that is here. No remains or personal effects have been found, and we are still attempting to reach the bridge to try and find out what happened."
  btr_archeology_crashed_ship.1.a:0 "Hopefully, the crew escaped before impact."
  ### Stage 2 ###
  btr_archeology_crashed_ship.2.name:0 "Grim Reveal"
  btr_archeology_crashed_ship.2.desc:0 "It took several days to safely reach the bridge of the ship. Along the way, we found the remains of two crew members. Based on their skeletal remains, we think that they were either already dead when the ship impacted or died shortly thereafter. The bridge gave us less information than we had hoped. Even with portable generators, the equipment is so degraded that it struggled to turn on, let alone function. Most Datapads we found were broken, but a handful survived, telling tales of petty grievances, disconnected loves, and insufficient pay for the food quality being provided. We are searching for more of the other evidence, as to what happened here."
  btr_archeology_crashed_ship.2.a:0 "There has to be an answer somewhere."
  ### Stage 3 ###
  btr_archeology_crashed_ship.3.name:0 "Captains Quarters"
  btr_archeology_crashed_ship.3.desc:0 "There are large sections of the ship that can only be accessed from the outside and one of them happens to be the Captain's Quarters. Unlike most of the ship, these quarters were easily identifiable due to the furniture and abundant personal belongings. Sifting through the room's debris and the minor personal items, we discovered a few interesting things. This was a tramp freighter, owned and operated by its captain, which is likely why it was never registered. It was also quite old, serving for many decades in a “Salamander shipping firm” before being sold to the captain only a few years ago. The captain was in talks with a lawyer to potentially sue for selling him “such a bad ship”, but nothing had been filed when the crash happened. The captain also seemed to have issues with his crew as they repeatedly asked for higher pay, better conditions, and that parts of their accommodations weren't working."
  btr_archeology_crashed_ship.3.a:0 "A bad combination."
  ### Stage 4 ###
  btr_archeology_crashed_ship.4.name:0 "Retreveal"
  btr_archeology_crashed_ship.4.desc:0 "From what we can gather, the ship was old, poorly maintained, and likely should not have left the spaceport. A mechanical issue spiraled out of control, and the ship was pulled into [planet.GetName]'s orbit. What that issue was will probably never be known, as we cannot identify the ship. We cannot pull up a crew manifest, so we are not sure if anyone escaped, but we did uncover three more sets of skeletal remains as we searched the rest of the ship. Others may be trapped in areas that we cannot reach, or laying outside damaged escape pods elsewhere on the planet. Unless someone comes forward, we likely won't be able to discover much more."
  btr_archeology_crashed_ship.4.a:0 "At least we can recover the cargo."

  ### Site ###
  btr_archeology_space_hulk:0 "Space Hulk"
  btr_archeology_space_hulk_site_desc:0 "Tramp freighters, criminals, and less scrupulous scrapyards have a habit of filling shipping lanes with derelict vessels that endanger legitimate travel and functioning members of society. By law they are obligated to alert us when a vessel is abandoned and to mark the ship so others can easily identify it and its status but that would then hold them responsible so they typically avoid it leaving these hulks as hazards we must clear."

  ### Stage 0 ###
  btr_archeology_space_hulk.name:0 "Floating Derelict"
  btr_archeology_space_hulk.desc:0 "We've received reports of a vessel floating adrift on the outskirts of shipping districts in [system.getname]. While operators are legally compelled to register shipping incidents and mark their vessels after abandoning some, especially the less savory sort, ignore these rules and hope that the law doesn't catch up with them. We'll need to safely remove it and check if there is any evidence of who left it there as well see if any cargo is left."
  btr_archeology_space_hulk.a:0 "Another day of governing."
  ### Stage 1 ###
  btr_archeology_space_hulk.1.name:0 "The Approach"
  btr_archeology_space_hulk.1.desc:0 "We have arrived on scene and located the vessel, it is floating not far from where reports indicated it would be. Our scan indicates that it is void cold with no life signs, no immediate signs of damage but it is hard to tell on a ship so similar to the background of space. We will be approaching and boarding as soon as it is safe to do so."
  btr_archeology_space_hulk.1.a:0 "Understood"
  ### Stage 2 ###
  btr_archeology_space_hulk.2.name:0 "Eulogy"
  btr_archeology_space_hulk.2.desc:0 "The rescue ship CRV Sultara responded to reports of a massive explosion in the [system.getname] and found the remnants of [ship.getname] along with additional debris inline with a standard size freighter. They found no survivors but were able to recover the [ship.getname]'s logs which recorded up to the moment of the explosion. Apparently the ship had a team working to restore power on the vessel, as soon as they did the ship went into some sort of emergency lockdown. They still had contact with the away team but could not get them off of the vessel, before they could even fully understand what had happened a prerecorded message began to play.“Well, well, well. I knew you hated me Ferik, if i had known you were so stupid i would've gotten rid of you years ago. You just can't help yourself can you? Doesn't matter now, I'll see you in hell.” Our initial analysis points to the freighter overloading its engine core and exploding so violently that it ripped both ships to pieces."
  btr_archeology_space_hulk.2.a:0 "Brave lives lost to someone else's grudge."
  ### Stage 3 ###
  btr_archeology_space_hulk.3.name:0 "Drop Coordinates"
  btr_archeology_space_hulk.3.desc:0 "The ship is old and not particularly well maintained so finding all of the reasons for the power failure and fixing them was proving overly tedious. Instead, we used portable generators to power the bridge so we could at least continue our investigation. What we uncovered was far more interesting than anything we'd anticipated. It seems this ship was a sacrifice, intended to give someone the coordinates to a payment stash without either party being physically present. No names are used but we have some clues as to who the parties are and are tracking those leads down. In the meantime our agents have retrieved the stash and removed the vessel from the shipping lanes."
  btr_archeology_space_hulk.3.a:0 "A bad combination."
  ### Stage 4 ###
  btr_archeology_space_hulk.4.name:0 "Penny Crimes"
  btr_archeology_space_hulk.4.desc:0 "Restoring power to the ship took longer than we had anticipated as the ship's systems were far more degraded than initial scans predicted. Apparently the ship was owned by an individual who had attempted to enter the shipping industry, offering both freight and personal trips to anywhere people with money wanted to go. Unfortunately for him, people with money weren't interested in his old run down vessel and his business was barely breaking even. As the ship continued to degrade he decided to abandon it out here rather than go through the official channels, and spend the time and money to dispose of the ship safely. He meticulously pulled everything off of it to either sell or use personally."
  btr_archeology_space_hulk.4.a:0 "Consider this reimbursement for administrative expenses."

  ### Site ###
  btr_archeology_krogan_warlord:0 "Scattered Bones"
  btr_archeology_krogan_warlord_site_desc:0 "A prospecting expedition stumbled onto what appears to be a former battleground or mass grave. Seeking the reward for discovering sites of archeological significance, and not wanting to face decades in prison for destroying it, they alerted authorities. Now it is up to us to investigate the site and determine exactly what it is and why it is there."

  ### Stage 0 ###
  btr_archeology_krogan_warlord.name:0 "Another Last Stand"
  btr_archeology_krogan_warlord.desc:0 "The Krogan Rebellions had officially ended years after the Genophage's deployment in 710 CE. Shiagur was the last legendary warlord who made a push at Canrum, before falling as well. Yet her and her krantt's death were not the last. Across the galaxy, other lesser known and minor Warlords made their own stands, whether out of nihilism as the Genophage came or out of what their blood demanded. As scientists had examined the planet in question, signs of an oddly focused battle site have become apparent, namely from environmental damage from past orbital bombardment. Discovering an untold battle might be worth investigating."
  btr_archeology_krogan_warlord.a:0 "Perhaps…"
  ### Stage 1 ###
  btr_archeology_krogan_warlord.1.name:0 "So Many Dead"
  btr_archeology_krogan_warlord.1.desc:0 "Only after a short while of searching and excavation, many remains have been found. Mostly that of Turian soldiers, though a handful of Krogan have been found buried by debris. Signs show that they had been gunned down, their bodies marched over. The epicenter of the battle eludes us, still buried. Corpses and metallic debris alongside earthen rubble block the way. Yet we are close, as shrapnel identified as pieces of old bombs has been found."
  btr_archeology_krogan_warlord.1.a:0 "Very well."
  ### Stage 2 ###
  btr_archeology_krogan_warlord.2.name:0 "The Warlord"
  btr_archeology_krogan_warlord.2.desc:0 "A warrior culture seemingly condemned and doomed. That is what had resulted in the sunken and buried crater where a Krogan Warlord whose name is lost to time lies. A species that was raised upward to defend the galaxy, shedding much blood to do so. Who then turned on those who pushed them towards an enemy, before being punished with the Genophage. The morbid site reminds us to consider what has passed, where we are, and what will come."
  btr_archeology_krogan_warlord.2.a:0 "Let us take a moment."

  ### Site ###
  btr_archeology_geth_probe:0 "Odd Lights & Sounds"
  btr_archeology_geth_probe_site_desc:0 "On distant worlds far on the frontier and edge of what is considered civilized space, bizarre things can happen. Records show some bright luminous light hitting the planet not too long ago. Following this, a single signal went out that was indecipherable, seemingly garbled electronic sounds. However, after some time, we traced the signal to an impact site that had gone into a mountainside."

  ### Stage 0 ###
  btr_archeology_geth_probe.1.name:0 "Strange Debris"
  btr_archeology_geth_probe.1.desc:0 "As excavation of the impact site proceeds, it is fairly strange in how straight the impact was and how far it had penetrated the mountain. Thus far, it continues on. All we've found are pieces of some unidentified flexible metallic alloy embedded into the rock within the tunneling. Whatever had hit the side of the mountain was clearly made of pretty durable material, seeing as the only signs of damage are wear and tear from prolonged collision. However these pieces of scrap provide a trail for us to continue following."
  btr_archeology_geth_probe.1.a:0 "Do so."
  ### Stage 1 ###
  btr_archeology_geth_probe.2.name:0 "White Fluid"
  btr_archeology_geth_probe.2.desc:0 "As the trail of debris starts to trickle out, a new sign to follow has become apparent…albeit peculiar. Smears of a white fluid go down to what appears to be the end of the tunneling created by whatever made impact. It almost has the consistency of blood, though there are no signs of any organic matter within it. As we've continued our excavation following these signs, we've seemed to have found the end. There appears to be some of this white liquid pooling around something, likely what we're looking for."
  btr_archeology_geth_probe.2.a:0 "Well, what are we waiting for?"
  ### Stage 2 ###
  btr_archeology_geth_probe.3.name:0 "From The Beyond The Veil"
  btr_archeology_geth_probe.3.desc:0 "An odd machine was unearthed and pulled from the pool of white liquid. As far as all of us on the team can tell, it is some form of drone. Its design doesn't match any Council species we are aware of off the top of our heads, nor does it match anything human made. Soon enough though, its origin became clear as its make was further analyzed. It matches the few pieces of data we possess on the enigmatic Geth from the Perseus Veil. Yet a question persists…What was its purpose? To extract resources perhaps? The drone's tools have mostly been ruined from a botched landing, so it is difficult to tell…yet it surely has people discussing the sophistication behind the design."
  btr_archeology_geth_probe.3.a:0 "The Geth…?"


  ### Site ###
  btr_archeology_salarian_researchers:0 "Bumbling Scientists"
  btr_archeology_salarian_scientists_site_desc:0 "When entering a system it is standard procedure to do a general scan to know what is out there so one can plan accordingly. While normally this reveals nothing beyond what other ships are in the system, we have received reports that something odd has been pinging back. An uninhabited planet in the system pinged back which means someone is down there with an active general communications system. We have no idea who is out there, what they are doing, or why and our standard assumption of mercenary or criminal activity don't make sense given their comms system is actively responding to pings alerting the system that someone is out there. It seems like it's past time we sent an expedition down to see who is out here and what they are doing."

  ### Stage 0 ###
  btr_archeology_salarian_researchers.1.name:0 "Disaster Signs"
  btr_archeology_salarian_researchers.1.desc:0 "As the expedition searched for the source signal of the communications system, the general area showed signs of a crash. From the looks of it, a small ship or shuttle dragged across the ground before blazing down a deep ravine.Nearby we've found what looks like a campsite, a small desk terminal remains albeit cracked and tossed to the ground, with data on the planet itself. Many questions have been raised by the team, but chief among them is who's out there still. This doesn't seem like mercenary or criminal work afoot, which means at the very least a proper effort should be put in to continue the search."
  btr_archeology_salarian_researchers.1.a:0 "What's going on?"
  ### Stage 1 ###
  btr_archeology_salarian_researchers.2.name:0 "Down The Ravine"
  btr_archeology_salarian_researchers.2.desc:0 "We've managed to scale down the ravine, and thus far it isn't looking too good. Metallic debris can be seen wedged and snapped off into the cliff face on the way down. Yet that's not the worst of it. Members of the expedition have found the bodies of several Salarians, bearing no military or affiliate markings. Most of the datapads they had have been ruined, though there seems to be a running theme as far as we can put together. A small group of researchers, who were all alone, had grown on each others' nerves. From pettiness to egotistical mania, it seems from the few logs we have that some form of self-sabotage had occurred. Surprisingly…or unsurprisingly depending on one's perspective, one of them had been actually analyzing the conditions of his peers for research rather than solving the issues present. As it stands, we've now found the ship in question where the signal is coming from and are readying to pry it open to get to the bottom of this."
  btr_archeology_salarian_researchers.2.a:0 "What the hell?"
  ### Stage 2 ###
  btr_archeology_salarian_researchers.3.name:0 "Engineered Doom"
  btr_archeology_salarian_researchers.3.desc:0 "Prying open the ship, we have found the remaining Salarian researchers who had not flown out of the ship as it crashed and burned. The state of all but one are abhorrent. Burnt, broken, most of the bodies on the ship's interior died in almost comical fashion. The only intact one was next to the ship's primary communication console, which it and everything needed to send out a rudimentary signal had been expertly repaired with very little to work with. The former lone survivor of the crash left a log of starvation, last thoughts, and confused anger that someone had forgotten to update the autopilot's course correctly before takeoff."
  btr_archeology_salarian_researchers.3.a:0 "Tragic but…stupid."

  ### Site ###
  btr_archeology_rites_of_beast:0 "The Plateau of Horns"
  btr_archeology_rites_of_beast_site_desc:0 "On a high plateau scarred by wind and time, archaeologists uncover rows of towering bone totems — the horns and skulls of beasts slain in ritual combat. Stone markers carved with clan symbols surround the field, each representing a Krogan warrior who triumphed here. The silence of the plateau is broken only by the wind, but the arrangement speaks of countless battles fought beneath the open sky."

  ### Stage 0 ###
  btr_archeology_rites_of_beast.name:0 "The Beast Pits"
  btr_archeology_rites_of_beast.desc:0 "Deep within the chaotic ruins lie the remnants of stone arenas. Excavations reveal the bones of exotic predators some native, others imported from across the stars. The Krogan brought their prey here not just to hunt, but to fight them in enclosed pits, a test of courage as much as endurance. Broken weapons and shattered armor still cover the ground, preserved by the thick jungle canopy."
  btr_archeology_rites_of_beast.a:0 "Study the remains. Even prey tells of its hunters."
  ### Stage 1 ###
  btr_archeology_rites_of_beast.1.name:0 "The Shaman's Cave"
  btr_archeology_rites_of_beast.1.desc:0 "In a network of murky caverns, ritual markings cover the walls. Ceremonial masks, trinkets, and preserved bones indicate this was once a shaman's sanctuary, where Krogan warriors received blessings before their trials. Inscriptions describe blood oaths sworn to ancestors, binding hunters to their clans through sacrifice."
  btr_archeology_rites_of_beast.1.a:0 "Record the inscriptions. Belief leaves scars deeper than battle."
  ### Stage 2 ###
  btr_archeology_rites_of_beast.2.name:0 "The Trial Grounds"
  btr_archeology_rites_of_beast.2.desc:0 "Scattered across a barren canyon are enormous hunting blinds and ambush points. Excavations suggest these were used to test initiates against wild packs of varren and other feral beasts. The remains of young Krogan lie next to their fallen adversaries — evidence that not all who faced the trials survived. Success brought honor; failure brought silence. "
  btr_archeology_rites_of_beast.2.a:0 "Mark the dead. Trial and sacrifice are inseparable."
  ### Stage 3 ###
  btr_archeology_rites_of_beast.3.name:0 "The Feast of Bones"
  btr_archeology_rites_of_beast.3.desc:0 "At the edge of a barren plain lie the charred remains of a Krogan gathering site. Fire pits filled with cracked bones and scorched horn fragments show where the victors feasted after their hunts. Songs, carved into stone, boast of glory won in combat — of warriors who earned their names in blood and fire. To the Krogan, such feasts were more than celebrations; they were proclamations of survival."
  btr_archeology_rites_of_beast.3.a:0 " Preserve the songs. Pride can outlast fire."
  ### Stage 4 ###
  btr_archeology_rites_of_beast.4.name:0 "The Altar of Blood"
  btr_archeology_rites_of_beast.4.desc:0 "At the center of a storm swept plateau stands a bloodstained stone altar, polished smooth by centuries of use. Krogan warriors once pledged loyalty here, binding themselves to clan and kin. Others met their end upon it, as sacrifices to tradition. The site radiates a solemn weight — it's like you can feel the countless hunts, trials, and victories. Even abandoned, the altar feels alive with memory."
  btr_archeology_rites_of_beast.4.a:0 "Leave an offering. Some rites should never be broken."
  rite_of_beast:0 "Rite of the Beast"
  rite_of_beast_desc:0 "We have rediscovered the old rites and it has brought a new sense of honor and vigor to our warriors."

  ### Site ###
  btr_archeology_echoes_rachni_war:0 "Listening Post Theta"
  btr_archeology_echoes_rachni_war_site_desc:0 "Orbiting a lifeless planet, this shattered Krogan listening post still hums faintly with degraded signals. Carved into the walls of its reinforced bunker are tallies of Rachni ships destroyed, each stroke a testament to the endless slaughter. But the records stop abruptly. The outpost was overrun before reinforcements could arrive. The silence here lingers like a wound."

  ### Stage 0 ###
  btr_archeology_echoes_rachni_war.name:0 "The Furnace World"
  btr_archeology_echoes_rachni_war.desc:0 "Excavation teams uncover vast weapon foundries buried beneath hardened lava flows. Thousands of crude but devastating munitions were forged here — designed not for precision, but for eradication. Murals etched into steel walls show Krogan smiths boasting of their weapons' power. Yet skeletal remains piled at the edges of the foundries hint that not all “workers” were volunteers."
  btr_archeology_echoes_rachni_war.a:0 "Catalog the weapons. War demanded everything."
  ### Stage 1 ###
  btr_archeology_echoes_rachni_war.1.name:0 "Burial of the Swarm"
  btr_archeology_echoes_rachni_war.1.desc:0 "Hollowed tunnels inside this asteroid contain mountains of insectoid remains. This was no natural hive — it was a Krogan deathtrap, luring Rachni into its caverns before collapsing the tunnels with explosives. The bones show signs of fire, acid, and blunt trauma, evidence of close-quarters slaughter. The Krogan left no marker for their dead foes, only silence."
  btr_archeology_echoes_rachni_war.1.a:0 "Count the bones. Victory leaves only ash."
  ### Stage 2 ###
  btr_archeology_echoes_rachni_war.2.name:0 "The Forward Bastion"
  btr_archeology_echoes_rachni_war.2.desc:0 "On a toxic, storm lashed planet stands the ruins of a fortress half buried in sand. Its walls are riddled with acid burns, claw marks, and explosive craters. Personal logs etched into datapads describe a final stand against an endless swarm. Few survived long enough to send their last transmission: “The line holds.” The bastion still reeks of defiance and extinction."
  btr_archeology_echoes_rachni_war.2.a:0 "Honor their sacrifice. Even stone remembers."
  ### Stage 3 ###
  btr_archeology_echoes_rachni_war.3.name:0 "The Forgotten Hatchery"
  btr_archeology_echoes_rachni_war.3.desc:0 "This sealed facility once housed Rachni eggs, taken alive for study. The walls are scorched where Krogan attempted to control — and weaponize — their enemy. Shattered containment cells reveal how badly this ended. Blood, both insectoid and Krogan, stains the chamber. The project was abandoned, scrubbed from records, but the corpses of scientists and hatchlings alike tell the true story."
  btr_archeology_echoes_rachni_war.3.a:0 "Purge the site. Some knowledge should remain buried."
  ### Stage 4 ###
  btr_archeology_echoes_rachni_war.4.name:0 "The Last Muster"
  btr_archeology_echoes_rachni_war.4.desc:0 "Orbiting a star-scorched planet drifts a graveyard of shattered warships. Their hulls bear Krogan war markings, scarred by acid burns and plasma fire. Among them lies a command ship, its databanks barely functional. Logs within reveal the warlord's final speech: victory was assured, but the Krogan had learned to love war too much. The seeds of future rebellions were already sown here."
  btr_archeology_echoes_rachni_war.4.a:0 "Record their words. The war never truly ended."

  ### Site ###
  btr_archeology_vorcha_colony:0 "Everything Ruined"
  btr_archeology_vorcha_colony_site_desc:0 "On an off-chance, we have received a primitive and unknown signal from a planet. Though it appears to originate in a fairly questionable area that almost no sentient or sapient being would dare tread. Sending a probe out to look things over, the team has discovered traces of foreign chemicals and crudely refined alloys, along with a few pieces of prefab structures. More notably though is the giant explosion that had occurred that has left a giant sinkhole at the site in question. The only signs of life are a few Vorcha corpses, which has only raised more questions."

  ### Stage 0 ###
  btr_archeology_vorcha_colony.1.name:0 "Dead Vorcha"
  btr_archeology_vorcha_colony.1.desc:0 "In our search of the odd site, we have only unearthed more and more dead Vorcha. All in various states of disrepair and decay. A variety of causes of death have been determined, many of which include being at the epicenter of whatever fantastically horrible explosion occurred here. However, many have lacerations, punctures, chemical burns, and even ammunition embedded into their bodies. The most recent of the bodies, namely the ones intact after being launched by a powerful explosion, are only weeks old. We have yet to find any signs as to what this all means, but it looks like something went very wrong very quickly."
  btr_archeology_vorcha_colony.1.a:0 "That's a lot of dead Vorcha."
  ### Stage 1 ###
  btr_archeology_vorcha_colony.2.name:0 "An Attempt"
  btr_archeology_vorcha_colony.2.desc:0 "We have finally found audio and data logs that offer a glimpse as to what happened. A great deal of Vorcha had arrived at this location, bringing supplies that were roughly cataloged, including many illegal weapons. However, with few engineers, it seems much of the labor was conducted by typical Vorcha individuals which resulted in unrest. In addition to these problems, it would appear that the Vorcha had not accounted for their stores correctly. They ended up with far more munitions and deadly chemicals than food. The most cohesive log is a frantic engineer quoting the murderous murmurings that desired those in leadership positions to be dead. Most audio logs are admissions of killing intent or cutoff by acts of rampant violence. We know what went wrong, but we don't understand what this was an attempt at. Yet we've almost traced the source of the signal, which appears to be coming from the bottom of the sinkhole."
  btr_archeology_vorcha_colony.2.a:0 "We've come this far."
  ### Stage 2 ###
  btr_archeology_vorcha_colony.3.name:0 "Colonists?"
  btr_archeology_vorcha_colony.3.desc:0 "After some effort, we've gone down the sinkhole. After trudging through still burning rubble and chemicals, as well as even more dead Vorcha, we did find something. A group of survivors who had been initially hostile but soon became pleading. These Vorcha recounted hurriedly and in a shoddy manner of how their clan escaped Heshtok by hijacking a smuggler's ship, then came to the world in question to establish their own colony. After what was deemed to be too many failures repeatedly, the clan soon turned on itself with everything available. When it became apparent to the leader they would be butchered, they instead set off a large scale fuel explosion with as many munitions available as possible. The surviving Vorcha…colonists…are willing to come and serve in any capacity so long as they get to live."
  btr_archeology_vorcha_colony.3.a:0 "Welcome…?"

  ### Site ###
  btr_archeology_failed_pilgrimage:0 "Quarian Distress"
  btr_archeology_failed_pilgrimage_site_desc:0 "Recently as we reexamined the planet, we discovered a new signal of Quarian origin. A recorded message repeats itself, as a Quarian describes that a group on their pilgrimage is in danger and that they need help as soon as possible. Unfortunately it did not describe the danger in question and there is no dating the message, so there was some hesitance in investigating due to lack of information. Eventually however, we have a team who is willing to head down to see what is going on."

  ### Stage 0 ###
  btr_archeology_failed_pilgrimage.1.name:0 "Abandoned Campsite"
  btr_archeology_failed_pilgrimage.1.desc:0 "Upon searching for the Quarians, the team had come upon a campsite. Much of the supplies were either contaminated or had been taken already. The small terminal setup was the source of the distress signal, repeating it in the dark of the main tent alongside some other abandoned equipment. There are no signs of the Quarians, save for a few logs on an underground ruin unearthed that has caught their interest and appears to have been the target of their pilgrimage. The team has caught wind of some faded tracks leading away from the camp. It seems we have our lead."
  btr_archeology_failed_pilgrimage.1.a:0 "Find them."
  ### Stage 1 ###
  btr_archeology_failed_pilgrimage.2.name:0 "The Ruin"
  btr_archeology_failed_pilgrimage.2.desc:0 "As we followed what little we had to go on, the team found an excavation hole leading into darkness. There is a lift the Quarians have set up, and with some elbow grease we got its generator running. With portable lamps at the ready, with some staying behind in case of the worst, we descended. As we illuminated the interior we found ourselves in, we were met by weathered metallic walls that had been partially falling apart from disrepair. There was a lack of much, save for dried blood that trailed deeper inward. As we cautiously followed, we found one Quarian against the wall. Their suit was compromised from a puncture, and they appeared to have tried crawling back to the entrance. To say we are unnerved is an understatement."
  btr_archeology_failed_pilgrimage.2.a:0 "Stay alert."
  ### Stage 2 ###
  btr_archeology_failed_pilgrimage.3.name:0 "Pilgrimage's End"
  btr_archeology_failed_pilgrimage.3.desc:0 "As we tread through hanging vine-like cabling and wires, our footsteps echoing off aged alloy flooring, we found another Quarian doomed to demise. Their helmet was shattered against the wall, signs that they were thrown against it in a violent impact. Damaged consoles, collapsed rooms, and foreboding halls eventually ended in what can be described as a large void with a walkway extended into it. Here we found the Quarian who matched the one who sent out the distress signal. He was slumped over the railing, he seemed to have bled out. An odd faded, brackish blue fluid stained the walkway, and the Quarian's tools were gone. Some struggle had occurred…but with what was undetermined at first. Yet a blinking, barely functioning monolith of a terminal laid at the end of the walkway. Investigating it, we have found that it was partially repaired by the Quarians due to the amount of omni-gel and ad hoc usage of tools that had been still visible. The Quarians had their own small portable datapad hooked up to it, and seemed to pull some amount of interesting data, with even a bit of analysis from the Quarians themselves on it. It seems it wasn't for nothing, but these three had seen the end of their pilgrimage from the Migrant Fleet."
  btr_archeology_failed_pilgrimage.3.a:0 "We will send their remains back. Collect the data."

  ### Site ###
  btr_archeology_hidden_titans:0 "Solid Gas"
  btr_archeology_hidden_titans_site_desc:0 "Gas giants are regularly surveyed both by specialized corporate craft and smaller private ships skimming fuel to be refined onboard. The intent is to find the densest pockets of key gases and to avoid all of the useless gases swirling around the behemoth. Recently, we received a report that [planet.getname] has had strange readings. The scans suggest an impossibly dense gas pocket, deeper than even the most advanced mining rigs can reach. However, our scientists tell us that there is no way a gas pocket could be that large and that stable."


  ### Stage 0 ###
  btr_archeology_hidden_titans.1.name:0 "Scans"
  btr_archeology_hidden_titans.1.desc:0 "Our ships have arrived on scene and have confirmed the scans. Now that we are looking for it, we've spent several days tracking the cloud, and it's increasingly likely that our scientists were right. The clouds are larger than any previously discovered pocket, deeper than anything we've ever touched, orbiting constantly, and maintaining a near perfect orbit within the gas giant's cloud. One of those would be an anomaly, two would be strange, all of them point to some form of meddling."
  btr_archeology_hidden_titans.1.a:0 "Meddling by who? And for what purpose?"
  ### Stage 1 ###
  btr_archeology_hidden_titans.2.name:0 "Probes"
  btr_archeology_hidden_titans.2.desc:0 "We are attempting to design new probes capable of withstanding the remarkable pressures that deep into the gas giant. In the meantime, we have been dispatching regular probes in the hopes that one of them will be able to tell us something. Luckily, we have been able to piece things together across the scrambled transmissions of our dying probes. We can now confirm that whatever is down there is metallic and shows signs of being artificially forged. Our task is made more difficult by the poor visibility and by repeatedly discovering odd elements that don't seem to serve any purpose on the ships."
  btr_archeology_hidden_titans.2.a:0 "Metalic, in a stable orbit... odd"
  ### Stage 2 ###
  btr_archeology_hidden_titans.3.name:0 "Findings"
  btr_archeology_hidden_titans.3.desc:0 "The specialized probes were able to give us a clearer picture of what we are dealing with before succumbing to the gas giant. What we have been scanning is not a gas pocket or a stray mining station. They are two massive vessels, parked next to one another; they have signs of damage but appear to be in decent shape. From the silhouette that we managed to glimpse, these don't appear to be warships. Despite their size, they don't have any of the telltale aspects nor the massive hangars, unless they use weapons so alien as to not need firing arcs, or their hangar doors are much more ornate than ours. Our view of them was claustrophobic and brief, but it was more than enough to show us exactly what we are working with."
  btr_archeology_hidden_titans.3.a:0 "Well, now we have to bring them up!"
  btr_archeology_hidden_titans.3.b:0 "Now we know."
  ### Stage 4 ###
  btr_archeology_hidden_titans.4.name:0 "Designs"
  btr_archeology_hidden_titans.4.desc:0 "Our engineers have been studying what went wrong with the specialist probes and have made some adjustments. However, they are uncertain that we can simply build our way into raising the ships. Instead, some have proposed a radical plan, massing gas miners above the ship and using them to temporarily push the surface of the gas giant toward the ships, making it easier for our new probes to operate. They are eager to study these more closely, not only to understand how they've survived so deep in the gas giant but also to figure out why their original owners gave them such odd features. It's going to be difficult, but theoretically it could work."
  btr_archeology_hidden_titans.4.a:0 "Make it so."
  btr_archeology_hidden_titans.4.b:0 "Sadly, that is too expensive."
  ### Stage 5 ###
  btr_archeology_hidden_titans.5.name:0 "Success"
  btr_archeology_hidden_titans.5.desc:0 "We were able to successfully dent the gas giant, allowing our probes to reach the two ships and pull them from its gravity. They are immense, far larger than anything we have ever seen. Despite the damage, our initial assessments are that these were pleasure barges from some ancient society. The intricate mosaics on the interior are made with precious gemstones; there are statues of aliens we don't recognize strewn across both ships. There is enough furniture in one ship to furnish a small city, and it isn't cheap furniture either. One of the ships has a replica waterfall, while the other has what we can only describe as an artificial white water rapids course that we theorize could be set to a sort of lazy river mode.  There seem to be paintings or murals on some of the interior walls, but we are unsure exactly what they depict, if they were originally part of the ships, or even if they are complete. How they got into the gas giant, and why, will likely never be known. But we can now appreciate the splendor and luxury that some ancient ruler imbued these ships with."
  btr_archeology_hidden_titans.5.a:0 "At last, a proper use of tax credits."
  pleasure_barge:0 "REPLACE_ME"
  pleasure_barge_desc:0 "REPLACE_ME"

  ### Site ###
  btr_archeology_aritificial_gladiation:0 "Suspicious Quantities"
  btr_archeology_aritificial_gladiation_desc:0 "Survey teams discovered something nearly unbelievably rare on [planet.GetName]. Not only does it have large deposits of minerals, and rare materials, those large deposits are seemingly stacked on top of one another? Or at least, that is the best explanation we currently have for these readings. They asked us to survey the area to confirm their findings and our survey got the same results which has our scientists asking, how?"

  ### Stage 0 ###
  btr_archeology_aritificial_gladiation.name:0 "Metallic Skulls"
  btr_archeology_aritificial_gladiation.desc:0 "The team arrived in the center of the strange hyper-deposit and began mining into the ground around them. It didn't take long before they started finding clearly artificial metallic parts in the excavated ground. As they continued clearing the area with a more delicate approach they found dozens of metallic bodies in just the small area that they'd begun working in. Many show signs of damage, all are inoperative, but there is debate on if these represent an alien robotic workforce or a gravesite of some genuinely artificial intelligence."
  btr_archeology_aritificial_gladiation.a:0 "We will not find out without further study."
  btr_archeology_aritificial_gladiation.b:0 "Trampling upon a gravesite is too severe a crime to risk."
  ### Stage 1 ###
  btr_archeology_aritificial_gladiation.1.name:0 "A Scale Unknown"
  btr_archeology_aritificial_gladiation.1.desc:0 "Despite the teams best efforts, we still aren't certain what we are dealing with on [planet.GetName]. We have increased the scope of our dig site significantly and have only found more  mechanical corpses. They are even buried in layers leading some to further argue this is a gravesite of some description. Others suggest that we are seeing the aftermath of repeated battles due to the fairly extreme damage many of these frames display. Why this planet, and this exact stretch of land, would be worth repeated large scale battles is still unknown."
  btr_archeology_aritificial_gladiation.1.a:0 "Answers will come with time."
  btr_archeology_aritificial_gladiation.1.b:0 "This is becoming too close to disturbing graves…"
  ### Stage 2 ###
  btr_archeology_aritificial_gladiation.2.name:0 "Walls"
  btr_archeology_aritificial_gladiation.2.desc:0 "As we've expanded our digsite even further we've encountered what appears to be the remnants of walls. They form a large oval centered around the area that we have been excavating. Initially, this was feared to prove that this was a gravesite but continued excavation of these walls reveal unexpected additions. At the two narrow extremes of the oval there seemed to have been gates of some sort which is likely how the machines were brought inside. There is also some evidence that above the gates were larger rooms, possibly the size of a decent apartment. The walls themselves were likely quite thick and some have speculated that they were not uniform in height but instead sloped downward toward the excavation. Some among the team have begun referring to it as “The Stadium”."
  btr_archeology_aritificial_gladiation.2.a:0 "Sparksports?"
  ### Stage 3 ###
  btr_archeology_aritificial_gladiation.3.name:0 "The Stadium"
  btr_archeology_aritificial_gladiation.3.desc:0 "After shifting our focus to what remains of these ancient walls we can confirm that they once housed structures both within and above them. While we can only guess what these structures were used for, the context is leaning heavily in spectator seating and amenities. The walls likely had large walkways, debates rage over if they were sealed or had large windows, and openings like our own stadiums leading to the seating on the sloped inside of the wall or ways of getting to the top which likely had more seating. Our orbital scans don't indicate any signs of settlements on this planet so these spectators must have arrived here from off world specifically for these events. We've also begun cataloging the machines we've been digging up. The process will take years but we are already seeing similar models or models drawing clear inspiration from one another, even with all the damage."
  btr_archeology_aritificial_gladiation.3.a:0 "But, why?"
  ### Stage 4 ###
  btr_archeology_aritificial_gladiation.4.name:0 "The [planet.GetName] Plaque"
  btr_archeology_aritificial_gladiation.4.desc:0 "As we were wrapping up our excavation of the site we did a cursory dig just beyond the two “gates” at either end of the oval. We found that one of them had a stone that was clearly brought from off-world planted just a few steps ahead of where the gate would've been. It held a plaque that our linguists have been hard at work trying to decipher. They've handed in their best approximation for what it might say:  “In Accordance with the Treaty of Gilazek Our guns lay silent,  Our blood remains ours, and on these specified grounds we settle our disputes with the Varedian people through our soulless proxies.   May peace last, may the Victor be respected."
  btr_archeology_aritificial_gladiation.4.a:0 "Spill Sparks not Blood."

  ### Site ###
  btr_archeology_the_scoop:0 "Buried Structure"
  btr_archeology_the_scoop_desc:0 "We've recently uncovered what is definitely an artificial structure buried on [planet.GetName]. So far all we've uncovered is a small section of the roof, work was then paused to allow for professional archeologists to handle the rest of the dig. Even with this small glimpse we can tell it is made up of square metallic plates that are bound together somehow. The plates vary in color from dark grey to a lighter steel color but something about this doesn't feel Prothean."

  ### Stage 0 ###
  btr_archeology_the_scoop.name:0 "Uncovering"
  btr_archeology_the_scoop.desc:0 "As our team arrived they oversaw the excavation and eventually discovered a doorway. It was just a rectangular space cut out of the metal walls but it leads into a series of hallways so we believe that was how it was designed. The interior is made up of the same metallic tiles as the exterior, in fact, judging by the doorway we think that the walls are only one tile thick yet it survived being buried incredibly deep."
  btr_archeology_the_scoop.a:0 "The answers lay within those hallways."
  ### Stage 1 ###
  btr_archeology_the_scoop.1.name:0 "Empty Halls"
  btr_archeology_the_scoop.1.desc:0 "We have spent days mapping the hallways of this structure and all we have learned is that it is much larger than we first assumed. Tracking the distance our teams have walked, this structure is nearly twice the size of any stadium we know of and we still haven't found its end. The interior is a mazelike scramble of empty hallways with empty rooms occasionally dotted throughout. We've consulted with other experts and no one can explain why an interior would be laid out this way. The only thing we've seen has been the metallic tiles that don't seem to hold any hidden messages based on the coloration despite a team spending weeks trying to find one."
  btr_archeology_the_scoop.1.a:0 "There must be an answer somewhere?"
  ### Stage 2 ###
  btr_archeology_the_scoop.2.name:0 "The Disapperance"
  btr_archeology_the_scoop.2.desc:0 "The expedition leader, [leader.GetName] has gone missing. They were out on an expedition into the dark hallways and when the team began their trek back they realized that they were one head short. We have scrambled as many people into the structure as we can but we haven't found any sign of our expedition leader. For the time being, this is a rescue mission to try and save our scientist. One of the search parties found what appears to be a large screen built into one of the longer hallways. We had thought that hallway had been surveyed already but no one recalls seeing it previous, its not on and there are no obvious ways to interact with it so we have marked it for future study and are continuing our search."
  btr_archeology_the_scoop.2.a:0 "Where could they have possibly gone!"
  ### Stage 3 ###
  btr_archeology_the_scoop.3.name:0 "Of a Mind"
  btr_archeology_the_scoop.3.desc:0 "The screen that we'd previously discovered flashed to life with no warning. We spent weeks trying to translate the alien glyphs that it depicts and the best we can do is “Mind Being Evaluated”. It's been days and the screen has not changed or turned off. Our efforts to locate [leader.GetName] have just uncovered more of the empty maze and members of the team are starting to worry. Engineers have been brought in to scan and survey the walls in the areas that the team had gone through before we lost our leader. We can't see what could be hiding in the walls but we are rapidly running out of options."
  btr_archeology_the_scoop.3.a:0 "We'll have to see what secrets these ancient parts can reveal to us."
  ### Stage 4 ###
  btr_archeology_the_scoop.4.name:0 "Mechanisms"
  btr_archeology_the_scoop.4.desc:0 "It appears that not every wall is as thin as we expected. The engineers were able to determine that there are small sections of this vast labyrinth where there are chambers behind the walls. Normally these small voids wouldn't be worthy of note but at this point, we're considering any and all ideas for what is going on in this horrific building. Ripping the tiles off of the walls to examine these voids is proving harder than expected and we still don't know how they are attached in the first place."
  btr_archeology_the_scoop.4.a:0 "Every answer spawns more questions."
  ### Stage 5 ###
  btr_archeology_the_scoop.5.name:0 "Reveal"
  btr_archeology_the_scoop.5.desc:0 "At the start of another day of searching we made a gruesome discovery. Laying at the base of the screen is the corpse of [leader.GetName]. The top of their skull is missing along with their brain, what happened to it is unknown. The screen has changed for the first time since it came to life, “Unsatisfactory” is all it displays. We've retrieved what we can of [Leader.GetName] and abandoned the structure, no one wants to spend anymore time inside and we are recommending that it simply be destroyed. Uncovering whatever twisted purpose it was designed for is not worth the risk to the rest of our personnel."
  btr_archeology_the_scoop.5.a:0 "Alert the local authorities that we will be launching a strike from orbit."
  ### Stage 6 ###
  btr_archeology_the_scoop.6.name:0 "Reveal"
  btr_archeology_the_scoop.6.desc:0 "Something's changed. The screen that had been flashing "Mind Being Evaluated" since [leader.GetName]'s disappearance now simply says "Mind Accepted". We don't know what this means, nothing else has changed in this odd structure but no matter how long we spend searching its bland corridors we cannot find any evidence of our leader. The team is beginning to accept that whatever happened to them in this ancient horror maze, they're likely never going to be coming back. At this point, we're preparing services for [leader.GetName] and looking forward to never seeing this planet again."
  btr_archeology_the_scoop.6.a:0 "Alert the local authorities that we will be launching a strike from orbit."
  btr_archeology_the_scoop.6.b:0 "Pull all of our people and material out and then rebury it. We should've never come here."

  ### Site ###
  btr_archeology_the_xultec:0 "Fine Debris"
  btr_archeology_the_xultec_desc:0 "While surveying [planet.GetName] what initially appeared to be debris from some sort of volcanic or meteoric incident in the planets past has turned out to be something more artificial. We are looking through our archives and reaching out to other groups to try and find out who could have had a satellite in the region. But due to the limited amount of debris we are thinking this was either a large unmanned probe or a small orbital station. How or why it crashed onto the planet is not immediately clear."

  ### Stage 0 ###
  btr_archeology_the_xultec.name:0 "A Slate?"
  btr_archeology_the_xultec.desc:0 "No archive we've searched has given us any idea who this debris could have belonged to. And the planet doesn't have anything interesting enough to warrant something of this scale. We've recovered some of the debris for testing which might tell us who built it. While going through the debris we found that small sections of some of the rooms survived with fairly minimal damage. One of them had a terminal that was far beyond destroyed but it had some sort of file within it. We've taken to calling it a Data Slate based on how thin it is and its coloration. We are certain that it contained information from the terminal, but how much is retrievable and how to retrieve it remains to be seen."
  btr_archeology_the_xultec.a:0 "Keep up the good work."
  ### Stage 1 ###
  btr_archeology_the_xultec.1.name:0 "Ancient Data"
  btr_archeology_the_xultec.1.desc:0 "The results are in, the debris field is actually a prothean design, along with the terminal we are thinking this was a small research station that was towed from location to location and for some reason crashed here. We have also studied the slate and while not all of its readable we have recovered a report from an archeological dig they were conducting on a species they called the “Xultec”. Our linguists are convinced that the word “Xultec” is not Prothean in origin so our theory is that they had got that name from a source they had access to."
  btr_archeology_the_xultec.1.a:0 "A dig you say?"
  ### Stage 2 ###
  btr_archeology_the_xultec.2.name:0 "A Resurrected Tomb"
  btr_archeology_the_xultec.2.desc:0 "It took a significant amount of time and data reconstruction but we pieced together a likely candidate for the location of the Prothean archeological dig. After scanning the planet several times in detail normally reserved for potential colonies we found what we believe to be the site of their dig. The planet appears largely as they described it, a dusty lifeless rock. But according to their findings the site housed nearly ten million individuals in a giant city that sprawled horizontally rather than laterally like the urban sprawl we are familiar with. We are going to try and find evidence of the Prothean archeological expedition."
  btr_archeology_the_xultec.2.a:0 "Hopefully we are right."
  ### Stage 3 ###
  btr_archeology_the_xultec.3.name:0 "The Tunnels"
  btr_archeology_the_xultec.3.desc:0 "The location of the digsite is strange to say the least. Even after all these thousands of years there is still a depression in the ground where the city once was. It's so large that it's hard to notice on the ground but that was one of the key reasons we found it at all. Apparently the Protheans believed the Xultec were a eusocial species with sentient Queen and King individuals, specialized drones whose intelligence varied depending on their purpose with some being nearly on par with the monarchs and others barely being above the drones. The drones were non-sentient workers making up the majority of the population. Their accommodations represented most of the cities size and they did most of its maintenance. Digging and maintaining the under city, maintaining the structures which the Protheans apparently had access to. They believed that the structures were made out of a sort of concrete, the drones would mix the rocks and soil with some compound in their body and then exude it in place. Whatever remnants the Protheans had to study are long gone now but the tunnels remain."
  btr_archeology_the_xultec.3.a:0 "Time to do a bit of investigating ourselves."
  ### Stage 4 ###
  btr_archeology_the_xultec.4.name:0 "Discarded Metropolis"
  btr_archeology_the_xultec.4.desc:0 "The massive labyrinth of tunnels under seemingly go on forever. We have still not been able to map them all but they are in remarkably good condition. We have found some small elements of the Prothean expedition here, mostly tools but another slate was discovered near what we assume was the Prothean landing zone. This one is also in bad condition from being left in the sun on a planet with no atmosphere for presumably years and then buried in the planet's dust for millennia. It effectively says that the Prothean archeologist believed the Xultec on this planet were destroyed, either completely or to such an extent that they abandoned the planet as this was their only settlement. We may have less to go off of but we are very skeptical of this claim. The notion that a city with ten million residents could be damaged so badly without cosmic scale destruction is simply too fantastical to be taken seriously."
  btr_archeology_the_xultec.4.a:0 "Maybe that is why it was left in the dust."
  btr_archeology_the_xultec.4.b:0 "The Protheans might have been onto something."
  pm_xultec_hives:0 "Xultec Ruins"
  pm_xultec_hives_desc:0 "The evidence of this societies ancient megacities has left us with large subterranean spaces to use as we see fit."
  xultec_hives:0 "Xultec Ruins"
  xultec_hives_desc:0 "The evidence of this societies ancient megacities has left us with large subterranean spaces to use as we see fit."
