  r_btr_prothean_beacon_hanar_desc:0 "This beacon was one of a nearly endless supply of Prothean artifacts left on the Hanar homeworld and was quickly revered by the local inhabitants, its suggestions and knowledge being enacted with zealous fervor."
  prothean_beacon_hanar:0 "Enkindler's Gift"

  ### Site ###
  btr_precursor_ice_canals:0 "Canals....of ice?"
  btr_precursor_ice_canals_site_desc:0 "The planet of Judor IV has been known amongst trivia circles for its strange glacial formations but has historically been ignored by genuine scientists. That ends today as a team of researchers attempting to study the formations discovered that they are almost certainly artificial."

  ### Stage 0 ###
  btr_precursor_salarian.1.name:0 "Canals…… of Ice?"
  btr_precursor_salarian.1.desc:0 "While there has been a general knowledge about the rare features on the planet of Judor IV for some time now, only upon a closer examination of these features did we learn to be more curious. The famous glacial rivers are actually artificial canals which appear to have been abandoned around the same time as the Protheans disappeared. Our working theory is that the Protheans constructed the canals for reasons we cannot currently understand. Something that has attracted so many of our scientists is how pristine the canals appear to be. While the ice has overflown the walls of the canals, underneath the ice the canals seem to perfect preserved despite not having been maintained in millennia."
  btr_precursor_salarian.1.a:0 "We could have many uses for maintenance free infrastructure."
  ### Stage 1 ###
  btr_precursor_salarian.2:0 "A Frozen Past"
  btr_precursor_salarian.2.desc:0 "Excavating a site buried under tens of meters of solid ice is not easy, especially when we must remain careful not to damage the canals underneath. Yet we were successful, with a combination or hard work and specially designed equipment we have cleared away enough of the ice to stand on top of the canal walls. While this hasn’t told us much about the materials that were used, or the techniques, or the technology, it is an important milestone."
  btr_precursor_salarian.2.a:0 "We must empty those canals!"
  ### Stage 2 ###
  btr_precursor_salarian.3:0 "A new causeway"
  btr_precursor_salarian.3.desc:0 "We have been able to reach the bottom of a section of one of the canals. Our science teams are hard at work determining what materials the canal is made out of and looking for clues about how it was constructed. At this time we don’t have conclusive results but we have begun tunneling through the ice in attempts to learn more about these ancient structures."
  btr_precursor_salarian.3.a:0 "“Find everything there is to know."
  ### Stage 3 ###
  btr_precursor_salarian.4:0 "An everlasting Metal"
  btr_precursor_salarian.4.desc:0 "There has been an incredible breakthrough in our study of the metallic walls and floor of this canal. It is a unique alloy that is primarily made of metals that we already know of and understand, how they are combined into this alloy that has properties none of them alone possess is beyond our understanding. Despite our current ignorance of how these metals were combined, knowing the ingredients gives us the ability to experiment. We have also shifted our tunnelling operations in an effort to find any surplus resources or possibly onsite forges."
  btr_precursor_salarian.4.a:0 "The more we can learn from this site the better."
  ### Stage 4 ###
  btr_precursor_salarian.5:0 "A Breakthrough"
  btr_precursor_salarian.5.desc:0 "Our excavation teams have discovered a room hidden behind a panel built into the wall of the canal. It appears that this room was used as housing for the workers while this was being constructed and then as storage and logistics once the construction moved further away. We have not fully explored this large chamber but we have recovered a number of artifacts including some samples of the greenish-blue metal that makes up the canal. We are going to be focusing on exploring this chamber for the foreseeable future."
  btr_precursor_salarian.5.a:0 "This could jump our technology 200 years into the future."
  ### Stage 5 ###
  btr_precursor_salarian.6:0 "200 years already"
  btr_precursor_salarian.6.desc:0 "In the back of the chamber we found it. A massive machine, our current hypothesis is a supercomputer of a design far beyond anything we have even theorized. It appears that this back area of the chamber had been converted into a form of command center for the build site after the barracks was moved closer to where the work was being done. Next to nothing of use is left, the terminals are all broken and many of the other devices are so arcane we cannot begin to understand if they are operational or not. But the computer, it is working, it glows with a faint green light and quietly hums, we aren’t sure why it was left behind when they sealed this area off but perhaps our future study can shed light on that topic as well."
  btr_precursor_salarian.6.a:0 "A discovery beyond our most optimistic estimates."
### Reward Event ###
# mars_triangle_reward_title:0 "The Great Reward"
# mars_triangle_reward_desc:0 "The secrets of the Prothean facility have been uncovered. Among them: advanced ship designs, vast knowledge of reactor technology, and functional shuttles ready for study."
# mars_triangle_reward_option:0 "This will advance our civilization by centuries!"

  r_btr_prothean_beacon_salarian:0 "Prothean Beacon"
  r_btr_prothean_beacon_salarian_desc:0 "This beacon was discovered, and quickly locked away by, the Salarians who used it to refine their tradecraft as well as the knowledge of their researchers allowing them to better create their own technology rather than becoming solely reliant on these Prothean proscriptions."
  prothean_beacon_salarian:0 "The Silent Beacon"


  ### Site ###
  btr_precursor_preexisting_cover:0 "Preexisting Cover"
  btr_precursor_preexisting_cover_site_desc:0 "We regularly conduct training exercises on various uninhabited worlds, partly because we can conduct maneuvers unimpeded and partly because a true national war will mostly likely not be restricted to densely populated cities. However, on one of our recent operations a group of soldiers discovered a well-constructed ruin to take cover in. After the exercise was concluded it was discovered that the engineering corps did not build any mock structures and that anything they found was already on the planet."

  ### Stage 0 ###
  btr_precursor_turian.1.name:0 "The Investigation Begins"
  btr_precursor_turian.1.desc:0 "The unit that originally found the ruins has led a large group to the decrepit remains of some form of outpost. They have been tasked with guarding the area while our investigation is underway. So far, we can tell that this facility was Prothean and quite large originally but very little remains above ground. We have begun excavating a large area around the ruins in an effort to discover more of the facility."
  btr_precursor_turian.1.a:0 "The Primarch is expecting results."
  ### Stage 1 ###
  btr_precursor_turian.2:0 "The Entrance"
  btr_precursor_turian.2.desc:0 "Apparently the buildings that the soldiers had taken shelter in were in fact the upper floors of several large towers that were part of the facility. We estimate that these towers stood about 15 meters tall with all except the upper floor being buried. Once we cleared away the dirt and debris in the towers, we were able to access much of its internal stairwells and hallways which are remarkably well preserved. Unfortunately, none of our exploration of the towers has revealed any artifacts or pieces of technology yet."
  btr_precursor_turian.2.a:0 "Make sure that “yet” does not last long."
  ### Stage 2 ###
  btr_precursor_turian.3:0 "Into the base"
  btr_precursor_turian.3.desc:0 "The towers have been cleared of some smaller items, but we have not yet found any of the extremely advanced technologies that were no doubt housed here. We have also begun expanding out into the rest of the base with two smaller buildings being discovered. From what has been found we know that this outpost was a research facility meant to maintain its operations classified and mitigate risk to important areas should their experiments go wrong. What they were researching or what they discovered remains elusive."
  btr_precursor_turian.3.a:0 "“There must be some evidence left of their research."
  ### Stage 3 ###
  btr_precursor_turian.4:0 "Excavation Complete"
  btr_precursor_turian.4.desc:0 "The excavation phase of the operation is complete with four towers and six smaller buildings being discovered as well as what appears to be a series of artificial caves or tunnels accessible through some of the smaller buildings. We have uncovered many of the buildings but not fully explored them and the tunnels remain completely unknown to us. The towers are completely catalogued but unfortunately there is painfully little information left. All we have learned is that this facility was set up in a hurry and was focused on weapons research, but it was always understaffed and struggling for equipment. Shortly after its creation it was abandoned without ever becoming fully operational."
  btr_precursor_turian.4.a:0 "This does not bode well for our expedition."
  ### Stage 4 ###
  btr_precursor_turian.5:0 "The Discovery"
  btr_precursor_turian.5.desc:0 "The smaller buildings have been fully surveyed and revealed little we did not already know. They appeared to be mostly barracks for the workers and a command building that was stripped of everything but the walls when the base was abandoned. We then began exploring the tunnels and it seems this was where the main experimentation was going on. There were examples of multiple types of weapon impacts on the walls and also a strange computer like device. It appears to be functional although we aren’t sure how to use it and it is very large, larger than any terminal we have seen in other Prothean ruins. We believe that this size is why it was left in the tunnels because of the urgency with which they abandoned the base meant they did not have the time to demolish one of the buildings and extricate this device."
  btr_precursor_turian.5.a:0 "Thankfully, we are not under such time pressures."
  ### Stage 5 ###
