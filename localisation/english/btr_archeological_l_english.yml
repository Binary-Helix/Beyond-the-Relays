r_btr_ancient_generator:0 "Ancient Generator"
r_btr_ancient_generator_desc:0 "A generator from a long lost civilization that somehow continues producing an impressive amount of energy for its size."
ancient_generator:0 "Ancient Generator Surplus"

  ### Site ###
  btr_precursor_unnatural_mountains:0 "Unnatural Mountains"
  btr_precursor_unnatural_mountains_site_desc:0 "We have long considered Madga to be a young primordial planet but recent revelations of its mountains being hollow in charactically artificial ways have called that assumption into question."

  ### Stage 0 ###
  btr_precursor_collective.7.name:0 "Unnatural Mountains"
  btr_precursor_collective.7.desc:0 "Upon a closer examination of the planet Madga the various mountains on its primordial molten surface appear to be hollow. Additionally, they are not hollow in the way that is typical of cave systems but instead has characteristics of buildings that have somehow become encased in rock. It is difficult to get more information considering the extreme conditions on the planet's surface but our scientists have begun preparing a series of plans to look  deeper into this."
  btr_precursor_collective.7.a:0 "A truly unique find."
  ### Stage 1 ###
  btr_precursor_collective.8:0 "Expedition into the Extreme"
  btr_precursor_collective.8.desc:0 "After a series of failed attempts to send probes onto the planets surface we have finally managed to get a working probe into position on Magda. It is equipped with cutting edge sensors and a small drill to possibly reach one of the spaces within the volcanic mountains. If this succeeds it could greatly enhance our understanding on what exactly happened on this planet."
  btr_precursor_collective.8.a:0 "Our understanding of the galaxy around us may soon become much greater."
  ### Stage 2 ###
  btr_precursor_collective.9:0 "Hard to Reach"
  btr_precursor_collective.9.desc:0 "The probes scans have given us a far better view into the theoretical rooms of these mountains which has only solidified our scientists beliefs that these are in fact, the remains of buildings that have melted slightly. In addition to the simulations that we ran upon originally discovering this oddity the scans showed what we understand to be the remains of doors and windows after their frames and ceilings gradually caved in. What we did not anticipate was that the drill the probe was equipped with would be incapable of reaching these rooms. It appears that the buildings are made out of a metal alloy far stronger than what we can produce and it has become encased in a relatively thin layer of rock as the volcanic activity has ebbed and flowed over the years. It will take some time to overcome this new obstacle."
  btr_precursor_collective.9.a:0 "Ensure that this obstacle is overcome."
  ### Stage 3 ###
  btr_precursor_collective.10:0 "The Jagged Tomb"
  btr_precursor_collective.10.desc:0 "A second probe with a more robust drill has been able to breach the wall of the structure and enter into one of the rooms. While whatever was in the room had burned away long ago there was remnants of metal items such as chair frames, what we believe was some form of electronic device, and mountings on the drooping walls. There was also something we hadn’t anticipated, a shadow of an alien etched onto one of the walls. The wall had melted so badly that its difficult to make out what the alien would have looked like in life, enough is visible to make obvious that this building was not melted by the volcanic activity but some cataclysm long before."
  btr_precursor_collective.10.a:0 "What could have done this?"
  ### Stage 4 ###
  btr_precursor_collective.11:0 "A Hidden Pas"
  btr_precursor_collective.11.desc:0 "We have deployed a small fleet of the probes which have infiltrated many of the building husks and through them we have learned much about this ancient culture. Firstly, it is clear that whatever happened here happened quickly and somewhat unexpectedly. Many of the shadows we have encountered depict signs of typical life, people at ease sitting in their homes before disappearing into oblivion. Secondly, this was a very advanced society, the alloys used in their creations gave us an idea about this but we have found space ports and other infrastructure to hint at them being a spacefaring people. Lastly, the planet is the molten world that we see today because of what happened here all those millenia ago. The planet was so thoroughly scourged that it was effectively terraformed out of habitability. Some small elements of their society were able to survive and from them we have learned a fraction of their knowledge. Specifically they were heavily focused on genetic modification and while much of their techniques would not work with our biology, we may be able to modify them to be more productive."
  btr_precursor_collective.11.a:0 "Their legacy lives on through us now."
