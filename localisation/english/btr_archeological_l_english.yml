### Reward Event ###
# mars_triangle_reward_title:0 "The Great Reward"
# mars_triangle_reward_desc:0 "The secrets of the Prothean facility have been uncovered. Among them: advanced ship designs, vast knowledge of reactor technology, and functional shuttles ready for study."
# mars_triangle_reward_option:0 "This will advance our civilization by centuries!"




  ### Site ###
  btr_precursor_artificial_jewel:0 "Artificial Jewel"
  btr_precursor_artificial_jewel_site_desc:0 "We have been using diamonds for millenia both for cultural and industrial purposes but we have never faced a shortage. Of the planets we inhabit nearly every one has diamond reserves large enough to handle any local needs. Yet, according to our best researchers a massive planetary diamond we discovered early in our space travels was created by some ancient regime. We will never know why until we take a closer look."

  ### Stage 0 ###
  btr_precursor_collective.1.name:0 "An Artificial Jewel"
  btr_precursor_collective.1.desc:0 "Long ago our people discovered a strange world in our early travels into the stars. While Diamonds are not rare on the worlds we inhabit, having an entire planet composed of diamond is something that attracted the attention of our scientists. A small team has been investigating this world for some time and has recently made a startling discovery. The world could not have formed naturally, while whatever did this to the planet destroyed any evidence of its past, our simulations have proven that no natural process could have created it. Why some past civilization decided to do this to the world is unclear to us, diamonds are not rare enough to require turning a whole planet into diamond to acquire large quantities. Perhaps there is a use for Diamond that we are not aware of which warranted such a massive investment and sacrifice. Whatever the answer, the only way to find out is to study the planet closer and search for evidence of whatever did alter the planet so radically."
  btr_precursor_collective.1.a:0 "There must be a reason for this madness."
  ### Stage 1 ###
  btr_precursor_collective.2:0 "Signs of Destruction"
  btr_precursor_collective.2.desc:0 "The team that we have dispatched to Fumimi has issued their preliminary report on the planet. The world is well disguised, with impact craters being so large it is difficult to believe that they are artificial. Currently we are unsure what could have done this to a planet. Simply throwing various asteroids at the world would not have achieved this effect. We are also still unclear what purpose turning this world into a gem served. However, the team has set about using various forms of scans to try and map out the planet beneath its diamond surface. Perhaps a deep cave network survived the process and can give us insight into what the world was, perhaps it can even explain what apocalyptic technology allowed this civilization to desecrate a world so thoroughly. For now though, the answers lay beneath the semi-reflective surface of the slain world."
  btr_precursor_collective.2.a:0 "Nothing could operate on such a large scale without leaving trace evidence."
  ### Stage 2 ###
  btr_precursor_collective.3:0 "Hidden Caverns"
  btr_precursor_collective.3.desc:0 "We have completed the scans of the planet and they have revealed something intriguing. There are three large voids in the planet, extremely deep within its crust, and almost perfectly rectangular. Even those of us less scientifically inclined could tell from the images of the scans that these rectangular voids were in fact artificially created. It is possible that whatever civilization did this to the planet was subterranean like us and this was where they lived. While the chambers are large, larger than the majority of our single chambers, they are disconnected and far apart, unlike our extremely interconnected chambers. There is no clear way to reach these chambers either, which is puzzling for a subterranean civilization. The team is preparing specialized equipment to begin tunneling to one of the chambers but it will require some time to develop the necessary equipment."
  btr_precursor_collective.3.a:0 "Make it so."
  ### Stage 3 ###
  btr_precursor_collective.4:0 "Ghost in the Reflection"
  btr_precursor_collective.4.desc:0 "After a significant amount of time and effort from our team the caverns have been reached. Our peoples experience with tunneling proved crucial in getting this project completed in a reasonable amount of time despite the difficulties with mining through solid diamond. As we had predicted, the chambers are in fact rooms clearly built by some alien civilization with technology that is largely unknown to us. The room has power with soft lavender lights illuminating the strange, purple-gray metal that was used to build the room and also many of the machines inside of it. There is not much space despite the fact that the room is immense, because the majority of it is taken up by a massive wall of strange, triangular boxes protruding from an otherwise smooth wall. The boxes are oriented with one pointing up and another pointing down directly next to it with a small gap before the next pair. The boxes have alien symbols that glow with the lavender that we cannot understand yet. Using the small hallway that runs along the strange wall our team has set up a new camp from which they will begin studying these boxes, the alien metals, and how this room is powered."
  btr_precursor_collective.4.a:0 "To solve one mystery is to reveal another."
  ### Stage 4 ###
  btr_precursor_collective.5:0 "Long, Long Ago"
  btr_precursor_collective.5.desc:0 "With long hours of careful study, we have come to the conclusion that the strange boxes are in fact a form of cryostasis. A technology that has until now been purely hypothetical to our people. This has presented several challenges to our researchers. Due to the largely intact nature of the chamber it is very likely that whoever is inside these chambers is still alive, waiting to be reawakened. However, since we do not know why they went into these chambers we can’t be sure that awakening them would not put them in danger. We also don’t understand how the technology works, or how it is controlled. So ripping one of the triangles out of the wall could be catastrophic. In the top left corner of the room there was a minor cave in which may have destroyed some of the pods. None of the team has been able to reach such heights as whoever constructed this room left no stairs, or ladders, or ramps and it is unclear how those in the upper pods would have been awakened without falling to their deaths. The team claims to have several possible plans that they will begin working on before their next report is due."
  btr_precursor_collective.5.a:0 "This is more complicated than we first believed, it is clear that caution is necessary."
### Stage 5 ###
 btr_precursor_collective.6:0 "Anima reditus"
 btr_precursor_collective.6.desc:0 "The team has deciphered the runes in the center of each pod. They seem to indicate some form of class or rank with the more prestigious sounding names being located closer to the ground. We also have gained access to the broken pods at the top of the wall as well. The creatures are little more than dried bones at this point, but it appears they were tall, with robust bones that indicate they may have been quite strong and bulky in life. Unfortunately our studies of the pods has revealed that they were an illusion all along. Instead of preserving the inhabitants of the pods, they froze them to death and for some time preserved their corpses but after the millenia the already nonfunctioning pods proved incapable of even this token gesture. Once this became clear, we removed several pods and studied them further and learned that while the technology is impressive and incredibly advanced, it is not complete. It appears that they were built using incomplete designs, or designs that were unfamiliar to them. The various forms of technology are so disparate that the team believes that the owners of these pods stole them from another advanced race before they were completed and then failed to properly finish them. We will likely never understand why they did so, or why they failed to test the pods before using them so extensively."
 btr_precursor_collective.6.a:0 "They paved the way for our own advancement."
