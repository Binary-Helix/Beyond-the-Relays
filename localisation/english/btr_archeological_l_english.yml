 l_english:

  ### Site ###
  mars_triangle_site_name:0 "The Triangle of Mars"
  mars_triangle_site_desc:0 "A mysterious region of Mars that has long been plagued by unexplained technical failures. Now, with colonization underway, rumors of the 'Martian Triangle' have intensified. It may be more than superstition."

  ### Stage 0 ###
  btr_precursor_all.1:0 "The Triangle of Mars"
  btr_precursor_all.1_desc:0 "While our colonization of Mars is still in its early phases there are already superstitions developing not only among the colonists, but among those that remain on Earth as well. One superstition that is unnervingly realistic has been dubbed “The Martian Triangle”. We have a significant amount of data showing that a specific area of Mars has had a disproportionate amount of satellite technical difficulties. We aren’t sure why, but it seems like there is something going on in that area which is effecting our equipment."
  btr_precursor_all.1_a:0 "We should look into this."
  ### Stage 1 ###
  btr_precursor_all.2:0 "The Deseado Catacombs"
  btr_precursor_all.2_desc:0 "It appears that our conclusion regarding odd activity in the “Martian Triangle” was correct, although no one seems to remember the term ever existed. We had been going to great lengths to keep our study of the region hidden in plain sight but ultimately it was a private excavation firm that found the true reason for the area’s strange equipment issues. It is too early to tell exactly what we’ve stumbled into, but it is clearly an artificially created structure that was buried. This has caused a lot of commotion in the public, but we truly know very little about this location."
  btr_precursor_all.2_a:0 "Then we must learn more."
  ### Stage 2 ###
  btr_precursor_all.3:0 "A Clearing"
  btr_precursor_all.3_desc:0 "We have managed to clear more of the facility on Mars and have discovered that is somehow still has power. It is incredibly old and has sustained a lot of damage but the areas that haven’t collapsed seem to be essentially left as they were when the facility was abandoned. We do believe it was abandoned because we have not found any signs of remains through the areas we have cleared. While we have uncovered some working terminals, we have no idea how they work or the language they are using."
  btr_precursor_all.3_a:0 "We must learn this ancient tongue to understand the future."
  ### Stage 3 ###
  btr_precursor_all.4:0 "A Conversation with Ghosts"
  btr_precursor_all.4_desc:0 "The clearing of the facility has been progressing slowly but after an unprecedented effort of humanities scientific community we have decrypted the language of the terminals in the facility. Some of the terminals are locked behind passcodes and some require repairs but a large amount of them are accessible to us. At the moment we don’t much information on the inhabitants, but we do know the facilities purpose. To watch and study us in our earliest stages of evolution and much of the information we have uncovered has actually shed more light on our own past than the facilities."
  btr_precursor_all.4_a:0 "An ironic twist for sure."
  ### Stage 4 ###
  btr_precursor_all.5:0 "A Name"
  btr_precursor_all.5_desc:0 "We are beginning to learn more about the former inhabitants of this facility as we finish clearing away the debris and repair their terminals. The scientists have dubbed them “Protheans”, and their civilization spanned a large portion of the galaxy. They were incredibly advanced and constructed a station that allowed their ships to travel to distant stars in orbit of Pluto. We aren’t sure why they were here as they seem repeatedly unimpressed with our ancestors. The terminals also fail to mention why the facility was abandoned or what happened to the Protheans themselves."
  btr_precursor_all.5_a:0 "There may be mysteries in the last areas of the facility."
  ### Stage 5 ###
  btr_precursor_all.6:0 "The Great Reward"
  btr_precursor_all.6_desc:0 "We have finished clearing the rest of the facility and it has revealed finds that can hardly be believed. There is a small hangar with function ships, likely small personnel shuttles, that we have already sent back to earth for study. From what we understand of their technology their ships were not capable of FTL travel but relied on the massive constructs to send them across space. The facilities power source has also been uncovered; it is some form of arcane reactor that we don’t understand. It functions off of a principle the scientists refer to as the “Mass Effect” and it generates large amounts of energy for negligible amounts of space. This particular one is clearly in disrepair and struggling to continue functioning, but it can still advance our technology by centuries!"
  btr_precursor_all.6_a:0 "We will put our sun behind us sooner than we thought!"
  ### Reward Event ###
  mars_triangle_reward_title:0 "The Great Reward"
  mars_triangle_reward_desc:0 "The secrets of the Prothean facility have been uncovered. Among them: advanced ship designs, vast knowledge of reactor technology, and functional shuttles ready for study."
  mars_triangle_reward_option:0 "This will advance our civilization by centuries!"