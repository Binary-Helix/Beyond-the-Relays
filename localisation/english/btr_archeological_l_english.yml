  ### Site ###
  btr_precursor_new_report:0 "A New Report"
  btr_precursor_new_report_site_desc:0 "Our scientists have been studying the planets within our space for many years. We never anticipated that one of their studies would uncover an unexplained anomaly, but now that it has we are compelled to investigate further."

  ### Stage 0 ###
  btr_precursor_elcor.1.name:0 "A New Report"
  btr_precursor_elcor.1.desc:0 "The planet of Lenuamund has been part of Elcor space ever since the Elcor achieved space flight. But due to its hot and uninhabitable nature it has been ignored with only a small collection of probes left in orbit to monitor it. No one had anticipated these probes to ever report anything of note outside of some academic study. Today we were proven incorrect in our assumptions; two of the probes reported the same anomalous reading from the surface of the planet. According to our study of the readings the probes indicate that something is emitting an intermittent signal from the planet surface but there is too much interference to determine what it is. Our scientists are able to confirm that the signal must be extremely powerful to pierce the interference and there is a high likelihood of it being artificial due how the signal has been behaving."
  btr_precursor_elcor.1.a:0 "We must look into such a strange situation."
  ### Stage 1 ###
  btr_precursor_elcor.2:0 "A Robotic Answer"
  btr_precursor_elcor.2.desc:0 "In order to reach the anomaly on the surface of Lenuamund we must use specially modified robotic workers because no organic being could survive near its surface. We have worked with many robotics manufacturers to begin construction of more durable and heat resistant models that have a chance of lasting on the surface. We are estimating that these models will be ready for deployment within the year."
  btr_precursor_elcor.2.a:0 "Soon this galactic mystery will be solved."
  ### Stage 2 ###
  btr_precursor_elcor.3:0 "The First Expedition"
  btr_precursor_elcor.3.desc:0 "The first deployment of our specialized robots has been completed. They were able to reach the surface of the planet at their drop site near the anomaly. Unfortunately, they were unable to endure the temperatures for long and one by one were silenced. The data that was able to be received did not contain anything about the beacon except for what appears to be a subtle hum that could be heard as they got closer to its location. We are designing a second model to attempt a second expedition."
  btr_precursor_elcor.3.a:0 "May their sacrifice not be in vain."
  ### Stage 3 ###
  btr_precursor_elcor.4:0 "The Second Expedition"
  btr_precursor_elcor.4.desc:0 "We have concluded our second expedition to the anomaly on Lenuamund and it has been much more successful than our original attempt. The second generation of robot explorers passed their fallen predecessors and discovered the source of the signal. It is a large machine that appears to be some form of computer. We do not know who placed it on the planet or when and we cannot answer the questions without retrieving it. Unfortunately, we did not plan on retrieving anything from the surface so we will need a third expedition to take the strange item off the surface."
  btr_precursor_elcor.4.a:0 "The galactic community should study this device."
  ### Stage 4 ###
  btr_precursor_elcor.5:0 "The Final Expedition"
  btr_precursor_elcor.5.desc:0 "Our third expedition to recover the device on Lenuamund has succeeded. With a specially designed shuttle and a new compliment of the second generation robots we were able to recover the device along with the damaged group from the second expedition and the remains of the first expedition. We have brought the device to a research institute where all citadel species can study the device and help unlock its secrets. The robots have been repaired and returned to service with the first expedition being laid to rest in a museum."
  btr_precursor_elcor.5.a:0 "What will we uncover from this computer?"
  ### Stage 5 ###
  btr_precursor_elcor.6:0 "Completion"
  btr_precursor_elcor.6.desc:0 "The research into the device has not gone as we had hoped. The science teams were able to confirm that Lenuamund was not always as it is now and that at some point it was a world similar to Earth or Thessia but It lost its atmosphere. Outside of that we have not been able to learn much about the device and none of our attempts to wake it from its standby mode have been successful. We believe that it is sending out a signal searching for a satellite which would then activate the device, but all of its satellites were lost when the atmosphere dissipated. Why it has only recently begun sending out the signal in an attempt to wake itself up is unknown and unfortunately it most likely never will be discovered."
  btr_precursor_elcor.6.a:0 "A sad conclusion to a strange mystery."
