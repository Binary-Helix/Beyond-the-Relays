l_english:

  ### Site ###
  btr_precursor_mars_triangle:0 "The Triangle of Mars"
  btr_precursor_mars_triangle_site_desc:0 "A mysterious region of Mars that has long been plagued by unexplained technical failures. Now, with colonization underway, rumors of the 'Martian Triangle' have intensified. It may be more than superstition."

  ### Stage 0 ###
  btr_precursor_all.1.name:0 "The Triangle of Mars"
  btr_precursor_all.1.desc:0 "While our colonization of Mars is still in its early phases there are already superstitions developing not only among the colonists, but among those that remain on Earth as well. One superstition that is unnervingly realistic has been dubbed “The Martian Triangle”. We have a significant amount of data showing that a specific area of Mars has had a disproportionate amount of satellite technical difficulties. We aren’t sure why, but it seems like there is something going on in that area which is effecting our equipment."
  btr_precursor_all.1.a:0 "We should look into this."
  ### Stage 1 ###
  btr_precursor_all.2:0 "The Deseado Catacombs"
  btr_precursor_all.2.desc:0 "It appears that our conclusion regarding odd activity in the “Martian Triangle” was correct, although no one seems to remember the term ever existed. We had been going to great lengths to keep our study of the region hidden in plain sight but ultimately it was a private excavation firm that found the true reason for the area’s strange equipment issues. It is too early to tell exactly what we’ve stumbled into, but it is clearly an artificially created structure that was buried. This has caused a lot of commotion in the public, but we truly know very little about this location."
  btr_precursor_all.2.a:0 "Then we must learn more."
  ### Stage 2 ###
  btr_precursor_all.3:0 "A Clearing"
  btr_precursor_all.3.desc:0 "We have managed to clear more of the facility on Mars and have discovered that is somehow still has power. It is incredibly old and has sustained a lot of damage but the areas that haven’t collapsed seem to be essentially left as they were when the facility was abandoned. We do believe it was abandoned because we have not found any signs of remains through the areas we have cleared. While we have uncovered some working terminals, we have no idea how they work or the language they are using."
  btr_precursor_all.3.a:0 "We must learn this ancient tongue to understand the future."
  ### Stage 3 ###
  btr_precursor_all.4:0 "A Conversation with Ghosts"
  btr_precursor_all.4.desc:0 "The clearing of the facility has been progressing slowly but after an unprecedented effort of humanities scientific community we have decrypted the language of the terminals in the facility. Some of the terminals are locked behind passcodes and some require repairs but a large amount of them are accessible to us. At the moment we don’t much information on the inhabitants, but we do know the facilities purpose. To watch and study us in our earliest stages of evolution and much of the information we have uncovered has actually shed more light on our own past than the facilities."
  btr_precursor_all.4.a:0 "An ironic twist for sure."
  ### Stage 4 ###
  btr_precursor_all.5:0 "A Name"
  btr_precursor_all.5.desc:0 "We are beginning to learn more about the former inhabitants of this facility as we finish clearing away the debris and repair their terminals. The scientists have dubbed them “Protheans”, and their civilization spanned a large portion of the galaxy. They were incredibly advanced and constructed a station that allowed their ships to travel to distant stars in orbit of Pluto. We aren’t sure why they were here as they seem repeatedly unimpressed with our ancestors. The terminals also fail to mention why the facility was abandoned or what happened to the Protheans themselves."
  btr_precursor_all.5.a:0 "There may be mysteries in the last areas of the facility."
  ### Stage 5 ###
  btr_precursor_all.6:0 "The Great Reward"
  btr_precursor_all.6.desc:0 "We have finished clearing the rest of the facility and it has revealed finds that can hardly be believed. There is a small hangar with function ships, likely small personnel shuttles, that we have already sent back to earth for study. From what we understand of their technology their ships were not capable of FTL travel but relied on the massive constructs to send them across space. The facilities power source has also been uncovered; it is some form of arcane reactor that we don’t understand. It functions off of a principle the scientists refer to as the “Mass Effect” and it generates large amounts of energy for negligible amounts of space. This particular one is clearly in disrepair and struggling to continue functioning, but it can still advance our technology by centuries!"
  btr_precursor_all.6.a:0 "We will put our sun behind us sooner than we thought!"
  ### Reward Event ###
 # mars_triangle_reward_title:0 "The Great Reward"
 # mars_triangle_reward_desc:0 "The secrets of the Prothean facility have been uncovered. Among them: advanced ship designs, vast knowledge of reactor technology, and functional shuttles ready for study."
 # mars_triangle_reward_option:0 "This will advance our civilization by centuries!"

  ### Site ###
  btr_precursor_original_pillar_name:0 "The Original Pillar"
  btr_precursor_original_pillar_desc:0 "Few remember the ancient folklore of our stone age ancestors of strange beings arriving and leaving a large pillar behind. Painstaking effort has ensured it so that those of us who remember can reap twice the benefit."

  ### Stage 0 ###
  btr_precursor_asari.1:0 "The Original Pillar"
  btr_precursor_asari.1.desc:0 "For as long as the Asari have existed on Thessia there has been a giant ancient artifact looming over them. The primitive Asari that lived in the area told tales of strange being leaving the artifact behind after staying in the region and teaching them various ways to improve their lives. These tales propagated across the planet taking on a life of their own as civilization began to develop on the world."
  btr_precursor_asari.1.a:0 "Whoever speaks with the artifact owns Thessia."
  ### Stage 1 ###
  btr_precursor_asari.2:0 "The Interface of a God"
  btr_precursor_asari.2.desc:0 "The primitive states that began to form as the Asari moved into its ancient era knew of the Pillar and often strove to control it. It rapidly took on a religious function as the ancient stories morphed into doctrines which coalesced around “The Goddess”. The Pillar was understood as a gift from the Goddess, a gift that required enough faith and understanding to fully appreciate."
  btr_precursor_asari.2.a:0 "Empires rose and fell trying to operate our gift."
  ### Stage 2 ###
  btr_precursor_asari.3:0 "The Secret takes hold"
  btr_precursor_asari.3.desc:0 "As time went on the religion solidified as the largest faith on Thessia and the time each nation possessed the gift got longer. Eventually it was realized that there would only ever be conflict over controlling the gift. The now highly powerful religious leadership decided it was best to hide the gift away and begin teaching the masses that it was not a physical gift as many believed. They embarked on a project of erecting a massive statue of the Goddess with the ancient pillar as its core."
  btr_precursor_asari.3.a:0 "We cannot use the Goddesses gift if we are all dead."
  ### Stage 3 ###
  btr_precursor_asari.4:0 "Research and Divination"
  btr_precursor_asari.4.desc:0 "After hundreds of years the Asari forgot about their god’s gift, believing it to have been a myth or a misinterpreted ancient text. Yet the highest echelons of their religious leaders knew different and were using small groups of trusted subordinates to do quietly do research on the pillar. While the nations that controlled the gift had done rudimentary research into it they had only controlled it for decades or a century at most. These religious leaders have held it in secret for nearly a generation and have been able to secretly publish several technological breakthroughs thanks to the pillar."
  btr_precursor_asari.4.a:0 "The future is sooner than we may have thought."
  ### Stage 4 ###
  btr_precursor_asari.5:0 "Reaching the Heavens"
  btr_precursor_asari.5.desc:0 "After generations of study the Asari were able to venture out into space on their own for the first time. The research into the Gift has shown that it is some form of computer but how to activate it and what it contains is still largely a mystery. However, its very design and the materials it is made out of have given rise to numerous inventions and its power supply has been extremely inspiring. As the Asari explore other areas of space, they have encountered technologies left by some other civilization that seem strangely compatible with designs derived from the Gift."
  btr_precursor_asari.5.a:0 "Could we be on the path to the Goddess?"
  ### Stage 5 ###
  btr_precursor_asari.6:0 "Reaching the Heavens"
  btr_precursor_asari.6.desc:0 "As exploration of the stars has continued the public has become aware that an ancient, advanced civilization left many artifacts scattered across the galaxy. None of them suspect that we possess one such artifact and have been using it for millennia to make some of our greatest innovations. Unfortunately, it is becoming increasingly clear that the ancient civilization that left this relic here has long since died out. We will most likely never know why they left it on our home world or what relationship they had with our primitive ancestors but they’re advanced technology will live on through us."
  btr_precursor_asari.6.a:0 "We represent a legacy beyond our wildest imaginations."
