  r_btr_prothean_beacon_turian:0 "Prothean Beacon"
  r_btr_prothean_beacon_turian_desc:0 "The beacon discovered by the Turian's it was predominantly used to shape Turian military organization, doctrine, and tactics which largely served to reinforce their existing cultural values and traditions."
  prothean_beacon_turian:0 "The Hierarchy's Codex"


  ### Site ###
  btr_precursor_forgotten_sibling:0 "The Forgotten Sibling"
  btr_precursor_forgotten_Sibling_site_desc:0 "Our nature drives us to seek out new opportunities and ways to make profit. The Satu Arrd system in our space is known for its immense Eezo mines which have been a substantial boon for our economy. However, some have argued that the focus on the Eezo mines, which exist primarily on one planet, has blinded us to the potential of the rest of the system. They are requesting permission to conduct a more in depth survey of the other planets which have been ignored so far."

  ### Stage 0 ###
  btr_precursor_volus.1.name:0 "Rilar's Cache"
  btr_precursor_volus.1.desc:0 "The survey is off to an amazing start, the first planet that has been given a closer inspection turned up some form of anomaly. Something is buried under the surface of the planet, what's confusing is that we would expect a resource deposit to be further from the surface. It is also relatively small which probably lead earlier surveys to just ignore it. However, our readings indicate that this is more than a mineral deposit as we have reason to believe there are voids within this anomalous zone."
  btr_precursor_volus.1.a:0 "I hear profits."
  ### Stage 1 ###
  btr_precursor_volus.2:0 "Excavation Commences"
  btr_precursor_volus.2.desc:0 "Reports are coming in detailing the beginning of an excavation on Rilar in an effort to uncover whatever mystery was picked up during the survey of the planet. Using robotic miners and automated systems it is progressing rapidly but has not found anything out of the ordinary. The story of Rilar's mystery has become something of a phenomenon among citadel species with theories about what is buried under the surface of Rilar drowning out most other content on various forums and sites."
  btr_precursor_volus.2.a:0 "Make sure that “yet” does not last long."
  ### Stage 2 ###
  btr_precursor_volus.3:0 "A Glimpse at the Unknown"
  btr_precursor_volus.3.desc:0 "It has been announced that the excavation on Rilar will be temporarily halted after some of the robotic miners managed to uncover something unknown. The automated systems will be retired, and a corps of archeologists and organic works will be brought in to continue the excavation in a gentler, more delicate fashion. So far all we know is that the item uncovered by the robots is part of a larger item which is still buried. From the size of it, the team believes it is a part of a buried structure, but its orientation, design, or purpose cannot be determined until more of the soil can be removed."
  btr_precursor_volus.3.a:0 "Why would there be a structure on this desolate world?"
  ### Stage 3 ###
  btr_precursor_volus.4:0 "The Surface Once More"
  btr_precursor_volus.4.desc:0 "Now that the organic corps of workers has arrived at the excavation site from volunteers across citadel space there has been more progress in identifying the objects that the automated systems uncovered. The renewed excavation has focused on following the item and clearing away the soil around it. We now know that it is a building and we have been able to enter it to discover primarily storage of various mechanical parts, presumably for terrestrial and atmospheric vehicles that would have been based nearby. Because of this the team has begun working on finding other buildings that may be part of some form of outpost or settlement."
  btr_precursor_volus.4.a:0 "We'll have to see what secrets these ancient parts can reveal to us."
  ### Stage 4 ###
  btr_precursor_volus.5:0 "A Tomb and Time capsule"
  btr_precursor_volus.5.desc:0 "As more of Rilar's mystery has been uncovered we have learned far more than we had ever wanted to know about the strange pit below the planet's surface. A total of ten buildings were uncovered and searched, the majority of them being either barracks or some form of vehicle bays. Unfortunately, these buildings tended to have the remains of dead aliens, we cannot identify the species, but we believe it to be Prothean. It appears that this outpost was a maintenance and crew recovery station for mining activities in the system but one day their supply ships stopped arriving and everyone at the outpost starved shortly thereafter. There was a command and control building which housed much of the entries that shed light on the events that transpired here. Currently three separate movies are in production depicting the plight of the staff here. What isn't known to the public is the recovery of a large device that was at the center of the command and control center, it is clearly mechanical and functional, but its operation is a mystery to us, and its purpose remains unknown."
  btr_precursor_volus.5.a:0 "Take the device and anything else that may have technological value and rebury the site."
  btr_precursor_volus_5.b:0 "Remove the device and begin cleaning the location, the fans of those movies aren't going to want actual dead aliens."
 ### Stage 5 ###
