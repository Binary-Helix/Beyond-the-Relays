 ### Council Resolutions ###
 resolution_category_council_petitions: "Citadel Council Petitions"
 council_politics: "Council Politics"
 mod_resolution_category_council_politics_vote_strength_mult_desc: "REPLACE_ME"
 mod_resolution_category_council_politics_vote_strength_mult: "REPLACE_ME"
 resolution_petition_citadel_embassy: "Petition for Citadel Embassy"
 resolution_petition_citadel_embassy_desc: "A presence on the Citadel is more than a diplomatic convenience, it is a symbol of legitimacy in the eyes of the galactic community. Any empire seeking to establish a permanent embassy on the Presidium must petition the Council for the privilege. Space on the station is finite, and the Council guards access carefully. An embassy, once granted, opens doors that raw military or economic power alone cannot." # TODO: AI PLACEHOLDER - Review with team for needed rewrite
 resolution_petition_spectre_1: "Petition for Spectre Representation"
 resolution_petition_spectre_1_desc: "The right to field a Spectre Agent is not granted lightly. Any empire seeking this distinction must formally petition the Citadel Council, demonstrating their commitment to galactic stability and earning the trust of its founding species." # TODO: AI PLACEHOLDER - Review with team for needed rewrite
 resolution_petition_citadel_council_seat: "Petition for a seat on the Citadel Council"
 resolution_petition_citadel_council_seat_desc: "The Citadel Council has guided the galaxy for millennia, its three founding species maintaining a careful balance of power that has kept the galaxy from tearing itself apart. To petition for a seat at that table is an act of profound ambition. An empire must have demonstrated not only military and economic strength, but a sustained commitment to galactic stability and the ideals the Council claims to represent. Even then, the Council's founding members are under no obligation to share what they have held for so long. A petition may be made, but the answer has always belonged to them alone." # TODO: AI PLACEHOLDER - Review with team for needed rewrite
 resolution_petition_spectre_2: "Petition for an Additional Spectre"
 resolution_petition_spectre_2_desc: "Having now proven our worth, it is time for us to gain another Spectre."
 gal_com_deprived_spectre: "Deprived Spectre REPLACE_ME"
 gal_com_lacks_council_seat: "Lack Council Seat REPLACE_ME"
 gal_com_we_have_citadel_embassy: "Citadel Embassy REPLACE_ME"
 already_have_embassy: "We already have an embassy on the Citadel."
 petition_for_spectre_requires_embassy: "We can't petition for a Council Spectre when we don't have an embassy on the Citadel."
 already_have_seat_on_council: "We already have a seat on the Citadel Council."

