 ### COUNCIL RESOLUTION EVENTS ###
 btr_council_resolutions.1.name: "Granted Citadel Embassy"
 btr_council_resolutions.1.desc: "Our petition for an embassy on the Citadel has been granted!"
 btr_council_resolutions.1.a: "Excellent."
 btr_council_resolutions.2.name: "Denied Citadel Embassy"
 btr_council_resolutions.2.desc: "Our petition for an embassy on the Citadel has been denied."
 btr_council_resolutions.2.a: "Disappointing."
 btr_council_resolutions.3.name: "Granted Council Spectre"
 btr_council_resolutions.3.desc: "Our petition to have a [root.getspeciesname] join the Spectres has been granted!"
 btr_council_resolutions.3.a: "Now the galaxy can see what [root.getspeciesclassplural] have to offer."
 btr_council_resolutions.4.name: "Denied Council Spectre"
 btr_council_resolutions.4.desc: "Our petition to have a [root.getspeciesname] join the Spectres has been denied."
 btr_council_resolutions.4.a: "When will they recognize what [root.getspeciesclassplural] have to offer?"
 btr_council_resolutions.5.name: "Granted Additional Council Spectre"
 btr_council_resolutions.5.desc: "Our petition to expand [root.getspeciesname] representation in the Spectres has been granted!"
 btr_council_resolutions.5.a: "Our standing amongst the galaxy continues to improve."
 btr_council_resolutions.6.name: "Denied Additional Council Spectre"
 btr_council_resolutions.6.desc: "Our petition to expand [root.getspeciesname] representation in the Spectres has been denied."
 btr_council_resolutions.6.a: "When will the Council stop holding us back?"
 btr_council_resolutions.7.name: "Granted Council Seat"
 btr_council_resolutions.7.desc: "We have been granted a seat on the Citadel Council! This marks the beginning of a new era for [Root.Owner.GetName]"
 btr_council_resolutions.7.a: "Now we stand as true equals amongst the other races."
 btr_council_resolutions.8.name: "Denied Council Seat"
 btr_council_resolutions.8.desc: "The Council in all of their wisdom has made it clear that we are not worthy to stand alongside them on the Council."
 btr_council_resolutions.8.a: "The Council will grow to recognize their mistake."

