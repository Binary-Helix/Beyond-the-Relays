l_english:

  ### SETUP TECHNOLOGIES ###
 tech_production_increase:0 "Industrial Revolution"
 tech_production_increase_desc:0 "You know how life is short and everything well time is shorter in Stellaris and the Realism is hard so we increased production for every empire <3"

 ### RARE RESOURCES ###

 tech_btr_beryllium_prospecting: "Beryllium Prospecting"
 tech_btr_beryllium_prospecting_desc: "Refining survey techniques lets us identify beryllium veins hidden in planetary crusts, enabling safe extraction of this valuable lightweight metal."
 tech_btr_lithium_prospecting: "Lithium Prospecting"
 tech_btr_lithium_prospecting_desc: "Advanced geochemical mapping reveals lithium concentrations in crustal deposits and salt flats, unlocking large-scale extraction for future energy and alloy applications."
 tech_btr_titanium_extraction: "Titanium Extraction"
 tech_btr_titanium_extraction_desc: "Improved smelting and refinement methods allow us to mine and process titanium, a resilient metal critical to structural materials."
 tech_btr_iridium_prospecting: "Iridium Prospecting"
 tech_btr_iridium_prospecting_desc: "Specialized geoscanners highlight iridium traces in asteroids and crustal deposits, enabling us to harvest this rare metal for catalytic and industrial use."
 tech_btr_palladium_prospecting: "Palladium Prospecting"
 tech_btr_palladium_prospecting_desc: "New refining techniques let us detect and extract palladium, a rare metal with catalytic properties vital for advanced energy systems."
 tech_btr_platinum_prospecting: "Platinum Prospecting"
 tech_btr_platinum_prospecting_desc: "Enhanced geological surveys uncover platinum deposits deep in planetary crusts, paving the way for its use in advanced alloys and biomedical technology."
 tech_btr_hydrogen_siphoning: "Hydrogen Syphoning"
 tech_btr_hydrogen_siphoning_desc: "Atmospheric skimming and isotope separation techniques allow us to harvest hydrogen directly from gas and ice giants."
 tech_btr_helium3_isotope_separation: "He-3 Isotope Separation"
 tech_btr_helium3_isotope_separation_desc: "Advanced isotope separation unlocks the ability to extract Helium-3 from giant planet atmospheres, providing a powerful future fuel source."
 tech_btr_uranium_geosurveys: "Uranium Geosurveys"
 tech_btr_uranium_geosurveys_desc: "Targeted geological surveys reveal uranium deposits within planetary crusts, enabling extraction for nuclear fission reactors."
 tech_btr_eezo_detection: "Element Zero Detection Arrays"
 tech_btr_eezo_detection_desc: "Exotic particle field mapping allows us to detect the rare deposits of Element Zero, essential for mass effect field manipulation and advanced propulsion."
 tech_btr_light_alloy_fabrication: "Light Alloy Fabrication"
 tech_btr_light_alloy_fabrication_desc: "By combining lightweight metals in specialized foundries, we can mass-produce Light Alloys, the foundation of interstellar infrastructure and warships."
 tech_btr_heavy_alloy_fabrication: "Heavy Alloy Fabrication"
 tech_btr_heavy_alloy_fabrication_desc: "Advanced catalytic and forging techniques allow us to combine rare heavy metals into resilient Heavy Alloys, vital for megastructures, armies, and advanced fortifications."
 tech_btr_antimatter_fuel_refining: "Antimatter Fuel Refining"
 tech_btr_antimatter_fuel_refining_desc: "Advances in containment and annihilation chamber design allow safe refinement of hydrogen and helium-3 into antimatter fuel, the indispensable propellant of interstellar fleets."
 tech_btr_beryllium_sensors: "Beryllium Sensor Systems"
 tech_btr_beryllium_sensors_desc: "Advances in detector materials allow us to use beryllium’s unique properties to create more efficient starship sensors, improving survey reliability and combat tracking."
 tech_btr_iridium_catalysis: "Iridium Catalytic Systems"
 tech_btr_iridium_catalysis_desc: "Iridium’s rare catalytic properties can be harnessed in advanced industrial processes, improving refinery yields and reducing resource waste."
 tech_btr_platinum_biomed: "Platinum Biomedical Applications"
 tech_btr_platinum_biomed_desc: "Platinum’s stability and conductivity make it ideal for advanced biomedical instruments, boosting both medical care and biological research output."
 tech_btr_titanium_infrastructure: "Titanium Infrastructure"
 tech_btr_titanium_infrastructure_desc: "Lightweight titanium framing improves structural stability, reducing construction time for buildings and districts while reinforcing planetary defenses."
 tech_btr_lithium_power_cells: "Lithium Power Cells"
 tech_btr_lithium_power_cells_desc: "High-density lithium power packs provide portable energy reserves, enabling new ship auxiliary modules that improve survivability and maneuverability."
 tech_btr_palladium_energy_catalysts: "Palladium Energy Catalysts"
 tech_btr_palladium_energy_catalysts_desc: "Incorporating palladium catalysts into our power plants increases their efficiency, generating more energy while stabilizing local grids."
 tech_btr_uranium_fission: "Uranium Fission Reactors"
 tech_btr_uranium_fission_desc: "By harnessing uranium in controlled fission reactions, we can construct powerful reactors that serve as a cornerstone of early large-scale energy production."
 tech_btr_mass_effect_reactors: "Mass Effect Reactors"
 tech_btr_mass_effect_reactors_desc: "Embedding eezo cores into reactor systems allows for unprecedented efficiency, dramatically boosting energy output across entire colonies."
 tech_btr_biotics_infrastructure: "Biotics Infrastructure"
 tech_btr_biotics_infrastructure_desc: "Specialized facilities and eezo distribution networks support biotic populations, enhancing both civilian quality of life and research potential."
 tech_btr_relay_stabilizers: "Relay Stabilizers"
 tech_btr_relay_stabilizers_desc: "Advanced eezo manipulation enables us to construct stabilizers for mass relays, improving FTL efficiency and regional control."
 tech_btr_hydrogen_fuel_cells: "Hydrogen Fuel Cells"
 tech_btr_hydrogen_fuel_cells_desc: "Compact hydrogen fuel cells provide clean, reliable power storage, enhancing civilian ships and extending operational range."
 tech_btr_helium3_fusion: "He-3 Fusion Reactors"
 tech_btr_helium3_fusion_desc: "Fusion reactors fueled by helium-3 provide a powerful, efficient energy source for both planetary grids and starship systems."
 tech_mine_element_zero:0 "Element Zero Mining"
 tech_mine_element_zero_desc:0 "Element Zero is often only formed in systems with Neutron stars and Pulsars. As these are dangerous places to mine, it usually requires extensive use of robotics, telepresence, and shielding to survive the intense radiation."
 tech_mine_helium_3:0 "Helium-3 Extraction"
 tech_mine_helium_3_desc:0 "Helium-3 can often be found in the atmospheres of gas giants, from where it can be easily and cheaply skimmed."

 ### MASS EFFECT DRIVES ###
 tech_mass_effect_drive_1:0 "Element Zero Core Infusion"
 tech_mass_effect_drive_1_desc:0 "When Element Zero is subjected to an electrical current, it releases dark energy which can be manipulated into a Mass Effect field, raising or lowering the mass of all objects within that field. This effectively raises the speed of light within the Mass Effect field, allowing high speed travel with negligible relativistic time dilation effects. This can be applied to our FTL drives to greatly improve efficiency."
 tech_mass_effect_drive_2:0 "Element Zero Concentration"
 tech_mass_effect_drive_2_desc:0 "Further research into the effects of Element Zero on our FTL drives has revealed potential improvements. By concentrating Element Zero into a purer form, it results in a notable decrease to the mass of a starship, further increasing FTL velocities."
 tech_mass_effect_drive_3:0 "Element Zero Experiementation"
 tech_mass_effect_drive_3_desc:0 "By combining Element Zero with different quantum and subatomic particles, we are able to improve the efficiency of our Element Zero infused FTL cores by at least 10 percent."
 tech_mass_effect_drive_4:0 "Mass Effect Field Stabilisation"
 tech_mass_effect_drive_4_desc:0 "Until now, Mass Effect fields generated by Element Zero have been naturally unstable when ships are travelling at extreme FTL velocities. However, further particle physics research has given us a better understanding of how these fields are formed. This research has allowed ships to safely surpass previous speed limitations."
 tech_mass_effect_drive_5:0 "Element Zero FTL Limits"
 tech_mass_effect_drive_5_desc:0 "Continued experimentation on FTL drives infused with Element Zero has recently been quite slow. Our scientists have made a few minor improvements to our current generation of FTL drives but have warned us further research is unlikely to return major results. However, they have proposed that we stop trying to improve standard FTL drives and instead construct a pure Element Zero drive core. We have been warned that this will be a long and resource intensive task however."
 tech_mine_eezo_extraction:0 "Element Zero Extraction"
 tech_mine_eezo_extraction_desc:0 "Eezo is generated when solid matter, such as a planet, is affected by the energy of a star going supernova. The material is common in the asteroid debris that orbits neutron stars and pulsars. These are dangerous places to mine, requiring extensive use of robotics, telepresence, and shielding to survive the intense radiation from the dead star. We now know how to safely harvest this volatile resource."
 element_zero_deficit:0 "Element Zero Deficit"