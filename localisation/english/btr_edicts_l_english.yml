 ## Resource Edicts ##
 #TODO: Resource Edict Descriptions are placeholders
 edict_btr_beryllium_optimization:0 "Beryllium-Optimized Engine Components"
 edict_btr_beryllium_optimization_desc:0 "Beryllium alloys enhance thermal resistance and structural integrity in engine cores allowing ships to sustain high-output burns without system fatigue."
 edict_btr_iridium_reinforced_hull:0 "Iridium-Reinforced Hull Plating"
 edict_btr_iridium_reinforced_hull_desc:0 "A dense, heat-resistant metal, iridium fortifies starship hulls against plasma fire and atmospheric reentry, ensuring durability across hostile theaters."
 edict_btr_platinum_calibration:0 "Platinum-Grade Sensor Calibration"
 edict_btr_platinum_calibration_desc:0 "Incorporating platinum into sensor arrays improves conductivity and signal clarity—crucial for deep-space scanning and rapid tactical target acquisition."
 edict_btr_titanium_bulkhead:0 "Titanium-Integrated Bulkhead Framework"
 edict_btr_titanium_bulkhead_desc:0 "Titanium's strength-to-weight ratio enables reinforced bulkheads and structural supports, boosting survivability without sacrificing maneuverability."
 edict_btr_lithium_systems:0 "Lithium-Cooled Energy Systems"
 edict_btr_lithium_systems_desc:0 "Advanced lithium heat-sinks regulate reactor temperatures under extreme load, delaying system overheating during prolonged combat and sustained FTL travel."
 edict_btr_palladium_shield_boost:0 "Palladium-Based Shield Latticing"
 edict_btr_palladium_shield_boost_desc:0 "By integrating refined palladium into shield matrix conduits, we enhance energy conductivity and lattice cohesion, allowing our defenses to regenerate faster and absorb greater kinetic stress."
 edict_btr_palladium_armor:0 "Palladium-Layered Reactive Armor"
 edict_btr_palladium_armor_desc:0 "By layering palladium into our reactive plating, we create smart armor that dissipates heat and redistributes impact energy, allowing ships to endure punishing barrages without buckling."
 edict_btr_high_efficiency_antimatter:0 "High-Efficiency Antimatter Burn"
 edict_btr_high_efficiency_antimatter_desc:0 "By integrating stabilized antimatter cores into our reactor systems, we achieve unparalleled propulsion and power output—at the cost of meticulous containment and relentless precision."
 edict_btr_uranium_warheads:0 "Uranium-Enhanced Warheads"
 edict_btr_uranium_warheads_desc:0 "Optimized for vacuum detonation, our uranium-infused ordnance delivers devastating kinetic shockwaves that cripple enemy hull integrity before their shields can recover."
 edict_btr_eezo_focus:0 "Element Zero Lens Arrays"
 edict_btr_eezo_focus_desc:0 "By threading element zero into advanced emitter lattices, we manipulate mass effect fields to focus energy weapons with pinpoint precision."
 edict_btr_eezo_amplification:0 "Element Zero Biotic Amplification"
 edict_btr_eezo_amplification_desc:0 "By saturating neural interfaces with trace element zero, we enhance biotic potential across our empire."


 ## Empire Edicts ##
 edict_drell_evacuation_protocols:0 "Evacuation Protocols"
 edict_drell_evacuation_protocols_desc:0 "Rahkana is lost, We must accept our failure and establish a new home among the stars. Prepare to evacuate our homeworld.""