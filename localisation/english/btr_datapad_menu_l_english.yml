l_english:

 btr_intro_text:0 "And Welcome to Mass Effect: Beyond the Relays!\n\nPrepare to immerse yourself into BioWare's sci-fi epic in a way you've never experienced before! In Beyond the Relays, you take the reins of your favorite Mass Effect factions, challenging you to change the course of galactic history in a universe where there is no Shepard to save you.\n\nTo provide the most accurate representation of the Mass Effect galaxy as possible, you'll find many changes from your traditional Stellaris experience! This total overhaul is complete with a comprehensive handcrafted galaxy map with individually placed systems and planets in their lore accurate locations, as well as a fully realized and functional recreation of the Mass Relays Network.\n\nTo help familiarize yourself with these many changes, you will be brought to a resources menu upon clicking the 'Begin' button below. This resource menu will contain the usual starting page to familiarize yourself with your chosen empire, but will also contain several additional resources to help teach you about the new mechanics and systems you will find in Beyond the Relays.\n\nNow get out there, the galaxy is counting on you!"
