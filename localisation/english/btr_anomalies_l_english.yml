l_english:

 PRESSHA:0 "Mysterious Disappearance"
 pressha_desc:0 "Long ago when the Krogan Rebellions came to and end a Turian admiral handed in his resignation and sailed into uncharted space on his own. He was never heard or seen again, but many believe that he's out there. Somewhere."
 pressha.1.name:0 "Mysterious Disappearance"
 pressha.1.desc:0 "When the Krogan Rebellions ended two millennia ago, the Turian chief of naval operations, Admiral Mehrkuri Fausnis, announced his retirement and disappeared into uncharted space. His ship was found on this moon two centuries later. However, his body was never found nor his reasons for landing here were discovered. Could it have been remorse for the state the Krogan were condemned to after the Genophage? Or maybe some Krogan veterans found him and killed him here, where no one would ever find out? We will probably never know. Only one thing is clear: he met his end in this forgotten place."
 pressha.1.a:0 "Certainly an unsolvable mystery."
 pressha.1.b:0 "May the spirits be with him."

 LIQUOR:0 "Space Liquor"
 liquor_desc:0 "The planet of Antirumgom has a unique combination of high methanol levels and intense temperatures which can create semi-liquid methanol compounds that rumor has it, are a favorite among the poor alcoholics in the Terminus."
 btr_anomaly.1.name:0 "Space Liquor"
 btr_anomaly.1.desc:0 "Molecular analysis of semi-liquid methanol derivative inside Antirumgom’s crust deeper layers have proven to be drinkable protein slush. Apparently some lowlife Terminus denizens extract it for recreational purposes. Its strong effects are similar to some of our people’s favorite alcoholic beverages."
 btr_anomaly.1.a:0 "Pour more of the stuff in the… thing where stuff goes in."
 btr_anomaly.1.b:0 "Who the hell drinks this poison?"
 intoxication:0 "Intoxication"
 exotic_liquor:0 "Exotic Liquors"

 SHOALS:0 "Shoals of Life"
 shoals_life_desc:0 "Space is considered a cold, dead, void but to those who sail it regularly they know that the opposite is true. Space is teaming with life, even in the harshest conditions, its just very different life than our own."
 btr_anomaly.2.name:0 "Shoals of Life"
 btr_anomaly.2.desc:0 "While our science ship [ship.GetName] was scanning Notanban, their crew discovered something astonishing. Amazingly, the gas giant’s upper atmosphere is inhabited by “shoals” of tiny ammonia-based lifeforms similar to Earth’s plankton. They are held aloft by air pressure and wind and are constantly fleeing the terminator. If exposed to the light and heat of a star, they irretrievably die."
 btr_anomaly.2.a:0 "The cosmos always finds ways to marvel us."

 PATAMALRUS:0 "Unclear Readings"
 patamalrus_desc:0 "The planet of Patamalrus has some interesting biometic readings, there is debate on if we should deploy probes to get more data or simply keep moving."
 btr_anomaly.3.name:0 "Uneventful Examination"
 btr_anomaly.3.desc:0 "Based on Patamalrus initial biometric scan it was considered a worthwhile effort to probe the planet further to check if it could be hosting native life. [ship.GetName]‘s crew have finalized their examination and concluded that, in fact, the barren planet is as lifeless as it could possibly be. No lifeforms have risen in its oxygen-sulphur dioxide atmosphere and its mostly magnesia crust."
 btr_anomaly.3.a:0 "It was to be expected."
 btr_anomaly.4.name:0 "Surprising Find"
 btr_anomaly.4.desc:0 "Based on Patamalrus initial scan it was considered a worthwhile effort to probe the planet further to check if it could be hosting native life. [ship.GetName]‘s crew have finalized their examination and concluded that, in fact, over the last million years the barren planet has given rise to cyanobacteria-like lifeforms which absorb heat from Patamalrus' sulphurous atmosphere and produce huge amounts of oxygen as a byproduct of this peculiar thermosynthesis. However, life on this planet is threatened in the long run considering Patamalrus's atmosphere will be blown off by Tereshkova in a few million years."
 btr_anomaly.4.a:0 "Life, uh, finds a way."

KAMAKAZI:0 "Windy"
kamakazi_desc:0 "The galaxy has much to teach us and many spectacular sights to see. Often times, the most dangerous, inhospitable, or destructive places are the ones that provide us the most."
btr_anomaly.5.name:0 "Hurricane Winds"
btr_anomaly.5.desc:0 "Thegeuse is a tidally locked terrestrial planet due to Tereshkova-A and its low mass for its size. This makes for a sharp temperature contrast between the sunward "hot pole" and the dark side "cold pole", which translates in constant gale-force winds across the terminator that can tear apart any landing ship or equipment."
btr_anomaly.5.a:0 "Interesting."

EXILE:0 "Sling Shot"
exile_desc:0 "There are many phenomena in this galaxy that we understand and recognize but have never experienced, like Rogue planets. However, our scientists have run models that they believe could help us identify future rogue planets."
btr_anomaly.6.name:0 "Future Rogue Planet"
btr_anomaly.6.desc:0 "Like the gas giant Solmarlon, it is thought that Mawinor formed too close to the Tereshkova stars and was thrown outwards by gravitational effects. This process keeps speeding up to the point that computer models suggest it will most likely be ejected from the system in a mere hundred thousand years, an incredible short amount of time for stellar timescales."
btr_anomaly.6.a:0 "With any luck, our people will get to see it in the distant future."

FLOATERS:0 "Stasis Litter"
floaters_desc:0 "Every planet has its unique excentricities but there is one that is unfortunately unique due to artificial interference. Decades of uncaring desecration have transformed a seemingly generic barren sphere into a haunting cemetery, frozen in time."
btr_anaomaly.7.name:0 "Cruel Sport"
btr_anomaly.7.desc:0 "Maji’s surface is littered with bodies, both from animals and sapient creatures alike. It is a well known tradition for many Terminus pirates clans and other unsavory characters to dump rivals, slaves, warbeasts, hostages and the likes when they want to get rid of someone problematic or simply if they are bored. "One must kill the other before they will be rescued from the lethal radiation of the giant stars", or so they say."
btr_anomaly.7.a:0 "Savages!"
btr_anomaly.7.b:0 "This looks fun."
 blood_sports:0 "Zero-G Blood Sports"

MAGMA:0 "Cold Stones"
magma_desc:0 "The line between a planet and a large asteroid or rock is blurry, giving rise to the intermediate classification of dwarf planet. While this can lead to headed debates amongst astronomers we believe that one dwarf planet can give us insight into how these form."
btr_anomaly.8.name:0 "Magma World"
btr_anomaly.8.desc:0 "Geological scans of Shasu show the dwarf planet used to be part of Agnin eons ago until it was impacted by a similar planet-sized body. Back then Agnin had a magma ocean covering most of its surface since it was still in its early phase of formation. Said impact ejected most of the surface magma into space, where it coalesced and cooled over millions of years. This event gave birth to the dwarf planet of Shasu as we know it today. Since then the planet has become relatively temperate."
btr_anomaly.8.a:0 "Everyday you learn something new."

GREAT_SPOT:0 "Eternal Storms"
great_spot_desc:0 "Gas giants are some of the most unique objects in space. Among their incredible features it their ability to have centuries long storms which we can study to learn more about not only the gas giants but in many cases physics itself."
btr_anomaly.9.name:0 "Gas Giant's Great Spots"
btr_anomaly.9.desc:0 "Scientist [leader.GetName] has been analyzing Dranen’s spectacular storms. It turns out they are not only bigger than most Jovian gas giants, but also significantly longer lasting. There appears to be at least three persistent observable "spots" —cyclonic and anticyclonic storms— which are over five hundred years old. The largest of these spots, the Ishna, has consistently held a diameter over four times that of the typical garden world."
btr_anomaly.9.a:0 "Worth taking a closer look at."

PRIMORDIAL:0 "Starting Soup"
primordial_desc:0 "Many species planets have a long history of life, starting incredibly simple and slowly advancing up. However, we know very little about those early phases and because life is a relatively rare occurrence we don't find many new planets in that stage. This means when we do, we need to gather as much research as we can."
btr_anomaly.10.name:0 "Prodigious Sea Life"
btr_anomaly.10.desc:0 "Arvuna, a moon of the gas giant Dranen, is a water world with  oceans and ice covering 90% of its surface. Coupled with its weak magnetic field it has produced an incredible plethora of sea life worth studying. Though most sapient species require radiation shields to survive on the planet, Arvuna’s native lifeforms have developed carapaces to resist radiation coming from Dranen's magnetosphere. This evolutionary adaptation has given rise to species such as the huge Deinorostrum, a carnivorous sea creature some 35 meters long."
btr_anomaly.10.a:0 "Truly prodigious."
btr_anomaly.10.b:0 "Just like Palaven!"

UNIQUE:0 "Truly Unique Life"
unique_desc:0 "Life itself is somewhat rare but we may have discovered a type of life so unique it not only doesn't exist anywhere else, it cannot exist anywhere else."
btr_anomaly.11.name:0 "Unique Evolution"
btr_anomaly.11.desc:0 "Our science ship [ship.GetName]’s crew have made a double discovery regarding Caleston: Cernunnos’s moon is both a major source of element zero thanks to an ancient asteroid strike, and also has developed very peculiar lifeforms. While the fact life has arisen in close contact to eezo is always very interesting due to how unusual it tends to occur, Caleston native organisms stand out on their own. Because of weak solar output, plant-like life on Caleston is silicon-based and thermosynthetic. They flourish in volcanic vents and during solar flares."
btr_anomaly.11.a:0 "All life must be treasured."
btr_anomaly.11.b:0 "Who cares? Just tell us about the eezo!"

CRUSHER:0 "Planetary Crusher"
crusher_desc:0 "We have largely mastered the art of making exploration probes. Standardized, generic probes are suitable for the vast majority of worlds and those that challenge our scientific might are subdued with addons and specialist modules. All except one, [planet.GetName] has somehow destroyed every probe ever sent to it and we know basically nothing more than what is seen on orbital scans."
btr_anomaly.12.name:0 "Probe Destroyer"
btr_anomaly.12.desc:0 "Sakata is a large Venusian hothouse with a dense atmosphere that is largely carbon dioxide and sodium which generates rough weather, a lime surface, and a pretty strong magnetosphere which suggests an iron-rich core. For some reason not even our best suited space probes can get to the planet's surface to investigate it and get more detailed data before being destroyed or confused."
btr_anomaly.12.a:0 "This doesn't make any sense!"

TECTONISM:0 "Tectonism"
tectonism_desc:0 "Tectonic activity is something we largely understand, or so we thought. Signs of tectonic activity on a planet thought far smaller than physically possible are making us reconsider our supposed truths."
btr_anomaly.13.name:0 "Incongruent Tectonism"
btr_anomaly.13.desc:0 "It is believed that for a celestial body to have a tectonically active lithosphere it needs to have a bare minimum radius of about 3,000 kilometers. Therefore, when our science ship [ship.GetName] came across Nambu's moon, Sumiko, scientist [leader.GetName]'s eyes went wide from disbelief at what they were seeing. Sumiko has a radius of just 1,264 km, yet shows bright fractures where its tectonic plates are clashing. This invalidates all current tectonics scientific knowledge."
btr_anomaly.13.a:0 "We must study this thoroughly."

RUINS_OF_RUIN:0 "Volcanic Highlights"
ruins_desc:0 "During an otherwise routine scientific scan of an incredibly volcanically active planet we found some strange anomalies around a few of the volcanoes, the team thinks its worth a closer look."
btr_anomaly.14.name:0 "Unforgiving Ruins"
btr_anomaly.14.desc:0 "In a surprising turn of events our survey team on Karumto have discovered that the planet filled with volcanism that fills the atmosphere with toxic gases, earthquakes and shrouds of dust, also hosts an old Prothean research facility under one of the many volcanoes of its sulfurous crust. Our experts are urging us to investigate the site immediately."
btr_anomaly.14.a:0 "We cannot let  this opportunity to study Prothean technology slip us by."
btr_anomaly.14.b:0 "The Enkindlers' holy site must be preserved."

FALSE_GARDEN:0 "Twisted Garden"
false_garden.desc:0 "When the council declares a planet a garden world, there is a certain image that appears in the mind of every who hears it. Regardless of species, ideology, or intent. However, the reality of the definition does not always have to align with the idyllic image that we all carry, some "Garden Worlds" are actually quite horrific."
btr_anomaly.15.name:0 "Sulfurous Wasteland"
btr_anomaly.15.desc:0 "Although technically a garden world, Asteria is proof that not every planet labeled as such is a paradise. Most of its surface can reach up to 65 degrees Celsius, leaving only the poles as a temperate enough region to be settled. Moreover, its soil is composed of arid sulfurous deserts. While the seas contain primitive animal life, little of it can live on land, leaving the soil to hardy plants that can survive in the extreme heat."
btr_anomaly.15.a:0 "It’s amazing how life can develop in these wastelands."

FORCED_EXTINCTION:0 "Ancient Signs"
forced_extinction_desc:0 "It is rare but we do discover signs of ancient alien life as we explore the galaxy. While that is typically of the Protheans some planets hide evidence of societies even older or societies that never escaped as their homeworlds became their tombstones."
btr_anomaly.16.name:0 "Ancient Civilization"
btr_anomaly.16.desc:0 "We have uncovered evidence pointing to Bothros being inhabited by a primate-like spacefaring civilization untold millennia ago. The frozen planet appears to have suffered some kind of saturation orbital bombardment. Scientist [leader.GetName] suggests we further investigate the planet to try to uncover its ancient denizens' mysteries."
btr_anomaly.16.a:0 "And that’s what we shall do."

HEATED_RACE:0 "First to Flames"
heated_race_desc:0 "We have found telltale signs of Prothean activity on this moon but our models predict that it is close, in cosmic terms, from turning into a giant planetary inferno. Our scientists recommend that we waste no time exploring this before someone else does."
btr_anomaly.17.name:0 "Prothean Site"
btr_anomaly.17.desc:0 "Makhaira's largest moon, Kopis, is a desolate place. Yet our orbital survey probe has discovered an old Prothean site on this barren moon. Its high albedo keeps Kopis from turning into a real inferno, so our experts are urging us to investigate the place before someone else does it first."
btr_anomaly.17.a:0 "Who knows what treasures we will find there?"
btr_anomaly.17.b:0 "It is these ones’ duty to preserve the Enkindlers’ legacy"

BIG_SQUID:0 "Water soluble"
big_squid_desc:0 "Ocean worlds are not particularly rare but one is bluer that you'd expect. [planet.GetName] is covered in a single giant ocean with sea life ranging from microscopic to gargantuan but more importantly, eezo dust is dissolved into it."
btr_anomaly.18.name:0 "Gigantuous Sea Life"
btr_anomaly.18.desc:0 "Trident is a world with over 95% of its surface covered by salt water. Therefore, it’s not a surprise that its oceans are filled with creatures ranging from tiny bivalves to mammoth vertebrates unequaled by most garden worlds’ biggest sea life. Small archipelagos dot the surface and create what little land there is. More importantly to our industrialists, dust-form element zero is very common on Trident’s oceans."
btr_anomaly.18.a:0 "Truly a sight to behold."
btr_anomaly.18.b:0 "And we thought whales and ichthyosaurs were huge"

SPACE_WORDS:0 "Message in a Planet"
space_words:0 "The [system.GetName] system has been know and well surveyed for years. Recently we've noticed, there seems to be something on one of the barren worlds within the system. We aren't sure exactly what, but its large enough to be seen from passive freighter scans so its both large and not something that should rapidly appear."
btr_anomaly.19.name:0 "Mass Accelerator Message"
btr_anomaly.19.desc:0 "Right in the middle of the eezo and iridium-rich Pamyat system sits Patsayev, a frozen ball barely worth a glance. It would be a totally forgettable world if it wasn’t for Andrei Kobzar, a disgruntled Human miner whose fortunes were spent prospecting for eezo to no avail. Furious, he used the cannon of a local mercenary group's A-61 Mantis gunship to carve a 208-kilometer long message in the ice saying "Zdes' nichego net," which means "There's nothing here" in Russian."
btr_anomaly.19.a:0 "And now his message draws tourist crowds."

UNDER_FIRE:0 "Under Fire"
under_fire_desc:0 "Space mining has some inherent dangers, as all mining does, but on [planet.GetName] things are taken to the extreme. Considering the planet is within an asteroid belt there are significantly more collisions with other stellar bodies than traditional mining, even traditional asteroid mining given its size and gravity. But it is so rich that corporations can't resist it."
btr_anomaly.20.name:0 "Rich But Dangerous"
btr_anomaly.20.desc:0 "Volkov is a most curious dwarf planet. Not only does it have its own trinary system with two moonlets, Zenevieva and Alena, but it also sits in the middle of the Chazov Belt. A dangerous field of rock and smaller debris infamous for its frequent meteor strikes. Although Volkov has considerable iridium veins, the relatively high number of fatalities of miners due to meteor strikes has earned it the fame of “rich but hazardous."
btr_anomaly.20.a:0 "Where there’s iridium, there’s miners."

CAT_EARS:0 "A strange silhouette"
cat_ears_desc:0 "While passing near the asteroid belt in [system.GetName] one of our ships reported catching a glimpse of something odd. Nothing nefarious, just a shape they had never seen nor could they explain. Most asteroids have long ago been beaten into pockmarked spheres but this had two large cones sticking out what appeared to be the top?"
btr_anomaly.21.name:0 "Weirdly-Shaped Asteroid"
btr_anomaly.21.desc:0 "While exploring Pamyat’s asteroid belt we have come across this strange asteroid. It looks like some kind of animal. Scientist [leader.GetName] can’t help wondering if the natural forces of the universe shaped it this way or if some ancient civilization gave it its current form."
btr_anomaly.21.a:0 "Weird."
btr_anomaly.21.b:0 "It looks exactly like a cat’s head! Look, those are its ears!"

GRAVEROBBING:0 "Race to the Past"
 graverobbing_desc:0 "Archeological sites pop up here and there every so often without much notice. But if our initial scans are correct, that will not happen here. This planet may be have the most Prothean artifacts outside of Hannar space which means looters will be picking it clean any day now, we must beat them to it."
btr_anomaly.22.name:0 "Prothean Burial Site"
btr_anomaly.22.desc:0 "Gei Hinnom was clearly destined to be the target of a “gold rush”. The tidally locked planet barely has any atmosphere to speak of, but is a dedicated Prothean burial ground. That means it has both element zero and Prothean technology in abundance. It won’t be long before the planet is totally looted. We should step in before that happens."
btr_anomaly.22.a:0 "We must discover all its secrets."
btr_anomaly.22.b:0 "The other races won’t understand, but preserving the Enkindlers’ opus is above all."

SALTY:0 "The Missing Ingredient"
salty_desc:0 "There are many worlds that we can survive on, but our preferred crops cannot. In some cases local crops are acceptable substitutes but in many cases we produce fertilizer to allow our crops to spread across the stars with us. This means we are constantly looking for the base materials needed to create fertilizer and theres a chance we just found the motherload!"
btr_anomaly.23.name:0 "Agri-Minery"
btr_anomaly.23.desc:0 "Although mostly a barren, cold rock with a thin nitrogen atmosphere, Neith is warm enough for liquid water to pool during the summer periods at its equator, where vast salt flats sit. The revealed salt can be collected and exported, as it is an ingredient for fertilizers necessary for agriculture in sodium-poor worlds."
btr_anomaly.23.a:0 "Whatever generates profit."

SOARING_SOLAR:0 "Void-Thermal"
soaring_solar_desc:0 "While space can be extremely cold there are regions of intense, overbearing heat. Heat is something we know how to harness and use, if we can tap into that perhaps it would provide a new source of reliable energy?"
btr_anomaly.24.name:0 "Boiling Planetoid"
btr_anomaly.24.desc:0 "Osalri is a boiling hot dwarf planet close to the G-class star Imir. It doesn’t offer anything interesting, scientifically or otherwise. Nonetheless, this planetoid used to have solar arrays orbiting it that collected energy from its heat, but they were destroyed a century ago by pirates. Scientist [leader.GetName] thinks it might be useful to rebuild them."
btr_anomaly.24.a:0 "We should repair those solar arrays."

BREATHING_ROCK:0 "A Shrinking Planet?"
breathing_rock_desc:0 "We maintain an extensive database of the planets that we have scanned, even ones that haven't been visited in generations. Its not often random planets are compared to it but recently an exploration team reported a new scan of a planet that was last visited ages ago; and it is significantly smaller? While it has been a long time by our standards cosmically, a planet shouldn't shrink that much that fast."
 btr_anomaly.25.name:0 "Atmospheric Cycle"
btr_anomaly.25.desc:0 "Gregas is a cold rock. It is composed of 65 percent igneous rock by mass and 35 percent frozen methane and nitrogen ices. However this composition changes during the “summer years” when these ices are heated by its sun and evaporated into a thin atmosphere, which then proceeds to go back to the surface during the “winter years”."
btr_anomaly.25.a:0 "Curious."

GAS_EXPLOSION:0 "The Giant Nextdoor"
gas_explosion_desc:0 "Solar system layouts are well understood and we have thousands of examples behind our current understanding of how solar systems form. However [system.GetName] is an outlier, its gas giant is far too close to its star and many believe this is so far outside of what is expected that it must be studied."
btr_anomaly.26.name:0 "Unstable Orbit"
btr_anomaly.26.desc:0 "Named in honor of a Krogan god of vengeance, Uzin couldn’t have possibly formed where it stands today, as it is located well within the "frost line" where gas giants usually do not form. Our science ship [ship.GetName]’s crew theorize its orbit used to be further from the star. This points to the gas giant having a seriously unstable orbit that may see it on a crash course into its star within a few million years."
btr_anomaly.26.a:0 "So it would seem."

PAST_PRIME:0 "Past Prime"
past_prime_desc:0 "One of the saddest parts of exploring space is finding planets that were lush garden worlds long ago but have since transformed into barren rocks. It can be hard to tell with the naked eye but once you start noticing the signs it is hard to see anything else."
btr_anomaly.27.name:0 "Ancient Hydrosphere"
btr_anomaly.27.desc:0 "Geological scans of Tamahera point to a very different environment in the distant past. The presence of canyons and flood plains indicates that liquid water once existed. Tamahera must have had a thicker atmosphere back then than its present thin halo of carbon dioxide and xenon. It probably lost most of it during the last hundreds million years."
btr_anomaly.27.a:0 "The more you study the galaxy, the more you realize so many planets could’ve been teeming with life."

SCOURGED:0 "The Scourged Planet"
scourged_desc:0 "Planets have odd shapes and sizes with strange geologic features being fairly typical. Yet, the giant chasm that many refer to as "The Great Rift Valley" is far beyond anything that we've seen before and has many wondering how tectonic activity could create something so dramatic."
btr_anomaly.28.name:0 "The Great Rift"
btr_anomaly.28.desc:0 "Klendagon is just an arid terrestrial world of average size. However, scientist [leader.GetName] couldn’t help gazing at an enormous geological anomaly as soon as our science ship reached its orbit: the Great Rift valley that stretches across the southern hemisphere. What is most fascinating about the Rift is that it does not appear to be formed by natural tectonic forces."
btr_anomaly.28.a:0 "Find out what created that rift."

CLOUDED_HELL:0 "Clouded Hell"
clouded_hell_desc:0 "Hothouse worlds are hard to study due to the immense heat, pressure, and dense opaque clouds. Yet, that just makes our scientists want to study them more and on one attempt the readings came back, strange. Hidden beneath the clouds, worn by the intense pressure and heat, the garbled readings seem to indicate structures of some form?"
btr_anomaly.29.name:0 "Orbital Bombardment"
btr_anomaly.29.desc:0 "Today’s Atahil is one more of the many Venusian hothouses through the galaxy, but it seems it wasn’t always like this. Although evidence has almost totally vanished after millions of years of high pressure, the signs of orbital bombardment are unmistakable. It surely must be related with the similar evidence of an old conflict the Schwarzschild system bears."
btr_anomaly.29.a:0 "So strange."

TRAMPLED_FLOWERS:0 "Trampled Flowers"
trampled_flowers_desc:0 "The world of [planet.GetName] sticks out as one that clearly had a living ecosystem and possibly complex life at some point in the distant past. That much is so obvious because of the clear signs that it was saturation bombarded at some point in the distant past. Bombarding a world so dramatically has been discussed but rarely if ever attempted, perhaps the ancient galactic powers were more ruthless than our enlightened modern day? Perhaps whoever lived on [planet.GetName] was so vile as to deserve it. The only way to find out is to land and dig."
btr_anomaly.30.name:0 "Postgarden World"
btr_anomaly.30.desc:0 "Since our science ship [ship.GetName] arrived at Schwarzschild its crew has known something is wrong with Etamis. A superterrestrial world larger than most garden worlds, it shows clear evidence of an saturation orbital bombardment. It is an unique occasion to study the remains of this 20-40 million years old civilization."
btr_anomaly.30.a:0 "Let’s do it."

NANO_RINGS:0 "Nano-Rings"
nano_rings_desc:0 "Gas Giants having rings is something used to describe so obvious as to not warrant mention. Even fairly thin rings are common enough, but not these rings. The rings around [planet.GetName] are thin, but the pieces that make them aren't as uniform as we would expect for such a thin ring. They are also giving far more metallic readings than normal and our scientists are eager to find out why."
btr_anomaly.31.name:0 "Rings of Debris"
btr_anomaly.31.desc:0 "Just like most of the planets on this system, the gas giant Linossa bears the marks of a former civilization. It is surrounded by several thin rings of debris. Analysis of this debris has been difficult due to extreme age and fragility, but several apparently nano-manufactured materials have been identified."
btr_anomaly.31.a:0 "They probably were helium-3 fueling stations."

STABLE_PLASMA:0 "Stable Plasma?"
stable_plasma_desc:0 "While we don't normally make detailed scans of stars some scientists, have noticed that passing scans of [planet.GetName] have some odd quirks. Many that it seems every scan caught the northern wind patterns in at exactly the same phase which feels unlikely. They are requesting equipment be made available to look into this more deeply."
btr_anomaly.32.name:0 "Grativic Anomaly"
btr_anomaly.32.desc:0 "As with all brown dwarfs, Mnemosyne is a failed star that couldn’t quite acquire enough mass to start its nuclear fusion reaction. All that is normal. What is not is the minor gravitic anomaly in the northern hemisphere. This area of unexpectedly low mass did not move with the prevailing wind patterns."
btr_anomaly.32.a:0 "Unfortunately it’s not feasible to reach that area unless there was something really interesting."

PULLED_APART:0 "Cold Tectonics"
pulled_apart_desc:0 "Tectonic activity is normally a sign of a planets internal molten core, which requires planets to be a certain size or density. [planet.GetName] is not big enough or dense enough to start tectonic activity and yet we see tectonic activity on it?"
btr_anomaly.33.name:0 "Gravity-Induced Tectonics"
btr_anomaly.33.desc:0 "Tectonic activity is usually caused by a celestial body’s own heat. However, scientist [leader.GetName] has discovered that Lethe, Mnemosyne’s biggest moon, has a constant weak tectonic activity driven by the tidal fluxes of Mnemosyne's gravity. Several large, ancient volcanoes release wide-ranging flows of molten silicate."
btr_anomaly.33.a:0 "Interesting."

 SMOG_WORLD:0 "Smog Haze"
 smog_world_desc:0 "It may not look like it but [planet.GetName] is a garden world, or it will be in several thousand years. It is undergoing a phase that we believe every garden world went through with the notable except that our readings have some anomalies that are consistent with previously discovered Prothean ruins."
 btr_anomaly.34.name:0 "Primordial World"
 btr_anomaly.34.desc:0 "Corang is a world similar to many garden worlds in their early stages: its atmosphere is a smog of methane, ammonia, and water vapor. It also has high density and active plate tectonics, suggesting a high internal heat fueled by a greater than normal concentration of heavy elements and radioactives. Moreover, our orbital scans suggest it may host a Prothean site."
 btr_anomaly.34.a:0 "Then we shall further investigate it."
 btr_anomaly.34.b:0 " These ones shall not despoil the Enkindlers."

STORM_TWINS:0 "The Dual Storms"
storm_twins_desc:0 "[planet.GetName] is a fairly standard gas giant with the mix of gases we'd expect, in the orbit we'd expect, and about the size we'd expect. What we can't explain is the two unmoving storm fronts at its poles. Storms aren't unheard of in gas giants but having two massive ones, centered on the poles, that never move is strange."
btr_anomaly.35.name:0 "Twin Storms"
btr_anomaly.35.desc:0 "A standard hydrogen-helium gas giant with a high number of moons, Serao stands out because of its pair of gigantic storm cells; one in the northern hemisphere, and one in the south. Our science ship [ship.GetName]’s crew are recommending us to study them more thoroughly."
btr_anomaly.35.a:0 "Makes you wonder how many celestial wonders we are yet to discover."

SHALLOW_GRAVES:0 "Shallow Graves"
shallow_graves_desc:0 "The planet of [planet.GetName] has a series of large mountain ranges and fairly simple life it is the sort of planet that we try to check on periodically to see how the life has evolved and adapted to changes in the planets ecosystem."
btr_anomaly.36.name:0 "Cemetery"
btr_anomaly.36.desc:0 "Our science ship [ship.GetName] has discovered a group of partial graves hidden in Vecchio’s equatorial mountain ranges. The ancient skeletons in the burial sites were obviously humanoid but incomplete and poorly preserved, which has made them difficult to identify. Fragments of primitive ceramic grave goods were also found nearby."
btr_anomaly.36.a:0 "A cemetery, huh?"
btr_anomaly.36.b:0 "Council regulation forbid to disturb burial sites."

SUPER_FROZEN:0 "Super Frozen"
super_frozen_desc:0 "Interstellar colonization is a complicated process considering you need to find a planet that is both the right type and at the right stage in its life. What often happens is we will find planets that we know will be habitable in a few thousand years, or we know they were habitable a few thousand years ago, but we cannot use them with extensive terraforming. This can be done, but it is expensive and time consuming and generally not worth the investment outside of rare circumstances or pet projects."
btr_anomaly.37.name:0 "Crushing Gravity"
btr_anomaly.37.desc:0 "Volturno is a so-called “super Earth” with a crushing gravity currently enduring an ice age except for the equator, where most organic life —mostly lichens and algae— reside. Its atmosphere contains lethal amounts of carbon dioxide in addition to its oxygen. The planet also hosts some roaming packs of Vorcha squatters living miserable existences."
btr_anomaly.37.a:0 "Huh. Poor devils."
btr_anomaly.37.b:0 "With interest: We must acquire funds to terraform this planet and evict the Vorcha."
btr_anomaly.37.c:0 "Vorcha stronk, this planet is livable!"

EEZO_FRAUD:0 "Caleston 2?"
eezo_fraud_desc:0 "The extranet had been flooded recently with leaked reports that claim someone found a giant stash of Element Zero buried under [planet.GetName] this has sparked a media sensation across the galaxy as people race to figure out its validity and its origin. We can try checking on the source just to make sure these leaks are accurate."
btr_anomaly.38.name:0 "Extranet Scam"
btr_anomaly.38.desc:0 "Here lies Pollino, a pretty common gas giant, if only a little small. Is only famous due to having become an Elcor-designed scam: news stories seeded throughout the extranet claimed that element zero was being found on Pollino's moons in record lodes. This turned out to be a scam spread by the Dunawurachum Consortium, an elcor corporation trying to scare up investors."
btr_anomaly.38.a:0 "And they say Elcor are not bold."
btr_anomaly.38.b:0 "Shamelessly: A necessary deception to further our interests."

ZEONA:0 "Sulfuric Air"
zeona_desc:0 "The planet of [planet.GetName] has caught the attention of our scientists for the sheer concentration of of sulfuric gasses in its atmosphere thanks to the plethora of active volcanoes across its surface. This gives us an opportunity to study a unique phenomena and possibly test advanced filtration and environmental gear."
btr_anomaly.39.name:0 "Sulfur-Devouring Bacteria"
btr_anomaly.39.desc:0 "A thin atmosphere of sulfur dioxide and trioxide created by the many volcanic vents have given rise on Zeona to a very unique kind of native bacteria whose diet consists of raw sulfur. Although it is possible that these bacteria were spread to this world by panspermia either through asteroids or accidental contamination by spacefarers."
btr_anomaly.39.a:0 "We should study these lifeforms."
