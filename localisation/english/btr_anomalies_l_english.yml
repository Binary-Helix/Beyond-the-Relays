l_english:

 BTR_PRESSHA:0 "Mysterious Disappearance"
 pressha_desc:0 "Long ago when the Krogan Rebellions came to and end a Turian admiral handed in his resignation and sailed into uncharted space on his own. He was never heard or seen again, but many believe that he's out there. Somewhere."
 pressha.1.name:0 "Mysterious Disappearance"
 pressha.1.desc:0 "When the Krogan Rebellions ended two millennia ago, the Turian chief of naval operations, Admiral Mehrkuri Fausnis, announced his retirement and disappeared into uncharted space. His ship was found on this moon two centuries later. However, his body was never found nor his reasons for landing here were discovered. Could it have been remorse for the state the Krogan were condemned to after the Genophage? Or maybe some Krogan veterans found him and killed him here, where no one would ever find out? We will probably never know. Only one thing is clear: he met his end in this forgotten place."
 pressha.1.a:0 "Certainly an unsolvable mystery."
 pressha.1.b:0 "May the spirits be with him."

 BTR_ANTIRUMGOM_LIQUOR:0 "Space Liquor"
 liquor_desc:0 "The planet of Antirumgom has a unique combination of high methanol levels and intense temperatures which can create semi-liquid methanol compounds that rumor has it, are a favorite among the poor alcoholics in the Terminus."
 btr_anomaly.1.name:0 "Space Liquor"
 btr_anomaly.1.desc:0 "Molecular analysis of semi-liquid methanol derivative inside Antirumgom's crust deeper layers have proven to be drinkable protein slush. Apparently some lowlife Terminus denizens extract it for recreational purposes. Its strong effects are similar to some of our people's favorite alcoholic beverages."
 btr_anomaly.1.a:0 "Pour more of the stuff in the... thing where stuff goes in."
 btr_anomaly.1.b:0 "Who the hell drinks this poison?"
 intoxication:0 "Intoxication"
 exotic_liquor:0 "Exotic Liquors"

 BTR_NOTANBAN_SHOALS:0 "Shoals of Life"
 shoals_life_desc:0 "Space is considered a cold, dead, void but to those who sail it regularly they know that the opposite is true. Space is teaming with life, even in the harshest conditions, its just very different life than our own."
 btr_anomaly.2.name:0 "Shoals of Life"
 btr_anomaly.2.desc:0 "While our science ship [ship.GetName] was scanning Notanban, their crew discovered something astonishing. Amazingly, the gas giant's upper atmosphere is inhabited by "shoals" of tiny ammonia-based lifeforms similar to Earth's plankton. They are held aloft by air pressure and wind and are constantly fleeing the terminator. If exposed to the light and heat of a star, they irretrievably die."
 btr_anomaly.2.a:0 "The cosmos always finds ways to marvel us."

 BTR_PATAMALRUS:0 "Unclear Readings"
 patamalrus_desc:0 "The planet of Patamalrus has some interesting biometic readings, there is debate on if we should deploy probes to get more data or simply keep moving."
 btr_anomaly.3.name:0 "Uneventful Examination"
 btr_anomaly.3.desc:0 "Based on Patamalrus initial biometric scan it was considered a worthwhile effort to probe the planet further to check if it could be hosting native life. [ship.GetName]'s crew have finalized their examination and concluded that, in fact, the barren planet is as lifeless as it could possibly be. No lifeforms have risen in its oxygen-sulphur dioxide atmosphere and its mostly magnesia crust."
 btr_anomaly.3.a:0 "It was to be expected."
 btr_anomaly.4.name:0 "Surprising Find"
 btr_anomaly.4.desc:0 "Based on Patamalrus initial scan it was considered a worthwhile effort to probe the planet further to check if it could be hosting native life. [ship.GetName]'s crew have finalized their examination and concluded that, in fact, over the last million years the barren planet has given rise to cyanobacteria-like lifeforms which absorb heat from Patamalrus' sulphurous atmosphere and produce huge amounts of oxygen as a byproduct of this peculiar thermosynthesis. However, life on this planet is threatened in the long run considering Patamalrus's atmosphere will be blown off by Tereshkova in a few million years."
 btr_anomaly.4.a:0 "Life, uh, finds a way."

 BTR_THEGEUSE_KAMAKAZI:0 "Windy"
 kamakazi_desc:0 "The galaxy has much to teach us and many spectacular sights to see. Often times, the most dangerous, inhospitable, or destructive places are the ones that provide us the most."
 btr_anomaly.5.name:0 "Hurricane Winds"
 btr_anomaly.5.desc:0 "Thegeuse is a tidally locked terrestrial planet due to Tereshkova-A and its low mass for its size. This makes for a sharp temperature contrast between the sunward "hot pole" and the dark side "cold pole", which translates in constant gale-force winds across the terminator that can tear apart any landing ship or equipment."
 btr_anomaly.5.a:0 "Interesting."

 BTR_MAWINOR_EXILE:0 "Sling Shot"
 exile_desc:0 "There are many phenomena in this galaxy that we understand and recognize but have never experienced, like Rogue planets. However, our scientists have run models that they believe could help us identify future rogue planets."
 btr_anomaly.6.name:0 "Future Rogue Planet"
 btr_anomaly.6.desc:0 "Like the gas giant Solmarlon, it is thought that Mawinor formed too close to the Tereshkova stars and was thrown outwards by gravitational effects. This process keeps speeding up to the point that computer models suggest it will most likely be ejected from the system in a mere hundred thousand years, an incredible short amount of time for stellar timescales."
 btr_anomaly.6.a:0 "With any luck, our people will get to see it in the distant future."

 BTR_MAJI_FLOATERS:0 "Stasis Litter"
 floaters_desc:0 "Every planet has its unique excentricities but there is one that is unfortunately unique due to artificial interference. Decades of uncaring desecration have transformed a seemingly generic barren sphere into a haunting cemetery, frozen in time."
 btr_anomaly.7.name:0 "Cruel Sport"
 btr_anomaly.7.desc:0 "Maji's surface is littered with bodies, both from animals and sapient creatures alike. It is a well known tradition for many Terminus pirates clans and other unsavory characters to dump rivals, slaves, warbeasts, hostages and the likes when they want to get rid of someone problematic or simply if they are bored. "One must kill the other before they will be rescued from the lethal radiation of the giant stars", or so they say."
 btr_anomaly.7.a:0 "Savages!"
 btr_anomaly.7.b:0 "This looks fun."
 blood_sports:0 "Zero-G Blood Sports"

 BTR_SHASU_MAGMA:0 "Cold Stones"
 magma_desc:0 "The line between a planet and a large asteroid or rock is blurry, giving rise to the intermediate classification of dwarf planet. While this can lead to headed debates amongst astronomers we believe that one dwarf planet can give us insight into how these form."
 btr_anomaly.8.name:0 "Magma World"
 btr_anomaly.8.desc:0 "Geological scans of Shasu show the dwarf planet used to be part of Agnin eons ago until it was impacted by a similar planet-sized body. Back then Agnin had a magma ocean covering most of its surface since it was still in its early phase of formation. Said impact ejected most of the surface magma into space, where it coalesced and cooled over millions of years. This event gave birth to the dwarf planet of Shasu as we know it today. Since then the planet has become relatively temperate."
 btr_anomaly.8.a:0 "Everyday you learn something new."

 BTR_DRANEN_GREAT_SPOT:0 "Eternal Storms"
 great_spot_desc:0 "Gas giants are some of the most unique objects in space. Among their incredible features it their ability to have centuries long storms which we can study to learn more about not only the gas giants but in many cases physics itself."
 btr_anomaly.9.name:0 "Gas Giant's Great Spots"
 btr_anomaly.9.desc:0 "Scientist [leader.GetName] has been analyzing Dranen's spectacular storms. It turns out they are not only bigger than most Jovian gas giants, but also significantly longer lasting. There appears to be at least three persistent observable "spots" - cyclonic and anticyclonic storms - which are over five hundred years old. The largest of these spots, the Ishna, has consistently held a diameter over four times that of the typical garden world."
 btr_anomaly.9.a:0 "Worth taking a closer look at."

 BTR_ARVUNA_PRIMORDIAL:0 "Starting Soup"
 primordial_desc:0 "Many species planets have a long history of life, starting incredibly simple and slowly advancing up. However, we know very little about those early phases and because life is a relatively rare occurrence we don't find many new planets in that stage. This means when we do, we need to gather as much research as we can."
 btr_anomaly.10.name:0 "Prodigious Sea Life"
 btr_anomaly.10.desc:0 "Arvuna, a moon of the gas giant Dranen, is a water world with  oceans and ice covering 90% of its surface. Coupled with its weak magnetic field it has produced an incredible plethora of sea life worth studying. Though most sapient species require radiation shields to survive on the planet, Arvuna's native lifeforms have developed carapaces to resist radiation coming from Dranen's magnetosphere. This evolutionary adaptation has given rise to species such as the huge Deinorostrum, a carnivorous sea creature some 35 meters long."
 btr_anomaly.10.a:0 "Truly prodigious."
 btr_anomaly.10.b:0 "Just like Palaven!"

 BTR_CLAESTON_UNIQUE:0 "Truly Unique Life"
 unique_desc:0 "Life itself is somewhat rare but we may have discovered a type of life so unique it not only doesn't exist anywhere else, it cannot exist anywhere else."
 btr_anomaly.11.name:0 "Unique Evolution"
 btr_anomaly.11.desc:0 "Our science ship [ship.GetName]'s crew have made a double discovery regarding Caleston: Cernunnos's moon is both a major source of element zero thanks to an ancient asteroid strike, and also has developed very peculiar lifeforms. While the fact life has arisen in close contact to eezo is always very interesting due to how unusual it tends to occur, Caleston native organisms stand out on their own. Because of weak solar output, plant-like life on Caleston is silicon-based and thermosynthetic. They flourish in volcanic vents and during solar flares."
 btr_anomaly.11.a:0 "All life must be treasured."
 btr_anomaly.11.b:0 "Who cares? Just tell us about the eezo!"

 BTR_SAKATA_CRUSHER:0 "Planetary Crusher"
 crusher_desc:0 "We have largely mastered the art of making exploration probes. Standardized, generic probes are suitable for the vast majority of worlds and those that challenge our scientific might are subdued with addons and specialist modules. All except one, [planet.GetName] has somehow destroyed every probe ever sent to it and we know basically nothing more than what is seen on orbital scans."
 btr_anomaly.12.name:0 "Probe Destroyer"
 btr_anomaly.12.desc:0 "Sakata is a large Venusian hothouse with a dense atmosphere that is largely carbon dioxide and sodium which generates rough weather, a lime surface, and a pretty strong magnetosphere which suggests an iron-rich core. For some reason not even our best suited space probes can get to the planet's surface to investigate it and get more detailed data before being destroyed or confused."
 btr_anomaly.12.a:0 "This doesn't make any sense!"

 BTR_SUMIKO_TECTONISM:0 "Tectonism"
 tectonism_desc:0 "Tectonic activity is something we largely understand, or so we thought. Signs of tectonic activity on a planet thought far smaller than physically possible are making us reconsider our supposed truths."
 btr_anomaly.13.name:0 "Incongruent Tectonism"
 btr_anomaly.13.desc:0 "It is believed that for a celestial body to have a tectonically active lithosphere it needs to have a bare minimum radius of about 3,000 kilometers. Therefore, when our science ship [ship.GetName] came across Nambu's moon, Sumiko, scientist [leader.GetName]'s eyes went wide from disbelief at what they were seeing. Sumiko has a radius of just 1,264 km, yet shows bright fractures where its tectonic plates are clashing. This invalidates all current tectonics scientific knowledge."
 btr_anomaly.13.a:0 "We must study this thoroughly."

 BTR_KARUMTO_RUINS_OF_RUIN:0 "Volcanic Highlights"
 ruin_desc:0 "During an otherwise routine scientific scan of an incredibly volcanically active planet we found some strange anomalies around a few of the volcanoes, the team thinks its worth a closer look."
 btr_anomaly.14.name:0 "Unforgiving Ruins"
 btr_anomaly.14.desc:0 "In a surprising turn of events our survey team on Karumto have discovered that the planet filled with volcanism that fills the atmosphere with toxic gases, earthquakes and shrouds of dust, also hosts an old Prothean research facility under one of the many volcanoes of its sulfurous crust. Our experts are urging us to investigate the site immediately."
 btr_anomaly.14.a:0 "We cannot let  this opportunity to study Prothean technology slip us by."
 btr_anomaly.14.b:0 "The Enkindlers' holy site must be preserved."

 BTR_ASTERIA_FALSE_GARDEN:0 "Twisted Garden"
 false_garden_desc:0 "When the council declares a planet a garden world, there is a certain image that appears in the mind of every who hears it. Regardless of species, ideology, or intent. However, the reality of the definition does not always have to align with the idyllic image that we all carry, some "Garden Worlds" are actually quite horrific."
 btr_anomaly.15.name:0 "Sulfurous Wasteland"
 btr_anomaly.15.desc:0 "Although technically a garden world, Asteria is proof that not every planet labeled as such is a paradise. Most of its surface can reach up to 65 degrees Celsius, leaving only the poles as a temperate enough region to be settled. Moreover, its soil is composed of arid sulfurous deserts. While the seas contain primitive animal life, little of it can live on land, leaving the soil to hardy plants that can survive in the extreme heat."
 btr_anomaly.15.a:0 "It's amazing how life can develop in these wastelands."

 BTR_BOTHROS_FORCED_EXTINCTION:0 "Ancient Signs"
 forced_extiction_desc:0 "It is rare but we do discover signs of ancient alien life as we explore the galaxy. While that is typically of the Protheans some planets hide evidence of societies even older or societies that never escaped as their homeworlds became their tombstones."
 btr_anomaly.16.name:0 "Ancient Civilization"
 btr_anomaly.16.desc:0 "We have uncovered evidence pointing to Bothros being inhabited by a primate-like spacefaring civilization untold millennia ago. The frozen planet appears to have suffered some kind of saturation orbital bombardment. Scientist [leader.GetName] suggests we further investigate the planet to try to uncover its ancient denizens' mysteries."
 btr_anomaly.16.a:0 "And that's what we shall do."

 BTR_KOPIS_HEATED_RACE:0 "First to Flames"
 heated_race_desc:0 "We have found telltale signs of Prothean activity on this moon but our models predict that it is close, in cosmic terms, from turning into a giant planetary inferno. Our scientists recommend that we waste no time exploring this before someone else does."
 btr_anomaly.17.name:0 "Prothean Site"
 btr_anomaly.17.desc:0 "Makhaira's largest moon, Kopis, is a desolate place. Yet our orbital survey probe has discovered an old Prothean site on this barren moon. Its high albedo keeps Kopis from turning into a real inferno, so our experts are urging us to investigate the place before someone else does it first."
 btr_anomaly.17.a:0 "Who knows what treasures we will find there?"
 btr_anomaly.17.b:0 "It is these ones' duty to preserve the Enkindlers' legacy"

 BTR_TRIDENT_BIG_SQUID:0 "Water soluble"
 big_squid_desc:0 "Ocean worlds are not particularly rare but one is bluer that you'd expect. [planet.GetName] is covered in a single giant ocean with sea life ranging from microscopic to gargantuan but more importantly, eezo dust is dissolved into it."
 btr_anomaly.18.name:0 "Gigantuous Sea Life"
 btr_anomaly.18.desc:0 "Trident is a world with over 95% of its surface covered by salt water. Therefore, it's not a surprise that its oceans are filled with creatures ranging from tiny bivalves to mammoth vertebrates unequaled by most garden worlds' biggest sea life. Small archipelagos dot the surface and create what little land there is. More importantly to our industrialists, dust-form element zero is very common on Trident's oceans."
 btr_anomaly.18.a:0 "Truly a sight to behold."
 btr_anomaly.18.b:0 "And we thought whales and ichthyosaurs were huge"

 BTR_PATSAYEV_SPACE_WORDS:0 "Message in a Planet"
 space_words_desc:0 "The [system.GetName] system has been know and well surveyed for years. Recently we've noticed, there seems to be something on one of the barren worlds within the system. We aren't sure exactly what, but its large enough to be seen from passive freighter scans so its both large and not something that should rapidly appear."
 btr_anomaly.19.name:0 "Mass Accelerator Message"
 btr_anomaly.19.desc:0 "Right in the middle of the eezo and iridium-rich Pamyat system sits Patsayev, a frozen ball barely worth a glance. It would be a totally forgettable world if it wasn't for Andrei Kobzar, a disgruntled Human miner whose fortunes were spent prospecting for eezo to no avail. Furious, he used the cannon of a local mercenary group's A-61 Mantis gunship to carve a 208-kilometer long message in the ice saying "Zdes' nichego net," which means "There's nothing here" in Russian."
 btr_anomaly.19.a:0 "And now his message draws tourist crowds."

 BTR_VOLKOV_UNDER_FIRE:0 "Under Fire"
 under_fire_desc:0 "Space mining has some inherent dangers, as all mining does, but on [planet.GetName] things are taken to the extreme. Considering the planet is within an asteroid belt there are significantly more collisions with other stellar bodies than traditional mining, even traditional asteroid mining given its size and gravity. But it is so rich that corporations can't resist it."
 btr_anomaly.20.name:0 "Rich But Dangerous"
 btr_anomaly.20.desc:0 "Volkov is a most curious dwarf planet. Not only does it have its own trinary system with two moonlets, Zenevieva and Alena, but it also sits in the middle of the Chazov Belt. A dangerous field of rock and smaller debris infamous for its frequent meteor strikes. Although Volkov has considerable iridium veins, the relatively high number of fatalities of miners due to meteor strikes has earned it the fame of "rich but hazardous."
 btr_anomaly.20.a:0 "Where there's iridium, there's miners."

 BTR_ASTEROID_BELT_CAT_EARS:0 "A strange silhouette"
 cat_ears_desc:0 "While passing near the asteroid belt in [system.GetName] one of our ships reported catching a glimpse of something odd. Nothing nefarious, just a shape they had never seen nor could they explain. Most asteroids have long ago been beaten into pockmarked spheres but this had two large cones sticking out what appeared to be the top?"
 btr_anomaly.21.name:0 "Weirdly-Shaped Asteroid"
 btr_anomaly.21.desc:0 "While exploring Pamyat's asteroid belt we have come across this strange asteroid. It looks like some kind of animal. Scientist [leader.GetName] can't help wondering if the natural forces of the universe shaped it this way or if some ancient civilization gave it its current form."
 btr_anomaly.21.a:0 "Weird."
 btr_anomaly.21.b:0 "It looks exactly like a cat's head! Look, those are its ears!"

 BTR_GEI_HINNOM_GRAVEROBBING:0 "Race to the Past"
 graverobbing_desc:0 "Archeological sites pop up here and there every so often without much notice. But if our initial scans are correct, that will not happen here. This planet may be have the most Prothean artifacts outside of Hannar space which means looters will be picking it clean any day now, we must beat them to it."
 btr_anomaly.22.name:0 "Prothean Burial Site"
 btr_anomaly.22.desc:0 "Gei Hinnom was clearly destined to be the target of a "gold rush". The tidally locked planet barely has any atmosphere to speak of, but is a dedicated Prothean burial ground. That means it has both element zero and Prothean technology in abundance. It won't be long before the planet is totally looted. We should step in before that happens."
 btr_anomaly.22.a:0 "We must discover all its secrets."
 btr_anomaly.22.b:0 "The other races won't understand, but preserving the Enkindlers' opus is above all."

 BTR_NEITH_SALTY:0 "The Missing Ingredient"
 salty_desc:0 "There are many worlds that we can survive on, but our preferred crops cannot. In some cases local crops are acceptable substitutes but in many cases we produce fertilizer to allow our crops to spread across the stars with us. This means we are constantly looking for the base materials needed to create fertilizer and theres a chance we just found the motherload!"
 btr_anomaly.23.name:0 "Agri-Minery"
 btr_anomaly.23.desc:0 "Although mostly a barren, cold rock with a thin nitrogen atmosphere, Neith is warm enough for liquid water to pool during the summer periods at its equator, where vast salt flats sit. The revealed salt can be collected and exported, as it is an ingredient for fertilizers necessary for agriculture in sodium-poor worlds."
 btr_anomaly.23.a:0 "Whatever generates profit."

 BTR_OSARI_SOARING_SOLAR:0 "Void-Thermal"
 soaring_solar_desc:0 "While space can be extremely cold there are regions of intense, overbearing heat. Heat is something we know how to harness and use, if we can tap into that perhaps it would provide a new source of reliable energy?"
 btr_anomaly.24.name:0 "Boiling Planetoid"
 btr_anomaly.24.desc:0 "Osalri is a boiling hot dwarf planet close to the G-class star Imir. It doesn't offer anything interesting, scientifically or otherwise. Nonetheless, this planetoid used to have solar arrays orbiting it that collected energy from its heat, but they were destroyed a century ago by pirates. Scientist [leader.GetName] thinks it might be useful to rebuild them."
 btr_anomaly.24.a:0 "We should repair those solar arrays."

 BTR_GREGAS_BREATHING_ROCK:0 "A Shrinking Planet?"
 breathing_rock_desc:0 "We maintain an extensive database of the planets that we have scanned, even ones that haven't been visited in generations. Its not often random planets are compared to it but recently an exploration team reported a new scan of a planet that was last visited ages ago; and it is significantly smaller? While it has been a long time by our standards cosmically, a planet shouldn't shrink that much that fast."
 btr_anomaly.25.name:0 "Atmospheric Cycle"
 btr_anomaly.25.desc:0 "Gregas is a cold rock. It is composed of 65 percent igneous rock by mass and 35 percent frozen methane and nitrogen ices. However this composition changes during the "summer years" when these ices are heated by its sun and evaporated into a thin atmosphere, which then proceeds to go back to the surface during the "winter years."
 btr_anomaly.25.a:0 "Curious."

 BTR_UZIN_GAS_EXPLOSION:0 "The Giant Nextdoor"
 gas_explosion_desc:0 "Solar system layouts are well understood and we have thousands of examples behind our current understanding of how solar systems form. However [system.GetName] is an outlier, its gas giant is far too close to its star and many believe this is so far outside of what is expected that it must be studied."
 btr_anomaly.26.name:0 "Unstable Orbit"
 btr_anomaly.26.desc:0 "Named in honor of a Krogan god of vengeance, Uzin couldn't have possibly formed where it stands today, as it is located well within the "frost line" where gas giants usually do not form. Our science ship [ship.GetName]'s crew theorize its orbit used to be further from the star. This points to the gas giant having a seriously unstable orbit that may see it on a crash course into its star within a few million years."
 btr_anomaly.26.a:0 "So it would seem."

 BTR_TAMAHERA_PAST_PRIME:0 "Past Prime"
 past_prime_desc:0 "One of the saddest parts of exploring space is finding planets that were lush garden worlds long ago but have since transformed into barren rocks. It can be hard to tell with the naked eye but once you start noticing the signs it is hard to see anything else."
 btr_anomaly.27.name:0 "Ancient Hydrosphere"
 btr_anomaly.27.desc:0 "Geological scans of Tamahera point to a very different environment in the distant past. The presence of canyons and flood plains indicates that liquid water once existed. Tamahera must have had a thicker atmosphere back then than its present thin halo of carbon dioxide and xenon. It probably lost most of it during the last hundreds million years."
 btr_anomaly.27.a:0 "The more you study the galaxy, the more you realize so many planets could've been teeming with life."

 BTR_KENDAGON_SCOURGED:0 "The Scourged Planet"
 scourged_desc:0 "Planets have odd shapes and sizes with strange geologic features being fairly typical. Yet, the giant chasm that many refer to as "The Great Rift Valley" is far beyond anything that we've seen before and has many wondering how tectonic activity could create something so dramatic."
 btr_anomaly.28.name:0 "The Great Rift"
 btr_anomaly.28.desc:0 "Klendagon is just an arid terrestrial world of average size. However, scientist [leader.GetName] couldn't help gazing at an enormous geological anomaly as soon as our science ship reached its orbit: the Great Rift valley that stretches across the southern hemisphere. What is most fascinating about the Rift is that it does not appear to be formed by natural tectonic forces."
 btr_anomaly.28.a:0 "Find out what created that rift."

 BTR_ATAHIL_CLOUDED_HELL:0 "Clouded Hell"
 clouded_hell_desc:0 "Hothouse worlds are hard to study due to the immense heat, pressure, and dense opaque clouds. Yet, that just makes our scientists want to study them more and on one attempt the readings came back, strange. Hidden beneath the clouds, worn by the intense pressure and heat, the garbled readings seem to indicate structures of some form?"
 btr_anomaly.29.name:0 "Orbital Bombardment"
 btr_anomaly.29.desc:0 "Today's Atahil is one more of the many Venusian hothouses through the galaxy, but it seems it wasn't always like this. Although evidence has almost totally vanished after millions of years of high pressure, the signs of orbital bombardment are unmistakable. It surely must be related with the similar evidence of an old conflict the Schwarzschild system bears."
 btr_anomaly.29.a:0 "So strange."

 BTR_ETAMIS_TRAMPLED_FLOWERS:0 "Trampled Flowers"
 trampled_flowers_desc:0 "The world of [planet.GetName] sticks out as one that clearly had a living ecosystem and possibly complex life at some point in the distant past. That much is so obvious because of the clear signs that it was saturation bombarded at some point in the distant past. Bombarding a world so dramatically has been discussed but rarely if ever attempted, perhaps the ancient galactic powers were more ruthless than our enlightened modern day? Perhaps whoever lived on [planet.GetName] was so vile as to deserve it. The only way to find out is to land and dig."
 btr_anomaly.30.name:0 "Postgarden World"
 btr_anomaly.30.desc:0 "Since our science ship [ship.GetName] arrived at Schwarzschild its crew has known something is wrong with Etamis. A superterrestrial world larger than most garden worlds, it shows clear evidence of an saturation orbital bombardment. It is an unique occasion to study the remains of this 20-40 million years old civilization."
 btr_anomaly.30.a:0 "Let's do it."

 BTR_LINOSSA_NANO_RINGS:0 "Nano-Rings"
 nano_rings_desc:0 "Gas Giants having rings is something used to describe so obvious as to not warrant mention. Even fairly thin rings are common enough, but not these rings. The rings around [planet.GetName] are thin, but the pieces that make them aren't as uniform as we would expect for such a thin ring. They are also giving far more metallic readings than normal and our scientists are eager to find out why."
 btr_anomaly.31.name:0 "Rings of Debris"
 btr_anomaly.31.desc:0 "Just like most of the planets on this system, the gas giant Linossa bears the marks of a former civilization. It is surrounded by several thin rings of debris. Analysis of this debris has been difficult due to extreme age and fragility, but several apparently nano-manufactured materials have been identified."
 btr_anomaly.31.a:0 "They probably were helium-3 fueling stations."

 BTR_MNEMOSYNE_STABLE_PLASMA:0 "Stable Plasma?"
 stable_plasma_desc:0 "While we don't normally make detailed scans of stars some scientists, have noticed that passing scans of [planet.GetName] have some odd quirks. Many that it seems every scan caught the northern wind patterns in at exactly the same phase which feels unlikely. They are requesting equipment be made available to look into this more deeply."
 btr_anomaly.32.name:0 "Grativic Anomaly"
 btr_anomaly.32.desc:0 "As with all brown dwarfs, Mnemosyne is a failed star that couldn't quite acquire enough mass to start its nuclear fusion reaction. All that is normal. What is not is the minor gravitic anomaly in the northern hemisphere. This area of unexpectedly low mass did not move with the prevailing wind patterns."
 btr_anomaly.32.a:0 "Unfortunately it's not feasible to reach that area unless there was something really interesting."

 BTR_LETHE_PULLED_APART:0 "Cold Tectonics"
 pulled_apart_desc:0 "Tectonic activity is normally a sign of a planets internal molten core, which requires planets to be a certain size or density. [planet.GetName] is not big enough or dense enough to start tectonic activity and yet we see tectonic activity on it?"
 btr_anomaly.33.name:0 "Gravity-Induced Tectonics"
 btr_anomaly.33.desc:0 "Tectonic activity is usually caused by a celestial body's own heat. However, scientist [leader.GetName] has discovered that Lethe, Mnemosyne's biggest moon, has a constant weak tectonic activity driven by the tidal fluxes of Mnemosyne's gravity. Several large, ancient volcanoes release wide-ranging flows of molten silicate."
 btr_anomaly.33.a:0 "Interesting."

 BTR_CORANG_SMOG_WORLD:0 "Smog Haze"
 smog_world_desc:0 "It may not look like it but [planet.GetName] is a garden world, or it will be in several thousand years. It is undergoing a phase that we believe every garden world went through with the notable except that our readings have some anomalies that are consistent with previously discovered Prothean ruins."
 btr_anomaly.34.name:0 "Primordial World"
 btr_anomaly.34.desc:0 "Corang is a world similar to many garden worlds in their early stages: its atmosphere is a smog of methane, ammonia, and water vapor. It also has high density and active plate tectonics, suggesting a high internal heat fueled by a greater than normal concentration of heavy elements and radioactives. Moreover, our orbital scans suggest it may host a Prothean site."
 btr_anomaly.34.a:0 "Then we shall further investigate it."
 btr_anomaly.34.b:0 " These ones shall not despoil the Enkindlers."

 BTR_SERAO_STORM_TWINS:0 "The Dual Storms"
 storm_twins_desc:0 "[planet.GetName] is a fairly standard gas giant with the mix of gases we'd expect, in the orbit we'd expect, and about the size we'd expect. What we can't explain is the two unmoving storm fronts at its poles. Storms aren't unheard of in gas giants but having two massive ones, centered on the poles, that never move is strange."
 btr_anomaly.35.name:0 "Twin Storms"
 btr_anomaly.35.desc:0 "A standard hydrogen-helium gas giant with a high number of moons, Serao stands out because of its pair of gigantic storm cells; one in the northern hemisphere, and one in the south. Our science ship [ship.GetName]'s crew are recommending us to study them more thoroughly."
 btr_anomaly.35.a:0 "Makes you wonder how many celestial wonders we are yet to discover."

 BTR_VECCHIO_SHALLOW_GRAVES:0 "Shallow Graves"
 shallow_graves_desc:0 "The planet of [planet.GetName] has a series of large mountain ranges and fairly simple life it is the sort of planet that we try to check on periodically to see how the life has evolved and adapted to changes in the planets ecosystem."
 btr_anomaly.36.name:0 "Cemetery"
 btr_anomaly.36.desc:0 "Our science ship [ship.GetName] has discovered a group of partial graves hidden in Vecchio's equatorial mountain ranges. The ancient skeletons in the burial sites were obviously humanoid but incomplete and poorly preserved, which has made them difficult to identify. Fragments of primitive ceramic grave goods were also found nearby."
 btr_anomaly.36.a:0 "A cemetery, huh?"
 btr_anomaly.36.b:0 "Council regulation forbid to disturb burial sites."

 BTR_VOLTURNO_SUPER_FROZEN:0 "Super Frozen"
 super_frozen_desc:0 "Interstellar colonization is a complicated process considering you need to find a planet that is both the right type and at the right stage in its life. What often happens is we will find planets that we know will be habitable in a few thousand years, or we know they were habitable a few thousand years ago, but we cannot use them with extensive terraforming. This can be done, but it is expensive and time consuming and generally not worth the investment outside of rare circumstances or pet projects."
 btr_anomaly.37.name:0 "Crushing Gravity"
 btr_anomaly.37.desc:0 "Volturno is a so-called "super Earth" with a crushing gravity currently enduring an ice age except for the equator, where most organic life - mostly lichens and algae - reside. Its atmosphere contains lethal amounts of carbon dioxide in addition to its oxygen. The planet also hosts some roaming packs of Vorcha squatters living miserable existences."
 btr_anomaly.37.a:0 "Huh. Poor devils."
 btr_anomaly.37.b:0 "With interest: We must acquire funds to terraform this planet and evict the Vorcha."
 btr_anomaly.37.c:0 "Vorcha stronk, this planet is livable!"

 BTR_POLLINO_EEZO_FRAUD:0 "Caleston 2?"
 eezo_fraud_desc:0 "The extranet had been flooded recently with leaked reports that claim someone found a giant stash of Element Zero buried under [planet.GetName] this has sparked a media sensation across the galaxy as people race to figure out its validity and its origin. We can try checking on the source just to make sure these leaks are accurate."
 btr_anomaly.38.name:0 "Extranet Scam"
 btr_anomaly.38.desc:0 "Here lies Pollino, a pretty common gas giant, if only a little small. Is only famous due to having become an Elcor-designed scam: news stories seeded throughout the extranet claimed that element zero was being found on Pollino's moons in record lodes. This turned out to be a scam spread by the Dunawurachum Consortium, an elcor corporation trying to scare up investors."
 btr_anomaly.38.a:0 "And they say Elcor are not bold."
 btr_anomaly.38.b:0 "Shamelessly: A necessary deception to further our interests."

 BTR_ZEONA_ZEONA:0 "Sulfuric Air"
 zeona_desc:0 "The planet of [planet.GetName] has caught the attention of our scientists for the sheer concentration of of sulfuric gasses in its atmosphere thanks to the plethora of active volcanoes across its surface. This gives us an opportunity to study a unique phenomena and possibly test advanced filtration and environmental gear."
 btr_anomaly.39.name:0 "Sulfur-Devouring Bacteria"
 btr_anomaly.39.desc:0 "A thin atmosphere of sulfur dioxide and trioxide created by the many volcanic vents have given rise on Zeona to a very unique kind of native bacteria whose diet consists of raw sulfur. Although it is possible that these bacteria were spread to this world by panspermia either through asteroids or accidental contamination by spacefarers."
 btr_anomaly.39.a:0 "We should study these lifeforms."

 BTR_ODASST_ODASST:0 "Double Dipping"
 odasst_desc:0 "Many of our most important mineral mines are on remote, isolated, and far flung facilities which makes oversight difficult to say the least. On one hand, these facilities can be raided and their resources hauled away. On the other, nefarious local managers may begin selling small quantities off to outlaw groups or even legal enterprises but pocket the money. As unglamorous as it is, its also one of the most important things our lae enforcement does."
 btr_anomaly.40.name:0 "Spectre Business"
 btr_anomaly.40.desc:0 "Odasst has an abundance of heavy metals and radioactives heavily mined for said resources. Forty-three years ago, a Council Spectre arrived to investigate reports that the businesses were selling platinum - a strategic metal - to pirate groups in the Terminus Systems. The results of the investigation were never released."
 btr_anomaly.40.a:0 "No death reported at least."
 btr_anomaly.40.b:0 "The damn Council should mind its own business."
 btr_anomaly.40.c:0 "REPORT ME TO THE DEVS"

 BTR_HESANO_PROTHEAN_PILFERING:0 "Prothean Pilfering"
 prothean_pilfering_desc:0 "There's a lot of activity around [planet.GetName] and its orbital path through the system. Nothing seems dangerous or illegal but it is odd?"
 btr_anomaly.41.name:0 "Prothean Artifacts' Scavengers"
 btr_anomaly.41.desc:0 "Two hundred years ago a lucky Volus prospector came across the wreck of a Prothean ship trapped within Hesano's trailing Lagrange point. He sold its location to a turian paleotechnology firm for nearly a million credits. Since then, Hesano's Lagrange points, rings, and moons have been combed over by fortune hunters seeking to strike it rich the same way. Thus far, no additional artifacts have been recovered."
 btr_anomaly.41.a:0 "Lucky Volus... I wish we could find something too."
 btr_anomaly.41.b:0 "This blatant disrespect for the Enkindlers' works shall not to be stand."

 BTR_ZORYA_GREEN_FLAMES:0 "Esh Yerukah"
 green_flames_desc:0 "While the vast majority of planets have little to no life some have an overabundance of it. [planet.GetName] has the latter issue with such thick vegetation that it is nearly impossible to coexist and because so much of it is fungal in nature the air is saturated with green spores and pollen that whirl in the breeze, much of which is toxic."
 btr_anomaly.42.name:0 "Green Inferno"
 btr_anomaly.42.desc:0 "Zorya's temperate and tropical zones are overrun with plants and fungi of all kinds. As a result, the air in most habitable areas is choked with pollen and spores that range from benign to deadly. Colonists have to resort to clear-cutting and slash-and-burn farming to create habitable zones, and the more rural areas, where the spores are thickest, practically cannot be populated."
 btr_anomaly.42.a:0 "Truly a green inferno."
 btr_anomaly.42.b:0 "Good planet!"

 BTR_VINTAEL_BALL_OF_ICE:0 "Vanishing Dwarf"
 ball_of_ice_desc:0 "One of the local dwarf planets is comprised almost entirely of ice which has raised some speculation that it can be mined for fuel in ships or shuttles."
 btr_anomaly.43.name:0 "Ball of Ice"
 btr_anomaly.43.desc:0 "Though a dwarf planet, Viantel's large amounts of water have led to heavy development by water-cracking industries seeking to turn the planet into hydrogen-oxygen fuel for starship thrusters. Some are concerned that the rate of loss may cause instability to the structure: in just some centuries the radius of Viantel has decreased by two kilometers, indicating removal of over 72,000 cubic kilometers of ice."
 btr_anomaly.43.a:0 " Credits are credits tho."

 BTR_MATOL_MATOL:0 "Carbon Rain"
 matol_desc:0 "Many planets were written off long ago due to the fact that they did no already possess life. Today we have much more advanced terraforming technology and can do great things on planets that already have a dense atmosphere. This is raising calls for us to reevaluate planets and see if any previously thought uninhabitable just need a little work."
 btr_anomaly.44.name:0 "Lifeless Hydrosphere"
 btr_anomaly.44.desc:0 "A normal rocky planet, Matol stands out thanks to its dense atmosphere composed of carbon dioxide and argon, with a surprising amount of water vapor. Fogs and rain are common on the barren, lifeless surface. Unfortunately, the planet receives a lot of radiation to be colonised."
 btr_anomaly.44.a:0 "A candidate for terraforming, albeit low on the list."

 BTR_CLUNGON_DECEPTIVE_GIANT:0 "Deceptive Giant"
 deceptive_giant_desc:0 "The gas giant of [planet.GetName] has long puzzled our scientists. In many ways, it is a classic gas giant, but in others it is slightly off. For a long time we lacked the ability to look more into this and simply chalked it up to a lack of knowledge on our end. However, maybe now we can get to the bottom of this mystery?"
 btr_anomaly.45.name:0 "Deceptive Giant"
 btr_anomaly.45.desc:0 "What we had assumed was an abnormally small gas giant is, in fact, not. Beneath a deceptive cover of thick dust swirling in the upper atmosphere lies a regular planet. A barren planet, but a planet nonetheless. This has proven quite embarrassing to the astronomical community on [Root.Owner.Capital.GetName]."
 btr_anomaly.45.a:0 "Remarkable."

 BTR_SESMOSE_BACKSPRAY:0 "Shimmer in the Night"
 backspray_desc:0 "Recently a somewhat well known extranet artist published a series of artistic depictions of [planet.GetName] which went viral. Now there are hundreds of artists producing their own takes and public discourse has started revolving around the planets beautiful rings and why it has them."
 btr_anomaly.46.name:0 "Ring of Ice Crystals"
 btr_anomaly.46.desc:0 "Sesmose is an ice dwarf world that appears unremarkable at first, but its unusually large and beautiful ring of ice crystals has made it a popular subject for visual artists. The ring is the result of a glancing equatorial impact, which left a large "trench," and threw a great deal of melted water into the atmosphere. The rings are a temporary feature that will completely decay in a few thousand years."
 btr_anomaly.46.a:0 "Beautiful."

 BTR_FARNURI_RAPID_GLASS:0 "Flash Vaporization"
 rapid_glass_desc:0 "The planet of [planet.GetName] is a strange case. Its star is very young and it is now a barren rock but there are reportedly signs that it once had an atmosphere and even liquid water. If that is true, this planet had to have raced through the planetary lifecycle at record speed and is now enjoying retirement for the rest of time."
 btr_anomaly.47.name:0 "Impossible Oxidation"
 btr_anomaly.47.desc:0 "Farnuri has a trace atmosphere of carbon dioxide and helium. The surface is mainly composed of silica laced with iron oxides, indicating the world had an oxygenated atmosphere at some time in the past. Given the relative youth of the blue star Caspian and the significant gravity well of Farnuri, this must have occurred with astonishing swiftness, perhaps a result of some cataclysmic event."
 btr_anomaly.47.a:0 "Further research is required."

 BTR_ALMARCRUX_ALMOST_PERFECT:0 "Almost Perfect"
 almost_perfect_desc:0 "As our terraforming knowledge and technology improves we have been reevaluating planets that had previously been written off. [Planet.GetName] is on the top of that list as it is ever so close to being a habitable world. If we wait a few thousand years it will likely reach a habitable state on its own."
 btr_anomaly.48.name:0 "Almost Habitable"
 btr_anomaly.48.desc:0 "Almarcrux has an atmosphere of methane and ethane, but despite the distance from Caspian, the energetic young star heats the surface to temperate levels. It also has abundant water and relatively mild gravity. However, there also are primitive methanotrophic bacteria that may be a precursor to a full-fledged native ecology, so if we wanted to terraform the planet there would be significant opposition from eco-ethics groups."
 btr_anomaly.48.a:0 "It just needs a little push to be habitable."
 btr_anomaly.48.b:0 "We have to take a long-term view, we can just appropriate everything in the galaxy."

 BTR_CHASCA_KALEIDOSCOPE:0 "Artificial Rings"
 kaleidoscope_desc:0 "For many years we assumed this planet had a relatively distinct but natural ring formation around it. However, upon closer examination from a potential colonial expedition it became clear that the rings are made of some sort of alien alloy?"
 btr_anomaly.49.name:0 "Artwork"
 btr_anomaly.49.desc:0 "Chasca is a tidally locked large, but low density world with a thin band apt for colonisation. What makes it stand out is its unique ring. It appears to be, for lack of a better term, a massive piece of alien "installation art." The rings are made of small pieces of synthetic material, and are almost invisible from space. From the ground, they catch and scatter the light of Matano in picturesque ways. It is not known who created the ring or when."
 btr_anomaly.49.a:0 "A most curious piece of work."

 BTR_APO_SHAKING:0 "Constant Rumbles"
 shaking_desc:0 "We have encountered many planets that possess some form of tectonic activity. Ranging from very little to highly dramatic, there is a wide range based on many factors, and then there is [planet.GetName] which has such dramatic tectonic activity so frequently that topographical maps of the planet are completely outdated every time we visit."
 btr_anomaly.50.name:0 "Hyperactive Tectonism"
 btr_anomaly.50.desc:0 "A craggy world of igneous and basaltic mountains, Apo is wracked by constant geologic activity. While volcanic hotspots are rare, continental plates are constantly piling up new mountains, subducting old ones, or causing slips along transform faults."
 btr_anomaly.50.a:0 "Unexpected."

 BTR_APO_GIANT_GEM:0 "Truly Red World"
 giant_gem_desc:0 "In space, red is generally seen in particularly iron rich barren worlds or stars at various stages in their lives. Finding a gargantuan red planet hiding at the edge of a system was quite a shock to put it mildly."
 btr_anomaly.51.name:0 "Ruby Giant"
 btr_anomaly.51.desc:0 "Ilapa is another gas giant like the thousands we already know. Everything is normal... except its coloration. It has an unusual ruby color caused by contaminants in the atmosphere. It is quite the sight to behold."
 btr_anomaly.51.a:0 "It's beautiful."
 btr_anomaly.51.b:0 "As Siari teachings say, we all are vessels for the universe to teach us."
 btr_anomaly.51.c:0 "Deep red color, profound effect on minds. Implications, useful."
 red_world_asari:0 "Planetary Gem"
 red_world_asari_desc:0 "Our people are inspired by the beauty of the Ruby Giant Ilapa"
 red_world_salarian:0 "Psycho-Visual stimuli"
 red_world_salarian_desc:0 "Upon discovering the effects that the planet of Ilapa had on our council colleagues we have begun researching exactly how the process works and potential use cases."

 BTR_NORDACCRUX_POLLEN_PAIN:0 "Untouched Gem"
 pollen_pain_desc:0 "Preliminary reports show that [planet.GetName] is a nearly perfect world for colonization. At the same time, it has no signs of past inhabitants or any efforts of colonization at all. Doing some research has revealed nothing either, as if this planet simply doesn't exist?"
 btr_anomaly.52.name:0 "Poisonous Pollen"
 btr_anomaly.52.desc:0 "While Nodacrux appears to be a perfect candidate to be colonised, our scientists [leader.GetName] has discovered that its thicker, oxygen-rich atmosphere produces thunderstorms that are deafening and spark constant wildfires. Even worse are the large and ubiquitous tufts of pollen that float in the high-pressure air. To oxygen-breathing species, they cause severe or fatal allergic reactions."
 btr_anomaly.52.a:0 "A pity, it's a beautiful garden world."

 BTR_SUEN_OPERA_PHANTOM:0 "A Phantom Opera"
 opera_phantom_desc:0 "There is something, nearly reverent about visiting battlefields. No matter how long ago they were fought."
 btr_anomaly.53.name:0 "The Final Song"
 btr_anomaly.53.desc:0 "Suen was the rachni's homeworld. At the final point of the Rachni Wars krogan commandos infiltrated Rachni vast underground nests carrying weapons of mass destruction into the secret chambers of the Rachni queens and detonated explosions so powerful the sinkholes are still visible today."
 btr_anomaly.53.a:0 "The tragic end of a species."
 btr_anomaly.53.b:0 "Good ol' days."
 btr_anomaly.53.c:0 "Our foremothers' sour notes were put to an end."
 rachni_visit:0 "Visit to Suen"
 rachni_visit_desc:0 "Its been a long time since we had to beat the bugs back into dark space. But it still feels good to trample on their ruined homeworld just for old times sake."

 BTR_KASHSHAPTU_ANCIENT_EEZO:0 "Scanned With Songs"
 ancient_eezo_desc:0 "The Rachni were the first ones to explore large stretches of the region and in doing so they discovered several mineral rich planets with [planet.GetName] likely being their crown jewel."
 btr_anomaly.54.name:0 "The Howling Gulf"
 btr_anomaly.54.desc:0 "The Rachni made an important discovery when they charted "the howling gulf," an enormous crater near the planet's equator. The depression was caused by the impact of several dozen extrasolar asteroids containing large quantities of element zero."
 btr_anomaly.54.a:0 "Eezo was mined out millennia ago though"

 BTR_LISTENING_POST_X-19_EXILE_POST:0 "Abyssal Staring"
 exile_post_desc:0 "On a lonely rock, in a dead system, in a cluster ravaged by war, sits a small installation crewed by dreary soldiers questioning where it all went wrong."
 btr_anomaly.55.name:0 "Listening Post X-19"
 btr_anomaly.55.desc:0 "Maskim Xul was the old Rachni home system; when they were declared extinct at the end of the Rachni Wars the Citadel Council was keen on making sure they stayed that way, building the Listening Post X-19 to monitor the Nimah Cluster for Rachni sightings. Among members of the Council militaries, being assigned to the station is seen as a form of punishment or exile since it has been thousands of years since the Rachni Wars."
 btr_anomaly.55.a:0 "Really an uneventful post."
 btr_anomaly.55.b:0 "Our crescendo will be known again."

 BTR_UTTUKU_WIND_SWEPT:0 "A Blasted Haven"
 wind_swept_desc:0 "The planet of [planet.GetName] has some clear hindrances to its habitability. It has less water than would be ideal, but it has some. From orbit we can see that it must have strong wind patterns today or have had them in the past. But it does seem to have a decent amount of flora which is often an indication of some level of fauna."
 btr_anomaly.56.name:0 "Savage World"
 btr_anomaly.56.desc:0 "Scientist [leader.GetName] informs that Utukku is habitable, but has extreme temperatures and violent weather, and it also has little liquid water to retain heat, so surface temperatures regularly oscillate between 70 C to -60 C. Utukku's vegetation has evolved flexible central stalks to survive high-speed winds as well as leathery leaves to shrug off the planet's frequent sandstorms. Animal life is mostly confined to the planet's small oceans."
 btr_anomaly.56.a:0 "There are rocks out there more alluring."

 BTR_KEPH_DISAPPEARING_REFINERIES:0 "Refining Constellation"
 disappearing_refineries_desc:0 "[planet.GetName] is a large helium refinery world. It is dotted with large refinery complexes orbiting around it which use specialized shuttles to scoop the unrefined helium out of its atmosphere and bring it back for refining."
 btr_anomaly.57.name:0 "Missing Infrastructure"
 btr_anomaly.57.desc:0 "Keph is a hydrogen-helium gas giant. Records show that the planet should have a helium-3 mining infrastructure, but scans find nothing of the sort. There are neither abnormal heat sources nor space junk from destroyed refineries. If the infrastructure was removed, it was removed entirely very recently."
 btr_anomaly.57.a:0 "What...?"

 BTR_BANNIK_BLUE_ROCKS:0 "Promising Scans"
 blue_rocks_desc:0 "Cursory scans of the [system.GetName] system show that the world of [planet.GetName] has many of the markers we associate with being resource rich. We will need to do more detailed orbital scans to confirm and determine exactly what resources it is holding but we are confident that this is a worthwhile endeavour"
 btr_anomaly.58.name:0 "Crushing Rock"
 btr_anomaly.58.desc:0 "Bannik shows all signs of a mineralogical treasure trove. There's only one problem: the planet is a large superterrestrial "hothouse" with a crushing carbon dioxide atmosphere. There's no way to safely reach its seas of molten metal and lodes of radioactives."
 btr_anomaly.58.a:0 "Such a pity."

 BTR_PRAGIA_VAULT22:0 "Artificial Jungle"
 vault22_desc:0 "Our scans indicate that the planet of [planet.GetName] is a flora rich planet but our models indicate that it likely shouldn't be. Its possible that life on this planet has some sort of accelerant factor, or our baseline assumptions about the planet are wrong. We won't know until we look closer."
 btr_anomaly.59.name:0 "Maddened Flora"
 btr_anomaly.59.desc:0 "Scientist [leader.GetName] reports that Pragia is choked by the hyper-growth of non-native industrially-mutated plant species. Two centuries ago, batarian agribusiness chose uninhabited Pragia as their empire's breadbasket. They introduced said plants that, synergizing with Pragia's natural geothermal conditions and chemotropic microbes, soon became a nightmare. [leader.GetName] predicts soil exhaustion in 400 years."
 btr_anomaly.59.a:0 "A reminder about the imperative for careful regulation during colonization."
 btr_anomaly.59.b:0 "Nothing to see here, citizen."

 BTR_YAMM_THALASSOPHOBIA:0 "Oceanic Hell"
 thalassophobia_desc:0 "The planet of [planet.GetName] has vast oceans which are clearly visible from orbit but are far deeper than on most other planets. This likely has severe knock on effects for what would otherwise be a fairly habitable world."
 btr_anomaly.60.name:0 "Hostile Oceans"
 btr_anomaly.60.desc:0 "Yamm's oceans can be quite hostile to sapient life: The heat from its extremely long days reaches dangerous levels and Hurricanes run unchecked across the oceans. But the real danger are the predominant life forms, various kinds of toxic algae blooms that stretch hundreds of kilometers across."
 btr_anomaly.60.a:0 "Have to be careful with what you eat down there."

 BTR_NORESHA_STELLAR_LONELINESS:0 "Stellar Loneliness"
 stellar_loneliness_desc:0 "Somehow, seeing a dying ancient star with but a few icy rocks and knowing that it once had dozens of stellar bodies accompanying it through space makes even the most extroverted of us pause."
 btr_anomaly.61.name:0 "Planetary Loneliness"
 btr_anomaly.61.desc:0 "Qertassi's only planet, Norehsa is an unremarkable ice giant. It is likely that the Qertassi system had additional worlds earlier in its history, but these have been swallowed by the aging giant star that is on its final stage of life. Only a small family of icy moons accompany Norehsa these days."
 btr_anomaly.61.a:0 "Nothing to see here."

 BTR_433_SPIDAU_FINAL_FLAMES:0 "Final Flames"
 final_flames_desc:0 "It is rare but easy to tell if a planet has undergone a nuclear apocalypse."
 btr_anomaly.62.name:0 "Nuclear Apocalypse"
 btr_anomaly.62.desc:0 "Our science ship {insert ship's name} has just chartered 433 Spidau. Apparently it was inhabited by a sapient species, which destroyed itself through nuclear warfare around 1,000 years ago. Scans show the ruins of over ninety cities on the planet are still radioactive. Further research is necessary."
 btr_anomaly.62.a:0 "And with this discovery, we know of seven races that perished in conflicts with nuclear weapons."
 btr_anomaly.62.b:0 "They were weak, otherwise they would've built an even stronger civilisation over their ruins."

 BTR_PHILAE_QUIET_OUTPOST:0 "Strange Formations"
 quiet_outpost_desc:0 "The planet of [planet.GetName] has some odd geological formations, other planets in the system have similar oddities."
 btr_anomaly.63.name:0 "Prothean Outpost"
 btr_anomaly.63.desc:0 "Our scans have led us to make an unexpected finding. Philae hosts the remains of at least one outpost of apparent Prothean design relatively well conserved. We must ensure its potential technology for us before someone else gets to hoard it."
 btr_anomaly.63.a:0 "Let's do it."
 btr_anomaly.63.b:0 "It is not up to these ones to profane this holy site."

 BTR_AGETON_DOWNED_SAT:0 "Distant Ruins"
 downed_sat_desc:0 "Of all the hothouse worlds we have surveyed and heard of there has never been previous signs of habitation until today. While scanning the hothouse world of [planet.GetName] we detected clear signs of debris scattered across a large portion of the planet. This debris is far too extensive to be from a single ship and it is too cohesive and localized to realistically be from a group of ships. If we get closer we can refine our scans and hopefully get a better understanding of what is laying on the surface of this horrific world."
 btr_anomaly.64.name:0 "Prothean Aerostat Colonies"
 btr_anomaly.64.desc:0 "A mild hothouse planet, Agetoton's scorching hot surface is littered with debris that may be the wreckage of downed Prothean aerostat colonies. Based on the size of the debris fields, a population of over 100,000 was likely."
 btr_anomaly.64.a:0 " A tragic end."

 BTR_ZAFE_LAST_AND_LOST:0 "Last and Lost"
 last_and_lost_desc:0 "Many believed it was a myth, others argued it had since been destroyed by a super nova, some cynics claimed a black hole had annihilated it, yet here it is."
 btr_anomaly.65.name:0 "Here Lies Ilos"
 btr_anomaly.65.desc:0 " Ilos is a world known only through second-hand sources. References to Ilos have been found at several other Prothean ruins, though direct study of the world is unlikely to occur. Four thousand years ago the Mu relay that connects this world with the rest of the galaxy was displaced by a supernova. We have now rediscovered it, and therefore Ilos too. Its secrets are now our own."
 btr_anomaly.65.a:0 " For many centuries the galaxy has been searching for Ilos. Now it's ours!"
 btr_anomaly.65.b:0 "This world must be preserved for all eternity as a temple of the Enkindlers!"

 BTR_ZAFE_BELTS:0 "Added Belts"
 belts_desc:0 "The planet of [planet.GetName] has many belts orbiting around it which seemed normal enough at first. However, as we started taking closer looks in preparation for potential mining operations it became clear that these were not naturally occurring belts and instead the fragments of, something?"
 btr_anomaly.66.name:0 "Belts of Debris"
 btr_anomaly.66.desc:0 "Zafe is a relatively small hydrogen and helium gas giant. There are several tenuous belts of debris in equatorial orbit. Spectral analysis of the material suggests artificial origin, perhaps the remains of stations that once mined Zafe for helium-3."
 btr_anomaly.66.a:0 "Old Prothean fueling stations, no doubt."

 BTR_SIANO_BUNKERS:0 "Terrestrial Voids"
 bunkers_desc:0 "Scanning systems does not give a very good picture of what is underneath the surface of a planet, at least not normally. That is what first drew our attention to [planet.GetName] our initial scans revealed that there are large voids that appear artificial due to the narrow surface opening and then significantly larger interior."
 btr_anomaly.67.name:0 "Radioactive Bunkers"
 btr_anomaly.67.desc:0 "Siano is a low-density rock tidally locked to its star, Dirada. Evidence that a complex of artificial structures once existed in the north of the sunward-facing hemisphere has been found. These structures have been badly degraded by millennia of heat and radiation. Several bunkers of radioactive waste, apparently byproducts of primitive fission plants, have been discovered on the other hemisphere."
 btr_anomaly.67.a:0 "Who could have built those?"

 BTR_CANALUS_HOT_SPIN:0 "Small but heavy?"
 hot_spin_desc:0 "The planet of [planet.GetName] is apparently much heavier than a planet of its size should be. Upon closer inspection it also has much more frequent, and intense, tectonic activity than we would expect for its size. This curiosity is something our scientists are eager to solve."
 btr_anomaly.68.name:0 "Highest Density"
 btr_anomaly.68.desc:0 "Although a relatively smaller than average world, Canalus has unusually high density. The high level of tectonic activity indicates that the density is caused by an abundance of radioactive materials in the core. These, combined with the planet's unusually high rate of spin, raise the planet's internal temperature and cause volcanism."
 btr_anomaly.68.a:0 "A pity, we could extract raw materials from this planet otherwise."

 BTR_NEIDUS_FROZEN_LOCKED:0 "Vent Life"
 frozen_locked_desc:0 "[planet.GetName] stood out as soon as we entered the system. It is far closer to the star than any of our models would have predicted and we aren't entirely sure how its orbit is so close but also so stable. This is something our scientists will line up to study."
 btr_anomaly.69.name:0 "Tidally Locked Frigid"
 btr_anomaly.69.desc:0 "Neidus is the exception to the norm by lying improbably close to the red dwarf Kriseroi, which allows it to approach habitability, though it is quite frigid. Neidus has developed a limited native ecology. Much of it clusters, permanently attached, around geothermal vents. There are, however, more advanced forms of life, most of which have limited vision, but finely-developed thermal sense."
 btr_anomaly.69.a:0 "Who would've thought?"

 BTR_THEONAX_ICE_PAVED:0 "Perfectly Smooth"
 ice_paved_desc:0 "Our efforts to scan [planet.GetName] caused strange readings and mechanical errors that we hadn't experienced before. After significant maintenance efforts and a reevaluation of the planet we discovered that the planets surface is so smooth in so many areas that it was reflecting the scans back at us. The readings were a jumbled mess of real data from the planet, hectic snippets of our own ship, and some data loss from waves being redirected away from our receivers. This is not something we have had happen before."
 btr_anomaly.70.name:0 "Cryovolcanic Pavement"
 btr_anomaly.70.desc:0 "Theonax's is covered by water and ammonia-hydrate ices, which are constantly repaved by cryovolcanic processes. The world's size and density suggest the core contains heavier elements, and retains much of the heat of the system's formation."
 btr_anomaly.70.a:0 "What a spectacle."

 BTR_CHITHES_FROZEN_PAST:0 "Frozen Past"
 frozen_past_desc:0 "Our scientists have long debated if [planet.GetName] has always been a massive ice ball or if at one point it was more temperate. Both sides have mountains "Evidence" and have argued for decades without any real progress being made to get to the truth of the matter, perhaps its time to put this issue to bed."
 btr_anomaly.71.name:0 "Subglacial Core"
 btr_anomaly.71.desc:0 "A gas giant's moon, Chiltress may have been very different millions of years ago. Scientist [leader.GetName] has collected evidence suggesting that Chithess was for many centuries a water-world, heated by tidal flexing as its orbit circularized around Uzin. The planetary ocean, once hundreds of kilometers deep, must now be frozen solid."
 btr_anomaly.71.a:0 "A shame its oceans are now frozen."

 BTR_ISALE_STRONG_MAGNET:0 "Giant Giant"
 strong_magnet_desc:0 "The gas giant of [planet.GetName] is immediately noticeable larger than we would anticipate for a gas giant. Why it is so much larger, and if this represents a motherload of Helium-3 remains to be seen."
 btr_anomaly.72.name:0 "Impossible Magnetic Field"
 btr_anomaly.72.desc:0 "Isale is a standard gas giant, and as expected with gas giants it has a powerful magnetic field. However, our science ship [ship.GetName]'s crew is confused with this one. Isale's field is stronger than current models predict."
 btr_anomaly.72.a:0 "Hmmm."

 BTR_RESCEL_HOT_JUPITER:0 "Hot Jupiter"
 hot_jupiter_desc:0 "Hot Jupiter gas giants are uncommon but not unheard of. We have a relatively clear understanding of how they function but we generally try to study any new ones we discover just to see if theres anything new it can teach us."
 btr_anomaly.73.name:0 "Temperate Hot Jupiter"
 btr_anomaly.73.desc:0 "Rescel is a massive "hot Jupiter" orbiting star Satent once every four and a half days. It is one of the few hot Jupiters to show a marked temperature difference in its sun-facing and dark-side hemispheres. The atmosphere absorbs and re-radiates Satent's heat too quickly for winds to carry the heat to the dark side."
 btr_anomaly.73.a:0 "The more you know!"

 BTR_ANEDIA_ICE_BANDITS:0 "Shaved Ice"
 ice_bandits_desc:0 "There is a icy planetoid named [planet.GetName] which has some odd features. Specifically, there is a specific zone that appears to be, missing? There is also a significant amount of ice shards floating around that half of the planetoid which is unusual."
 btr_anomaly.74.name:0 "Anedian Scrapes"
 btr_anomaly.74.desc:0 "Anedia is an ice planetoid whose mass is composed mainly of carbon and water ice. Pirates are known to land here thanks to its weak gravity to extract ice, to the point that one area in the southern hemisphere, the so-called "Anedian Scrapes," is so frequently used for this purpose that higher-albedo raw ice can be easily seen from orbit."
 btr_anomaly.74.a:0 "Beware pirates."

 BTR_NAMAKLI_VORCHA_FARM:0 "Vorcha Farm"
 vorcha_farm_desc:0 "Some see the vorcha as a blight or a plague, some see them as convenient shields, others as useful patsy's. Only the Asari would look at them and think that they could be model citizens with the right job and enough supervision. The strangest part is that the company was making money hand over first with its reduced labor costs."
 btr_anomaly.75.name:0 "Gone Native"
 btr_anomaly.75.desc:0 "Namakli, an arid garden world, was home to several Asari-Vorcha settlements. The Asari kept the Vorcha in line and helped them socialise while also making profits. An economic turndown saw them leaving the planet and the Vorcha alone, which have since turned violent and uncontrollable, and the colonies essentially have self-destroyed."
 btr_anomaly.75.a:0 "Vorcha? Socialised? Hah! They are nothing but vermin."
 btr_anomaly.75.b:0 "RAAAH! Asari bad, Vorcha no like colonialism!"
 btr_anomaly.75.c:0 "We must resume our operation here and save these Vorcha from barbarism."

 BTR_AZRAHAS_ANCIENT_RESEARCH:0 "Old Satellites"
 ancient_research_desc:0 "The planet of [planet.GetName] has several structures orbiting it that are clearly artificial. We cannot find any record of them so we believe that they are quite old yet they appear to be in stable orbits and in decent condition. Some of our scientists are proposing that we try to board these structures and discover their purpose."
 btr_anomaly.76.name:0 "Abandoned Orbital Stations"
 btr_anomaly.76.desc:0 "Azrahas is a hothouse planet rich in nitrogen, methane, and ethane. Decrepit orbital stations from scientific expeditions long ago circle the planet. None display signs of occupation. It should not be hard to have them operational again."
 btr_anomaly.76.a:0 "Good."

 BTR_ROSTESK_DERELICT_FUEL:0 "Old Stations"
 derelict_fuel_desc:0 "Our records show that at one point there was a flourishing Helium-3 supply stations and refining infrastructure that had begun falling into disrepair long ago. This began a feedback loop of travelers avoiding the area for its disrepair, losing the region money which drove further maintenance cuts, losing them more customers."
 btr_anomaly.77.name:0 "Neglected Helium-3 Stations"
 btr_anomaly.77.desc:0 "Rotesk is a methane-soaked gas giant. However, usual helium-3 fueling stations appear to have been neglected, just like the rest of infrastructure in the Zaherin system. Their kinetic barriers failed long ago due to neglect. The apparatus was destroyed by meteorites, probably originating in Rotesk's rings."
 btr_anomaly.77.a:0 "We could rebuild them without problem."

 BTR_JARFOR_WINDY_WORLD:0 "A Planet of Extremes"
 windy_world_desc:0 "The Planet of [planet.GetName] has a few interesting oddities. It is on the larger end of what we would expect, it is closer to the star than most other gas giants, and judging by the swirls we see in scans its atmospheric winds are quite fast. Any one of these would make our scientists curious, all three? They are close to demanding a chance to study it."
 btr_anomaly.78.name:0 "Tidally Locked Hot Jupiter"
 btr_anomaly.78.desc:0 "Jarfor is a close-orbiting "hot Jupiter" hydrogen-helium gas giant. What is surprising is that despite its great size, Jarfor is actually rather low-mass; the incredible heat of the star Hoc has caused its atmosphere to expand. In fact, Jarfor is so low-mass, it is tidally locked to Hoc. The temperature difference between the sunward "hot pole" and the dark side "cold pole" creates constant hurricane-force winds."
 btr_anomaly.78.a:0 "Another star system, another discovery."

 BTR_VIRMIRE:0 "A Dangerous Haven"
 virmire_desc:0 "[planet.GetName] is known among government and bureaucratic circles as a near perfect world for colonization. Unfortunately, it is destined to remain just out of our grasp."
 btr_anomaly.79.name:0 "Unreachable Paradise"
 btr_anomaly.79.desc:0 "Virmire is a lush tropical world located on the frontier of the Attican Traverse. Unfortunately, the political instability of the nearby Terminus Systems has impeded colonization efforts - the high risk of raids by pirates and slavers makes it an unappealing homestead. Many times there have been negotiations to colonise this world, and all have fallen apart."
 btr_anomaly.79.a:0 "What a shame, it's a beautiful world."

 BTR_PRESCYLA_A_MESSAGE:0 "Spontaneous Formation"
 a_message_desc:0 "We've received reports of strange formations that had never been noticed before on [planet.GetName]. We're unsure how this could have happened so suddenly but we are confident we can get to the bottom of it."
 btr_anomaly.80.name:0 "Batarian Message"
 btr_anomaly.80.desc:0 "Prescyla is a small planet, but that is not what caught scientist {insert name}'s attention. Recently, some Terminus pirate carved a message into the surface using ship-based laser weapons. In hundred-meter-wide batarian syllabic, the message proclaims the military prowess and virility of one "Captain Zaysh". A smaller postscript alludes to the questionable parentage of all humans."
 btr_anomaly.80.a:0 "So pointless."
 btr_anomaly.80.b:0 "Hah!"
 btr_anomaly.80.c:0 "Idiot..."

 BTR_SAPFIR_GEM_WORLD:0 "A Gleaming World"
 gem_world_desc:0 "Theoretically, we've known that diamond worlds are possible but actually finding one is quite a strange experience. This gives us the chance to practically study what had previous been exclusively a scientific concept."
 btr_anomaly.81.name:0 "Planet-Sized Compressor"
 btr_anomaly.81.desc:0 "Sapfir is the only planet in the far away Telith system. It's a singular world. A diamond world, to be more specific: with high levels of carbon and due to high temperatures and pressure on this planet much of it has formed into diamonds. Not only that, but this system was created thanks to a supernova, and therefore Sapfir's surface is littered with element zero."
 btr_anomaly.81.a:0 "We must secure the eezo!"

 BTR_PROSPECT_SPINNING_GRAVES:0 "A Dark Orbit"
 spinning_graves_desc:0 "It is largely forgotten today but to those who work in Helium-3 mining, refining, or logistics the dark past of [planet.GetName] is still fresh in memory."
 btr_anomaly.82.name:0 "Suicide By Spacing"
 btr_anomaly.82.desc:0 "Prospect is a hydrogen-nitrogen gas giant with 13 known moons which have heavy metal deposits. This incited a resource rush. In a tragic turn of events, a galactic uranium surplus drove half the mining firms out of business, and the surfaces of some moons are littered with the bodies of executives who committed suicide by airlock."
 btr_anomaly.82.a:0 "The men stood by the sill, calmly, and waited their turn to jump."

 BTR_HORIZON_NEW_PARADISE:0 "A New Paradise"
 new_paradise_desc:0 "Long range scans indicate that [planet.GetName] has potential to be an incredibly habitable world. More detailed orbital scans will be needed to confirm this, and ensure there aren't any local quirks that would disqualify it, but it has many in our government excited."
 btr_anomaly.83.name:0 "A Haven of Peace"
 btr_anomaly.83.desc:0 "Our science ship [ship.GetName] survey shows Horizon is a temperate world blessed with verdant forests and abundant fresh water. It has hit the "sweet spot" for carbon-based life, Horizon has a nitrogen-oxygen atmosphere maintained by abundant indigenous photosynthetic plants and bacteria. Its soil is perfect to cultivate nutritious, synthetic crops."
 btr_anomaly.83.a:0 "A nice planet."
 btr_anomaly.83.b:0 "Not our kind of world, unfortunately."

 BTR_IMANEYA_SHINING_WORLD:0 "Shining World"
 shining_world_desc:0 "Our initial scans of the system revealed a planet that we had previously only theorized about, a planet size gem. We identified this due to its absolutely absurd albedo which matches what we would expect based on our models."
 btr_anomaly.84.name:0 "Pure Ice"
 btr_anomaly.84.desc:0 "Imaneya is particularly large for a terrestrial planet, and it also has half the average density for garden worlds and an atmosphere of nitrogen and carbon monoxide. Its crust is composed mainly of water ice. This has led to its surface being made of pure water ice, whose whiteness gives it a high albedo."
 btr_anomaly.84.a:0 "Like a diamond in space."

 BTR_NEPMOS_HIGH_GROUND:0 "Unusual World"
 high_ground_desc:0 "Our scientists were drawn to [planet.GetName] partly because of its proximity to the galactic core but also due to the incredibly dramatic earthquakes and volcanic eruptions we've recorded that appear to happen constantly."
 btr_anomaly.85.name:0 "Magma Crust"
 btr_anomaly.85.desc:0 "Nepmos is a resource-rich terrestrial world somewhat larger and with a dense atmosphere of sulphur dioxide and argon. Nepmos' crust is very thin and unstable, not more than 8 kilometers deep in any location. Subsurface magma flows are a hazard to ground travel, and earthquakes are frequent. Even worse, it lies uncomfortably close to the "Five Kiloparsec Ring" around the galactic core, an area too dangerous to travel."
 btr_anomaly.85.a:0 "Too dangerous, indeed."

 BTR_QUAJI_FAIRY_PATERNS:0 "Odd Request"
 fairy_paterns_desc:0 "We have been asked to survey [planet.GetName] by a group of private exploration firms. They all report strange readings when attempting to survey the planet, patterns that appear in the terrain one moment but disappear the next. No two ships have been able to get the same readings of the planet and even the same ships surveying the planet multiple times get unique results each time."
 btr_anomaly.86.name:0 "Atmospheric Patterns"
 btr_anomaly.86.desc:0 "Quaji is a terrestrial planet with an atmosphere of methane and ethane. Our scans detect clouds of small water ice crystals are common here. Quaji's skies are full of fine silica dust. Our atmospheric scans are detecting geometric patterns in the northern hemisphere deserts, visible only in the ultraviolet band, but when we focus on those they disappear."
 btr_anomaly.86.a:0 "What..."

 BTR_CHOFEN_FALSE_LIFE:0 "Theorized Life"
 false_life_desc:0 "Our scientific community has long debated if life could exist in [planet.GetName]. Those in favor argue that because of the planets unique mass it has a liquid hydrogen ocean buried under its swirling clouds, an ocean that could contain the most alien life ever discovered. Those opposed argue that even if the oceans exist there is no evidence of hydrogen based life and no clear indication of how life could start in what would likely be the total darkness that deep into a gas giant. This debate is paralyzing our scientific community and becoming more heated each day, it might be time we sponsor an expedition to find out the truth."
 btr_anomaly.87.name:0 "Afloat Hydrocarbon Life"
 btr_anomaly.87.desc:0 "Chofen is an unusually small hydrogen-helium gas giant, with traces of sulphur and hydrocarbons in the atmosphere. Our initial scans provided inconclusive evidence of hydrocarbon life in the atmosphere (over 1000 meters below the cloud tops), where pressure compresses Chofen's hydrogen into a liquid state. We have just gathered conclusive evidence that those primitive lifeforms indeed exist here."
 btr_anomaly.87.a:0 "Incredible!"
 btr_anomaly.88.name:0 "Inconclusive Evidence"
 btr_anomaly.88.desc:0 "Chofen is an unusually small hydrogen-helium gas giant, with traces of sulphur and hydrocarbons in the atmosphere. Our initial scans provided inconclusive evidence of hydrocarbon life in the atmosphere (over 1000 meters below the cloud tops), where pressure compresses Chofen's hydrogen into a liquid state. Unfortunately, further probes haven't been able to handle the crushing pressure long enough to send back useful data."
 btr_anomaly.88.a:0 "It was to be expected."

 BTR_TIMSHAR_HIDDEN_STAR:0 "Hidden Star"
 hidden_star_desc:0 "The Protheans designed the Mass Relay network to aid their travel from star to star but even they couldn't reach every star. Many were skipped or left by the wayside, which makes [planet.GetName] all the more curious. The Pulsar is so dangerous that it is one of the few active Relays that are off limits to all but incredibly select vessels."
 btr_anomaly.89.name:0 "Pulsar Star"
 btr_anomaly.89.desc:0 "Timshar is stuff for legends and conspiracy theories, off-limits to civilian ships as almost none have enough protection to endure its radiation. It is one of the few non-standard stars reachable with the mass relay network. Even more curious is the signs of Prothean presence eons ago. Why they ventured here is a mystery in itself."
 btr_anomaly.89.a:0 "Still, it's worth researching a pulsar star."

 BTR_ADOUNIA_E_LIGHTSHOW_RESEARCH:0 "Light Show Research"
 lightshow_research_desc:0 "The system of [system.GeTName] is highly dangerous due to the pulsar star at its heart and is currently restricted to almost all traffic. However, we have evidence that this was not always the case. According to what little information we have on the system, the Protheans operated a research station on the moon of one of the planets and who knows what secrets lay in such an inhospitable outpost?"
 btr_anomaly.90.name:0 "Prothean Scientific Station"
 btr_anomaly.90.desc:0 "Unlike the other barren celestial bodies on the Timshar system, Adounia's fourth moon hosts a peculiar discovery. An old Prothean research station is located on this moon. They were probably studying Timshar itself, but we will have to further research these ruins to be sure."
 btr_anomaly.90.a:0 "It's worth the radiation risks."
 btr_anomaly.90.b:0 "These ones must not disturb the Enkindlers."

 BTR_MINDOIR_DANGEROUS_PARADISE:0 "Dangerous Paradise"
 dangerous_paradise_desc:0 "We maintain a list of planets that have the potential for colonization and occasionally revisit them to make sure they still deserve their spot on the list. [Planet.GetName] has been on the list for quite a while and there has always been some debate about it. The planet itself is never in question, instead it is one of few planets that have external factors raising questions on if it should be removed or not."
 btr_anomaly.91.name:0 "A Nice World"
 btr_anomaly.91.desc:0 "A slightly dry world with temperate pole regions and complex biota, Mindoir is a good candidate for colonisation. The planet's location deep in the Traverse makes it a dangerous place to live nonetheless, since any slaver or pirate gang could raid the place before reinforcements could arrive to defend it."
 btr_anomaly.91.a:0 "A nice place to retire. The neighbourhood could be better though."

 BTR_AMAR_LOW_G:0 "A Garden Alone"
 low_g_desc:0 "The planet of [planet.GetName] got significant attention when we arrived in the system as it has all the hallmarks of a garden world. We won't be able to officially declare it as such until we do orbital scans to confirm the longer range scans and search for any disqualifying factors but for the time being, there is a lot of excitement on the [ship.GetName]"
 btr_anomaly.92.name:0 "Low-Gravity Garden World"
 btr_anomaly.92.desc:0 "Amar is a low-gravity garden world. Its core appears to not have gathered as much iron-nickel alloy as most habitable worlds, therefore giving this planet a lighter gravity. This would force any potential settlers to use mass effect fields to generate a comfortable gravity or just let their organisms adapt to Amar's gravity."
 btr_anomaly.92.a:0 "Not a first class garden world."
 btr_anomaly.92.b:0 "We have colonise worst places. Our people don't get intimidated by minutiae."

 BTR_KET'OSH_LOST_HOMES:0 "Lost Homes"
 lost_homes_desc:0 "Very few remember that [planet.GetName] was once inhabited, and by an unlikely species."
 btr_anomaly.93.name:0 "Ancient Quarian Colony"
 btr_anomaly.93.desc:0 "A small, arid world similar in climate to the quarian homeworld of Rannoch, Ket'osh was established as the furthest outpost of quarian-colonized space centuries ago, eventually becoming one of their main colonies as they have an easier time adapting to live this planet than most garden worlds. As with all worlds during the Geth War, however, it was abandoned after weeks of brutal fighting against the newly-sentient AIs."
 btr_anomaly.93.a:0 "Those Quarians doomed themselves by creating AIs."
btr_anomaly.93.b: 0 "If we can't have the homeworld back, maybe Ket'osh will have to do."
 btr_anomaly.93.c:0 "The Creators forced our course of action."

 BTR_SIAN_SILENT_GRAVES:0 "Silent Graves"
 silent_graves_desc:0 "The short but intense war between the Geth and the Quarians is largely forgotten, even by its participants. Long over shadowed by the wars dramatic outcomes and ongoing tragedy. Yet, scattered sporadically across the region of space are the forgotten remnants of that war, the permanent resiting place of the last terrestrial Quarians and the first primitive Geth and their original, limited, platforms."
 btr_anomaly.94.name:0 "Battle Wreckage"
 btr_anomaly.94.desc:0 "Sian is a small, vacuous world within the Plenesh System barely worth a second glance. Untouched by the quarians who colonized nearby Ket'osh, the world only serves to play host to several wrecks left behind from the aftermath of the Battle of Ket'osh, one of the final battles of the Geth-Quarian war."
 btr_anomaly.94.a:0 "Those wrecks still have many useful materials."
 btr_anomaly.94.b:0 "It's so low, but we just can't turn down this opportunity to salvage our ancestors' wrecks."
 btr_anomaly.94.c:0 "As expedient as it may be, we cannot disturb the rest of the last of our people to sleep without a suit."
 btr_anomaly.94.d:0 "Creators' wrecks contain useful materials."
 btr_anomaly.94.e:0 "Our programming forbids disturbing the graves of the Creators."
 btr_anomaly.94.f:0 "They may have made mistakes but their graves deserve to be respected."
 respected_graves:0 "Respected Graves"
 respected_graves_desc:0 "It was a difficult decision and it required us to endure some hardship, but our leaders had the integrity to honor the graves of our ancestors and that is no small thing."

 BTR_DH1993_RED_WIPE:0 "A Planetary Fossil?"
 red_wipe_desc:0 "There are plenty of barren rocks in the galaxy. Some are larger than others but few warrant any real scrutiny but [planet.GetName] is different. Some of our scientists are convinced that it is hiding evidence that it used to be a lush planet and with some extra support they can prove it."
 btr_anomaly.95.name:0 "Former Atmosphere"
 btr_anomaly.95.desc:0 "DH1993 is a lifeless rock. However, scientist {insert name} has found evidence pointing out that the planet once harbored life. Evidence of chalk can be found across the world, a substance that can only be created when the remains of microscopic creatures are subjected to severe heat and pressure for millions of years."
 btr_anomaly.95.a:0 "Its star going into the red dwarf phase must have wiped out the ecosystem."

 BTR_L2183_WRONG_MINERALS:0 "Odd formation"
 wrong_minerals_desc:0 "We were initially drawn to [planet.GetName] because of its proximity to DC1938, an unusual phenomena for an asteroid and a planet. Yet, as we scanned the smaller asteroid we realized that there was more here than we realized. It isn't made up of the same minerals the neighboring asteroids are and it doesn't match what we would expect of an asteroid."
 btr_anomaly.96.name:0 "Rogue Moon"
 btr_anomaly.96.desc:0 "Our science ship [ship.GetName]'s crew has concluded that L/2183 is an ejected satellite of the destroyed world DC1938 that will eventually leave the world. Evidence of a former atmosphere on the world exists, as on the eastern hemisphere can be found signs that someone partook in strip-mining."
 btr_anomaly.96.a:0 "Such a destructive power."

 BTR_DC1938_SHATTERED_WORLD:0 "Shattered World"
 shattered_world_desc:0 "It is not often we see an entire planet cracked open so, obviously, our scientists are fighting to see who gets to be the one to lead the study of this unique case."
 btr_anomaly.97.name:0 "Core Fusion"
 btr_anomaly.97.desc:0 "A rare example of a garden world orbiting a red giant, DC1938 is, unfortunately, part of another rare statistic: it suffered from a phenomenon known as core fusion. This was caused by the uranium core of the planet collapsing in on itself, igniting a thermonuclear explosion strong enough to rupture the planet into several pieces. es. The shockwave blew away the atmosphere, destroying the entire ecosystem of the planet."
 btr_anomaly.97.a:0 "We are picking up a signal!"

 BTR_MV1963_GHOST_MINING:0 "Resource Bounty"
 ghost_mining_desc:0 "The gas giant of [planet.GetName] shows signs of being a fantastic source of Helium-3 and some of its moons appear to be rich in important minerals needed for our industry. There are a lot of industrial interests that are urging us to complete our orbital scans and declare the area safe for mining as soon as possible."
 btr_anomaly.98.name:0 "Signs of Atmospheric Mining"
 btr_anomaly.98.desc:0 "MV1963 hides rich quantities of helium-3 and moons ripe for harvesting precious metals and ores. There is clear evidence that someone mined the atmosphere of MV1963 utilizing automated systems. Not a single body or survivor has been found on or around the gas giant and its moons."
 btr_anomaly.98.a:0 "Curious."

 BTR_VECTRA_MASSIVE_COMMET:0 "Massive Comet"
 massive_commet_desc:0 "One of the first things we noticed when entering [system.GetName] was what appeared to be a comet several orders of magnitude larger than anything we'd ever seen before. After the initial shock wore off we determined that it isn't a giant comet, and is instead a gas giant that has a tail. Now our scientists want to study why it has tail."
 btr_anomaly.99.name:0 "Atmospheric Halo"
 btr_anomaly.99.desc:0 "Vectra, a typical gas giant, is seeing its massive atmosphere being slowly basted away by the heat of its star Gorgon. The blasted atmosphere is visible as a long, dim tail that trails behind the planet."
 btr_anomaly.99.a:0 "Beautiful."

 BTR_VARMALUS_MOLE_MEN:0 "Boiling World"
 mole_men_desc:0 "[planet.GetName] is somewhat rare, its atmosphere is incredibly dense and it has very active volcanic activity. These two combine to make the surface temperature of the planet incredibly hot by terrestrial standards and leaves its crust pockmarked with large cave formations as volcanic activity shifts around the planet leaving vacant volcanic shells behind."
 btr_anomaly.100.name:0 "Underground Lifeforms"
 btr_anomaly.100.desc:0 "Varmalus has a thick atmosphere of nitrogen and helium and its surface is scorching hot. However, the planet has an extensive network of subterranean caves, formed over the millennia by volcanic processes. In these relatively cool areas, some primitive life has developed, thriving on the coolness of the tunnels."
 btr_anomaly.100.a:0 "Maybe someday they'll evolve into intelligent life."

 BTR_CANRUM_WOMEN_WARRIOR:0 "Warrior Women"
 women_warrior_desc:0 "The Krogan rebellions saw many incredible stories of intense clashes between Citadel forces and Krogan warbands, often with casualty lists longer than many dictionaries. Its scars litter the space between Tuchanka and the Citadel and drive deep wedges between modern decedents of the combatants. Every so often we stumble onto a piece of that conflict that gives us a tiny glimpse into the pure hell that those soldiers endured."
 btr_anomaly.101.name:0 "Shiagur's Last Stand"
 btr_anomaly.101.desc:0 "Shiagur was one of the few female warlords during the Krogan Rebellions, and one of the few fertile females after the Genophage was deployed. She was a sign of hope in the final days of the Krogan golden age. But here on Canrum Shiagur was defeated by turian peacekeeping forces. Vengeful male krogan admirers near and far swore blood oaths against the participating turian crews. To this day, many krogan proudly proclaim that they have the "blood of Shiagur"."
 btr_anomaly.101.a:0 "A Krogan pilgrimage site."
 btr_anomaly.101.b:0 "Never forgotten, never forgiven."
 btr_anomaly.101.c:0 "The things they forced us to endure and to do..."
 resolute_resolve:0 "Resolute Resolve"
 resolute_resolve_desc:0 "Our ancestors showed the galaxy the unending resolve of the Turian spirit and people. We will not let them down."

 BTR_INTAI'SEI_HOT_GARDEN:0 "A Possible Garden"
 hot_garden_desc:0 "[Planet.GetName] shows very promising signs of being a garden world suitable for colonization and our scientists are eager to do closer surveys to confirm."
 btr_anomaly.102.name:0 "Intolerable Temperatures"
 btr_anomaly.102.desc:0 "Similar in atmosphere and composition to most garden worlds, Intai'sei is habitable. However, prohibitively high temperatures and an arid climate are quite the challenge. Lack of abundant water means agriculture would have to rely on wind traps."
 btr_anomaly.102.a:0 "A world for romantics looking for a secluded way of life."

 BTR_VEBINOK_CRASH_SPILL:0 "An Ancient Spill"
 crash_spill_desc:0 "Our records indicate that long ago there was an industrial accident of some description that left a permanent mark on this planet."
 btr_anomaly.103.name:0 "LOX Spill"
 btr_anomaly.103.desc:0 "Approximately 270 years ago a turian bulk gas transport was attacked by pirates in the Phoenix system, which forced it to make a rough landing on Vebinok. The heat of the landing melted significant quantities of surface ice, and ruptured shipping containers spilled LOX across the surface. Before this evaporated and escaped Vebinok's weak gravity, it reacted, causing one hemisphere to be covered by deposits of oxidized copper."
 btr_anomaly.103.a:0 "Damn pirates."

 BTR_SALAMIS_MOLTEN_CRUST:0 "Disappearing Magma?"
 molten_crust_desc:0 "Some of the scans we've received show [planet.GetName] as a molten world with a liquid surface. Others show it as a standard post-magmatic world, the problem is that as time has gone on these reports seem to alternate?"
 btr_anomaly.104.name:0 "Molten Cycle"
 btr_anomaly.104.desc:0 "Salamis is an unremarkable world. Our science ship {insert ship's name} has scanned it from orbit and found that, due to its thick carbon dioxide atmosphere and proximity to the energetic star Athens, the equatorial daytime temperatures have been known to turn the surface molten."
 btr_anomaly.104.a:0 "An entire world's crust made into liquid rock every day."

 BTR_PROTEUS_HUMIDIFIER:0 "A Cloudy Orb"
 humidifier_desc:0 "[Planet.GetName] has raised some flags amongst our science staff on account of every single scan we have of it being at best incredibly cloudy, and at worst so cloudy we cannot even see the planet at all. We cannot find another example of a world so covered in clouds."
 btr_anomaly.105.name:0 "Stormy Oceans"
 btr_anomaly.105.desc:0 "Proteus is a world that is more than 90% covered by oceans. The incredible heat thrown off from Athens raises global humidity to 100%, creates constant cloud cover, and powers colossal typhoons that rage across the surface year-round and swep the few landmasses on their way."
 btr_anomaly.105.a:0 "Is still a colonizable, isn't it?"
 btr_anomaly.105.b:0 "Praise be the beach thunder, for this world is remarkably similar to Kahje."

 BTR_THERUM_LOST_TROVE:0 "Rocks!"
 lost_trove_desc:0 "Early scans of [planet.GetName] have shown promising signs of significant resource deposits. We are hopeful that our more detailed orbital scans can confirm and locate these hints."
 btr_anomaly.106.name:0 "Mineral-Buried Secrets"
 btr_anomaly.106.desc:0 "A world plentiful in heavy minerals, Therum didn't always look like it does today: core samples rich with the fossils of simple silicon-based organisms indicate Therum was more habitable in the past than it is at present. That possibly explains the great number of Prothean ruins on this world worth a richness alongside the world's minerals."
 btr_anomaly.106.a:0 "We must stake our claim to this world before anyone else does!"
 btr_anomaly.106.b:0 "We shall extract those minerals to fuel our economy, but we will not disturb the Enkindlers."

 BTR_ZAKROS_CRYPTIC_MAZE:0 "Odd Mountains"
 cyrptic_maze_desc:0 "Initial scans of [planet.GetName] has revealed several mountain ranges that don't follow what we would expect for mountain ranges."
 btr_anomaly.107.name:0 "Maze of Crypts"
 btr_anomaly.107.desc:0 "Our probes have detected multiple areas at Zakro's equator with oddly regular surface protrusions. Closer investigation revealed these as millions of elaborate crypts a few meters below the surface, left by a long-extinct spacefaring species called the zeioph."
 btr_anomaly.107.a:0 "We must further investigate it."
 btr_anomaly.107.b:0 "The Council's law forbids disturbing grave sites!"

 BTR_SHARJILA_SILICA_LIFE:0 "Two Extremes"
 silica_life_desc:0 "[Planet.GetName] has an atmosphere like no other. Thus far the galaxy has revealed three types of respiration, oxygen, ammonia, and liquid water. Many planets have liquid water and one of the first two, this planet has all three with a blended Oxygen-Ammonia Atmosphere. How this happened and is sustained is currently unknown."
 btr_anomaly.108.name:0 "Ammonia-Oxygen Life"
 btr_anomaly.108.desc:0 "Sharjila has a very dense atmosphere of ammonia and oxygen. It houses an extensive silicon-based, oxygen-breathing ecology. Heavily populated areas are covered with fine silica (silicon dioxide) dust, the respiratory by-product of the world's higher animal forms."
 btr_anomaly.108.a:0 "Exuberant life in a world hostile to us."

 BTR_PATAVIG_AMMONIA_AIR:0 "Pristine Garden"
 ammonia_air_desc:0 "The planet of [planet.GetName] has seemingly been ignored despite looking like an idyllic world while this does give us pause many remain hopeful that we have hit the jackpot."
 btr_anomaly.109.name:0 "Ammonia Ecology"
 btr_anomaly.109.desc:0 "Most of Patavig's surface is covered by a vast sea of liquid ammonia, in which a unique aquatic ammonia-based biosphere has developed. While the frozen continents are largely bereft of life, a rich bounty of complex organisms - many larger than a human - flourish in the chilly, toxic seas."
 btr_anomaly.109.a:0 "Just another toxic wasteland."
 btr_anomaly.109.b:0 "A suitable planet for our people."

 BTR_ALTAAYA_LOST_ATMOSPHERE:0 "Large Ice"
 lost_atmosphere_desc:0 "Some of our scientists have been perplexed by [planet.GetName]. Its not terribly interesting outside of it being slightly larger than our models would indicate. In an effort to better refine our predictive models they want to study the planet and try to ascertain how a frozen rock managed to get so big without turning into some other type of planet."
 btr_anomaly.110.name:0 "Planetary Cataclysm"
 btr_anomaly.110.desc:0 "Altaaya is an unusually large terrestrial world with a trace atmosphere of methane and ammonia with a frozen surface. According to our geological examination of its crust this planet used to possess an atmosphere thick enough to support some form of liquid. What cataclysm stripped the atmosphere and left the planet to freeze is not currently known."
 btr_anomaly.110.a:0 "Let's find out what happened here."

 BTR_ONTAMALCA_CROWDED_SPACE:0 "Crowded Space"
 crowded_space_desc:0 "Gas giants having multiple moons is nothing new, in fact it is quite common. Yet [planet.GetName] has so many moons that it can be difficult to actually reach the gas giant itself or even see it on scans. That has sparked our scientists interest."
 btr_anomaly.111.name:0 "Grinding Moons"
 btr_anomaly.111.desc:0 "Ontamalca is a large hydrogen-helium gas giant. Its orbit is congested with hundreds of captured moons. Most last only a few thousand years before being ejected, dragged down into the atmosphere, or ripped apart by tidal forces and added to the gas giant's immense rings. Navigation through this system of moons and rings is a mortal enterprise."
 btr_anomaly.111.a:0 "We should advise others against coming close to this planet."

 BTR_SYIDED_CAVE_LIFE:0 "Stellar Distance"
 cave_life_desc:0 "[Planet.GetName] is much closer to its star than is typical which alone would be of interest to our science staff. But the planet is also pockmarked with mountain chains, large craters, and what appears to be canyons and caves scaring its surface to the point that it barely looks like a sphere at all."
 btr_anomaly.112.name:0 "Shielded by Caves"
 btr_anomaly.112.desc:0 "Syided proximity to its star causes constant blue and violet auroras during periods of increased solar flares so bright that they can be seen with off-the-shelf optics from a distance of several AU. A surprising variety of simple carbon-based life flourishes in a complex network of cave systems that wind through the crust, protected from Hercules' heat and radiation."
 btr_anomaly.112.a:0 "As usual, life arises where you least expect it."

 BTR_ELETANIA_DEATH_BREATH:0 "Lone Paradise"
 death_breath_desc:0 "We have received many proposals to colonize [planet.GetName] but we haven't conducted much in the way of detailed study on the apparently very appealing world. Some of the particularly dour scientists have asked why we are the first ones to seriously consider colonizing a planet that looks irresistible."
 btr_anomaly.113.name:0 "Toxic Life"
 btr_anomaly.113.desc:0 "Eletania appears to be a world eminently suited for colonization. Unfortunately, it really is not. The animal kingdom is a web of microscopic symbiotic creatures. These are impossible to filter from the air and necessary for the native life to thrive. Unfortunately, they also cause anaphylactic shock when inhaled by non-native life."
 btr_anomaly.113.a:0 "Any colonisation effort would require fully sealed environment suits, or replacement of the entire world's ecosystem."

 BTR_SYTAU_ALL_THAT_GLISTENS:0 "Volcanic Hyper-Activity"
 all_that_glistens_desc:0 "Volcanoes are a common sight on planets that still have functioning cores but no planet we have surveyed before has anywhere near the number of volcanoes as [planet.GetName] appears to have. If these are accurate many of those volcanoes are also incredibly large as well which raises even more eyebrows among our science staff."
 btr_anomaly.114.name:0 "Supervolcanoes"
 btr_anomaly.114.desc:0 "Sytau is rabidly volcanic; a dozen "supervolcanoes" from 50 to 120 kilometers wide are erupting across the planet. Sytau's carbon content and constant volcanism make natural diamonds plentiful, if extremely costly and dangerous to recover."
 btr_anomaly.114.a:0 "Diamonds, huh?"

 BTR_FEROS:0 "Urban World"
 feros_desc:0 "Science fiction has long predicted planets made entirely out of paved urban sprawl and some of the more eccentric academics have done the math to prove it is technically possible. Yet we have never encountered an example of such a planet nor met anyone capable of realistically creating one. Except for Feros, which apparently was well on its well way toward becoming exactly such a world when the Protheans disappeared. Some even claim that it was a fully urban world and after all this time nature has only liberated a mere third of it."
 btr_anomaly.115.name:0 "Prothean Ecumenopolis"
 btr_anomaly.115.desc:0 "Two-thirds of Feros' surface is covered with the ruins of a crumbling Prothean megatropolis, and although in the millennia since the Prothean extinction, the ruins have been picked over by looters many times, there surely remains a lot of treasures to be discovered. Not the best prospect for colonisation, it is nonetheless a unique world worth controlling."
 btr_anomaly.115.a:0 "Just think of all the richness hiding among those archologies."
 btr_anomaly.115.b:0 "This one must be consecrated for the Enkindlers' glory!"

 BTR_SHARRING_OLD_FUEL:0 "Moon Gas"
 old_fuel_desc:0 "While we are preparing to do detailed scans of [planet.GetName] to discover its suitability for Helium-3 mining some are suggesting that we also scan its two largest moons as it isn't common for gas giants to have moons large enough for any real infrastructure."
 btr_anomaly.116.name:0 "Prothean Refueling Stations"
 btr_anomaly.116.desc:0 "A standard hydrogen-helium gas giant, Sharring is accompanied by over 60-odd moons, two have diameters of over 3,000 kilometers. Both have signs of former Prothean development, suggesting Sharring may have been mined for helium-3."
 btr_anomaly.116.a:0 "That shall prove useful."

 BTR_QUANA_GHOST_MINES:0 "Ghost Towns"
 ghost_mines_desc:0 "It is clear from even our system level scans that [planet.GetName] was once inhabited. We have sketched out the rough outlines of several urban areas and a few routes that may be some sort of road or rail network. The total lack of light pollution or radio waves has many of our scientists convinced that we are looking at the remnants of a society, not an undiscovered pre-ftl community. We wont know the specifics until our more detailed orbital scans come in."
 btr_anomaly.117.name:0 "Prothean Mines"
 btr_anomaly.117.desc:0 "The remains of a well-developed Prothean mining infrastructure dot this planet. Abandoned mines are connected to dead cities by collapsed maglev lines. Quana's ruins are reasonably intact and can be used to extract the world's plentiful heavy minerals, although all valuable items were stripped by looters a long time ago."
 btr_anomaly.117.a:0 "The infrastructure is already in place, we just have to resume mining activities."

 BTR_LOGAN_BLOOPS:0 "Promising Fuel"
 bloops_desc:0 "the gas giant of [planet.GetName] has been flagged for closer study as a potential candidate for Helium-3 mining."
 btr_anomaly.118.name:0 "Afloat Bodies"
 btr_anomaly.118.desc:0 "Logan is a standard hydrogen-helium gas giant. Our survey team has reported many strange disturbances in Logan's cloud bands, suggesting many remarkably large solid objects were present beneath the cloud tops. As the ship approached, however, they subsided one by one. Our crew have been unable to pick up these disturbances again."
 btr_anomaly.118.a:0 "That's weird."

 BTR_EDEN_PRIME_THE_START:0 "Sub-Surface Ruins"
 the_Start_desc:0 "Almost immediately after we began colonizing [planet.GetName] we noticed that there were Prothean ruins just beneath the surface. Considering how important the Prothean ruins we excavated in the past were for our development there are many want us to begin excavations as soon as possible."
 btr_anomaly.119.name:0 "Prothean Beacon"
 btr_anomaly.119.desc:0 "Since its discovery it's been known that Protheans used to inhabit Eden Prime, as the multiple ruins dotting its surface can attest. However, recently we've picked up a signal coming from one specific complex that points to it hosting an actual functional Prothean beacon. Almost no beacon remains operative, so this is a unique opportunity to get an insight of Prothean technology!"
 btr_anomaly.119.a:0 "We must seize that beacon!"

 BTR_HUNTINGTO_PLANETARY_STATIC:0 "System Static"
 planetary_static_desc:0 "The [system.GetName] system has an intense amount of baseline static, far more than usual. This can cause a long list of issues for ships navigating through the system and, ironically, makes determining the source more difficult but if we can find the source we might be able to find ways to mitigate it."
 btr_anomaly.120.name:0 "Ice Crystal Rings"
 btr_anomaly.120.desc:0 "Huningto is a Jovian-sized gas giant. Spectral analysis indicates its extensive ring system is mostly composed of ice crystals. Huningto has an exceptionally powerful magnetic field, which creates strong radio interference throughout the inner system."
 btr_anomaly.120.a:0 "Beautiful, but dangerous."

 BTR_MAVINGON_PARALLEL_LIFE:0 "Venticulated"
 parallel_life_desc:0 "Some scientists are looking for funding to do a more detailed survey of [planet.GetName]. It deviates slightly from what we would expect and its plethora of geothermal vents means that there is plenty of room for some unique finds."
 btr_anomaly.121.name:0 "Ammonia-Based Life"
 btr_anomaly.121.desc:0 "Mavigon is a typical rock and ice planet with a slightly smaller size than average with a thin atmosphere of ammonia and methane. Nonetheless, scientist [leader.GetName] reports that this world has rudimentary ammonia-based life, mainly concentrated around geothermal vents deep underground."
 btr_anomaly.121.a:0 "The universe is full of life."

 BTR_FARCROTHU_C_LIFE_SIZED:0 "Rocky Mountains"
 life_sized_desc:0 "Our main focus was on the gas giant in the system as we attempted to gauge its Helium-3 mining quality. However, a cursory glance at one of its moons revealed a strange mountain range running along most of the moon. This has peaked the curiosity of many scientists because by all accounts, these moons should not have mountains at all?"
 btr_anomaly.122.name:0 "Colossal Sculptures"
 btr_anomaly.122.desc:0 "Farcrothu c is an average gas giant's moon. However, what struck our survey team is that, along with some other moons, it has been sculpted into the likenesses of an arthropodal alien race not yet known to Council science. Radiometric dating suggests the moons were worked over half a million years ago."
 btr_anomaly.122.a:0 "Who could've done those?"

 BTR_PATATANLIS_NO_AIR:0 "Big Rock"
 no_air_desc:0 "While surveying the system of [system.GetName] we came across [planet.GetName] from its size we expect it to be a fairly habitable planet but our long range scans show that it is basically a large asteroid. The question that we are now left to ask is, why?"
 btr_anomaly.123.name:0 "Lack of Atmosphere"
 btr_anomaly.123.desc:0 "A large rock world, Patatanlis should have a far thicker atmosphere of hydrogen and carbon monoxide than the thin halo it possesses. Our science ship [ship.GetName]'s crew is puzzled. Nobody understands how this planet could have lost most of its atmosphere."
 btr_anomaly.123.a:0 "So mysterious."

 BTR_ANTIROPRUS_GLOW_BALL:0 "Glowing World"
 glow_ball_desc:0 "From the moment the [ship.GetName] entered [system.GetName] it noticed that one of the planets was glowing in the infrared bands. This is strange for several reasons but the most interesting is that they were looking at the side of the planet facing away from the sun meaning it was not just reflecting a solar phenomenon."
 btr_anomaly.124.name:0 "Cyclonic Winds"
 btr_anomaly.124.desc:0 "Another typical hydrogen-helium gas giant, Antiroprus formed on the edges of the system and has been migrating inwards for millions of years. That means that there is a sizable temperature difference between the side of Antiroprus facing its star and the side facing the cold space, which creates variance powers massive cyclonic wind systems. The intense heat it absorbs from the sun, in addition to its own internal heat engine, causes the planet's dark side to radiate faintly in the infrared."
 btr_anomaly.124.a:0 "Very dangerous."

 BTR_PLOBA_BIG_BRAIN:0 "Shaped Gas?"
 big_brain_desc:0 "While scanning [planet.GetName] a corporate survey ship began receiving strange readings. They repeated their scans over a dozen times, ran countless maintenance routines and even physically took apart and reassembled what they could inside the ship. No matter what they did the strange readings did not change. Now they are requesting that we attempt to scan the gas giant in the hopes that either we do not have this issues or that our scanners can provide a clearer picture of whatever is causing these readings."
 btr_anomaly.125.name:0 "Jupiter Brain"
 btr_anomaly.125.desc:0 "Ploba is the biggest gas giant of Antaeus. Active scans by our science ship have returned tantalizing indications of massive, solid structures deep within the atmosphere, too regular in pattern to be anything natural. Scientist [leader.GetName] believe this is proof that Ploba is actually a "Jupiter Brain", a planet-sized supercomputer. Others think that an ancient spacefaring race disposed of their weapons of war by dumping them into the planet."
 btr_anomaly.125.a:0 "Nothing more than conspiracy theories."
 btr_anomaly.125.b:0 "We must try to reach Ploba's "Deep Anomalies"."
 btr_anomaly.125.c:0 "So-called "Deep Anomalies" enigmatic, need to investigate this anomaly."

 BTR_TREBIN_WATER_BOY:0 "Dry Atmosphere"
 water_boy_desc:0 "While surveying [system.GetName] our science team discovered [planet.GetName] which has many of the signs of a habitable planet but early scans indicate that it doesn't have as much of a biosphere as we would have predicted. Our scientists want to do more indepth orbital scans to try and determine why."
 btr_anomaly.126.name:0 "Lack of Water"
 btr_anomaly.126.desc:0 "Trebin is a modest terrestrial world, with an atmosphere composed of nitrogen and argon. Trebin's environment is relatively mild, but the scarcity of water or similar enabling substances has prevented the development of any biosphere. An effort could be funded to thicken the atmosphere and introduce more water and oxygen to the planet."
 btr_anomaly.126.a:0 "We can make it habitable."

 BTR_HUNIDOR_SMOOTH_WORLD:0 "Reflective Surface"
 smooth_world_desc:0 "While trying to scan [planet.GetName] our science team encountered an incredibly rare phenomenon, scattered, corrupted responses to the scans. Strange readings as the return signals are reflected back at the ship in different directions or just reflected out into space. What makes this even stranger is, this type of planet isn't supposed to be capable of causing these errors?"
 btr_anomaly.127.name:0 "Cryovolcanic Evidence"
 btr_anomaly.127.desc:0 "Hunidor is a moderately sized ice world with an extremely thin atmosphere composed of krypton and xenon. Its frozen surface is unusually smooth, suggesting widespread "repaving" by cryovolcanic processes though no such activity is currently evident."
 btr_anomaly.127.a:0 "It appeared to be a totally boring planet at first sight."

 BTR_ZAYARTER_ALL_OF_THE_LIGHTS:0 "A Systems of Signals"
 all_of_the_lights_desc:0 "Almost immediately upon entering the [system.GetName] system we began picking up incredibly faint signals. There was no pattern, nothing to be translated or decoded, more like a never ending beaming on certain frequencies that have no record of ever being used. This strange droning was so faint that we couldn't track it down to any planet in the system but our teams are hopeful that more detailed scans of the worlds will uncover the source."
 btr_anomaly.128.name:0 "Mysterious Lights"
 btr_anomaly.128.desc:0 "Something strange has happened on Zayarter while our team was surveying the planet. They have reported geometric patterns of lights on the dark side of Zayarter. Attempts at further investigation proved fruitless; the lights disappeared when our ship approached the inner system."
 btr_anomaly.128.a:0 "What the hell?"

 BTR_COHE_FAMILY_THERMOSTAT:0 "Heat Freeze"
 family_thermostat_desc:0 "Based on our long range scans the planet of [planet.GetName] has many characteristics of a habitable planet but doesn't show signs of life. Early investigations show that the planet likely has a thinner atmosphere than its size would have us believe, but exactly how thin remains to be seen. A closer study of the planet is needed to make any serious claims."
 btr_anomaly.129.name:0 "Subterranean Ecology"
 btr_anomaly.129.desc:0 "Chohe is a terrestrial world in nearly vacuum as it only has a very thin trace atmosphere. This lack of atmosphere allows a moderate average temperature, but the differences between night and day are extreme. However, native lifeforms have been detected in its subterranean caves and tunnels, which shows incredible resilience to extremes of heat and cold."
 btr_anomaly.129.a:0 "They are worth researching."

 BTR_JARTAR_SPOOKY_SQUID:0 "Rumor Moons"
 spooky_squid_desc:0 "There have long been rumors that the [system.GetName] system is home to a something... unique. What exactly that is changes depending on the storyteller, some say its an ancient shipwreck of a society older than the Protheans, some say its an abandoned Prothean research facility that played a role in their Disappearance, a few claim its a hoax. We are fairly certain there is something in the system, although it is likely far less exciting than what is being dreamed up."
 btr_anomaly.130.name:0 "Leviathan of Dis"
 btr_anomaly.130.desc:0 "Jartar is noted for the discovery of the "Leviathan of Dis," the apparent corpse of a genetically engineered living starship. The Leviathan was found in the bottom of a crater by a batarian survey team, and estimated to be nearly a billion years old. It "disappeared" after a visit to the system by a Batarian dreadnought a few years ago."
 btr_anomaly.130.a:0 "Those damn Batarians have kept its secrets for themselves."
 btr_anomaly.130.b:0 "There never was a "Leviathan of Dis", just enemy lies and propaganda."

 BTR_KLENSAL_FOOLS_GOLD:0 "Suspicious Deals"
 fools_gold_desc:0 "Recently there was a high profile deal between an Alliance mining firm and the Batarian Government which would allow the human mining group to extract the rich mineral deposits on [planet.GetName]. However, the crews sent to begin the mining process have been unable to locate any mineral deposits at all. We have been asked to step in and survey the planet so confirm its mineral value one way or the other."
 btr_anomaly.131.name:0 "Gold Rush"
 btr_anomaly.131.desc:0 "Klensal's first first geological surveys were performed by Batarians, and suggested areas of great mineral wealth. Human mining concerns spent billions of credits hustling to the distant system and sinking test bores to claim the system for humanity. It turned out to be an Hegemony-sponsored Batarian ruse that bankrupted an entire Human mining company. To this day abandoned mining equipment still dotes its surface."
 btr_anomaly.131.a:0 "Humans and Batarians brickeling at each other as usual."
 btr_anomaly.131.b:0 "Batarians bastards!"
 btr_anomaly.131.c:0 "Serves them right."

 BTR_GREMAR_FOUL_WATERS:0 "Ice Garden World"
 foul_waters_desc:0 "Our scans of [planet.GetName] show that it has small seas despite being an intensely frigid planet. This has raised the hopes of our crew that they may be on the cusp of discovering unique species that are adapted to living in such harsh cold."
 btr_anomaly.132.name:0 "Ammonia Seas"
 btr_anomaly.132.desc:0 "An icy terrestrial world, Gremar's surface is mainly composed of frozen ammonia that, when exposed to sunlight, can melt, forming equatorial seas of the toxic chemical. This allowed a profusion of simple fungus and lichens to evolve in the low-energy environment. A by-product of their metabolism causes them to glow very faintly, a phenomena visible from space."
 btr_anomaly.132.a:0 "Interesting."
 btr_anomaly.132.b:0 "This world should belong to us."

 BTR_TUNSHAGON_HIDDEN_MOONS:0 "Lonely Giant"
 hidden_moons_desc:0 "Our system scans of [system.GetName] have uncovered [planet.GetName], a gas giant with significantly fewer moons than we'd expect. Now we are receiving requests from curious scientists that want to look into this a bit deeper and try to figure out why."
 btr_anomaly.133.name:0 "Few Moons"
 btr_anomaly.133.desc:0 "Tunshagon is a hydrogen-helium ice giant with traces of chlorine and nitrogen in its atmosphere. It has an unusually small number of moons for a gas giant; a mere seven, something really unusual for the huge gravity well of any gas giant, including ice giants."
 btr_anomaly.133.a:0 "Farinata must have captured most of the system's mass during the nebular collapse that created it."

 BTR_NONVEL_BLUE_LAVA:0 "Explosive Planet"
 blue_lava_desc:0 "The planet of [planet.GetName] has returned some readings that we weren't anticipating. Something about the planet isn't as generic as its appearance would suggest but we'll need to do a closer scanning pass to figure out what it is."
 btr_anomaly.134.name:0 "Volcanoes and Eezo"
 btr_anomaly.134.desc:0 "Nonuel is the largest body in the asteroid belt of the blue star Plutus, not only as large as to maintain a spherical shape, but enough to retain a thick toxic atmosphere. It is rabidly volcanic, and the source of its great heat is also the source of its inordinate mass. Nonuel is a "secondary source" of element zero, coalesced around a large chunk of eezo ejected by a supernova billions of years ago."
 btr_anomaly.134.a:0 "Eezo you said? Disregard the lava flows."
