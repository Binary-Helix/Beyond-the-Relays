l_english:

  btr_intro_text:0 "Welcome to Mass Effect:Beyond the Relays!\n\nPrepare to immerse yourself in BioWare's sci-fi epic in a way you’ve never experienced before. In Beyond the Relays you stand at the head of your favorite Mass Effect empire, challenging you to change the course of galactic history in a universe where there is no Shepard to save you. To provide the most accurate representation of the Mass Effect Galaxy possible, you'll find many changes from your traditional Stellaris experience. Complete with a comprehensive galaxy map handcrafted with lore accurate systems and planets as well as a fully realized and functional representation of the Mass Relay Network, you'll find Beyond the Relays at times plays like a completely different game!\n\n To help you familiarize yourself with the many changes that Beyond the Relays brings, immediately after clicking begin below our custom datapad will appear. This resource will help get you started in familiarizing yourself with your empire and the many changes and new mechanics that you will find in Beyond the Relays.\n\n And Welcome Home, Commander!"