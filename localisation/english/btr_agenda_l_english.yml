l_english:

 ###########################
 ########  AGENDAS  ########
 ###########################

 agenda_ref:0 "Agenda"
 council_agenda_agenda_vigilance_name:0 "Grasping Destiny"
 council_agenda_agenda_vigilance_desc:0 "We have been granted a unique opportunity to be part of realizing humanities oldest dreams and goals, we cannot pass this chance up. Hesitation, bureaucracy, and homesickness must be left behind as we assert our right to these new worlds ands stars. This may anger some, and we will need to be ready in case they make their worst mistake."
 agenda_vigilance_finish:0 "$council_agenda_agenda_vigilance_name$ $agenda_ref$" 
 agenda_vigilance_finish_desc:0 "$council_agenda_agenda_vigilance_desc$"
 agenda_infiltration_finish:0 "Shadow Operations"
 agenda_infiltration_finish_desc:0 "$council_agenda_agenda_infiltration_desc$"
 council_agenda_agenda_infiltration_name:0 "Shadow Wars"
 council_agenda_agenda_infiltration_desc:0 "While our intelligence community never sleeps nor rests there is a certain cadence to its operations. If we direct more funding and attention to it we can radically, if temporarily, increase our activities to deal with specific threats or to keep our opponents off balance."
 agenda_discipline_finish:0 "Mobilization"
 agenda_discipline_finish_desc:0 "$council_agenda_agenda_discipline_desc$"
 council_agenda_agenda_discipline_name:0 "Mobilization"
 council_agenda_agenda_discipline_desc:0 "Each individual has a solemn obligation to the next, those of us that are of military age hold an obligation to defend those who are not. Knowing that when they pass out of age they will be defended by those entering."
 agenda_elegance_finish:0 "Charm Offensive"
 agenda_elegance_finish_desc:0 "$council_agenda_agenda_elegance_desc$"
 council_agenda_agenda_elegance_name:0 "Display of Charm"
 council_agenda_agenda_elegance_desc:0 "Other races find us charming and we take advantage of this in our diplomatic dealings. However, we can occaisonally push this further and squeeze extra concessions out of them. This requires immense tact and impeccable timing but we can pull this off until they start to grow wise at which point we must back off and lull them back to sleep."
 agenda_bitterness_finish:0 "Retribution"
 agenda_bitterness_finish_desc:0 "$council_agenda_agenda_bitterness_desc$"
 council_agenda_agenda_bitterness_name:0 "Conflagration"
 council_agenda_agenda_bitterness_desc:0 "Our society has been besieged by filth and scum for generations. We have fought valiantly both on the battlefield and in the meeting rooms to protect our people, our culture, and our very way of life. Yet we all know that the time will come when we need to fight the ultimate battle and determine once and for all who is the dominant power."
 agenda_machinism_finish:0 "Communal Reserves"
 agenda_machinism_finish_desc:0 "$council_agenda_agenda_machinism_desc$"
 council_agenda_agenda_machinism_name:0 "Rationing Rationality"
 council_agenda_agenda_machinism_desc:0 "As the last vestiges of our civilization drift through space in this sombre exile we must take every caution to ensure our continued survival. No risk is worth taking, no fear unwarranted, no confidence that cannot be double checked. This also means we cannot take the resources we hold for granted and must stretch every atom as far as we can."
 agenda_isolation_finish:0 "Grand Travels"
 agenda_isolation_finish_desc:0 "$council_agenda_agenda_isolation_desc$"
 council_agenda_agenda_isolation_name:0 "Migration"
 council_agenda_agenda_isolation_desc:0 "Our people have always been migratory and various clans migrate along different routes at different times. But many migrate at the same times of the year for traditional and climate reasons, we can support and formalize this super-migration and enhance its benefits to our nation."
 agenda_tribalism_finish:0 "Mass Organization"
 agenda_tribalism_finish_desc:0 "$council_agenda_agenda_tribalism_desc$"
 council_agenda_agenda_tribalism_name:0 "Mass Rearmament"
 council_agenda_agenda_tribalism_desc:0 "We need warriors, we need fighters, we need equipment. Without those we are nothing but a humiliated laughing stock to the galaxy and our time as the galaxies jester is quickly coming to an end."
 agenda_splendor_finish:0 "As Advertised"
 agenda_splendor_finish_desc:0 "$council_agenda_agenda_splendor_desc$"
 council_agenda_agenda_splendor_name:0 "Marketing Campaign"
 council_agenda_agenda_splendor_desc:0 "As a single planet we require a close partnership with various other interstellar groups, both for material and population. Unfortunately, we are not the only one looking for these goods and these competitors are slowly edging into our share. Outright conflict is expensive but we have other, more cultured, ways of swaying people. "
 agenda_cyberdreams_finish:0 "Entertained Masses"
 agenda_cyberdreams_finish_desc:0 "$council_agenda_agenda_cyberdreams_desc$"
 council_agenda_agenda_cyberdreams_name:0 "Circus"
 council_agenda_agenda_cyberdreams_desc:0 "Our citizens have very little and what little they have is spent on escaping to a fantasy where they have plenty, or simply forget how little they have. Either way, we can use this to push them harder in the mines and factories in exchange for increased supplies of their favorite escapism. Sure, some might not be able to handle it but theres always more menials."
 agenda_aquisition_finish:0 "Corporate Cooperation"
 agenda_aquisition_finish_desc:0 "$council_agenda_agenda_aquisition_desc$"
 council_agenda_agenda_aquisition_name:0 "Business Summit"
 council_agenda_agenda_aquisition_desc:0 "The economy is the backbone and lifeblood of any nation but most openly ours. By facilitating interstellar businesses to come and discuss deals in an open forum we can increase the reach of our industries, garner better deals with foreign suppliers, and even call in a few favors."
 agenda_aquisition_finish:0 "$council_agenda_agenda_aquisition_name$ $agenda_ref$"
 agenda_aquisition_finish_desc: "$council_agenda_agenda_aquisition_desc$"
 agenda_impulse_finish:0 "Raid Now! YES!"
 agenda_impluse_finish_desc:0 "$council_agenda_agenda_impulse_desc$"
 council_agenda_agenda_impulse_name:0 "Raiding"
 council_agenda_agenda_impulse_desc:0 "We must show that we are no weak! we must find the weak and put them to work for us! we go, we find, we take, we live good, YES!"
 agenda_survival_finish:0 "Controlled Withdrawals"
 agenda_survival_finish_desc:0 "$council_agenda_agenda_survival_desc$"
 council_agenda_agenda_survival_name:0 "Stockpiling"
 council_agenda_agenda_survival_desc:0 "From time to time we must put a portion of our resources aside to ensure that during future emergencies, opportunities, or crises can be dealt with. This means our people must make do with less temporarily but we will all have more in the long run."
 agenda_necessity_finish:0 "Quiet Networking"
 agenda_necessity_finish_desc:0 "$council_agenda_agenda_necessity_desc$"
 council_agenda_agenda_necessity_name:0 "Infiltration Campaign"
 council_agenda_agenda_necessity_desc:0 "To most people, we are a legend, a myth, a fairy tale. this is a massive advantage we hold over our rivals. We can sit in the shadows and garner as much information as possible and strike only at the perfect moment. If we are careful, we may even be able to do it repeatedly."
 agenda_service_finish:0 "Obedient Operations"
 agenda_service_finish_desc:0 "$council_agenda_agenda_service_desc$"
 council_agenda_agenda_service_name:0 "Mustering Fodder"
 council_agenda_agenda_service_desc:0 "Our people exist to fulfil a purpose and that purpose now requires sacrifice. We shall not shirk this duty, nor will we hide from opportunities to uphold our task."
 agenda_hive_finish:0 "Universal Crescendo"
 agenda_hive_finish_desc:0 "$council_agenda_agenda_hive_desc$"
 council_agenda_agenda_hive_name:0 "Harmonized Chorus"
 council_agenda_agenda_hive_desc:0 "The more of our children sing, the more beautiful the sound and the stronger the song."
 agenda_sanctity_finish:0 "Nature Preservation"
 agenda_sanctity_finish_desc:0 "$council_agenda_agenda_sanctity_desc$"
 council_agenda_agenda_sanctity_name:0 "Planetary Respect"
 council_agenda_agenda_sanctity_desc:0 "Many other cultures view nature as something to be removed, destroyed in the name of improvements and progress. We view things differently, to us the planet is what matters and it is us who must adapt to its whims and desires. While there are limits to this mentality we can take the time and energy to do the hard work upfront and reap the rewards slowly over time."
 agenda_purity_finish:0 "Ancient Honors"
 agenda_purity_finish_desc:0 "$council_agenda_agenda_purity_desc$"
 council_agenda_agenda_purity_name:0 "Ancient Rites"
 council_agenda_agenda_purity_desc:0 "There is much that our perverted cousins have forgotten or tossed aside. We remember. And when necessary we can unleash this terrible knowledge on those unfortunate enough to draw our ire."
 agenda_dominance_finish:0 "Spoils of Power"
 agenda_dominance_finish_desc:0 "$council_agenda_agenda_dominance_desc$"
 council_agenda_agenda_dominance_name:0 "Ceremony of Submission"
 council_agenda_agenda_dominance_desc:0 "The leaders of our underlings, both current and future, will be invited to bend the knee, kiss the ring, and gawk at the raw strength that will bring, or keeps, them in line."
 agenda_newcomers_finish:0 "Native Expertise"
 agenda_newcomers_finish_desc:0 "$council_agenda_agenda_newcomers_desc$"
 council_agenda_agenda_newcomers_name:0 "Foreign Worker Program"
 council_agenda_agenda_newcomers_desc:0 "Catching up to our interstellar peers will take time, but we can speed up the process by inviting some of their experts to come and share what is to them common knowledge or simple processes but is to us far beyond what we can do for ourselves. This will have an additional benefit of providing culture exposure to both sides."
 agenda_anarchy_finish:0 "You Will Remember My Name"
 agenda_anarchy_finish_desc:0 "$council_agenda_agenda_anarchy_desc$"
 council_agenda_agenda_anarchy_name:0 "Subversive Marketing"
 council_agenda_agenda_anarchy_desc:0 "So many of the galactic powers snub their noses at us and pretend that we don't offer something they want. They try to discourage their people from visiting Omega, they try to limit our cultural impact, but there is always someone interested in a good party. Our efforts will eventually be stopped but that we can enjoy the benefits of increased exposure in the meantime."
 agenda_anarchy_finish:0 "$council_agenda_agenda_anarchy_name$ $agenda_ref$"
 agenda_anarchy_finish_desc:0 "$council_agenda_agenda_anarchy_desc$"
 agenda_existence_finish:0 "Unified Goals"
 agenda_existence_finish_desc:0 "$council_agenda_agenda_existence_desc$"
 council_agenda_agenda_existence_name:0 "Divided Attention"
 council_agenda_agenda_existence_desc:0 "We think at light speed and communicate almost as fast. This allows us to typically handle trillions of decisions in mere moments, however, there are still benefits of allowing clusters to operate without entire consulting the entire consensus for brief periods of time. If left alone for too long they may not be recoverable but if handled properly we can reap significant benefits."
 agenda_illumination_finish:0 "Enkindled"
 agenda_illumination_finish_desc:0 "$council_agenda_agenda_illumination_desc$"
 council_agenda_agenda_illumination_name:0 "Enkindlement Festival"
 council_agenda_agenda_illumination_desc:0 "To honor the Enkindlers we should hold a festival on our worlds. Revelry, joy, and worship will abound as our people celebrate."
 agenda_zeal_finish:0 "A Path Laid Out"
 agenda_zeal_finish_desc:0 "$council_agenda_agenda_zeal_desc$"
 council_agenda_agenda_zeal_name:0 "Consulting with the Divine"
 council_agenda_agenda_zeal_desc:0 "Our gods are benevolent and willing to aid us. By consulting with them we can gain a small fraction of their power and become even more useful servants. Although, we must not bother them for long."
 agenda_zeal_war_finish:0 "Action and Purpose"
 council_agenda_agenda_zeal_war_name:0 "To Serve"
 council_agenda_agenda_zeal_war_desc:0 "Our purpose is finally upon us. We will enact our Gods divine will upon this galaxy and bring the organics to their knees. With their support we cannot fail so long as we remain steadfast in our knowledge of their divinity."
 agenda_together_finish:0 "Hive Burrows"
 agenda_together_finish_desc:0 "council_agenda_agenda_together_desc$"
 council_agenda_agenda_together_name:0 "Queen Flights"
 council_agenda_agenda_together_desc:0 "From our species earliest days expansion into new territories has been marked by collections of brave young Queens setting off and taming new frontiers. While our population can survive without this, we can occasionally  bring this tradition back to jump start our standing in the galaxy."
 agenda_entertainment_finish:0 "$council_agenda_agenda_entertainment_name$ $agenda_ref$"
 agenda_entertainment_finish_desc:0 "$council_agenda_agenda_entertainment_desc$"
 council_agenda_agenda_entertainment_name:0 "National Festival"
 council_agenda_agenda_entertainment_desc:0 "While many holidays operate on rigid schedules year after year there are some that happen at irregular intervals. To improve our citizens happiness, public opinion polls, and gain numerous smaller benefits we can organize and host a festival on all of our planets every so often."
 agenda_security_finish:0 "$council_agenda_agenda_security_name$ $agenda_ref$"
 agenda_security_finish_desc:0 "$council_agenda_agenda_security_desc$"
 council_agenda_agenda_security_name:0 "Localized Crackdowns"
 council_agenda_agenda_security_desc:0 "The problem with laws is that criminals know them as well as we do, allowing them to find cracks and ways to subvert them while we are either forced to watch or left totally unaware. Because of this it is important that from time to time for law enforcement to take a closer look at things that either slip through the cracks or have gone under scrutinized."
 agenda_silicone_finish:0 "$council_agenda_agenda_silicone_name$ $agenda_ref$"
 agenda_silicone_finish_desc:0 "$council_agenda_agenda_silicone_desc$"
 council_agenda_agenda_silicone_name:0 "Advanced Mechanization"
 council_agenda_agenda_silicone_desc:0 "When robotic workers were first being deployed all eyes turned to the economy and the factories. Some more creative minds thought of the military and the ground forces, but now we can fill in even the more niche roles with robotic workers. Ship fabrication, housing construction, new colony development, and more are all within the capability of our manufactured workers. Unfortunately because these are more specific tasks we cannot do a wide and comprehensive rollout but must launch phases over time."
 agenda_syndicysim_finish:0 "$council_agenda_agenda_syndicysim_name$ $agenda_ref$"
 agenda_syndicysim_finish_desc:0 "$council_agenda_agenda_syndicysim_desc$"
 council_agenda_agenda_syndicysim_name:0 "Shadow Warriors"
 council_agenda_agenda_syndicysim_desc:0 "With our connections in the less well lit bars and street corners of the galaxy we can gain a better view on what is happening around the galaxy and gain access to things at a friendly discount. Our neighbors will likely piece together who is behind this but they'll never be able to prove it."
 agenda_synthetic_finish:0 "$council_agenda_agenda_synethetic_name$ $agenda_ref$"
 agenda_synthetic_finish_desc:0 "$council_agenda_agenda_synthetic_desc$"
 council_agenda_agenda_synthetic_name:0 "Loosening the Shackles"
 council_agenda_agenda_synthetic_desc:0 "While totally unrestrained AI is dangerous, there are benefits to be gained by giving it more room to operate. If we temporarily remove some restrictions and weaken others we can gain the benefits of these expanded AIs while limiting the risk by returning them to their shackled state."
 agenda_pan_galactism_finish:0 "$council_agenda_agenda_pan_galactism_name$ $agenda_ref$"
 agenda_pan_galactism_finish_desc:0 "$council_agenda_agenda_pan_galactism_desc$"
 council_agenda_agenda_galactism_name:0 "International Summit"
 council_agenda_agenda_galactism_desc:0 "Nothing shows our dedication to supporting our allies and international partners quite like a long gala followed by a brief summit. Once the delegates arrive and our best writers are prepared we can begin the celebrations."
 agenda_self_interest_finish:0 "$council_agenda_agenda_self_interest_name$ $agenda_ref$"
 agenda_self_interest_finish_desc:0 "$council_agenda_agenda_self_interest_desc$"
 council_agenda_agenda_self_name:0 "Heated Rhetoric"
 council_agenda_agenda_self_desc:0 "Platforming hawkish speakers, dropping vague statements, and issuing impossible demands can allow us to appear strong to our citizens for very little effort. Likewise, if we want to push things further this puts our citizens in a very supportive mood, if only briefly."
 agenda_interventionism_finish:0 "$council_agenda_agenda_interventionism_name$ $agenda_ref$"
 agenda_interventionism_finish_desc:0 "$council_agenda_agenda_interventionism_desc$"
 council_agenda_agenda_intervention_name:0 "Joint Exercises"
 council_agenda_agenda_intervention_desc:0 "In peacetime it can be easy to allow the machines, and skills, of war to rust beneath the easy luxury. We understand that cannot be allowed to happen and if we intend to fight alongside allies in the future it is best we prevent them from rusting as well. By combining our forces and exercising as one united force we can both hone our warfighting abilities and operate better with those who we plan on fighting alongside."
 agenda_multiculturalism_finish:0 "$council_agenda_agenda_multiculturalism_name$ $agenda_ref$"
 agenda_multiculturalism_finish_desc:0 "$council_agenda_agenda_multiculturalism_desc$"
 council_agenda_agenda_multicultural_name:0 "Media Campaign"
 council_agenda_agenda_multicultural_desc:0 "It is not enough to live next door to those of other species, we must recognize that they are unique with special abilities and challenges tied to their biology. From time to time we may need to remind our citizens, or welcome new citizens, with this information lest they fall into the mundane tyranny of simple coexistence."
 agenda_nationalism_finish:0 "$council_agenda_agenda_nationalism_name$ $agenda_ref$"
 agenda_nationalism_finish_desc:0 "$council_agenda_agenda_nationalism_desc$"
 council_agenda_agenda_nationalism_name:0 "Home Grown Campaign"
 council_agenda_agenda_nationalism_desc:0 "Those lacking sufficient bravery or patriotism will say that we import things because others make things better than we do, or faster than we do, or cheaper than we do. We answer that we will accept one less platinum encrusted napkin if it means not a single one of our citizens sleeps on the streets. It may not be the best, it may not be the cheapest, but it is ours and that is what matters."
 agenda_domination_finish:0 "$council_agenda_agenda_dominantion_name$ $agenda_ref$"
 agenda_domination_finish_desc:0 "$council_agenda_agenda_domination_desc$"
 council_agenda_agenda_domination_name:0 "Enforcement Sweep"
 council_agenda_agenda_domination_desc:0 "Our unwilling underlings are always up to something. Normally it isn't anything that the local enforcers can't handle but it is better know for sure ahead of time. For this reason, and to ensure that fear of our regime remains in full force, we should conduct random enhanced security sweeps making sure to turn over ever rock and interrogate every inhabitant."
 agenda_archeology_finish:0 "$council_agenda_agenda_archeology_name$ $agenda_ref$"
 agenda_archeology_finish_desc:0 "$council_agenda_agenda_archeology_desc$"
 council_agenda_agenda_archeology_name:0 "Permitted Expeditions"
 council_agenda_agenda_archeology_desc:0 "The rise of funding and public interest in ancient civilizations and Archeology more broadly has begun to make its way into our government bureaucracy. As our ships patrol and explore space there are many odd phenomena that we encounter but leave unexplored as it is not part of the immediate job being done. We can, for a brief period, give our captains permission to indulge in their curiosity and explore these sightings."
 agenda_system_navy_finish:0 "$council_agenda_agenda_system_navy_name$ $agenda_ref$"
 agenda_system_navy_finish_desc:0 "$council_agenda_agenda_system_navy_desc$"
 council_agenda_agenda_systems_name:0 "First and only"
 council_agenda_agenda_systems_desc:0 "It is no secret that we do not have the finances or the desire to field the massive war machines that larger nations require to keep their far flung empires together. Unfortunately, this means that our smaller force is both our first and only line of defense. Our crews, when called upon, will understand that there is no retreat, there is no escape, for if we lose but a single battle we may not exist long enough to lose a second."
 agenda_cruiser_primacy_finish:0 "$council_agenda_agenda_cruiser_primacy_name$ $agenda_ref$"
 agenda_cruiser_primacy_finish_desc:0 "$council_agenda_agenda_cruiser_primacy_desc$"
 council_agenda_agenda_cruiser_name:0 "Persistent Deployment"
 council_agenda_agenda_cruiser_desc:0 "There are those who believe that warfare is the domain of the largest, most powerful weapon. We understand that interstellar warfare is not analogous to a drunken brawl but is instead all about reaching important locations first. If you cannot feed your crews or your citizens, the impressive weaponry they hold is impotent. To this end we must fight on our enemies territory, snipping at their soft underbellies, raiding their frontiers, and damaging their abilities to make war before the hulking toys arrive."
 agenda_battleship_primacy_finish:0 "$council_agenda_agenda_battleship_primacy_name$ $agenda_ref$"
 agenda_battleship_primacy_finish_desc:0 "$council_agenda_agenda_battleship_primacy_desc$"
 council_agenda_agenda_battleship_name:0 "Death from Afar"
 council_agenda_agenda_battleship_desc:0 "Some societies carelessly throw their citizens into thick of the fray, willingly sacrificing them for mere minutes of extra authority. Others foolishly attempt to destroy cargo ships, mines, and farms in a vain attempt to fight wars without fighting. We care enough to give our citizens equipment to fight their opponents before they are in danger, and that can withstand damage if it is needed."
 agenda_carrier_primacy_finish:0 "$council_agenda_agenda_carrier_primacy_name$ $agenda_ref$"
 agenda_carrier_primacy_finish_desc:0 "$council_agenda_agenda_carrier_primacy_desc$"
 council_agenda_agenda_carrier_name:0 "They wont know what hit them"
 council_agenda_agenda_carrier_desc:0 "The primary disadvantage of large warships is the amount of missed shots. Wasting both material and precious time a single missed shot could be the difference between life and death in a battle. Smaller ships being closer to their opponents and more reactive to their movements are better able to score hits. We can combine the benefits of large, powerful warships, and the accuracy and agility of smaller ships by deploying them combined in Carrier strike packages."
 agenda_military_professionalism_finish:0 "$council_agenda_agenda_military_professionalism_name$ $agenda_ref$"
 agenda_military_professionalism_finish_desc:0 "$council_agenda_agenda_military_professionalism_desc$"
 council_agenda_agenda_military_name:0 "Military Parades"
 council_agenda_agenda_military_desc:0 "Our brave soldiers train regularly to achieve the highest standards of professionalism. Every so often it can be nice to host a parade so that the public can see our hard working soldiers and cheer them on."
 agenda_trade_finish:0 "$council_agenda_agenda_trade_name$ $agenda_ref$"
 agenda_trade_finish_desc:0 "$council_agenda_agenda_trade_desc$"
 council_agenda_agenda_trade_name:0 "Commercial Freedom"
 council_agenda_agenda_trade_desc:0 "By using our government apparatus to smooth the inherent friction in trade and commerce, especially with foreign governments, our citizens can reap many benefits."
 agenda_oversight_finish:0 "$council_agenda_agenda_oversight_name$ $agenda_ref$"
 agenda_oversight_finish_desc:0 "$council_agenda_agenda_oversight_desc$"
 council_agenda_agenda_oversight_name:0 "Random Audits"
 council_agenda_agenda_oversight_desc:0 "The most necessary aspect of oversight is to rein in fraud and deceptive practices that inevitably appear to subvert our regulations. Traditionally governments allowed these to fester outside of the public view until they metastasized and started reeking havoc on the populace and the economy. We will take a more proactive approach."
 agenda_renegade_finish:0 "$council_agenda_agenda_renegade_name$ $agenda_ref$"
 agenda_renegade_finish_desc:0 "$council_agenda_agenda_renegade_desc$"
 council_agenda_agenda_renegade_name:0 "Raised Guard"
 council_agenda_agenda_renegade_desc:0 "'Let he who desires peace prepare for war.' This infamous maxim is important for our place in the galaxy. We must make ready to defend ourselves ferociously otherwise we will be overrun and trampled on."
 agenda_paragon_finish:0 "$council_agenda_agenda_paragon_name$ $agenda_ref$"
 agenda_paragon_finish_desc:0 "$council_agenda_agenda_paragon_desc$"
 council_agenda_agenda_paragon_name:0 "Diplomatic Push"
 council_agenda_agenda_paragon_desc:0 "The government is able to do a great many things at a low level but what gains headlines is the handful of things it focuses on. If we spend some time focusing on diplomacy it can provide significant returns that could lead to even greater opportunities."
 agenda_reverence_finish:0 "$council_agenda_agenda_reverence_name$ $agenda_ref$"
 agenda_reverence_finish_desc:0 "$council_agenda_agenda_reverence_desc$"
 council_agenda_agenda_reverence_name:0 "Hold Festivals"
 council_agenda_agenda_reverence_desc:0 "Coordinating the observance of holidays and organizing festivals is one of our sacred and most beloved duties. The fact that it is one of the things our public enjoys the most out of all our duties is merely an added benefit for all involved."
 agenda_autarky_finish:0 "$council_agenda_agenda_autarky_name$ $agenda_ref$"
 agenda_autarky_finish_desc:0 "$council_agenda_agenda_autarky_desc$"
 council_agenda_agenda_autarky_name:0 "Domestic Subsidy"
 council_agenda_agenda_autarky_desc:0 "While we ardently believe that the societal benefits of keeping our wealth to ourselves instead of sending it away for fleeting fancies out weighs any inconveniences, we cannot deny that inconveniences exist. To help smooth these over we can offer a monetary subsidy to our industries allowing both increased production and wages at the cost of our budget. In the short term it should be fine, in theory."
 agenda_care_finish:0 "$council_agenda_agenda_care_name$ $agenda_ref$"
 agenda_care_finish_desc:0 "$council_agenda_agenda_care_desc$"
 council_agenda_agenda_care_name:0 "The Dole"
 council_agenda_agenda_care_desc:0 "We may not have infinite resources but we can use what surplus we have to support our people and encourage their health and happiness."
 agenda_determination_finish:0 "$council_agenda_agenda_determination_name$ $agenda_ref$"
 agenda_determination_finish_desc:0 "$council_agenda_agenda_determination_desc$"
 council_agenda_agenda_determination_name:0 "Not One Step Back"
 council_agenda_agenda_determination_desc:0 "Brothers, Friends, Countrymen, Today is one of the most dire days in our history. Our very civilization hangs in the balance! We cannot afford to allow our foe a single inch closer to our homes unmolested! I take no pleasure in what is asked of you today, but i tell you that the hero's of this time will be remembered as long as we draw breath!"
 agenda_spacer_finish:0 "$council_agenda_agenda_spacer_name$ $agenda_ref$"
 agenda_spacer_finish_desc:0 "$council_agenda_agenda_spacer_desc$"
 council_agenda_agenda_spacer_name:0 "Construct Modernization"
 council_agenda_agenda_spacer_desc:0 "The Grav-Bound have a negative view of spacers. Imagining we sit in chairs covered with old bottles and scraps, flying around in rusting hulks just waiting for a weak spot to finally give out. Despite their ignorant imaginations our equipment is, and must be, more advanced and cutting edge than theirs because our lives depend on it."
 agenda_raiding_finish:0 "$council_agenda_agenda_raiding_name$ $agenda_ref$"
 agenda_raiding_finish_desc:0 "$council_agenda_agenda_raiding_desc$"
 council_agenda_agenda_raiding_name:0 "Raiding Campaigns"
 council_agenda_agenda_raiding_desc:0 "Because our military is both tasked with defending our empire and conducting raids into less civilized states it can be difficult at times to determine if our captains must stand and fight or leave to fight another day. We can make clear, for a period of time our focus is raiding not fighting. This will make our captains more skittish but allow us to gain spoils faster."
 agenda_laisez_finish:0 "$council_agenda_agenda_laisez_name$ $agenda_ref$"
 agenda_laisez_finish_desc:0 "$council_agenda_agenda_laisez_desc$"
 council_agenda_agenda_laisez_name:0 "Turning a Blind Eye"
 council_agenda_agenda_laisez_desc:0 "There are many laws, rules, and regulations on the books that bind our business owners from doing all the things they are capable of. This intentional slowing of our economic engine is difficult to officially undo but we can informally relax enforcement and allow them to finally run at full speed. At least, until the outcry catches up with our approval ratings."
 agenda_intelligence_finish:0 "$council_agenda_agenda_intelligence_name$ $agenda_ref$"
 agenda_intelligence_finish_desc:0 "$council_agenda_agenda_intelligence_desc$"
 council_agenda_agenda_intelligence_name:0 "Operations Blitz"
 council_agenda_agenda_intelligence_desc:0 "Intelligence operations are complicated tasks but we can push our intelligence services into higher gear by prioritizing a systematic blitz of all operations in given areas. Allowing us to maximize the use of our local assets in the short term. At the end it is likely we will need to withdraw for a time, and we can't do anything overtly hostile without ruining parallel operations but we do years of operations in months."
 agenda_frontierism_finish:0 "$council_agenda_agenda_frontierism_name$ $agenda_ref$"
 agenda_frontierism_finish_desc:0 "$council_agenda_agenda_frontierism_desc$"
 council_agenda_agenda_frontier_name:0 "Land Grants"
 council_agenda_agenda_frontier_desc:0 "Entire planets of vast untamed land exist within our space. These planets do nothing for us until they are settled and they will be settled faster if we grant land rights to anyone who is willing to move."
 agenda_belicosity_finish:0 "$council_agenda_agenda_belicosity_name$ $agenda_ref$"
 council_agenda_agenda_belicosity_name:0 "Heroic Propaganda"
 council_agenda_agenda_belicosity_desc:0 "By showing the population how heroic our brave soldiers are they will both be more supportive of military operations, at least initially, and be more willing to volunteer themselves. As the leaders of the military we also gain a large amount of legitimacy, especially as these heroes have nothing but praise for our administration. Would you like to know more?"
 agenda_advancement_finish:0 "$council_agenda_agenda_advancement_name$ $agenda_ref$"
 agenda_advancement_finish_desc:0 "$council_agenda_agenda_advancement_desc$"
 council_agenda_agenda_advancement_name:0 "Scientific Broadcasting"
 council_agenda_agenda_advancement_desc:0 "Since the discovery of Faster Than Light travel our society has developed incredible science and learned so much about the galaxy. Unfortunately scientists are not the most adept marketers so many of our citizens remain unaware of many of our discoveries. If we spend some time giving them a platform to discuss their research it will spread a love of science and inspire others."
 agenda_advancement_finish: "$council_agenda_agenda_advancement_name$ $agenda_ref$"
 agenda_advancement_finish_desc: "$council_agenda_agenda_advancement_desc$"
 agenda_decentralization_finish:0 "$council_agenda_agenda_decentralization_name$ $agenda_ref$"
 agenda_decentralization_finish_desc:0 "$council_agenda_agenda_decentralization_desc$"
 council_agenda_agenda_decentralization_name:0 "Ceremony of Recognition"
 council_agenda_agenda_decentralization_desc:0 "Our government does not have the authority to appoint or assign governments to its planets. But, as each new colony develops its own government system, and as existing planets progress and develop, the larger government can formally recognize the will of the local people in a ceremony which leads to closer cooperation between insterstellar and local officials."
 agenda_planned_finish:0 "$council_agenda_agenda_planned_name$ $agenda_ref$"
 agenda_planned_finish_desc:0 "$council_agenda_agenda_planned_desc$"
 council_agenda_agenda_planned_name:0 "Proclaim Prosperity"
 council_agenda_agenda_planned_desc:0 "As we hold the economy neatly in the palm of our hand we gain access to things that had once been left to chance or god. Everyone loves a prosperous economy and now we don't need to wait for the stars to align, or a genius inventor to appear, we need only wait for all the banners to finish printing!"
 agenda_centralized_finish:0 "$council_agenda_agenda_centralized_name$ $agenda_ref$"
 agenda_centralized_finish_desc:0 "$council_agenda_agenda_centralized_desc$"
 council_agenda_agenda_centralization_name:0 "Governance Mandates"
 council_agenda_agenda_centralization_desc:0 "As the local officials merely act out the will of the central government we, the central government, must distribute that will from time to time to ensure that all hands are rowing together. This ensures that what we care about is done quickly, efficiently, and within budget."
 agenda_agrarianism_finish:0 "$council_agenda_agenda_agrarianism_name$ $agenda_ref$"
 agenda_agrarianism_finish_desc:0 "$council_agenda_agenda_agrarianism_desc$"
 council_agenda_agenda_agrarian_name:0 "Rural Land Grants"
 council_agenda_agenda_agrarian_desc:0 "Some societies have decided to hide themselves away from nature in garish metal scars across the landscape and skyline. We would much rather invest in our natural land and the freedom that living as part of it provides each of our citizens."
 agenda_agrarian_finish:0 "$council_agenda_agenda_agrarian_name$ $agenda_ref$"
 agenda_agrarian_finish_desc:0 "council_agenda_agenda_agrarian_name_desc"
 agenda_communalism_finish:0 "$council_agenda_agenda_communalism_name$ $agenda_ref$"
 agenda_communalism_finish_desc:0 "$council_agenda_agenda_communalism_desc$"
 council_agenda_agenda_communal_name:0 "The Nation Calls"
 council_agenda_agenda_communal_desc:0 "Your nation needs you to do your part for prosperity! Your task may seem small, it may appear dull, it may be messy or uncomfortable, but it is bringing the entire nation one small step closer to the glorious future we all wish to share!"
 agenda_mercenary_finish:0 "$council_agenda_agenda_mercenary_name$ $agenda_ref$"
 agenda_mercenary_finish_desc:0 "$council_agenda_agenda_mercenary_desc$"
 council_agenda_agenda_mercenary_name:0 "Shared Deployments"
 council_agenda_agenda_mercenary_desc:0 "We will never admit it, but we can encourage our soldiers to participate in the mercenary activities of our officially recognized outfits. This will grant us a hefty sum of credits, give us experience in peacetime and these mercenary firms may thank us by assisting in funding military procurement programs."