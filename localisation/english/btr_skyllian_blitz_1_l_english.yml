l_english:
 btr_skyllian_blitz_1.2.name: ""
 btr_skyllian_blitz_1.2.desc: "§HSomeone is trying to establish contact with us.§!\n\n§HA turian is asking for an audience with you.§!"
 btr_skyllian_blitz_1.2.a: "Who are you?"
 btr_skyllian_blitz_1.2.a.response: "Hello Magistratus, my name is §YElanos Haliat§! and I believe I can be of use to you. "
 btr_skyllian_blitz_1.2.b: "How can you help the Directorate?"
 btr_skyllian_blitz_1.2.b.response: "Your nation exists as a bastion on the frontier of civilization and must be ready to defend itself at a moment's notice. I happen to have extensive experience as a Logistics Officer with the Hierarchy military. Perhaps together we can ensure that Caleston's defenders never want for ammunition and use the latest and most effective weapons available. What do you say?"
 btr_skyllian_blitz_1.2.c: "Yes, let us welcome our turian brother."
 btr_skyllian_blitz_1.2.d: "No, thank you. We can manage our own security."

 btr_skyllian_blitz_1.3.name: "Elanos Haliat"
 btr_skyllian_blitz_1.3.desc: "Hello Magistratus, my name is Elanos Haliat and I believe I can be of use to you. Your nation exists as a bastion on the frontier of civilization and must be ready to defend itself at a moment's notice. I happen to have extensive experience as a Logistics Officer with the Hierarchy military. Perhaps together we can ensure that Caleston's defenders never want for ammunition and use the latest and most effective weapons available. What do you say?"
 btr_skyllian_blitz_1.2.c.response: "§HThe turian smiles grimly before responding. §!\n\nA wise decision. I look forward to the fruits of a most beneficial partnership. I'll start familiarizing myself with our military effectiveness immediately.§H\n\nWithout another word, he terminates the connection.§!"
 btr_skyllian_blitz_1.2.d.response: "§HFor an instant the turian's composure gives way and he visibly bristles, his mandibles slightly flexing as a dangerous look passes across his face. The practiced smile returns, though his eyes remain cold as he smoothly responds - §!\n\nA disappointing choice, but one that makes little difference in the end. We will cross paths again.§H\n\nHe terminates the connection without waiting for a response.§!"

 #
 # btr_skyllian_blitz_1.100.name: "Refusal's Return"
 # btr_skyllian_blitz_1.100.desc: "Despite our initial refusal of Haliat's proposal to become a military advisor to our high command he has remained on Caleston. We were always apprehensive of his presence but had no grounds to expel him or arrest him, until now. He has recently issued a statement claiming that our government is in service to foreign corporations and not the true sons and daughters of Caleston. We prevented his message from spreading far, but his band of mercenaries is still a problem that must be swiftly dealt with."
 # btr_skyllian_blitz_1.100.a: "They shall be crushed by the true sons and daughters of Caleston!"
 # btr_skyllian_blitz_1.2.name: "Haliat's Mutiny"
 # btr_skyllian_blitz_1.2.desc: "Upon the Caleston Government's refusal to hire him, Elanos Haliat launched a rapid coup of the Government. With the help of the Eclipse Mercenary group and a small handful of personal supporters he was able to seize key government buildings. The former Magistratus Praefectus was killed in the fighting along with several lower Administrators, many who survived are currently in prison as Haliat begins establishing a new Regime."
 # btr_skyllian_blitz_1.2.a: "Curious."
 # btr_skyllian_blitz_1.3.name: "Rebellious Rabble"
 # btr_skyllian_blitz_1.3.desc: "The decision to refuse the offer of military support from a stranger wearing our face proved to be incredibly prescient. Upon hearing the news he immediately launched an attempted coup with the help of mercenaries and a small gaggle of traitors. Our security forces were able to put down this nuisance quickly with the organizers currently being dealt with. Many have begun pushing for the government to ban mercenary groups in Caleston space."
 # btr_skyllian_blitz_1.4.name: "REPLACE_ME"
 # btr_skyllian_blitz_1.4.desc:0 "REPLACE_ME"
 # btr_skyllian_blitz_1.4.a: "REPLACE_ME"
 # btr_skyllian_blitz_1.5.name: "REPLACE_ME"
 # btr_skyllian_blitz_1.5.desc: "REPLACE_ME"
 # btr_skyllian_blitz_1.6.name: "Reformation Plan Presented"
 # btr_skyllian_blitz_1.6.desc: "The Caleston military is well trained and equipped but it is almost entirely defensive in nature. If it was ever asked to deploy outside of Caleston space it would be almost incapable of responding. This has also led to decades of logistical oversight as officers throughout the chain of command believe that they can simply find another supply depot if something goes wrong. These issues are not things that can be trained or ‘procedured' away, this calls for a broad military restructuring."
 # btr_skyllian_blitz_1.6.a: "It is time for the military to be more proactive."
 # btr_skyllian_blitz_1.6.b: "What does Haliat get out of this?"
 # btr_skyllian_blitz_1.7.name: "The Haliat Investigation"
 # btr_skyllian_blitz_1.7.desc: "Our security services have looked into Elanos Haliat and his proposal of reforming our military. While we do not have any clear indications of his intentions we have uncovered meetings between him and several ranking military officials prior to his proposal. He is also very closely associated with the Eclipse Mercenary company and met with Aria T'Loak on Omega not long before arriving on Caleston. The military did not play an active role in the investigation but there is some concern over how embedded this newly arrived stranger would become in our military should the proposal be accepted."
 # btr_skyllian_blitz_1.7.a: "This is concerning, bring him in."
 # btr_skyllian_blitz_1.7.b: "There is nothing wrong with a bit of backchanneling. Proceed with his proposal."
 # btr_skyllian_blitz_1.8.name: "The Haliat Coup"
 # btr_skyllian_blitz_1.8.desc: "At exactly 5am local time groups of Eclipse Mercenary Company and detachments of the Caleston Defense Force seized control of all transit centers of the planet along with the administrative districts of a majority of the planets Domes. After a tense four hours of silence Elanos Haliat emerged on a mandatory broadcast to declare that he was now in control of the government after removing the head of state for being ‘in the pocket of foreign corporations'."
 # btr_skyllian_blitz_1.8.a: "Rally the loyalists!"
 # btr_skyllian_blitz_1.8.b: "We should avoid violence."
 #
