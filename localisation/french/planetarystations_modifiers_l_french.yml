 ####################################
 # Modifiers
 ####################################
 
 helium_deficit: "Deficit: $helium$"
 
 ####################################
 # Planet Modifiers
 ####################################
 
 station_wreckage: "Station Wreckage"
 station_wreckage_desc: "There was once a station on this planet, as evidenced by the damaged structures on the surface."
 political_persecution: "Political Persecution"
 political_persecution_desc: "Political persecution is taking place on this planet. Agents of the government scurry about looking for enemies of the state."
 hunting_heretics: "Hunting Heretics"
 hunting_heretics_desc: "The Church has declared this planet to be a hotbed of heresy. Church officials call for apostates to be found and brought to holy judgment."
 increased_maintenance: "Increased Maintenance"
 increased_maintenance_desc: "This station has been upgraded to an increased maintenance level to ensure that the life support system is running at high efficiency."
 increased_maintenance_hive: "Increased Maintenance"
 increased_maintenance_hive_desc: "This station has been upgraded to an increased maintenance level to ensure that the life support system is running at high efficiency."
 contaminated_filters: "Contaminated Filters"
 contaminated_filters_desc: "The air filters at this station have not been properly maintained for a long time. The air will become contaminated and endanger the health of the station's inhabitants until the situation is corrected over time."
 heightened_security: "Heightened Security"
 heightened_security_desc: "The station has been declared a high level of security and control. Many new occupants are arriving at the station and are being subjected to rigorous screening and scrutiny."
 open_station: "Open Station"
 open_station_desc: "New passenger ships are constantly arriving from different parts of the empire. Station security is overwhelmed by the influx of incoming passengers and some are entering the station illegally."
 life_support_failure: "Life Support Failure"
 life_support_failure_desc: "The consequences of the accident will lead to a lack of oxygen at the station for some time until the life support system returns to normal."
 conciliation_measures: "Conciliation Measures"
 conciliation_measures_desc: "After the workers' strike, the living standards of the station's staff have been raised several times over to compensate for the harsh working conditions."
 prolonged_strike: "Prolonged Strike"
 prolonged_strike_desc: "At the station, a group of workers, dissatisfied with working conditions, organize protests and gather more like-minded people to block production."
 suppressed_protests: "Suppress Protests"
 suppressed_protests_desc: "After the workers' strike at the station, the instigators were arrested by the security forces. This led to pogroms and clashes with the security forces, which always end in the arrests of the most radical protesters. The strike turned into an active protest that quickly died out, lacking organization."
 station_mascot: "Station Mascot"
 station_mascot_desc: "Visitors of this station are greeted and escorted by a cute animal that brings a lot of joy and peace to its inhabitants."
 aura_of_fear: "Aura of Fear"
 aura_of_fear_desc: "In the hidden corners of the station dwells a mysterious hunter who kills personnel and spreads terror, leaving no place of safety."
 unidentified_intruder: "Unidentified Intruder"
 unidentified_intruder_desc: "An unidentified organic specimen has infiltrated the station. The facility's performance is at risk."
 energy_leak: "Energy Leak"
 energy_leak_desc: "The imperfect power grid at this station is prone to frequent failures, resulting in intermittent energy leaks."
 rising_corruption: "Rise of Corruption"
 rising_corruption_desc: "This station has become less secure for commercial operations. The lower levels are mired in crime and the administration is corrupt to the core."
 overloading_transport_hubs: "Overloading Transport Hubs"
 overloading_transport_hubs_desc: "The station's logistical system has collapsed. Many ships are waiting in line to land while port services attempt to service the docked ships."
 advantageous_location: "Advantageous Location"
 advantageous_location_desc: "This station happened to be at the crossroads of important trade routes. Most of the trade deals are done here at the moment."
 prisoner_revolt: "Prisoner Revolt"
 prisoner_revolt_desc: "The prisoners at this station have broken out of their cells and are trashing everything around them. The guards can't hold back the crowd and quell the riot."
 staff_recruitment: "Staff Recruitment"
 staff_recruitment_desc: "This station actively recruits and trains new employees by reducing production processes."
 station_close: "Station Close"
 station_close_desc: "This station is undergoing a shutdown procedure. Personnel are being evacuated."
 station_close_gestalt: "Station Close"
 station_close_gestalt_desc: "This station is undergoing a shutdown procedure. Personnel are being evacuated."
 the_consumers: "The Consumers"
 the_consumers_desc: "Society on this planet is used to living in better conditions at the expense of the resources they take from the colonies."
 the_unruly: "The Unruly"
 the_unruly_desc: "Society on this planet has long considered itself a separate civilization. They work hard in the hope of building their own independent state."
 the_rebels: "The Rebels"
 the_rebels_desc: "Dependence on the center, which takes away a large share of resources in exchange for meager living conditions, has turned this mining colony into a hotbed of instability."
 station_deterioration: "Station Deterioration"
 station_deterioration_desc: "This station has been abandoned and without maintenance will deteriorate over time."
 prison_station: "Prison Station"
 prison_station_desc: "The planetary station on this planet serves as a correctional facility. Most of the empire's criminals will end up in this place sooner or later.\n\n§WThe station's population is replenished mainly by criminals from other worlds. Everyone except the prison staff and prisoners does not stay here for long.§!"
 military_outpost: "Military Outpost"
 military_outpost_desc: "On this planet there is a planetary station that performs defensive functions and creates a military presence in the region."
 resort_station: "Resort Station"
 resort_station_desc: "There is a planetary station on this planet, which is one of the best places for recreation and entertainment."
 confluence_station: "Confluence Station"
 confluence_station_desc: "The planetary station on this planet acts as a nexus to strengthen the unity of the hive."
 simulation_station: "Simulation Station"
 simulation_station_desc: "On this planet there is a planetary station where complex simulations and data analysis are carried out to strengthen the unity of minds."
 extremophile_life_forms: "Extremophile Life Forms"
 extremophile_life_forms_desc: "In the depths of this volcanic planet, a gigantic network of caves has been discovered, inhabited by creatures that can withstand even very high temperatures. The morphology of these strange organisms is of great interest for our research."
 pop_convicted: "Convicted"
 pop_convicted_desc: "This settlement serves punishment for crimes."
 recent_arrests: "Recent Arrests"
 recent_arrests_desc: "A recent spate of high-profile arrests will dampen the rampant local crime. New inmates have already been transported to their prisons."
 mass_arrests: "Mass Arrests"
 mass_arrests_desc: "$recent_arrests_desc$"
 terraforming_station: "Terraforming Station"
 terraforming_station_desc: "On this planet there is a planetary station that is engaged in terraforming."
 barren_terraformed: "Terraformed Barren World"
 barren_terraformed_desc: "This planet has undergone the first stage of terraforming and now has its own reservoirs and a dense atmosphere, which, unfortunately, is not yet suitable for breathing."
 barren_cold_terraformed: "$barren_terraformed$"
 barren_cold_terraformed_desc: "$barren_terraformed_desc$"
 frozen_terraformed: "Terraformed Frozen World"
 frozen_terraformed_desc: "$barren_terraformed_desc$"
 toxic_terraformed: "Terraformed Toxic World"
 toxic_terraformed_desc: "$barren_terraformed_desc$"
 greenhouse_terraformed: "Terraformed Greenhouse World"
 greenhouse_terraformed_desc: "This planet has undergone Stage I terraforming and now has its own hydrosphere, which currently exists mostly in a vaporous state. The atmosphere is still not breathable, and the surface is too hot."
 methane_terraformed: "Terraformed Methane World"
 methane_terraformed_desc: "$barren_terraformed_desc$"