  ####################################
  # Origins
  ####################################
  
  origin_expanse: "The Expanse"
  origin_expanse_desc: "Rapidly running out of resources and significant overpopulation, pushed this civilization to enter space very early, without FTL technology. The period of colonization of the most promising uninhabited worlds in the system, ended in a deep civilizational crisis. At the moment when the disagreement, caused by complex social problems, between the homeworld and the colonies reached a peak, the hyperdrive was invented."
  civic_tooltip_expanse_effects: "You begin the game with three planetary stations in your system. Your home world and stations have special modifiers."
  
  
  ####################################
  # Traits
  ####################################
  
  
  ####################################
  # Start Screen Mesages
  ####################################
  
  START_ORIGIN_EXPANSE: "Our civilization has encountered many insurmountable obstacles along the way, but we have always found a way out. Climatic disasters, running out of resources, and overpopulation have forced us to seek new opportunities outside our home planet [GetHomeWorldName]. We built high-tech stations that allowed us to live and work on planets without suitable atmospheres. For a long time, the colonies provided their home planet with everything it needed, but it didn't last. The colonies' complicated dependence on the center and unequal social conditions have led society to contradictions that are about to escalate into conflict. \But all this will be in the past, because now, with the invention of the hyperdrive, new doors are opening for us... and new opportunities."
  
