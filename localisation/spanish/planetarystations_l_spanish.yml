  decision_start_barren_terraforming_project_2_effect_desc: "This decision starts the second stage of the terraforming project of the Barren World.\n\nIn the later stage of terraforming, you will have to deal with global greening of the planet and creation of a breathable nitrogen-oxygen atmosphere."
