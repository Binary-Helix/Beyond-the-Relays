  decision_start_frozen_terraforming_project_2_effect_desc: "This decision starts the second stage of the Frozen World terraforming project.\n\nIn the later stage of terraforming, you will have to deal with global greening of the planet and creation of a breathable nitrogen-oxygen atmosphere."
  decision_start_toxic_terraforming_project_1_effect_desc: "This decision starts the first stage of the Toxic World Terraforming Project.\n\nIn the early stages of terraforming, you will need to put maximum effort into creating a stable hydrosphere and cleaning the atmosphere of harmful impurities."
  decision_start_toxic_terraforming_project_2_effect_desc: "This decision starts the second stage of the Toxic World terraforming project.\n\nIn the later stage of terraforming, you will have to deal with global greening of the planet and creation of a breathable nitrogen-oxygen atmosphere."
  decision_start_greenhouse_terraforming_project_1_effect_desc: "This decision starts Stage I of the Greenhouse World terraforming project.\n\nIn the early stages of terraforming, you will need to put maximum effort into creating a hydrosphere and lowering the surface temperature."
  decision_start_greenhouse_terraforming_project_2_effect_desc: "This decision starts the second stage of the Greenhouse World terraforming project.\n\nIn the later stage of terraforming, you will have to deal with global greening of the planet and creation of a breathable nitrogen-oxygen atmosphere."
