  building_station_capital_desc: "The administrative section of this station, serving as the complex's manager and the location of the management staff."
  building_station_major_capital: "Station Administration Center"
  building_station_major_capital_desc: "A vast complex of bureaucratic departments that manage a major station."
  building_station_fe_capital: "$building_station_capital$"
