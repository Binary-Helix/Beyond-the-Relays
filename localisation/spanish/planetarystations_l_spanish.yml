  building_station_system_capital: "Station Capital-Complex"
  building_station_system_capital_desc: "A multi-tiered station complex, combining administrative offices, service nodes and extensive network infrastructure, which opens up more opportunities for station expansion."
  building_prison_capital: "Prison Control Module"
  building_prison_capital_desc: "$building_station_capital_desc$"
