  # Tooltip Massages
  ####################################
  
  requires_suitable_planetary_body: "$TRIGGER_FAIL$We don't have the technology to build stations on this type of planet."
  requires_barren_world: "$TRIGGER_FAIL$Planet cracking operations can only be performed on barren rocky worlds."
  requires_building_planetary_station_capital: "§RRequires §Y$building_planetary_station_capital$§! on planet.§!"
  requires_building_planetary_station_major_capital: "§RRequires §Y$building_planetary_station_major_capital$§! on planet.§!"
  requires_building_planetary_station_system_capital: "§RRequires §Y$building_planetary_station_system_capital$§! on planet.§!"

  
  ####################################
  # Army
  ####################################
  
  alien_army: "Alien Swarm"
  alien_army_desc: "Alien bloodthirsty monsters that hunt their prey in stealth and love to ambush."
  prison_army: "Crowd of Prisoners"
  prison_army_desc: "Armed with anything and everything, a mob of aggressive, rioting prisoners."
  
  ####################################
  # Technology
  ####################################
  
  tech_planetary_station_1: "Autonomous Life Support Systems"
  tech_planetary_station_1_desc: "A number of engineering solutions designed to provide permanent habitation in isolated complexes will allow the colonization of uninhabited worlds. Such colonies will be limited and expensive to maintain, but will open access to the resources of inaccessible planets."
  feature_build_planetary_station_1: "1st Level Planetary Stations"
  feature_build_planetary_station_1_desc: "Allows us to colonize most types of §YBarren Worlds§!, §YFrozen Worlds§! and §YAsteroids§!."
  tech_planetary_station_2: "Heat Resistant Materials"
  tech_planetary_station_2_desc: "Creation of special industrial materials and thermoplastic alloys, will make it possible to take the next step in the development of uninhabited worlds. Heavy-duty and heat-resistant structures are necessary for colonization of planets with active volcanism and moving plate tectonics."
  feature_build_planetary_station_2: "2st Level Planetary Stations"
  feature_build_planetary_station_2_desc: "Allows us to colonize most types of §YMolten Worlds§!."
  tech_planetary_station_3: "Adaptive Coverage"
  tech_planetary_station_3_desc: "The development of advanced electroplating technologies for materials capable of adapting to extreme toxic conditions will make it possible to colonize planets with aggressive environments."
  feature_build_planetary_station_3: "3st Level Planetary Stations"
  feature_build_planetary_station_3_desc: "Allows us to colonize most types of §YToxic Worlds§!."
  tech_planetary_station_4: "Antigravity Stabilizer"
  tech_planetary_station_4_desc: "The development of antigravity technologies opens up the possibility of creating stabilizing engines, working at the expense of the gravitational field of celestial bodies. Special propulsion systems capable of holding objects of enormous mass in the atmosphere of planets will make it possible to colonize gas giants and other planets where construction on the surface is impossible."
  feature_build_planetary_station_4: "4st Level Planetary Stations"
  feature_build_planetary_station_4_desc: "Allows us to colonize the §YGas Giants§! and §YGreenhouse Worlds§!."
  tech_extreme_mining_methods: "Extreme Mining Methods"
  tech_extreme_mining_methods_desc: "Implementing the idea of extensive mining by splitting lithospheric plates requires the development of a whole system of engineering solutions. This revolutionary step in the mining industry will enable cracking operations on uninhabitable planets for super-efficient resource extraction."
  feature_build_cracking_station: "Cracking Stations"
  feature_build_cracking_station_desc: "Allows us to colonize the §YBroken World§! and opens the solution §H$decision_planet_cracking$§! for §YBarren Worlds§!."
  tech_mine_helium: "Mine Helium-3"
  tech_mine_helium_desc: "Production of helium-3 on an industrial scale became possible only with access to space. Planets with a dense atmosphere do not retain this isotope. But millions of years of helium-3 accumulate in the regolith on atmosphereless planetsт."
  tech_colonial_station_protocol: "Colonial Station Protocol"
  tech_colonial_station_protocol_desc: "The development of special infrastructure facilities and the reorganization of control services will allow us to expand planetary stations and take the first step toward full colony status in the future."
  tech_planetary_reactor: "Nucleation of Production"
  tech_planetary_reactor_desc: "The creation of a global energy grid based on readily available nuclear energy will greatly increase the efficiency of production on the planet."
  tech_planet_meltification: "Planet Meltification"
  tech_planet_meltification_desc: "A range of integrated solutions for melting massive glaciers using the planet's geothermal resources opens up the possibility of terraforming even the coldest and most inhospitable worlds."
  feature_terraform_frozen: "$tech_planet_meltification$"
  feature_terraform_frozen_desc: "Allows us to terraform Frozen Worlds."
  
  
