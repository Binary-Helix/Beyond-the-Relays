  ####################################
  # Planet Subclasses
  ####################################
  
  ice_giant: "Ice Giant"
  ice_giant_desc: "This type of gas planets consists mainly of the solid aggregate states water, ammonia, methane and hydrogen sulfide, as well as rock, which make up about a quarter of the mass. The hydrogen and helium content of the ice giants does not exceed 15-20%. The magnetic fields are unusually shifted and tilted."
  methane_planet: "Methane World"
  methane_planet_desc: "The atmosphere of this gloomy world consists of nitrogen and methane-ethane compounds, which very often fall as rain to the surface, forming vast lakes."
  greenhouse_planet: "Greenhouse World"
  greenhouse_planet_desc: "A red-hot rocky world with an extremely dense atmosphere of carbon dioxide, nitrogen, and sulfur dioxide. The thick cloud cover created a greenhouse effect. As the temperature rose, the liquid water evaporated and with it the greenhouse gases from the crust of the planet were released. Temperatures on the surface can reach five hundred degrees Celsius, causing entire mountains to melt, so the landscape does not rarely change."
  scorched_planet: "Scorched World"
  scorched_planet_desc: "This barren world is practically devoid of atmosphere. The planet is too close to the central star of the system. During the day, unbearable heat reigns on its surface, and at night it is terribly cold."
  sulfur_planet: "Sulfur World"
  sulfur_planet_desc: "A molten world with active geological processes, the main composition of which is a variety of silicate rocks and sulfur compounds. Strong volcanism on the planet contributes to frequent changes in terrain, and due to sulfur compounds emitted by volcanic eruptions, this world acquires various shades of yellow, white, red, black and green on its surface."
  hot_giant: "Hot Giant"
  hot_giant_desc: "This gas giant is too close to its star, causing its surface to heat up to monstrous temperatures and its atmosphere to gradually evaporate. In the future, this gas giant may become a loose planet."
  
