 ####################################
 
 station_wreckage: "Обломки станции"
 station_wreckage_desc: "Когда-то на этой планете находилась станция, о чем свидетельствуют поврежденные сооружения на поверхности."
 political_persecution: "Политическое преследование"
 political_persecution_desc: "Население на этой планете подвергается политическим репрессиям. Повсюду снуют агенты правительства в поисках врагов государства."
 hunting_heretics: "Охота на еретиков"
 hunting_heretics_desc: "Церковь объявила эту планету очагом распространения ереси. Служители церкви призывают находить отступников и придавать их священному суду."
 increased_maintenance: "Повышенное обслуживание"
 increased_maintenance_desc: "Эта станция переведена на повышенный уровень обслуживания, чтобы обеспечить высокую эффективность работы системы жизнеобеспечения."
 increased_maintenance_hive: "Повышенное обслуживание"
 increased_maintenance_hive_desc: "Эта станция переведена на повышенный уровень обслуживания, чтобы обеспечить высокую эффективность работы системы жизнеобеспечения."
 contaminated_filters: "Загрязненные фильтры"
 contaminated_filters_desc: "Воздушные фильтры на этой станции давно не получали надлежащего обслуживания. Воздух будет загрязнятся и подвергать опасности здоровье обитателей станции, пока со временем ситуация не урегулируется."
 heightened_security: "Повышенная безопасность"
 heightened_security_desc: "На станции объявлен высокий уровень безопасности и контроля. На станцию прибывает множество новых обитателей, которые подвергаются тщательной проверке и досмотру."
 open_station: "Открытая станция"
 open_station_desc: "Новые пассажирские суда постоянно прибывают с разных уголков империи. Служба безопасности станции не справляется с большим потоком прибывающих пассажиров и некоторые попадают на станцию нелегально."
 life_support_failure: "Отказ системы жизнеобеспечения"
 life_support_failure_desc: "Последствия аварии какое-то время будут приводить к недостатку кислорода на станции, пока работа системы жизнеобеспечения не нормализуется."
 conciliation_measures: "Примирительные меры"
 conciliation_measures_desc: "После забастовки рабочих, на станции уровень жизни персонала был увеличен в несколько раз, чтобы компенсировать тяжелые условия труда."
 prolonged_strike: "Длительная забастовка"
 prolonged_strike_desc: "На станции группа рабочих, недовольная условиями труда, организует протесты и собирает все больше единомышленников, блокирующих производство."
 suppressed_protests: "Подавление протестов"
 suppressed_protests_desc: "После забастовки рабочих на станции зачинщики были арестованы службой безопасности. Это привело к погромам и стычкам с силовиками, которые всегда заканчиваются задержаниями наиболее радикальных протестующих. Забастовка переросла в активный протест, который быстро затухнет, лишенный организации."
 station_mascot: "Талисман станции"
 station_mascot_desc: "Посетителей этой станции встречает и провожает милый зверек, который дарит много радости и умиротворения для ее обитателей."
 aura_of_fear: "Ореол страха"
 aura_of_fear_desc: "В потаенных углах станции обитает таинственный охотник, который убивает персонал и сеет ужас, не оставляя безопасных мест."
 unidentified_intruder: "Неизвестный нарушитель"
 unidentified_intruder_desc: "На станцию проникла неопознанная органическая особь. Работоспособность объекта находится под угрозой."
 energy_leak: "Утечка энергии"
 energy_leak_desc: "Несовершенная энергосеть на этой станции подвержена частым сбоям, в результате которых происходит периодическая утечка энергии."
 rising_corruption: "Рассвет коррупции"
 rising_corruption_desc: "Эта станция стала менее безопасна для коммерческих операций. Нижние уровни погрязли в преступности, а администрация насквозь коррумпирована."
 overloading_transport_hubs: "Перегрузка транспортных узлов"
 overloading_transport_hubs_desc: "На станции произошел коллапс логистической системы. Множество кораблей ожидает своей очереди на посадку, пока портовые службы пытаются обслужить пристыкованные корабли."
 advantageous_location: "Выгодное расположение"
 advantageous_location_desc: "Эта станция оказалась на пересечении важных торговых маршрутов. На данный момент большинство торговых сделок проходят здесь."
 prisoner_revolt: "Восстание заключенных"
 prisoner_revolt_desc: "Заключенные на этой станции вырвались из своих камер и громят все вокруг. Охрана не может сдержать толпу и усмирить бунт."
 staff_recruitment: "Набор персонала"
 staff_recruitment_desc: "На этой станции происходит активный набор и обучение новых сотрудников за счет снижения производственных процессов."
 station_close: "Отключение станции"
 station_close_desc: "Эта станция проходит процедуру отключения. Персонал эвакуируется."
 station_close_gestalt: "Отключение станции"
 station_close_gestalt_desc: "Эта станция проходит процедуру отключения. Персонал эвакуируется."
 the_consumers: "Потребители"
 the_consumers_desc: "Общество на этой планете привыкло жить в лучших условиях за счет ресурсов, которые они забирают у колоний."
 the_unruly: "Непокорные"
 the_unruly_desc: "Общество на этой планете давно считает себя отдельной цивилизацией. Они много трудится в надежде построить свое независимое государство."
 the_rebels: "Бунтовщики"
 the_rebels_desc: "Зависимость от центра, который отбирает большую долю ресурсов в обмен на скудные условия существования, превратила эту шахтерскую колонию в очаг нестабильности."
 station_deterioration: "Ухудшение состояния станции"
 station_deterioration_desc: "Эта станция была заброшена и без обслуживания будет разрушена с течением времени."
 prison_station: "Тюремная станция"
 prison_station_desc: "Планетарная станция на этой планете выполняет роль исправительного учреждения. Большинство преступников империи рано или поздно окажутся в этом месте.\n\n§WНаселение станции пополняется в основном за счет преступников из других миров. Все кроме обслуживающего персонала тюрьмы и заключенных здесь на долго не задерживаются.§!"
 military_outpost: "Военный аванпост"
 military_outpost_desc: "На этой планете находится планетарная станция, которая выполняет оборонительные функции и создает военное присутствие в регионе."
 resort_station: "Курортная станция"
 resort_station_desc: "На этой планете находится планетарная станция, которая является одним из лучших мест для отдыха и развлечений."
 confluence_station: "Станция слияния"
 confluence_station_desc: "Планетарная станция на этой планете выполняет роль связующего узла для укрепления единства улья."
 simulation_station: "Станция симуляции"
 simulation_station_desc: "На этой планете находится планетарная станция, где проводятся комплексные симуляции и анализа данных для укрепления единства разумов."
 extremophile_life_forms: "Экстремофильные формы жизни"
 extremophile_life_forms_desc: "В глубинах этой вулканической планеты обнаружена гигантская сеть пещер, где обитают существа способные выдерживать даже очень высокие температуры. Морфология этих странных организмов представляет большой интерес для наших исследований."
 pop_convicted: "Осужденные"
 pop_convicted_desc: "Это поселение отбывает наказание за преступления."
 recent_arrests: "Недавние аресты"
 recent_arrests_desc: "Недавняя череда громких арестов поубавит пыл разгулявшейся местной преступности. Новые заключенные уже транспортированы в места отбывания наказаний."
 mass_arrests: "Массовые аресты"
 mass_arrests_desc: "$recent_arrests_desc$"
 terraforming_station: "Cтанция терраформирования"
 terraforming_station_desc: "На этой планете находится планетарная станция, которая занимается терраформированием."
 barren_terraformed: "Терраформированный безжизненный мир"
 barren_terraformed_desc: "Эта планета прошла I-й этап терраформирования и теперь имеет собственные водоемы и плотную атмосферу, которая пока, к сожалению, не пригодна для дыхания."
 barren_cold_terraformed: "$barren_terraformed$"
 barren_cold_terraformed_desc: "$barren_terraformed_desc$"
 frozen_terraformed: "Терраформированный замерзший мир"
 frozen_terraformed_desc: "$barren_terraformed_desc$"
 toxic_terraformed: "Терраформированный токсичный мир"
 toxic_terraformed_desc: "$barren_terraformed_desc$"
 greenhouse_terraformed: "Терраформированный тепличный мир"
 greenhouse_terraformed_desc: "Эта планета прошла I-й этап терраформирования и теперь имеет собственную гидросферу, которая существует пока преимущественно в парообразном состоянии. Атмосфера все еще не пригодна для дыхания, а поверхность слишком горяча."
 methane_terraformed: "Терраформированный метановый мир"
 methane_terraformed_desc: "$barren_terraformed_desc$"
 
 