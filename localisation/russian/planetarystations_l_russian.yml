  district_fortified_bunkers: "Укрепленные бункеры"
  district_fortified_bunkers_plural: "Укрепленные бункеры"
  district_fortified_bunkers_desc: "Эти фортификационные сооружения, спрятанные глубоко под поверхность, позволят выдержать любой вражеский удар с орбиты."
  district_temple_complex: "Храмовый комплекс"
  district_temple_complex_plural: "Храмовые комплексы"
  district_temple_complex_desc: "Этот комплекс станции предназначен для медитаций и проведения религиозных ритуалов."
  district_grim_complex: "Мрачный комплекс"
  district_grim_complex_plural: "Мрачные комплексы"
  district_grim_complex_desc: "Этот комплекс станции предназначен для жертвоприношений и проведения темных ритуалов."
  district_battle_arena: "Боевая арена"
  district_battle_arena_plural: "Боевые арены"
  district_battle_arena_desc: "Этот комплекс станции представляет собой театр для массовых зрелищ и состязаний."
  district_casino_level: "Уровень казино"
  district_casino_level_plural: "Уровни казино"
  district_casino_level_desc: "Эта секция станции представляет собой игровую зону, где посетители могут спустить все свои деньги."
  district_race_track: "Гоночный трек"
  district_race_track_plural: "Гоночные треки"
  district_race_track_desc: "Эта зона станции оборудована для проведения гоночных турниров на самых разных видах транспорта."
  district_synaptic_node: "Узел синоптической связи"
  district_synaptic_node_plural: "Узлы синоптической связи"
  district_synaptic_node_desc: "Этот комплекс необходим для полноценной работы синоптической сети улья."
  district_simulation_complex: "Комплекс симуляции"
  district_simulation_complex_plural: "Комплексы симуляции"
  district_simulation_complex_desc: "Этот комплекс станции предназначен для создания различных симуляций и анализа уязвимостей системы."
  district_terraforming_complex: "Комплекс терраформирования"
  district_terraforming_complex_plural: "Комплексы терраформирования"
  district_terraforming_complex_desc: "Этот комплекс станции предназначен для поэтапного терраформирования планеты с целью изменения её характеристик в сторону полноценной обитаемости."
  
