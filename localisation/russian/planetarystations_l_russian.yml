  decision_planet_cracking: "Потрошение планеты"
  decision_planet_cracking_desc: "Это решение запускает операцию по неограниченной добыче полезных ископаемых путем раскола планет и очистки породы."
  no_barren_world_for_cracking: "Возможно потрошение только безжизненных миров."
  decision_planet_cracking_effect_desc: "Превращает планету в §Y$pc_broken$§!, открывая особые £district£ §Yгорнодобывающие районы§! и удаляя все планетарные особенности."
  decision_station_restructuring: "Реструктуризация станции"
  decision_station_restructuring_desc: "Иногда наступает момент, когда существующий тип станции перестает соответствовать планам развития империи. Данный проект позволит отказаться от использования устаревших инфраструктурных решений, чтобы начать планирование станции нового типа."
  decision_station_restructuring_effect_desc: "Все районы кроме жилых корпусов будут удалены. Появится возможность выбрать новый тип станции."
  decision_launch_political_persecution: "Начать политические преследования"
  decision_launch_political_persecution_desc: "Агенты спецслужб выявляют оппозиционные настроения в обществе и организуют облавы на ячейки предателей, заражающие остальное население лживыми идеями."
  decision_end_political_persecution: "Закончить политические преследования"
  decision_end_political_persecution_desc: "Идеологические противники больше не представляют опасность для нашего общества."
  decision_launch_hunting_heretics: "Начать охоту на еретиков"
  decision_launch_hunting_heretics_desc: "Рыцари веры выявляют противников церкви в обществе и организуют облавы на собрания еретиков, сеющих сомнения в умах и душах верующих братьев и сестер."
  decision_end_hunting_heretics: "Закончить охоту на еретиков"
  decision_end_hunting_heretics_desc: "Противники церкви больше не представляют опасность для нашего общества."
  decision_detention_operation: "Операция по задержанию"
  decision_detention_operation_desc: "Преступные элементы, выявленные в результате оперативного розыска, будут арестованы и перенаправлены в центры отбывания наказаний."
  decision_detention_egalitarian_effect_desc: "Случайное поселение с эгалитарной этикой будет принудительно перемещено на случайную тюремную станцию."
  decision_detention_materialist_effect_desc: "Случайное поселение с материалистической этикой будет принудительно перемещено на случайную тюремную станцию."
  decision_detention_criminal_effect_desc: "Случайное преступное поселение будет принудительно перемещено на случайную тюремную станцию."
  decision_launch_staff_recruitment: "Начать набор персонала"
  decision_launch_staff_recruitment_desc: "Для эффективного функционирования станции, требуется огромный штат опытных сотрудников. Комплекс мер по обучению и привлечению новых работников значительно ускорит темпы расширения колонии за счет временного снижения эффективности рабочих процессов."
  decision_end_staff_recruitment: "Завершить набор персонала"
  decision_end_staff_recruitment_desc: "Новые работники прошли полный курс обучения. Пора полностью сосредоточится на рабочем процессе."
  decision_launch_station_close: "Начать отключение станции"
  decision_launch_station_close_desc: "Процесс завершения эксплуатации станции занимает определенное время, которое необходимо для эвакуации персонала и оборудования."
  decision_station_close_effect_desc: "Каждый месяц одно £pop£ поселение автоматически переселяется с этой планеты на другие планеты империи. Станция будет полностью отключена, когда весь персонал будет эвакуирован."
  decision_end_station_close: "Отменить отключение станции"
  decision_end_station_close_desc: "Завершение процедуры отключения станции и отмена эвакуации."
  
  decision_terraforming_station: "Тип станции: Cтанция терраформирования"
  decision_terraforming_station_desc: "Разработка и утверждение проекта станции терраформирования, запускает амбициозный проект, превращения этого непригодного для обитания мира в планету с азотно-кислородной атмосферой и естественной экосистемой."
  participates_in_another_terraforming_project: "Эта планета уже учувствует в другом проекте терраформирования."
  district_terraforming_complex_add: "Добавляет новый район: §Y$district_terraforming_complex$§!"
  decision_start_barren_terraforming_project_1_effect_desc: "Это решение запускает I-й этап проекта терраформирования безжизненного мира.\n\nНа раннем этапе терраформирования вам потребуется максимум усилий для создания стабильной гидросферы, которой лишена эта планета."
  decision_start_barren_terraforming_project_2_effect_desc: "Это решение запускает II-й этап проекта терраформирования безжизненного мира.\n\nНа позднем этапе терраформирования вам предстоит заняться глобальным озеленением планеты и созданием пригодной для дыхания азотно-кислородной атмосферы."
  decision_start_barren_cold_terraforming_project_1_effect_desc: "$decision_start_barren_terraforming_project_1_effect_desc$"
  decision_start_barren_cold_terraforming_project_2_effect_desc: "$decision_start_barren_terraforming_project_2_effect_desc$"
  decision_start_frozen_terraforming_project_1_effect_desc: "Это решение запускает I-й этап проекта терраформирования замерзшего мира.\n\nНа раннем этапе терраформирования вам потребуется максимум усилий для повышения температуры поверхности и формирования плотной атмосферы планеты."
  decision_start_frozen_terraforming_project_2_effect_desc: "Это решение запускает II-й этап проекта терраформирования замерзшего мира.\n\nНа позднем этапе терраформирования вам предстоит заняться глобальным озеленением планеты и созданием пригодной для дыхания азотно-кислородной атмосферы."
  decision_start_toxic_terraforming_project_1_effect_desc: "Это решение запускает I-й этап проекта терраформирования токсичного мира.\n\nНа раннем этапе терраформирования вам потребуется максимум усилий для создания стабильной гидросферы и очистки атмосферы от вредных примесей."
  decision_start_toxic_terraforming_project_2_effect_desc: "Это решение запускает II-й этап проекта терраформирования токсичного мира.\n\nНа позднем этапе терраформирования вам предстоит заняться глобальным озеленением планеты и созданием пригодной для дыхания азотно-кислородной атмосферы."
  decision_start_greenhouse_terraforming_project_1_effect_desc: "Это решение запускает I-й этап проекта терраформирования тепличного мира.\n\nНа раннем этапе терраформирования вам потребуется максимум усилий для создания гидросферы и понижения температуры поверхности."
  decision_start_greenhouse_terraforming_project_2_effect_desc: "Это решение запускает II-й этап проекта терраформирования тепличного мира.\n\nНа позднем этапе терраформирования вам предстоит заняться глобальным озеленением планеты и созданием пригодной для дыхания азотно-кислородной атмосферы."
  decision_start_methane_terraforming_project_1_effect_desc: "Это решение запускает I-й этап проекта терраформирования метанового мира.\n\nНа раннем этапе терраформирования вам потребуется максимум усилий для создания стабильной гидросферы и очистки атмосферы от вредных примесей."
  decision_start_methane_terraforming_project_2_effect_desc: "Это решение запускает II-й этап проекта терраформирования метанового мира.\n\nНа позднем этапе терраформирования вам предстоит заняться глобальным озеленением планеты и созданием пригодной для дыхания азотно-кислородной атмосферы."
  decision_start_barren_terraforming_project_2: "Продолжить процесс терраформирования"
  decision_start_barren_terraforming_project_2_desc: ""
