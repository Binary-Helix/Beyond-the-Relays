  d_angels_valley: "Долина ангелов"
  d_angels_valley_desc: "Это место наполнено особой красотой и настраивает на духовное умиротворение любого космического путешественника, оказавшегося здесь."
  d_ghosts: "Призраки"
  d_ghosts_desc: "В этом месте происходят загадочные и необъяснимые явления о которых часто рассказывают в СМИ. Возможно, это слухи цель которых привлечь сюда туристов."
  d_restricted_area: "Запретная зона"
  d_restricted_area_desc: "По какой-то причине этот регион был занесен в реестр запретных для посещения. Эта информация оказалась достоянием общественности и теперь все хотят знать, что там."
  d_mysterious_site: "Мистическое место"
  d_mysterious_site_desc: "В этом месте происходят загадочные и необъяснимые явления о которых часто рассказывают в СМИ. Возможно, это слухи цель которых привлечь сюда туристов."
  d_buried_ruins: "Закопанные руины"
  d_buried_ruins_desc: "Эти рукотворные мегалиты таинственной цивилизации не слишком интересуют ученых, но вызывают живой интерес у туристов."
  d_great_place: "Отличное место"
  d_great_place_desc: "Просто отличное место чтобы провести свой отпуск без необходимости тащить свое тело на вершину криовулкана или полётов в центр газового шторма."
  d_relic_valley: "Реликтовая долина"
  d_relic_valley_desc: "В этом месте обнаружены залежи особо ценных минералов, не представляющих интерес для промышленной разработки, но перспективных для частных предпринимателей."
  d_unusual_formations: "Необычные образования"
  d_unusual_formations_desc: "В этом месте обнаружены залежи особо ценных минералов, не представляющих интерес для промышленной разработки, но перспективных для частных предпринимателей."
  d_rich_stones_area: "Область богатых камней"
