  origin_expanse: "Экспансия"
  origin_expanse_desc: "Стремительно кончающиеся ресурсы и значительное перенаселение, подтолкнули эту цивилизацию очень рано выйти в космос, не имея сверхсветовых технологий. Период колонизации самых перспективных необитаемых миров в системе, закончился глубоким цивилизационным кризисом. В тот момент, когда разногласия, вызванные сложными социальными проблемами, между родным миром и колониями достигли пика, был изобретен гипердвигатель."
  civic_tooltip_expanse_effects: "Вы начинаете игру с тремя планетарными станциями в своей системе. Ваш родной мир и станции имеют особые модификаторы."
  
  
  ####################################
  # Traits
  ####################################
  
  
  ####################################
  # Start Screen Mesages
  ####################################
  
  START_SCREEN_ORIGIN_EXPANSE: "На пути развития наша цивилизация встречала множество непреодолимых преград, но мы всегда находили выход. Климатические катастрофы, заканчивающиеся ресурсы, перенаселение вынудили нас искать новые возможности за пределами родной планеты [GetHomeWorldName]. Мы построили высокотехнологичные станции, позволяющие жить и работать на планетах без пригодной атмосферы. Долгое время колонии обеспечивали родную планету всем необходимым, но это не продлилось долго. Сложная зависимость колоний от центра и неравные социальные условия привели общество к противоречиям, которые вот-вот перерастут в конфликт. \n\nНо все это окажется в прошлом, потому что теперь, после изобретения гипердвигателя, для нас открываются новые двери… и новые возможности."
  
  ####################################
  # Tooltip Massages
  ####################################
  
  requires_suitable_planetary_body: "$TRIGGER_FAIL$У нас нет технологий для строительства станций на этом типе планет."
  requires_barren_world: "$TRIGGER_FAIL$Операции потрошения планет можно проводить только на безжизненных каменистых мирах."
  requires_building_planetary_station_capital: "§RНа планете требуется §Y$building_planetary_station_capital$§!.§!"
  requires_building_planetary_station_major_capital: "§RНа планете требуется §Y$building_planetary_station_major_capital$§!.§!"
  requires_building_planetary_station_system_capital: "§RНа планете требуется §Y$building_planetary_station_system_capital$§!.§!"

  
  ####################################
  # Army
  ####################################
  
  alien_army: "Стая чужих"
  alien_army_desc: "Чужеродные кровожадные монстры, скрытно охотятся на своих жертв и любят нападать из засады."
  prison_army: "Толпа заключенных"
  prison_army_desc: "Вооруженная чем попало толпа агрессивных взбунтовавшихся узников."
  
  ####################################
  # Technology
  ####################################
  
  tech_planetary_station_1: "Автономные системы жизнеобеспечения"
  tech_planetary_station_1_desc: "Ряд инженерных решений, направленных на обеспечение постоянного проживания в изолированных комплексах, позволит колонизировать необитаемые миры. Такие колонии будут ограниченными и дорогостоящими в обслуживании, но откроют доступ к ресурсам недоступных планет."
  feature_build_planetary_station_1: "Планетарные станции 1-го уровня"
  feature_build_planetary_station_1_desc: "Позволяет нам колонизировать большинство типов §Yбезжизненных§!, §Yзамерзших миров§! и §Yастероидов§!."
  tech_planetary_station_2: "Жаропрочные материалы"
  tech_planetary_station_2_desc: "Создание особых промышленных материалов и термопластичных сплавов, позволит сделать следующий шаг в освоении необитаемых миров. Сверхпрочные и жаростойкие структуры необходимы для колонизации планет с активным вулканизмом и подвижной тектоникой плит."
  feature_build_planetary_station_2: "Планетарные станции 2-го уровня"
  feature_build_planetary_station_2_desc: "Позволяет нам колонизировать большинство типов §YРасплавленных миров§!."
  tech_planetary_station_3: "Адаптивное покрытие"
  tech_planetary_station_3_desc: "Разработка технологий усовершенствованной гальваники материалов, способных адаптироваться к экстремальным токсичным условиям, позволит колонизировать планеты с агрессивной окружающей средой."
  feature_build_planetary_station_3: "Планетарные станции 3-го уровня"
  feature_build_planetary_station_3_desc: "Позволяет нам колонизировать большинство типов §Yтоксичных миров§!."
  tech_planetary_station_4: "Антигравитационный стабилизатор"
  tech_planetary_station_4_desc: "Развитие антигравитационных технологий открывает возможность создания стабилизирующих двигателей, работающих за счет гравитационного поля небесных тел. Специальные силовые установки, способные удерживать объекты огромной массы в атмосфере планет, позволят колонизировать газовые гиганты и другие планеты где строительство на поверхности невозможно."
  feature_build_planetary_station_4: "Планетарные станции 4-го уровня"
  feature_build_planetary_station_4_desc: "Позволяет нам колонизировать §Yгазовые гиганты§! и §Yтепличные миры§!."
  tech_extreme_mining_methods: "Экстремальные методы добычи"
  tech_extreme_mining_methods_desc: "Реализация идеи масштабной добычи полезных ископаемых методом раскола литосферных плит, требует разработки целой системы инженерных решений. Этот революционный шаг в индустрии добычи полезных ископаемых позволит проводить операции потрошения необитаемых планет для сверхэффективной добычи ресурсов."
  feature_build_cracking_station: "Станции потрошения планет"
  feature_build_cracking_station_desc: "Позволяет нам колонизировать §Yразбитый мир§! и открывает решение §H$decision_planet_cracking$§! для §Yбезжизненных миров§!."
  tech_mine_helium: "Добыча гелия-3"
  tech_mine_helium_desc: "Добыча гелий-3 в промышленных масштабах стала возможна только с выходом в космос. Планеты с плотной атмосферой не удерживают этот изотоп. Но в реголите на безатмосферных планетах гелий-3 накапливается миллионы лет."
  tech_colonial_station_protocol: "Колониальный протокол станции"
  tech_colonial_station_protocol_desc: "Разработка особых инфраструктурных объектов и реорганизация контрольных служб позволит нам расширить планетарные станции и сделать первый шаг к статусу полноценных колоний в будущем."
  tech_planetary_reactor: "Нуклеаризация производства"
  tech_planetary_reactor_desc: "Создание глобальной энергосети на основе легкодоступной атомной энергии позволит значительно увеличить эффективность производства на планете."
  tech_planet_meltification: "Планетарная Мельтификация"
  tech_planet_meltification_desc: "Ряд комплексных решений для таяния массивных ледников с использованием геотермальных ресурсов планеты, открывает для нас возможности терраформирования даже самых холодных и непригодных для обитания миров."
  feature_terraform_frozen: "$tech_planet_meltification$"
  feature_terraform_frozen_desc: "Позволяет нам терраформировать замерзшие миры."
  
  
  ####################################
  # Buildings
  ####################################
  
  building_station_capital: "Модуль управления станции"
  building_station_capital_desc: "Административная секция этой станции, служащий в качестве управляющего комплекса и места расположения руководящего персонала."
  building_station_major_capital: "Административный центр станции"
  building_station_major_capital_desc: "Обширный комплекс бюрократических ведомств, который занимается управлением крупной станции."
  building_station_fe_capital: "$building_station_capital$"
  building_station_fe_capital_desc: "$building_station_capital_desc$"
  building_station_system_capital: "Главный комплекс станции"
  building_station_system_capital_desc: "Многоуровневый комплекс станции, сочетающий в себе административные учреждения, сервисные узлы и обширную сетевую инфраструктуру, что открывает больше возможностей для расширения станции."
  building_prison_capital: "Модуль управления тюрьмы"
  building_prison_capital_desc: "$building_station_capital_desc$"
  building_prison_major_capital: "Административный центр тюрьмы"
  building_prison_major_capital_desc: "$building_station_major_capital_desc$"
  building_prison_system_capital: "Главный тюремный комплекс"
  building_prison_system_capital_desc: "$building_station_system_capital_desc$"
  building_security_service: "Служба безопасности станции"
  building_security_service_desc: "$building_precinct_house_desc$"
  building_guard_quarters: "Блок охраны"
  building_guard_quarters_desc: "$building_precinct_house_desc$"
  building_checkpoint: "Контрольно-пропускной пункт станции"
  building_checkpoint_desc: "$building_sentinel_posts_desc$"
  building_energy_capacitor: "Конденсатор энергосети"
  building_energy_capacitor_desc: "$building_energy_grid_desc$"
  building_borehole_mine: "Рудная скважина"
  building_borehole_mine_desc: "Гигантская рудная шахта вгрызается в самые недра планеты, открывает доступ к самым глубоким месторождениям."
  building_hydroponics_greenhouse: "Гидропонная теплица"
  building_hydroponics_greenhouse_desc: "Гидропонные фермы производят питательное растительное вещество, предназначенное для потребления персоналом станции."
  building_mega_forge: "Mега-кузница"
  building_mega_forge_desc: "$building_foundry_2_desc$"
  building_fabricator: "Фабрикатор"
  building_fabricator_desc: "$building_factory_2_desc$"
  building_planetary_reactor: "Планетарный реактор"
  building_planetary_reactor_desc: "Огромный комплекс атомных энергоблоков значительно увеличивает производственные мощности планеты, за счет полной энергонезависимости всех отраслей."
  building_hotel: "Отель"
  building_hotel_desc: "Комфортабельные апартаменты для космических путешественников и тех, кто просто любит проводить свой отпуск на краю галактики."
  mod_building_hotel_max: "$building_hotel$: максимум"
  building_dormitories: "Общежитие"
  building_dormitories_desc: "Компактные жилые блоки для проживания персонала станции."
  building_drone_depot: "Депо дронов"
  building_drone_depot_desc: "$building_drone_storage_desc$"
  building_nightclub_dome: "Купол ночного клуба"
  building_nightclub_dome_desc: "Отдельный сектор, отведенный для отдыха персонала станции."
  building_maintenance_center: "Центр обслуживания"
  building_maintenance_center_desc: "Отдельный сектор, предназначенный для обслуживания персонала и ремонта сооружений станции."
  building_monorail: "Монорельс"
  building_monorail_desc: "Сеть скоростных транспортных линий связывающая различные комплексы станции."
  building_transit_network: "Транзитная сеть"
  building_transit_network_desc: "Более совершенная транспортная система связывает все объекты станции как единое целое."
  building_breeding_tank: "Резервуар для разведения"
  building_breeding_tank_desc: "$building_spawning_pool_desc$"
  building_medical_unit: "Медицинский блок"
  building_medical_unit_desc: "Проживание в искусственных средах обитания требует регулярного медицинского обслуживания персонала для защиты здоровья и постепенной адаптации."
  building_ftl_inhibitor: "Подавитель сверхсветовых технологий"
  building_ftl_inhibitor_desc: "Техническое сооружение, не позволяющее кораблям противника в системе, где находится эта станция, открывать какой-либо гиперкоридоры для маневра, кроме того, через который они прошли."
  building_training_area: "Тренировочная зона"
  building_training_area_desc: "Специальная система тренировки солдат в нестандартных условиях увеличивает эффективность и скорость обучения."
  building_dread_site: "Полигон ужаса"
  building_dread_site_desc: "$building_dread_encampment_desc$"
  
  
  ####################################
  # Planet Subclasses
  ####################################
  
  ice_giant: "Ледяной гигант"
  ice_giant_desc: "Этот тип газовых планет состоит в основном из твердых агрегатных состояний воды, аммиака, метана и сероводорода, а также скальных пород, которые составляют примерно четверть массы. Содержание водорода и гелия у ледяных гигантов не превышает 15—20%. Магнитные поля необычно смещены и наклонены."
  methane_planet: "Метановый мир"
  methane_planet_desc: "Атмосфера этого мрачного мира состоит из соединений азота и метаноэтана, которые очень часто выпадают в виде дождя на поверхность, образуя обширные озера."
  greenhouse_planet: "Тепличный мир"
  greenhouse_planet_desc: "Раскаленный каменистый мир с крайне плотной атмосферой из углекислого газа, азота и диоксида серы. Густой облачный покров создал парниковый эффект. В результате роста температуры, жидкая вода испарилась, а с ней высвободились парниковые газы из коры планеты. Температура на поверхности может достигать пятисот градусов Цельсия, заставляя плавиться целые горы, поэтому ландшафт не редко меняется."
  scorched_planet: "Выжженный мир"
  scorched_planet_desc: "Этот бесплодный мир практически лишен атмосферы.  Планета находится слишком близко к центральной звезде системы. Днем на её поверхности царит невыносимая жара, а ночью жуткий холод."
  sulfur_planet: "Серный мир"
  sulfur_planet_desc: "Расплавленный мир с активными геологическими процессами, основной состав которого составляют разнообразные силикатные породы и соединения серы. Сильный вулканизм на планете способствует частому изменению рельефа, а из-за соединений серы, выбрасываемых извержениями вулканов, данный мир приобретает различные оттенки жёлтого, белого, красного, чёрного и зелёного на своей поверхности."
  hot_giant: "Горячий гигант"
  hot_giant_desc: "Этот газовый гигант находится слишком близко к звезде, в результате чего его поверхность нагревается до чудовищных температур, а атмосфера постепенно испаряется. В будущем этот газовый гигант может стать рыхлой планетой."
  
  
