  d_barren_blocker: "Безжизненная пустыня"
  d_barren_blocker_desc: "Эта планета лишена пригодной для дыхания атмосферы, а поверхность представляет собой пустынный ландшафт, испещренный глубокими каньонами и кратерами."
  d_barren_cold_blocker: "Долина кратеров"
  d_barren_cold_blocker_desc: "Эта планета лишена пригодной для дыхания атмосферы, а поверхность представляет собой изрытую кратерами каменистую пустошь."
  d_asteroid_blocker: "Мертвый планетоид"
  d_asteroid_blocker_desc: "Лишённый атмосферы безжизненный камень, плавающий в черноте космоса среди мириад других, более мелких небесных тел."
  d_ice_asteroid_blocker: "Мертвый планетоид"
  d_ice_asteroid_blocker_desc: "Лишённый атмосферы безжизненный камень, плавающий в черноте космоса среди мириад других, более мелких небесных тел."
  d_crystal_asteroid_blocker: "Мертвый планетоид"
  d_crystal_asteroid_blocker_desc: "Лишённый атмосферы безжизненный камень, плавающий в черноте космоса среди мириад других, более мелких небесных тел."
  d_frozen_blocker: "Замерзшая пустошь"
  d_frozen_blocker_desc: "Эта планета лишена пригодной для дыхания атмосферы, а поверхность представляет собой скованный вечным льдом ландшафт."
  d_molten_blocker: "Лавовые поля"
  d_molten_blocker_desc: "Атмосфера этой планеты представляет собой смесь ядовитых газов и пепла, а поверхность состоит из вулканов и расплавленной породы."
  d_broken_blocker: "Распотрошённая планета"
  d_broken_blocker_desc: "Эта планета лишена пригодной для дыхания атмосферы и находится в состоянии разрушения. Гравитационная стабильность нарушена и планета медленно разрывается изнутри."
  d_broken_cold_blocker: "Распотрошённая планета"
  d_broken_cold_blocker_desc: "Эта планета лишена пригодной для дыхания атмосферы и находится в состоянии разрушения. Гравитационная стабильность нарушена и планета медленно разрывается изнутри."
  d_toxic_blocker: "Смертоносные поля"
  d_toxic_blocker_desc: "Эта планета лишена пригодной для дыхания атмосферы, а поверхность представляет собой каменистую равнину, насыщенную ядовитыми испарениями."
  d_methane_blocker: "Метановые побережья"
  d_methane_blocker_desc: "Эта планета лишена пригодной для дыхания атмосферы, а поверхность представляет собой каменистую пустыню с вкраплениями метановых морей."
  d_gas_giant_blocker: "Бескрайние облака"
  d_gas_giant_blocker_desc: "В верхних слоях газового гиганта атмосфера не пригодна для дыхания, но здесь редки смертоносные штормы и не раздавит давлением."
  d_ice_giant_blocker: "Бескрайние облака"
  d_ice_giant_blocker_desc: "В верхних слоях газового гиганта атмосфера не пригодна для дыхания, но здесь редки смертоносные штормы и не раздавит давлением."
  d_greenhouse_blocker: "Парниковый ад"
  d_greenhouse_blocker_desc: "Температура на поверхности так высока, что порода постоянно плавится и обнажает недра, откуда вырываются смертоносные газы. Ни о какой пригодной для дыхания атмосферы нет и речи."
  d_scorched_blocker: "Расплавленная долина"
  d_scorched_blocker_desc: "Ночью температура на этих безжизненных каменистых пустошах может достигать –200ºC, а днем +400ºC."
  d_sulfur_blocker: "Серные поля"
  d_sulfur_blocker_desc: "Поверхность этой непригодной для обитания планеты почти полностью покрыта пеплом и серными соединениями. Из-за бурной вулканической деятельности ландшафт этого мира постоянно изменяется."
  d_hot_giant_blocker: "Горячие облака"
  d_hot_giant_blocker_desc: "В верхних слоях горячего гиганта атмосфера не пригодна для дыхания, но здесь редки смертоносные огненные штормы и не раздавит давлением."
  
  d_mineral_lodes: "Залежи минералов"
  d_mineral_lodes_desc: "В этой области обнаружена высокая концентрация богатых минеральных отложений."
  d_ore_rich_rings: "Богатые рудой кольца"
  d_ore_rich_rings_desc: "В кольцах этой планеты состоят преимущественно из ценных минералов."
  d_junkyard: "Свалка"
  d_junkyard_desc: "Некогда это место использовали как свалку. Теперь вся поверхность здесь усеяна металлическими обломками. Некоторые из них можно использовать."
  d_geothermal_springs: "Геотермальные источники"
  d_geothermal_springs_desc: "В этом регионе из коры планеты происходят выбросы горячего пара и газов."
  d_hydrocarbon_deposits: "Залежи углеводородов"
  d_hydrocarbon_deposits_desc: "В этом регионе планеты обнаружены источники горючих ископаемых."
  d_storm_area: "Регион штормов"
  d_storm_area_desc: "В этом регионе атмосфера планеты особо активна. Сильные ветры создают вихри, а разряды молний не прекращаются ни на секунду."
  d_scorched_plain: "Опаленная равнина"
  d_scorched_plain_desc: "Этот регион планеты отлично подходит для получения энергии от излучения местного светила."
  d_rich_regolith_formations: "Богатые образования реголита"
  d_rich_regolith_formations_desc: "Слой реголита в этом месте имеет большую концентрацию изотопа гелий-3, используемого в энергетике."
  d_helium_clouds: "Гелиевые облака"
  d_helium_clouds_desc: "В этом регионе газового гиганта концентрация изотопа гелий-3 очень высока."
  d_odd_life_forms: "Необычные формы жизни"
  d_odd_life_forms_desc: "На этой планете обнаружены экстремофильные организмы, представляющие интерес для научных изысканий."
  d_mysterious_xenofacts: "Таинственные ксенофакты"
  d_mysterious_xenofacts_desc: "Странные сооружения инопланетной цивилизации, которая некогда обитала на этой планете, представляет большой интерес для научных исследований."
  d_cryogazers_valley: "Долина криогейзеров"
  d_cryogazers_valley_desc: "В этой области планеты происходит активная криовулканическая деятельность, которая представляет интерес для инженерных исследований."
  d_giant_vortex: "Гигантский вихрь"
  d_giant_vortex_desc: "Огромный атмосферный вихрь больше любой обитаемой планеты, представляет огромный интерес для инженерных исследований."
  d_alien_wreckage: "Инопланетные обломки"
  d_alien_wreckage_desc: "Некогда на этой планете потерпел крушение инопланетный корабль, который представляет большой интерес для инженерных исследований."
  d_enigmatic_anomaly: "Загадочная аномалия"
  d_enigmatic_anomaly_desc: "В этом регионе замечены странные искривления пространства и времени, что представляет большой интерес для физических исследований."
  d_organic_starship: "Органический звездолет"
  d_organic_starship_desc: "Более трех миллиардов лет назад на этой планете потерпел крушение некий органический звездолет. Пусть сегодня от него остались лишь кости, раскопки могут привести к научным открытиям."
  d_atmospheric_ecosystem: "Атмосферная экосистема"
  d_atmospheric_ecosystem_desc: "В верхних слоях этого газового гиганта образовалась крупная экосистема, насчитывающая множество странных форм инопланетной жизни. Их биология обещает много интересных открытий."
  d_asteroid_life: "Астероидные формы жизни"
  d_asteroid_life_desc: "На этом астероиде обитает колония огромных червеобразных литотрофов, выгрызающих тоннели в камне. Мы можем узнать много нового, изучая эти уникальные формы жизни."
  d_extremophile_life_forms: "Экстремофильные формы жизни"
  d_extremophile_life_forms_desc: "В глубинах этой вулканической планеты обнаружена гигантская сеть пещер, где обитают существа способные выдерживать даже очень высокие температуры. Морфология этих странных организмов представляет большой интерес для наших исследований."
  d_abyssal_exofauna: "Глубинная экзофауна"
  d_abyssal_exofauna_desc: "Под ледяной коркой этой планеты находится огромный океан, который подогревают гидротермальные источники. Он кишит уникальными организмами, изучая которые, мы почерпнем немало новых знаний."
  d_derelict_structure: "Заброшенная структура"
  d_derelict_structure_desc: "На этой планете находится древнее сооружение, давно покинутое прежними обитателями."
  d_alien_marks: "Следы инопланетных цивилизаций"
  d_alien_marks_desc: "В этом месте были оставлены следы инопланетной культуры, которые могут представлять интерес для наших ученых."
  d_ancient_remains: "Древние развалины"
  d_ancient_remains_desc: "Останки давно погибшей цивилизации все еще покоятся в этом мрачном и безжизненном месте."
  d_hells_gate: "Адские врата"
