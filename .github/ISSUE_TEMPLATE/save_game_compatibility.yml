name: Save Game Compatibility Issue
description: Report an issue with save game compatibility after mod updates
title: "[Save Game] "
labels: ["playability"]
type: Bug
body:
  - type: dropdown
    id: additional-labels
    attributes:
      label: Additional Labels
      description: Select any additional labels that apply to this issue.
      multiple: true
      options:
        - bug
        - mechanics
        - compatibility
        - documentation
        - localization
        - performance
        - balance
        - UI
        - crash

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the save game compatibility issue you're experiencing.
    validations:
      required: true

  - type: input
    id: mod-version-save
    attributes:
      label: Mod Version When Save Was Created
      description: What version of the mod was the save game created with?
    validations:
      required: true

  - type: input
    id: mod-version-current
    attributes:
      label: Current Mod Version
      description: What version are you trying to load it with?
    validations:
      required: true

  - type: input
    id: stellaris-version
    attributes:
      label: Stellaris Version
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Load save with mod version X
        2. Update mod to version Y
        3. Try to load the save
        4. See error/issue
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen when loading the save?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens instead?
    validations:
      required: true

  - type: textarea
    id: errors
    attributes:
      label: Error Messages
      description: |
        If applicable, paste any error messages from:
        - `Stellaris/logs/error.log`
        - `Stellaris/logs/game.log`
        - `Stellaris/logs/launcher.log`
        - `Stellaris/crashes/your-crash-log`
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other relevant information about the save or the update that broke compatibility. Attach the save game file if possible.
