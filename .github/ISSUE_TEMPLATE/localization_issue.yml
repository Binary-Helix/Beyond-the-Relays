name: Localization Issue
description: Report missing translations or localization problems
title: "[Localization]"
labels: ["localization"]
type: Bug
body:
  - type: dropdown
    id: additional-labels
    attributes:
      label: Additional Labels
      description: Select any additional labels that apply to this issue.
      multiple: true
      options:
        - bug
        - compatibility
        - documentation
        - economy
        - empires
        - enhancement
        - events
        - help wanted
        - leaders
        - mechanics
        - planets
        - playability
        - pops
        - qol
        - question
        - species
        - technology
        - TODO
        - ui
        - update

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the localization issue.
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Language
      description: What language is affected?
    validations:
      required: true

  - type: checkboxes
    id: issue-type
    attributes:
      label: Issue Type
      options:
        - label: Missing text
        - label: Incorrect text
        - label: Broken formatting/display
        - label: Other (please specify in description)

  - type: input
    id: location
    attributes:
      label: Location
      description: Where in the mod is this issue?
      placeholder: e.g., menu, tooltip, event text, description
    validations:
      required: true

  - type: textarea
    id: current-text
    attributes:
      label: Current Text
      description: What text is currently displayed (or missing)?

  - type: textarea
    id: suggested-translation
    attributes:
      label: Suggested Translation
      description: If you have a translation suggestion, please provide it.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other relevant information about the localization issue.
