name: Feature Request
description: Suggest an idea for the Beyond-the-Relays mod
title: "[Feature]"
labels: ["enhancement", "mechanics"]
type: Feature
body:
  - type: dropdown
    id: additional-labels
    attributes:
      label: Additional Labels
      description: Select any additional labels that apply to this issue.
      multiple: true
      options:
        - bug
        - compatibility
        - documentation
        - economy
        - empires
        - enhancement
        - events
        - help wanted
        - leaders
        - localization
        - mechanics
        - planets
        - playability
        - pops
        - qol
        - question
        - species
        - technology
        - TODO
        - ui
        - update

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the feature is.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe the problem it solves.

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.

  - type: textarea
    id: implementation-notes
    attributes:
      label: Implementation Notes
      description: Any technical considerations or suggestions for implementation (optional).

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or examples about the feature request here.
