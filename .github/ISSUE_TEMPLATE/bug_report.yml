name: Bug Report
description: Report a bug or issue with the Beyond-the-Relays mod
title: "[Bug] "
labels: []
type: Bug
body:
  - type: dropdown
    id: additional-labels
    attributes:
      label: Additional Labels
      description: Select any additional labels that apply to this issue.
      multiple: true
      options:
        - mechanics
        - compatibility
        - documentation
        - localization
        - playability
        - performance
        - balance
        - save-game
        - UI
        - crash

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened instead.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.

  - type: input
    id: stellaris-version
    attributes:
      label: Stellaris Version
      placeholder: e.g., 3.9.2
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: Mod Version
      description: Check descriptor.mod for the version number.
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g., Windows 10, Linux, macOS

  - type: textarea
    id: mod-config
    attributes:
      label: Mod Configuration
      description: List any other mods enabled, whether the game was started fresh or loaded from a save, and whether a save game is attached.
      placeholder: |
        Other Mods Enabled:
        Fresh game or loaded save:
        Save game attached:

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste relevant log content here, or describe what you found. Logs can be found at:
        - `Stellaris/logs/error.log`
        - `Stellaris/logs/game.log`
        - `Stellaris/logs/launcher.log`
        - `Stellaris/crashes/your-crash-log`
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
