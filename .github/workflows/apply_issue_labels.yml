name: Apply Issue Form Labels

on:
  issues:
    types: [opened, reopened, edited]

permissions:
  issues: write

jobs:
  apply-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Parse and apply labels from issue form
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body ?? '';
            const issueNumber = context.payload.issue.number;

            // Extract the "Additional Labels" section from the issue form body.
            // GitHub renders multi-select dropdowns as a "### Field\n\nvalue1, value2" block.
            const sectionMatch = body.match(
              /###\s+Additional Labels\s*\n+([\s\S]*?)(?=\n###|\s*$)/i
            );

            if (!sectionMatch) {
              console.log('No "Additional Labels" section found — skipping.');
              return;
            }

            // The value is a comma-separated list. Trim whitespace and filter blanks.
            const rawValue = sectionMatch[1].trim();

            // GitHub renders "none" when the user selects nothing in a multi-select
            if (!rawValue || rawValue.toLowerCase() === '_no response_' || rawValue.toLowerCase() === 'none') {
              console.log('No additional labels selected — skipping.');
              return;
            }

            const selectedLabels = rawValue
              .split(',')
              .map(l => l.trim())
              .filter(Boolean);

            if (selectedLabels.length === 0) {
              console.log('Label list empty after parsing — skipping.');
              return;
            }

            console.log(`Labels to apply: ${selectedLabels.join(', ')}`);

            // Fetch all labels that exist in the repository so we don't try to
            // apply a label that hasn't been created yet (which would 404).
            const { data: repoLabels } = await github.rest.issues.listLabelsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const validNames = new Set(repoLabels.map(l => l.name.toLowerCase()));

            const toApply = selectedLabels.filter(l => validNames.has(l.toLowerCase()));
            const missing = selectedLabels.filter(l => !validNames.has(l.toLowerCase()));

            if (missing.length > 0) {
              console.warn(`Skipping unknown labels (not found in repo): ${missing.join(', ')}`);
            }

            if (toApply.length === 0) {
              console.log('No valid labels to apply.');
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: toApply,
            });

            console.log(`Successfully applied: ${toApply.join(', ')}`);

      - name: Format issue body
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body ?? '';
            let formatted = body;

            // Pass 1: Remove sections the user left blank (_No response_).
            // Cleans up noise from optional fields that were skipped.
            formatted = formatted.replace(/### [^\n]+\n\n_No response_\n*/g, '');

            // Pass 2: Format the "Additional Labels" value as inline code spans.
            // Turns "bug, enhancement" into `bug` `enhancement` for a tag-like look.
            formatted = formatted.replace(
              /(### Additional Labels\n\n)([^\n]+)/,
              (_, header, value) => {
                const tags = value.split(',').map(t => `\`${t.trim()}\``).join(' ');
                return `${header}${tags}`;
              }
            );

            // Pass 3: Wrap version field values in inline code spans.
            // Makes version numbers visually distinct and easy to scan.
            const versionFields = [
              'Stellaris Version',
              'Mod Version',
              'Beyond-the-Relays Version',
              'Mod Version When Save Was Created',
              'Current Mod Version',
            ];
            for (const field of versionFields) {
              const pattern = new RegExp(`(### ${field}\\n\\n)([^\`\\n][^\\n]*)`);
              formatted = formatted.replace(
                pattern,
                (_, header, value) => `${header}\`${value.trim()}\``
              );
            }

            // Pass 4: Insert a horizontal rule before every ### header except the first.
            // Visually separates each section in the rendered issue.
            formatted = formatted.replace(/\n(### )/g, '\n\n---\n\n$1');

            // Pass 5: Collapse runs of 3+ blank lines down to 2.
            // Prevents excess whitespace left behind by Pass 1 removals.
            formatted = formatted.replace(/\n{3,}/g, '\n\n').trim();

            if (formatted === body) {
              console.log('No changes needed — skipping update.');
              return;
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: formatted,
            });

            console.log('Issue body formatted successfully.');
